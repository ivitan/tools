<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<link rel="icon" type="image/svg+xml" href="/img/Daily.svg" sizes="any">
<link rel="stylesheet" href="https://cdn.bootcdn.net/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<title>日报生成工具</title>
<script>
  /* 提前应用主题，避免刷新时闪白（沿用 SQLite 工具的 data-theme 方案，
     同时兼容旧版 localStorage 键名 "theme"） */
  (function () {
    try {
      var saved = localStorage.getItem('daily-theme') || localStorage.getItem('theme');
      var dark = saved ? saved === 'dark'
        : window.matchMedia('(prefers-color-scheme: dark)').matches;
      document.documentElement.dataset.theme = dark ? 'dark' : 'light';
    } catch (e) {}
  })();
</script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #f8fafc;
    --panel: #ffffff;
    --panel-hover: #f1f5f9;
    --border: #e2e8f0;
    --border-hover: #cbd5e1;
    --text: #0f172a;
    --text-secondary: #475569;
    --text-muted: #64748b;

    --primary: #2563eb;
    --primary-hover: #1d4ed8;
    --primary-light: #eff6ff;
    --primary-soft: rgba(37, 99, 235, 0.10);
    --primary-on: #ffffff;

    --success: #059669;
    --success-light: #ecfdf5;
    --danger: #dc2626;
    --danger-light: #fef2f2;

    /* 近机位强调色（琥珀系，与 SQLite 工具 warning 语义一致） */
    --warn: #f59e0b;
    --warn-ink: #b45309;
    --warn-light: #fef3c7;
    --warn-soft: rgba(245,158,11,0.12);

    --scrollbar-thumb: #cbd5e1;
    --scrollbar-thumb-hover: #94a3b8;
    --shadow: 0 1px 3px rgba(0,0,0,0.05), 0 1px 2px rgba(0,0,0,0.03);
    --shadow-lg: 0 10px 15px -3px rgba(0,0,0,0.08), 0 4px 6px -2px rgba(0,0,0,0.04);
    --code-bg: #f1f5f9;

    --r: 8px;
    --r-sm: 6px;
    --field-h: 34px;   /* 机位号输入框与类型徽章共用高度 */
    --font-ctl: 13px;
    --success-ink: #047857;
    --danger-ink: #b91c1c;
    --danger-on: #ffffff;
    --primary-ink: #1d4ed8;
}

  [data-theme="dark"] {
    --bg: #0b1220;
    --panel: #111827;
    --panel-hover: #1e293b;
    --border: #1f2937;
    --border-hover: #475569;
    --text: #f1f5f9;
    --text-secondary: #cbd5e1;
    --text-muted: #94a3b8;
    --primary: #60a5fa;
    --primary-hover: #93c5fd;
    --primary-light: rgba(96,165,250,0.18);
    --primary-soft: rgba(96,165,250,0.22);
    --primary-on: #0b1220;
    --success: #34d399;
    --success-light: rgba(52,211,153,0.18);
    --danger: #f87171;
    --danger-light: rgba(248,113,113,0.18);
    --warn: #fbbf24;
    --warn-ink: #fbbf24;
    --warn-light: rgba(251,191,36,0.16);
    --warn-soft: rgba(251,191,36,0.20);
    --scrollbar-thumb: #475569;
    --scrollbar-thumb-hover: #64748b;
    --shadow: 0 1px 3px rgba(0,0,0,0.5);
    --shadow-lg: 0 10px 25px rgba(0,0,0,0.5);
    --code-bg: #0a1224;
    --success-ink: #6ee7b7;
    --danger-ink: #fca5a5;
    --danger-on: #0b1220;
    --primary-ink: #93c5fd;
}

  html, body { height: auto; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: var(--bg);
    color: var(--text);
    font-size: 14px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    transition: background-color 0.15s, color 0.15s;
  }

  /* ===== Header ===== */
  .header {
    height: 52px;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    padding: 0 16px;
    box-shadow: var(--shadow);
    position: sticky;
    top: 0;
    z-index: 20;
    gap: 8px;
  }
  .header-inner {
    width: 100%;
    max-width: 1180px;
    margin: 0 auto;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .logo {
    display: flex;
    align-items: center;
    gap: 10px;
    font-weight: 600;
    font-size: 15px;
  }
  .logo-icon {
    width: 28px;
    height: 28px;
    background: var(--primary);
    border-radius: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--primary-on);
    font-size: 14px;
    flex-shrink: 0;
  }
  .logo span {
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .home-btn {
    width: 30px;
    height: 30px;
    border-radius: 50%;
    border: none;
    background: var(--panel-hover);
    color: var(--primary);
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    transition: background-color 0.15s, transform 0.15s, color 0.15s;
  }
  .home-btn:hover { background: var(--primary); color: #fff; transform: translateY(-1px); }
  .home-btn:active { transform: translateY(0); }
  .header-spacer { flex: 1; }
  .header-actions { display: flex; gap: 6px; align-items: center; }
  .icon-btn {
    width: 32px;
    height: 32px;
    border-radius: 6px;
    border: 1px solid transparent;
    background: transparent;
    color: var(--text-secondary);
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    transition: all 0.15s;
  }
  .icon-btn:hover {
    background: var(--panel-hover);
    color: var(--text);
    border-color: var(--border);
  }

  /* ===== Layout ===== */
  .page {
    max-width: 1180px;
    margin: 0 auto;
    padding: 16px;
    padding-bottom: max(32px, env(safe-area-inset-bottom));
  }
  .grid {
    display: grid;
    grid-template-columns: 1.2fr 1fr;
    gap: 14px;
    align-items: start;
  }

  .panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: var(--r);
    box-shadow: var(--shadow);
  }
  .panel-header {
    padding: 10px 14px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
  }
  .panel-title {
    display: flex;
    align-items: center;
    gap: 7px;
    font-size: 13.5px;
    font-weight: 600;
    color: var(--text);
  }
  .panel-title i { color: var(--primary); font-size: 13px; }
  .panel-body { padding: 14px; }

  /* ===== 机位卡片 ===== */
  .stand-card {
    background: var(--accent-light);
    border: 1px solid var(--border);
    border-left: 3px solid var(--accent);
    border-radius: var(--r);
    padding: 10px 12px;
    margin-bottom: 10px;
    transition: border-color 0.15s;
  }
  .stand-card[data-type="远机位"] {
    --accent: var(--primary);
    --accent-ink: var(--primary);
    --accent-soft: var(--primary-soft);
    --accent-light: var(--primary-light);
  }
  .stand-card[data-type="近机位"] {
    --accent: var(--warn);
    --accent-ink: var(--warn-ink);
    --accent-soft: var(--warn-soft);
    --accent-light: var(--warn-light);
  }
  .stand-card:focus-within { border-color: var(--accent); }

  .stand-header {
    display: grid;
    grid-template-columns: 1fr 28px;
    gap: 8px;
    align-items: center;
    margin-bottom: 8px;
  }
  .stand-num-wrap { display: flex; gap: 8px; align-items: stretch; min-width: 0; }
  .stand-num-wrap .stand-num {
    flex: 1;
    min-width: 0;
    height: var(--field-h);
    font-weight: 600;
  }
  .badge {
    flex: none;
    width: 56px;
    height: var(--field-h);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    padding: 0 6px;
    border-radius: var(--r-sm);
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.3px;
    white-space: nowrap;
    background: var(--accent-soft);
    color: var(--accent-ink);
  }

  /* ===== 输入控件 ===== */
  input, textarea {
    width: 100%;
    padding: 7px 10px;
    border: 1px solid var(--border);
    border-radius: var(--r-sm);
    background: var(--panel);
    color: var(--text);
    font-size: var(--font-ctl);
    font-family: inherit;
    line-height: 1.5;
    outline: none;
    transition: border-color 0.15s, box-shadow 0.15s;
  }
  input::placeholder, textarea::placeholder { color: var(--text-muted); font-weight: 400; }
  input:focus, textarea:focus {
    border-color: var(--primary);
    box-shadow: 0 0 0 3px var(--primary-soft);
  }

  textarea.auto-grow {
    display: block;
    resize: none;
    overflow-y: hidden;
    min-height: var(--field-h);
    max-height: 320px;
  }
  textarea.auto-grow.scrollable { overflow-y: auto; }

  .item-row {
    display: grid;
    grid-template-columns: 1.2fr 2fr 28px;
    gap: 6px 8px;
    align-items: start;
    margin-bottom: 8px;
  }
  .item-row .multi-select-container:nth-of-type(1) { grid-column: 1; min-width: 0; }
  .item-row .multi-select-container:nth-of-type(2) { grid-column: 2; min-width: 0; }
  .item-row .icon-del { grid-column: 3; align-self: center; justify-self: end; }

  /* ===== 按钮 ===== */
  .btn {
    height: 32px;
    padding: 0 12px;
    border-radius: var(--r-sm);
    border: 1px solid var(--border);
    background: var(--panel-hover);
    color: var(--text);
    font-size: var(--font-ctl);
    font-weight: 500;
    font-family: inherit;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    white-space: nowrap;
    transition: all 0.15s;
    -webkit-tap-highlight-color: transparent;
  }
  .btn:hover { border-color: var(--border-hover); background: var(--border-hover); }
  .btn i { font-size: 12px; }
  .btn-primary {
    background: var(--primary);
    border-color: var(--primary);
    color: var(--primary-on);
    font-weight: 600;
  }
  .btn-primary:hover {
    background: var(--primary-hover);
    border-color: var(--primary-hover);
    color: var(--primary-on);
  }
  .btn-danger { background: var(--danger); border-color: var(--danger); color: var(--danger-on); font-weight: 600; }
  .btn-danger:hover { background: var(--danger); border-color: var(--danger); color: var(--danger-on); filter: brightness(0.94); }
  /* 弱化危险操作：描边 + 文字，hover 才填色（与 SQLite 工具的删除按钮一致） */
  .btn-danger-ghost {
    background: var(--danger-light);
    border-color: var(--border);
    color: var(--danger-ink);
    height: 28px;
    padding: 0 10px;
    font-size: 12.5px;
  }
  .btn-danger-ghost:hover { background: var(--danger); border-color: var(--danger); color: var(--danger-on); }

  .add-stand-group { display: flex; gap: 10px; margin-top: 12px; }
  .btn-add {
    flex: 1;
    background: var(--panel-hover);
    border-color: var(--border);
    font-weight: 500;
  }
  .btn-add.far { color: var(--primary); }
  .btn-add.far:hover { background: var(--primary-light); border-color: var(--primary); color: var(--primary); }
  .btn-add.near { color: var(--warn-ink); }
  .btn-add.near:hover { background: var(--warn-light); border-color: var(--warn); color: var(--warn-ink); }

  .btn-dashed {
    width: 100%;
    height: 32px;
    border: 1px dashed var(--border-hover);
    border-radius: var(--r-sm);
    background: var(--primary-light);
    color: var(--primary-ink);
    font-size: 12.5px;
    font-weight: 500;
    font-family: inherit;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    transition: all 0.15s;
    -webkit-tap-highlight-color: transparent;
  }
  .btn-dashed:hover {
    border-color: var(--primary);
    color: var(--primary-ink);
    background: var(--primary-soft);
  }

  /* 删除：默认低调，hover 才显红 */
  .icon-del {
    width: 28px;
    height: 28px;
    border-radius: var(--r-sm);
    border: none;
    background: transparent;
    color: var(--text-muted);
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-size: 13px;
    opacity: 0.6;
    transition: all 0.15s;
    flex: none;
  }
  .stand-card:hover .icon-del, .item-row:hover .icon-del { opacity: 0.9; }
  .icon-del:hover { background: var(--danger-light); color: var(--danger); opacity: 1; }

  /* ===== 预览 ===== */
  .preview-panel { position: sticky; top: 68px; }
  #preview-box {
    width: 100%;
    min-height: 140px;
    max-height: none;
    height: auto;
    background: var(--code-bg);
    border: 1px solid var(--border);
    border-radius: var(--r-sm);
    padding: 12px 14px;
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    font-size: 13px;
    line-height: 1.7;
    white-space: pre-wrap;
    overflow: visible;
  }
  #preview-box:empty::before {
    content: attr(data-placeholder);
    color: var(--text-muted);
  }
  .copy-btn { width: 100%; height: 34px; margin-top: 10px; }

  /* ===== 多选下拉 ===== */
  .multi-select-container { position: relative; width: 100%; }
  .input-with-arrow {
    background-image: url('data:image/svg+xml;utf8,<svg fill="%2394a3b8" height="24" viewBox="0 0 24 24" width="24" xmlns="http://www.w3.org/2000/svg"><path d="M7 10l5 5 5-5z"/></svg>');
    background-repeat: no-repeat;
    background-position: right 6px top 8px;
    padding-right: 28px;
    cursor: text;
  }
  .multi-select-dropdown {
    position: absolute;
    top: calc(100% + 4px);
    left: 0;
    right: 0;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: var(--r);
    box-shadow: var(--shadow-lg);
    z-index: 100;
    max-height: 240px;
    overflow-y: auto;
    padding: 3px;
    display: none;
  }
  .multi-select-dropdown.show { display: block; }
  .multi-select-option {
    padding: 6px 9px;
    border-radius: 4px;
    cursor: pointer;
    font-size: 12.5px;
    font-weight: 500;
    line-height: 1.4;
    color: var(--text);
    text-align: left;
    transition: background 0.12s, color 0.12s;
  }
  .multi-select-option:hover { background: var(--primary-soft); color: var(--primary); }
  .multi-select-option.selected {
    background: var(--primary-soft);
    color: var(--primary);
    font-weight: 600;
  }
  .multi-select-option.selected::after {
    content: "\f00c";
    font-family: "Font Awesome 6 Free";
    font-weight: 900;
    float: right;
    font-size: 11px;
    margin-left: 8px;
  }
  .match-text { color: var(--primary); font-weight: 700; }

  /* ===== Toast ===== */
  .toast {
    position: fixed;
    top: 16px;
    right: 16px;
    background: var(--text);
    color: var(--panel);
    padding: 9px 16px;
    border-radius: var(--r-sm);
    font-size: 13px;
    font-weight: 500;
    box-shadow: var(--shadow-lg);
    z-index: 200;
    animation: slideIn 0.18s ease;
    display: flex;
    align-items: center;
    gap: 6px;
    max-width: calc(100vw - 32px);
  }
  .toast.success { background: var(--success); color: #052e1a; }
  .toast.error { background: var(--danger); color: #450a0a; }
  [data-theme="dark"] .toast.success { color: #02261a; }
  [data-theme="dark"] .toast.error { color: #3b0808; }
  @keyframes slideIn {
    from { transform: translateX(20px); opacity: 0; }
    to { transform: translateX(0); opacity: 1; }
  }

  /* ===== 确认弹窗（替代原生 confirm，深色友好） ===== */
  .dialog-mask {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.55);
    z-index: 300;
    display: flex;
    align-items: center;
    justify-content: center;
    animation: fadeIn 0.15s ease;
  }
  [data-theme="dark"] .dialog-mask { background: rgba(0,0,0,0.7); }
  .dialog {
    background: var(--panel);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 10px;
    box-shadow: var(--shadow-lg);
    padding: 20px 22px;
    width: min(420px, calc(100vw - 32px));
    animation: dialogIn 0.18s cubic-bezier(0.2, 0.8, 0.3, 1);
  }
  .dialog-title { font-size: 15px; font-weight: 600; margin-bottom: 8px; }
  .dialog-message { font-size: 13px; color: var(--text-secondary); line-height: 1.6; margin-bottom: 18px; }
  .dialog-actions { display: flex; justify-content: flex-end; gap: 8px; }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  @keyframes dialogIn {
    from { transform: translateY(-8px) scale(0.96); opacity: 0; }
    to { transform: translateY(0) scale(1); opacity: 1; }
  }

  /* Scrollbar */
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--scrollbar-thumb); border-radius: 4px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--scrollbar-thumb-hover); }

  /* ===== 响应式 ===== */
  @media (max-width: 900px) {
    .grid { grid-template-columns: 1fr; }
    .preview-panel { position: static; }
  }

  @media (max-width: 768px) {
    body { font-size: 13.5px; }
    .header { height: 48px; padding: 0 10px; gap: 4px; }
    .logo { font-size: 13.5px; }
    .logo span { max-width: 44vw; }

    .page { padding: 12px 10px; padding-bottom: max(24px, env(safe-area-inset-bottom)); }
    .grid { gap: 12px; }
    .panel-body { padding: 12px; }
    .panel-header { padding: 9px 12px; }

    :root { --field-h: 38px; --font-ctl: 13.5px; }

    .item-row {
      grid-template-columns: 1fr 28px;
      grid-template-areas:
        "event del"
        "reason del";
      gap: 7px;
    }
    .item-row .multi-select-container:nth-of-type(1) { grid-area: event; }
    .item-row .multi-select-container:nth-of-type(2) { grid-area: reason; }
    .item-row .icon-del { grid-area: del; align-self: center; }

    textarea.auto-grow { min-height: 40px; }
    .add-stand-group { gap: 8px; margin-top: 10px; }
    .toast { top: 58px; right: 10px; left: 10px; max-width: none; }
  }

  @media (max-width: 380px) {
    .add-stand-group { flex-direction: column; gap: 8px; }
    .panel-body { padding: 10px; }
    .stand-card { padding: 9px 10px; }
  }
</style>
</head>
<body>

<header class="header">
  <div class="header-inner">
    <div class="logo">
      <div class="logo-icon"><i class="fas fa-clipboard-list"></i></div>
      <span>日报生成工具</span>
      <a href="../" class="home-btn" title="返回主页" aria-label="返回主页">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 11.5 12 4l9 7.5"/>
          <path d="M5 10.5V20a1 1 0 0 0 1 1h4v-6h4v6h4a1 1 0 0 0 1-1v-9.5"/>
        </svg>
      </a>
    </div>
    <div class="header-spacer"></div>
    <div class="header-actions">
      <button class="icon-btn" id="btnTheme" title="切换主题">
        <svg id="iconSun" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display:none;">
          <circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
        </svg>
        <svg id="iconMoon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
        </svg>
      </button>
    </div>
  </div>
</header>

<datalist id="event-list-far" style="display: none">
  <option value="所有节点"></option>
  <option value="引导车进入"></option>
  <option value="引导车离开"></option>
  <option value="飞机入位开始"></option>
  <option value="飞机入位结束"></option>
  <option value="上轮档"></option>
  <option value="到港摆渡车到位"></option>

<div class="page">

<script>
/* ================== 主题管理 ================== */
const theme = {
  get current() { return document.documentElement.dataset.theme || 'light'; },
  set(t, manual = true) {
    document.documentElement.dataset.theme = t;
    if (manual) localStorage.setItem('daily-theme', t);
    this._updateIcon();
  },
  toggle() { this.set(this.current === 'dark' ? 'light' : 'dark'); },
  init() {
    const saved = localStorage.getItem('daily-theme') || localStorage.getItem('theme');
    const initial = saved || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    this.set(initial, false);
    matchMedia('(prefers-color-scheme: dark)').addEventListener('change', e => {
      const s = localStorage.getItem('daily-theme') || localStorage.getItem('theme');
      if (!s) this.set(e.matches ? 'dark' : 'light', false);
    });
  },
  _updateIcon() {
    const dark = this.current === 'dark';
    document.getElementById('iconSun').style.display = dark ? 'block' : 'none';
    document.getElementById('iconMoon').style.display = dark ? 'none' : 'block';
    document.getElementById('btnTheme').title = dark ? '切换到浅色模式' : '切换到深色模式';
  }
};
theme.init();
document.getElementById('btnTheme').onclick = () => theme.toggle();

/* ================== Toast ================== */
function toast(msg, type = '') {
  const el = document.createElement('div');
  el.className = 'toast ' + type;
  el.textContent = msg;
  document.body.appendChild(el);
  setTimeout(() => { el.style.opacity = '0'; el.style.transition = 'opacity 0.2s'; }, 1800);
  setTimeout(() => el.remove(), 2200);
}

/* ================== 自定义确认弹窗 ================== */
const ESC_MAP = { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' };
function escapeHtml(s) {
  return String(s === null || s === undefined ? '' : s).replace(/[&<>"']/g, c => ESC_MAP[c]);
}
function confirmDialog({ title = '确认', message = '', okText = '确定', cancelText = '取消', danger = false } = {}) {
  return new Promise(resolve => {
    const mask = document.createElement('div');
    mask.className = 'dialog-mask';
    mask.innerHTML = `
      <div class="dialog" role="dialog" aria-modal="true">
        <div class="dialog-title">${escapeHtml(title)}</div>
        <div class="dialog-message">${escapeHtml(message)}</div>
        <div class="dialog-actions">
          <button class="btn" data-act="cancel">${escapeHtml(cancelText)}</button>
          <button class="btn ${danger ? 'btn-danger' : 'btn-primary'}" data-act="ok">${escapeHtml(okText)}</button>
        </div>
      </div>`;
    document.body.appendChild(mask);
    const close = (v) => { mask.remove(); resolve(v); };
    mask.querySelector('[data-act="ok"]').onclick = () => close(true);
    mask.querySelector('[data-act="cancel"]').onclick = () => close(false);
    mask.addEventListener('click', (e) => { if (e.target === mask) close(false); });
    document.addEventListener('keydown', function onKey(e) {
      if (e.key === 'Escape') { document.removeEventListener('keydown', onKey); close(false); }
      if (e.key === 'Enter') { document.removeEventListener('keydown', onKey); close(true); }
    });
    setTimeout(() => mask.querySelector('[data-act="ok"]').focus(), 0);
  });
}

/* ================== 业务状态 ================== */
const cnNums = ["", "一", "二", "三", "四", "五", "六", "七", "八", "九", "十",
  "十一", "十二", "十三", "十四", "十五", "十六", "十七", "十八", "十九", "二十"];
let baseOptions = {};
let activeDropdown = null;
let activeInput = null;
let currentSearchQuery = "";

const MAX_TEXTAREA_H = 320;

/* ====== 文本框自动增高：随内容向下扩展，到上限后才内部滚动 ====== */
function autoResize(el) {
  if (!el || !el.classList || !el.classList.contains("auto-grow")) return;
  // 测量前临时摘掉 placeholder：窄屏上提示文字会折行并被计入 scrollHeight，
  // 导致空文本框被撑高到多行的高度
  const ph = el.placeholder;
  el.placeholder = "";
  el.style.height = "auto";
  const h = el.scrollHeight;
  el.placeholder = ph;

  if (h >= MAX_TEXTAREA_H) {
    el.style.height = MAX_TEXTAREA_H + "px";
    el.classList.add("scrollable");
  } else {
    el.style.height = h + "px";
    el.classList.remove("scrollable");
  }
}

function autoResizeAll() {
  document.querySelectorAll("textarea.auto-grow").forEach((el) => autoResize(el));
}

window.addEventListener("resize", autoResizeAll);

window.onload = () => {
  ["event-list-far", "event-list-near", "reason-list"].forEach((id) => {
    const list = document.getElementById(id);
    if (list) baseOptions[id] = Array.from(list.options).map((o) => o.value);
  });

  addStandCard("远机位");
  addStandCard("近机位");

  const container = document.getElementById("stands-container");

  document.addEventListener("click", (e) => {
    if (e.target.classList.contains("custom-dropdown-input")) {
      if (activeDropdown && activeDropdown.parentNode === e.target.parentNode) return;
      showDropdown(e.target);
    } else if (!e.target.closest(".multi-select-dropdown")) {
      closeAllDropdowns();
    }
  });

  container.addEventListener("input", (e) => {
    autoResize(e.target);
    if (
      e.target.classList.contains("custom-dropdown-input") &&
      activeDropdown &&
      activeDropdown.parentNode === e.target.parentNode
    ) {
      const listId = e.target.getAttribute("data-list");
      const isNode = listId === "event-list-far" || listId === "event-list-near";
      const validOptions = baseOptions[listId];
      const { query } = parseInput(e.target.value, validOptions, isNode);
      currentSearchQuery = query;
      renderOptions(e.target, activeDropdown, listId);
    }
    generatePreview();
  });
};

/* ====== 下拉框与智能搜索核心逻辑 ====== */
function parseInput(val, validOptions, isNode) {
  const rawParts = val.split("、").map((v) => v.trim());
  const selected = [];
  let query = "";

  for (let i = 0; i < rawParts.length - 1; i++) {
    if (rawParts[i]) selected.push(rawParts[i]);
  }

  const lastPart = rawParts[rawParts.length - 1];
  if (lastPart) {
    if (validOptions.includes(lastPart)) {
      selected.push(lastPart);
      query = "";
    } else {
      query = lastPart;
    }
  }
  return { selected, query };
}

function showDropdown(input) {
  closeAllDropdowns();
  const listId = input.getAttribute("data-list");
  if (!baseOptions[listId]) return;

  const dropdown = document.createElement("div");
  dropdown.className = "multi-select-dropdown show";

  activeDropdown = dropdown;
  activeInput = input;

  const isNode = listId === "event-list-far" || listId === "event-list-near";
  const validOptions = baseOptions[listId];
  const { query } = parseInput(input.value, validOptions, isNode);
  currentSearchQuery = query;

  renderOptions(input, dropdown, listId);
  input.parentNode.appendChild(dropdown);
}

function renderOptions(input, dropdown, listId) {
  dropdown.innerHTML = "";
  const validOptions = baseOptions[listId];
  const isNode = listId === "event-list-far" || listId === "event-list-near";
  const { selected } = parseInput(input.value, validOptions, isNode);

  const filteredOptions = validOptions.filter((opt) => opt.includes(currentSearchQuery));

  if (filteredOptions.length === 0) {
    const emptyDiv = document.createElement("div");
    emptyDiv.className = "multi-select-option";
    emptyDiv.style.color = "var(--text-muted)";
    emptyDiv.style.cursor = "not-allowed";
    emptyDiv.innerText = isNode ? "无匹配节点 (将作为自定义内容保留)" : "无匹配项 (将作为自定义原因保留)";
    dropdown.appendChild(emptyDiv);
    return;
  }

  filteredOptions.forEach((opt) => {
    const optionDiv = document.createElement("div");
    optionDiv.className = "multi-select-option";
    if (selected.includes(opt)) optionDiv.classList.add("selected");

    if (currentSearchQuery) {
      const parts = opt.split(currentSearchQuery);
      optionDiv.innerHTML = parts.join(`<span class="match-text">${currentSearchQuery}</span>`);
    } else {
      optionDiv.innerText = opt;
    }

    optionDiv.onmousedown = (e) => {
      e.preventDefault();
      toggleSelection(input, opt, dropdown, listId);
    };
    dropdown.appendChild(optionDiv);
  });
}

function toggleSelection(input, opt, dropdown, listId) {
  const isNode = listId === "event-list-far" || listId === "event-list-near";
  const validOptions = baseOptions[listId];
  let { selected } = parseInput(input.value, validOptions, isNode);

  if (selected.includes(opt)) {
    selected = selected.filter((v) => v !== opt);
  } else {
    selected.push(opt);
  }

  if (listId === "reason-list") {
    input.value = selected.join("、");
  } else {
    input.value = selected.join("、") + (selected.length > 0 ? "、" : "");
  }

  autoResize(input);
  generatePreview();
  input.focus();
  renderOptions(input, dropdown, listId);
}

function closeAllDropdowns() {
  if (activeDropdown) {
    if (activeInput) {
      activeInput.value = activeInput.value.replace(/、+$/, "");
      generatePreview();
    }
    activeDropdown.remove();
    activeDropdown = null;
    activeInput = null;
    currentSearchQuery = "";
  }
}

/* ====== 卡片与明细行 ====== */
function createEventRowHTML(type) {
  const listId = type === "远机位" ? "event-list-far" : "event-list-near";
  return `
    <div class="item-row">
      <div class="multi-select-container">
        <textarea rows="1" class="item-event auto-grow input-with-arrow custom-dropdown-input" data-list="${listId}" placeholder="异常节点：点击或输入搜索" autocomplete="off"></textarea>
      </div>
      <div class="multi-select-container">
        <textarea rows="1" class="item-reason auto-grow input-with-arrow custom-dropdown-input" data-list="reason-list" placeholder="异常原因：点击或输入搜索" autocomplete="off"></textarea>
      </div>
      <button class="icon-del" onclick="removeEventRow(this)" title="删除此行" aria-label="删除此行"><i class="fas fa-xmark"></i></button>
    </div>`;
}

function addStandCard(type) {
  const container = document.getElementById("stands-container");
  const card = document.createElement("div");
  card.className = "stand-card";
  card.setAttribute("data-type", type);

  card.innerHTML = `
    <div class="stand-header">
      <div class="stand-num-wrap">
        <span class="badge">${type}</span>
        <input type="text" class="stand-num" placeholder="机位号" autocomplete="off">
      </div>
      <button class="icon-del" onclick="removeStandCard(this)" title="删除该机位" aria-label="删除该机位"><i class="fas fa-xmark"></i></button>
    </div>
    <div class="items-container">
      ${createEventRowHTML(type)}
    </div>
    <button class="btn-dashed" onclick="addEventRow(this)"><i class="fas fa-plus"></i>添加异常明细</button>`;

  const existingCards = container.querySelectorAll(`.stand-card[data-type="${type}"]`);
  if (existingCards.length > 0) {
    const lastCard = existingCards[existingCards.length - 1];
    lastCard.parentNode.insertBefore(card, lastCard.nextSibling);
  } else {
    container.appendChild(card);
  }

  generatePreview();
  autoResizeAll();
}

function addEventRow(btnElement) {
  const card = btnElement.closest(".stand-card");
  const type = card.getAttribute("data-type");
  const itemsContainer = btnElement.previousElementSibling;
  itemsContainer.insertAdjacentHTML("beforeend", createEventRowHTML(type));
  generatePreview();
  autoResizeAll();
}

function removeEventRow(btnElement) {
  const row = btnElement.parentElement;
  const container = row.parentElement;
  const card = container.closest(".stand-card");
  const type = card.getAttribute("data-type");

  row.remove();
  if (container.children.length === 0) {
    container.insertAdjacentHTML("beforeend", createEventRowHTML(type));
  }
  generatePreview();
  autoResizeAll();
}

function removeStandCard(btnElement) {
  btnElement.closest(".stand-card").remove();
  generatePreview();
}

async function clearAllCards() {
  const ok = await confirmDialog({
    title: '清空所有数据',
    message: '将删除当前全部机位卡片与异常明细，且无法恢复。',
    okText: '清空',
    danger: true
  });
  if (!ok) return;
  document.getElementById("stands-container").innerHTML = "";
  addStandCard("远机位");
  addStandCard("近机位");
  generatePreview();
  autoResizeAll();
  toast('已清空', 'success');
}

/* ====== 预览与复制 ====== */
function generatePreview() {
  const cards = document.querySelectorAll(".stand-card");
  let data = { 远机位: [], 近机位: [] };

  cards.forEach((card) => {
    const type = card.getAttribute("data-type");
    const standNum = card.querySelector(".stand-num").value.trim();
    const eventRows = card.querySelectorAll(".item-row");

    const records = [];
    eventRows.forEach((row) => {
      const event = row.querySelector(".item-event").value.trim();
      const reason = row.querySelector(".item-reason").value.trim();
      if (event && reason) records.push({ event, reason });
    });

    if (standNum && records.length > 0) data[type].push({ standNum, records });
  });

  let resultText = "";

  if (data["远机位"].length > 0) {
    resultText += "远机位：\n";
    data["远机位"].forEach((item, index) => {
      const cnIndex = cnNums[index + 1];
      resultText += `${cnIndex ? `${cnIndex}、` : `${index + 1}. `}${item.standNum}\n`;
      item.records.forEach((rec, recIndex) => {
        resultText += `${recIndex + 1}. ${rec.event}：${rec.reason}\n`;
      });
      resultText += "\n";
    });
  }

  if (data["近机位"].length > 0) {
    resultText += "近机位：\n";
    data["近机位"].forEach((item, index) => {
      const cnIndex = cnNums[index + 1];
      resultText += `${cnIndex ? `${cnIndex}、` : `${index + 1}. `}${item.standNum}\n`;
      item.records.forEach((rec, recIndex) => {
        resultText += `${recIndex + 1}. ${rec.event}：${rec.reason}\n`;
      });
      resultText += "\n";
    });
  }

  document.getElementById("preview-box").textContent = resultText.trim();
}

function copyReport() {
  const text = document.getElementById("preview-box").textContent;
  if (!text) {
    toast('还没有可复制的数据，请先在左侧录入', 'error');
    return;
  }
  navigator.clipboard.writeText(text)
    .then(() => toast('日报已复制到剪贴板', 'success'))
    .catch(() => toast('复制失败，请手动选择文本复制', 'error'));
}
</script>
