<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="/img/Bug.png" type="image/svg+xml" sizes="any" />
    <title>日报生成工具</title>
    <style>
        :root {
            /* 日间模式变量 - 简洁中性灰蓝色调（与前两版一致） */
            --primary-color: #4a7ab5;
            --primary-dark: #3d6799;
            --success-color: #5a9e7a;
            --success-dark: #4a8666;
            --danger-color: #64748b;
            --danger-dark: #475569;
            --warning-color: #c79447;
            --warning-dark: #ad7f37;
            --violet-color: #8a72ad;
            --violet-dark: #745e95;
            --info-color: #4a7ab5;

            --bg-gradient: #f1f5f9;
            --container-bg: #ffffff;
            --panel-bg: #ffffff;
            --panel-secondary: #f8fafc;
            --text-color: #1e293b;
            --text-secondary: #64748b;
            --text-light: #94a3b8;
            --label-color: #334155;
            --input-bg: #ffffff;
            --input-border: #e2e8f0;
            --border-color: #e2e8f0;
            --shadow-color: rgba(15, 23, 42, 0.08);
            --hover-bg: rgba(74, 122, 181, 0.08);
            --radius: 12px;
            --radius-sm: 8px;

            /* 机位类型配色：远机位=蓝，近机位=橙 */
            --far-accent: #3b6db5;
            --far-tint: rgba(59, 109, 181, 0.08);
            --near-accent: #d9734e;
            --near-tint: rgba(217, 115, 78, 0.08);
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg-gradient: #0f172a;
                --container-bg: #1e293b;
                --panel-bg: #1e293b;
                --panel-secondary: #0f172a;
                --text-color: #e2e8f0;
                --text-secondary: #94a3b8;
                --text-light: #64748b;
                --label-color: #cbd5e1;
                --input-bg: #0f172a;
                --input-border: #334155;
                --border-color: #334155;
                --shadow-color: rgba(0, 0, 0, 0.3);
                --hover-bg: rgba(122, 162, 210, 0.14);
                --far-tint: rgba(96, 145, 200, 0.16);
                --near-tint: rgba(210, 130, 95, 0.16);
            }
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "PingFang SC", "Microsoft YaHei", sans-serif;
            background-color: var(--bg-gradient);
            color: var(--text-color);
            line-height: 1.6;
            padding: 16px;
        }

        /* =============== 顶栏 =============== */
        header {
            background: #0f172a;
            color: #fff;
            padding: 14px 24px;
            border-radius: 16px 16px 0 0;
        }

        .header-content {
            max-width: 1300px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        header h3 {
            font-size: 1.1rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 10px;
            color: #fff;
        }

        /* =============== 布局 =============== */
        .container {
            max-width: 1300px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 1.2fr 1fr;
            gap: 16px;
            align-items: start;
            padding-bottom: 20px;
        }

        @media (max-width: 900px) {
            .container {
                grid-template-columns: 1fr;
            }
        }

        .panel {
            background: var(--panel-bg);
            border-radius: var(--radius);
            padding: 14px 16px;
            box-shadow: 0 4px 24px var(--shadow-color);
            border: 1px solid var(--border-color);
        }

        /* 首屏上方两个面板紧贴顶栏，整体卡片感 */
        .container>.panel:first-child {
            border-top-left-radius: 0;
            border-top-right-radius: 0;
        }

        h2 {
            font-size: 0.98rem;
            margin-bottom: 10px;
            color: var(--text-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 8px;
            border-bottom: 1px solid var(--border-color);
        }

        /* ===== 机位卡片：远/近机位不同配色区分 ===== */
        .stand-card {
            background: var(--panel-secondary);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-sm);
            padding: 10px 12px;
            margin-bottom: 10px;
            transition: border-color 0.2s;
        }

        /* 远机位：蓝色系 */
        .stand-card[data-type="远机位"] {
            background: var(--far-tint);
            border-left: 4px solid var(--far-accent);
        }

        .stand-card[data-type="远机位"]:focus-within {
            border-color: var(--far-accent);
        }

        /* 近机位：绿色系 */
        .stand-card[data-type="近机位"] {
            background: var(--near-tint);
            border-left: 4px solid var(--near-accent);
        }

        .stand-card[data-type="近机位"]:focus-within {
            border-color: var(--near-accent);
        }

        .stand-header {
            display: flex;
            gap: 8px;
            align-items: center;
            margin-bottom: 8px;
        }

        .badge {
            padding: 3px 10px;
            border-radius: 6px;
            font-size: 0.76rem;
            font-weight: 600;
            color: #fff;
            white-space: nowrap;
            letter-spacing: 0.3px;
        }

        .badge-far {
            background-color: var(--primary-color);
        }

        .badge-near {
            background-color: #d9734e;
        }

        input,
        textarea {
            width: 100%;
            padding: 7px 10px;
            border: 1px solid var(--input-border);
            border-radius: var(--radius-sm);
            background-color: var(--input-bg);
            color: var(--text-color);
            font-size: 0.85rem;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
            font-family: inherit;
        }

        input:focus,
        textarea:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(74, 122, 181, 0.12);
        }

        .stand-header input {
            flex: 1;
            font-weight: 600;
        }

        .item-row {
            display: grid;
            grid-template-columns: 1.2fr 2fr auto;
            gap: 8px;
            margin-bottom: 6px;
            align-items: start;
        }

        /* =============== 统一按钮系统（实色填充 + 区分语义色） =============== */
        button {
            padding: 7px 13px;
            border: none;
            border-radius: var(--radius-sm);
            font-size: 0.84rem;
            cursor: pointer;
            transition: all 0.2s ease;
            font-weight: 500;
            font-family: inherit;
            -webkit-tap-highlight-color: transparent;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        button:active {
            transform: scale(0.98);
        }

        /* 实色按钮：主操作蓝 / 确认绿 / 警告橙 / 危险红 / 紫 */
        .btn-primary {
            background-color: var(--primary-color);
            color: #fff;
        }

        .btn-primary:hover {
            background-color: var(--primary-dark);
        }

        .btn-success {
            background-color: #d9734e;
            color: #fff;
        }

        .btn-success:hover {
            background-color: #bf5e3b;
        }

        .btn-warning {
            background-color: var(--warning-color);
            color: #fff;
        }

        .btn-warning:hover {
            background-color: var(--warning-dark);
        }

        .btn-danger {
            background-color: var(--danger-color);
            color: #fff;
        }

        .btn-danger:hover {
            background-color: var(--danger-dark);
        }

        /* 中性灰：用于清空/删除等常规操作，不暗示危险 */

        .btn-violet {
            background-color: var(--violet-color);
            color: #fff;
        }

        .btn-violet:hover {
            background-color: var(--violet-dark);
        }

        /* 删除图标按钮：中性灰实色，固定 30×30 方形，保留在网格最右 */
        .btn-icon {
            width: 30px;
            height: 30px;
            padding: 0;
            background: var(--danger-color);
            color: #fff;
            font-size: 0.85rem;
            border: none;
            align-self: center;
        }

        .btn-icon:hover {
            background: var(--danger-dark);
        }

        /* 新增机位按钮：并排实色，均分两列 */
        .add-stand-group {
            display: flex;
            gap: 10px;
            margin-top: 12px;
        }

        .add-stand-group button {
            flex: 1;
        }

        .preview-panel {
            position: sticky;
            top: 20px;
        }

        #preview-box {
            width: 100%;
            min-height: 120px;
            height: auto;
            font-family: "SF Mono", "Fira Code", "Courier New", monospace;
            white-space: pre-wrap;
            margin-bottom: 12px;
            background: var(--panel-secondary);
            line-height: 1.6;
            font-size: 0.88rem;
            border: 1px solid var(--border-color);
            border-radius: var(--radius-sm);
            padding: 10px 12px;
            color: var(--text-color);
            overflow: visible;
        }

        #preview-box:empty::before {
            content: attr(data-placeholder);
            color: var(--text-light);
        }

        .toast {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background-color: var(--success-color);
            color: white;
            padding: 11px 24px;
            border-radius: 30px;
            box-shadow: 0 4px 16px var(--shadow-color);
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
            z-index: 999;
            font-size: 0.9rem;
        }

        .toast.show {
            opacity: 1;
        }

        /* ======== 多选下拉框样式 ======== */
        .multi-select-container {
            position: relative;
            width: 100%;
        }

        .input-with-arrow {
            background-image: url('data:image/svg+xml;utf8,<svg fill="%2364748b" height="24" viewBox="0 0 24 24" width="24" xmlns="http://www.w3.org/2000/svg"><path d="M7 10l5 5 5-5z"/></svg>');
            background-repeat: no-repeat;
            background-position: right 8px center;
            padding-right: 30px;
            cursor: text;
        }

        .multi-select-dropdown {
            position: absolute;
            top: calc(100% + 4px);
            left: 0;
            right: 0;
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            box-shadow: 0 8px 20px var(--shadow-color);
            z-index: 100;
            max-height: 250px;
            overflow-y: auto;
            display: none;
        }

        .multi-select-dropdown.show {
            display: block;
        }

        .multi-select-option {
            padding: 6px 12px;
            cursor: pointer;
            font-size: 0.85rem;
            transition: background 0.2s;
            color: var(--text-color);
            text-align: left;
        }

        .multi-select-option:hover {
            background: var(--panel-secondary);
        }

        .multi-select-option.selected {
            color: var(--primary-color);
            background: var(--hover-bg);
            font-weight: 600;
        }

        .multi-select-option.selected::after {
            content: '✔';
            float: right;
            font-size: 0.85rem;
            margin-left: 8px;
        }

        .match-text {
            color: #e11d48;
            font-weight: 700;
        }

        @media (max-width: 480px) {
            body {
                padding: 8px;
            }

            .container {
                gap: 14px;
            }

            .panel {
                padding: 12px;
            }

            .item-row {
                grid-template-columns: 1fr;
            }

            #preview-box {
                min-height: 100px;
            }
        }
    </style>
</head>

<body>

                <h3>📝 日报生成工具</h3>
                <a href="../" class="home-back-icon" title="返回主页" aria-label="返回主页"><svg viewBox="0 0 24 24" fill="none"

        <option value="关货舱门"></option>
        <option value="开始加清水"></option>
        <option value="完成加清水"></option>
        <option value="开始排污"></option>
        <option value="完成排污"></option>
        <option value="行李拖车入位"></option>
        <option value="行李拖车离开"></option>
        <option value="撤轮挡"></option>
        <option value="牵引车对接"></option>

    <datalist id="reason-list" style="display: none;">
        <option value="无异常"></option>
    </datalist>

    <div class="container">
        <div class="panel" id="input-panel">
            <h2>
                <span>📝 异常数据录入</span>
                <button class="btn-danger" onclick="clearAllCards()">🗑️ 全部清空</button>
            </h2>

            <div id="stands-container"></div>

            <div class="add-stand-group">
                <button class="btn-primary" onclick="addStandCard('远机位')">+ 新增远机位</button>
                <button class="btn-success" onclick="addStandCard('近机位')">+ 新增近机位</button>
            </div>
        </div>

        <div class="panel preview-panel">
            <h2>📄 日报实时预览</h2>
            <pre id="preview-box" data-placeholder="左侧填写数据，此处自动实时排版..."></pre>
            <button class="btn-violet" style="width: 100%;" onclick="copyReport()">📋 一键复制日报</button>
        </div>
    </div>

    <div class="toast" id="toast">复制成功！</div>

    <script>
        const cnNums = ["", "一", "二", "三", "四", "五", "六", "七", "八", "九", "十", "十一", "十二", "十三", "十四", "十五", "十六", "十七", "十八", "十九", "二十"];
        let baseOptions = {};
        let activeDropdown = null;
        let activeInput = null;
        let currentSearchQuery = "";

        window.onload = () => {
            ['event-list-far', 'event-list-near', 'reason-list'].forEach(id => {
                const list = document.getElementById(id);
                if (list) {baseOptions[id] = Array.from(list.options).map(o => o.value);}
            });

            addStandCard('远机位');
            addStandCard('近机位');

            const container = document.getElementById('stands-container');

            // 点击输入框展示下拉并处理点击外部关闭
            document.addEventListener('click', (e) => {
                if (e.target.classList.contains('custom-dropdown-input')) {
                    if (activeDropdown && activeDropdown.parentNode === e.target.parentNode) return;
                    showDropdown(e.target);
                } else if (!e.target.closest('.multi-select-dropdown')) {
                    closeAllDropdowns();
                }
            });

            // 监听实时打字输入
            container.addEventListener('input', (e) => {
                if (e.target.classList.contains('custom-dropdown-input') && activeDropdown && activeDropdown.parentNode === e.target.parentNode) {
                    const listId = e.target.getAttribute('data-list');
                    const isNode = (listId === 'event-list-far' || listId === 'event-list-near');
                    const validOptions = baseOptions[listId];

                    const {query} = parseInput(e.target.value, validOptions, isNode);
                    currentSearchQuery = query; // 更新全局搜索记忆
                    renderOptions(e.target, activeDropdown, listId);
                }
                generatePreview();
            });
        };

        // ====== 下拉框与智能搜索核心逻辑 ======

        // 解析输入框内容，智能分离出“已选项”和“正在搜索的词”
        function parseInput(val, validOptions, isNode) {
            const rawParts = val.split('、').map(v => v.trim());
            const selected = [];
            let query = "";

            for (let i = 0; i < rawParts.length - 1; i++) {
                if (rawParts[i]) {
                    // 【核心修改】：无论是节点还是原因，前置内容只要通过“、”分隔过，都视为合法保留内容
                    selected.push(rawParts[i]);
                }
            }

            const lastPart = rawParts[rawParts.length - 1];
            if (lastPart) {
                if (validOptions.includes(lastPart)) {
                    selected.push(lastPart);
                    query = "";
                } else {
                    query = lastPart;
                }
            }
            return {selected, query};
        }

        function showDropdown(input) {
            closeAllDropdowns();
            const listId = input.getAttribute('data-list');
            if (!baseOptions[listId]) return;

            const dropdown = document.createElement('div');
            dropdown.className = 'multi-select-dropdown show';

            activeDropdown = dropdown;
            activeInput = input;

            const isNode = (listId === 'event-list-far' || listId === 'event-list-near');
            const validOptions = baseOptions[listId];
            const {query} = parseInput(input.value, validOptions, isNode);
            currentSearchQuery = query;

            renderOptions(input, dropdown, listId);
            input.parentNode.appendChild(dropdown);
        }

        function renderOptions(input, dropdown, listId) {
            dropdown.innerHTML = '';
            const validOptions = baseOptions[listId];
            const isNode = (listId === 'event-list-far' || listId === 'event-list-near');
            const {selected} = parseInput(input.value, validOptions, isNode);

            // 核心：永远基于全局搜索记忆进行过滤，即便输入框被清理也能保持搜索结果
            const filteredOptions = validOptions.filter(opt => opt.includes(currentSearchQuery));

            if (filteredOptions.length === 0) {
                const emptyDiv = document.createElement('div');
                emptyDiv.className = 'multi-select-option';
                emptyDiv.style.color = 'var(--text-light)';
                emptyDiv.style.cursor = 'not-allowed';
                // 【核心修改】：提示语变为允许自定义内容保留
                emptyDiv.innerText = isNode ? '无匹配节点 (将作为自定义内容保留)' : '无匹配项 (将作为自定义原因保留)';
                dropdown.appendChild(emptyDiv);
                return;
            }

            filteredOptions.forEach(opt => {
                const optionDiv = document.createElement('div');
                optionDiv.className = 'multi-select-option';
                if (selected.includes(opt)) {optionDiv.classList.add('selected');}

                if (currentSearchQuery) {
                    const parts = opt.split(currentSearchQuery);
                    optionDiv.innerHTML = parts.join(`<span class="match-text">${currentSearchQuery}</span>`);
                } else {
                    optionDiv.innerText = opt;
                }

                optionDiv.onmousedown = (e) => {
                    e.preventDefault();
                    toggleSelection(input, opt, dropdown, listId);
                };
                dropdown.appendChild(optionDiv);
            });
        }

        function toggleSelection(input, opt, dropdown, listId) {
            const isNode = (listId === 'event-list-far' || listId === 'event-list-near');
            const validOptions = baseOptions[listId];
            let {selected} = parseInput(input.value, validOptions, isNode);

            if (selected.includes(opt)) {
                selected = selected.filter(v => v !== opt); // 反选
            } else {
                selected.push(opt); // 勾选
            }

            // 如果是原因框，只拼接文字，不加末尾的“、”
            if (listId === 'reason-list') {
                input.value = selected.join('、');
            } else {
                input.value = selected.join('、') + (selected.length > 0 ? '、' : '');
            }

            generatePreview();
            input.focus();
            renderOptions(input, dropdown, listId);
        }

        function closeAllDropdowns() {
            if (activeDropdown) {
                if (activeInput) {
                    // 【核心修改】：无论是节点还是原因，关闭下拉框时都不再粗暴删除未匹配项，仅移除末尾多余的逗号，保留所有自定义文本
                    activeInput.value = activeInput.value.replace(/、+$/, '');
                    generatePreview();
                }
                activeDropdown.remove();
                activeDropdown = null;
                activeInput = null;
                currentSearchQuery = "";
            }
        }
        // =============================

        function createEventRowHTML(type) {
            const listId = (type === '远机位') ? 'event-list-far' : 'event-list-near';
            return `
            <div class="item-row">
                <div class="multi-select-container">
                    <input type="text" class="item-event input-with-arrow custom-dropdown-input" data-list="${listId}" placeholder="点击或输入搜索... (支持多选及自定义)" autocomplete="off">
                </div>
                <div class="multi-select-container">
                    <input type="text" class="item-reason input-with-arrow custom-dropdown-input" data-list="reason-list" placeholder="点击或输入搜索... (支持多选及自定义)" autocomplete="off">
                </div>
                <button class="btn-icon" onclick="removeEventRow(this)" title="删除此行">✖</button>
            </div>
        `;
        }

        function addStandCard(type) {
            const container = document.getElementById('stands-container');
            const card = document.createElement('div');
            card.className = 'stand-card';
            card.setAttribute('data-type', type);

            const badgeClass = type === '远机位' ? 'badge-far' : 'badge-near';

            card.innerHTML = `
            <div class="stand-header">
                <span class="badge ${badgeClass}">${type}</span>
                <input type="text" class="stand-num" placeholder="机位号 (如: 903)">
                <button class="btn-icon" onclick="removeStandCard(this)" title="删除该机位">✖</button>
            </div>
            <div class="items-container">
                ${createEventRowHTML(type)}
            </div>
            <button class="btn-warning" onclick="addEventRow(this)">+ 添加异常明细</button>
        `;

            const existingCards = container.querySelectorAll(`.stand-card[data-type="${type}"]`);
            if (existingCards.length > 0) {
                const lastCard = existingCards[existingCards.length - 1];
                lastCard.parentNode.insertBefore(card, lastCard.nextSibling);
            } else {
                container.appendChild(card);
            }

            generatePreview();
        }

        function addEventRow(btnElement) {
            const card = btnElement.closest('.stand-card');
            const type = card.getAttribute('data-type');
            const itemsContainer = btnElement.previousElementSibling;
            itemsContainer.insertAdjacentHTML('beforeend', createEventRowHTML(type));
            generatePreview();
        }

        function removeEventRow(btnElement) {
            const row = btnElement.parentElement;
            const container = row.parentElement;
            const card = container.closest('.stand-card');
            const type = card.getAttribute('data-type');

            row.remove();
            if (container.children.length === 0) {
                container.insertAdjacentHTML('beforeend', createEventRowHTML(type));
            }
            generatePreview();
        }

        function removeStandCard(btnElement) {
            btnElement.closest('.stand-card').remove();
            generatePreview();
        }

        function clearAllCards() {
            if (confirm('确定要清空所有录入的数据吗？')) {
                document.getElementById('stands-container').innerHTML = '';
                addStandCard('远机位');
                addStandCard('近机位');
                generatePreview();
            }
        }

        function generatePreview() {
            const cards = document.querySelectorAll('.stand-card');
            let data = {'远机位': [], '近机位': []};

            cards.forEach(card => {
                const type = card.getAttribute('data-type');
                const standNum = card.querySelector('.stand-num').value.trim();
                const eventRows = card.querySelectorAll('.item-row');

                const records = [];
                eventRows.forEach(row => {
                    const event = row.querySelector('.item-event').value.trim();
                    const reason = row.querySelector('.item-reason').value.trim();
                    if (event && reason) {
                        records.push({event, reason});
                    }
                });

                if (standNum && records.length > 0) {
                    data[type].push({standNum, records});
                }
            });

            let resultText = "";

            if (data['远机位'].length > 0) {
                resultText += "远机位：\n";
                data['远机位'].forEach((item, index) => {
                    const cnIndex = cnNums[index + 1] || (index + 1);
                    resultText += `${cnIndex}、${item.standNum}\n`;
                    item.records.forEach((rec, recIndex) => {
                        resultText += `${recIndex + 1}、${rec.event}：${rec.reason}\n`;
                    });
                    resultText += "\n";
                });
            }

            if (data['近机位'].length > 0) {
                resultText += "近机位：\n";
                data['近机位'].forEach((item, index) => {
                    const cnIndex = cnNums[index + 1] || (index + 1);
                    resultText += `${cnIndex}、${item.standNum}\n`;
                    item.records.forEach((rec, recIndex) => {
                        resultText += `${recIndex + 1}、${rec.event}：${rec.reason}\n`;
                    });
                    resultText += "\n";
                });
            }

            const previewBox = document.getElementById('preview-box');
            previewBox.textContent = resultText.trim();
        }

        function copyReport() {
            const text = document.getElementById('preview-box').textContent;
            if (!text) {
                alert("目前还没有可复制的数据，请先在左侧录入哦。");
                return;
            }

            navigator.clipboard.writeText(text).then(() => {
                const toast = document.getElementById('toast');
                toast.classList.add('show');
                setTimeout(() => {toast.classList.remove('show');}, 2000);
            }).catch(err => {
                alert('复制失败，请手动选择文本复制。');
            });
        }
    </script>
    <!-- 返回主页图标按钮样式 -->
    <style>
        .home-back-icon {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            color: #fff;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid transparent;
            text-decoration: none;
            flex-shrink: 0;
            transition: background 0.2s ease, transform 0.2s ease;
            -webkit-tap-highlight-color: transparent;
        }

        .home-back-icon:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: translateY(-1px);
        }

        .home-back-icon svg {
            width: 18px;
            height: 18px;
            display: block;
        }
    </style>
</body>
