/* 录制：直接录 canvas 流，不需要额外编码器 */
function mirrorRecToggle(){
  const m=state.mirror, cv=$('#mirrorCanvas');
  if(m.recOn){ try{ m.rec.stop(); }catch(_){} return; }
  if(!cv || !cv.width || !cv.classList.contains('on')){
    toast('请先开始投屏并等到画面出现再录制','warn'); return;
  }
  if(typeof MediaRecorder!=='function' || !cv.captureStream){ toast('当前浏览器不支持录制','warn'); return; }
  const stream=cv.captureStream(30);
  const mime=MediaRecorder.isTypeSupported('video/webm;codecs=vp9')?'video/webm;codecs=vp9':'video/webm';
  let rec=null;
  try{ rec=new MediaRecorder(stream,{mimeType:mime,videoBitsPerSecond:6000000}); }
  catch(_){ try{ rec=new MediaRecorder(stream); }catch(e){ toast('无法开始录制','err'); return; } }
  m.recChunks=[];
  rec.ondataavailable=e=>{ if(e.data && e.data.size) m.recChunks.push(e.data); };
  rec.onstop=()=>{
    const wasOn=m.recOn;
    m.recOn=false; m.rec=null;
    const b=$('[data-act="mirror-rec"]'); if(b) b.innerHTML=icon('video',15)+'录制画面';
    const st=$('#mirrorStage'); if(st) st.classList.remove('recording');
    const blob=new Blob(m.recChunks,{type:mime.split(';')[0]});
    m.recChunks=[];
    if(!blob.size){ toast('录制为空，未保存','warn'); return; }
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');
    a.href=url; a.download='gjbox-record-'+Date.now()+'.webm';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>{ try{ URL.revokeObjectURL(url); }catch(_){} },30000);
    if(wasOn) toast('录制已保存（'+(blob.size/1048576).toFixed(1)+' MB）','ok');
  };
  rec.start(1000);
  m.rec=rec; m.recOn=true; m.recAt=Date.now();
  const b=$('[data-act="mirror-rec"]'); if(b) b.innerHTML=icon('stop',15)+'停止录制';
  const st=$('#mirrorStage'); if(st) st.classList.add('recording');
  toast('开始录制画面','ok');
}

/* 画面像素 → 设备像素。投屏是降分辨率编码的（如 720x1600 投 1080x2400 的机器），
   而 input tap / swipe 只认设备原生坐标，必须再按比例放大一次，否则点击全部偏移。
   旋转后编码尺寸会变成横向，这里按长宽方向自动交换设备宽高。 */
function mirrorDevSize(nw,nh){
  const m=state.mirror;
  let w=m.devW||0, h=m.devH||0;
  if(!w||!h) return {w:nw,h:nh};
  if(nw&&nh&&((nw>nh)!==(w>h))){ const t=w; w=h; h=t; }
  return {w:w,h:h};
}
/* 把画面上的点换算成设备原始像素坐标（考虑 object-fit: contain 的黑边） */
function mirrorPoint(cx,cy){
  const img=mirrorSurface();
  if(!img) return null;
  const nw=img.width, nh=img.height;
  if(!nw||!nh) return null;
  const r=img.getBoundingClientRect();
  const scale=Math.min(r.width/nw, r.height/nh);
  if(!(scale>0)) return null;
  const ox=r.left+(r.width-nw*scale)/2, oy=r.top+(r.height-nh*scale)/2;
  const vx=(cx-ox)/scale, vy=(cy-oy)/scale;
  if(vx<0 || vy<0 || vx>=nw || vy>=nh) return null;
  const dev=mirrorDevSize(nw,nh);
  const x=Math.round(vx*dev.w/nw), y=Math.round(vy*dev.h/nh);
  return {x:Math.max(0,Math.min(dev.w-1,x)), y:Math.max(0,Math.min(dev.h-1,y))};
}

/* ---------------- 截图逻辑 ---------------- */
const SHOTS={list:[],busy:false,keep:true};
function shotName(){
  const d=new Date(), p=n=>String(n).padStart(2,'0');
  return 'gjbox-'+d.getFullYear()+p(d.getMonth()+1)+p(d.getDate())+'-'+p(d.getHours())+p(d.getMinutes())+p(d.getSeconds())+'.png';
}
function saveUrlAs(url,name){
  const a=document.createElement('a');
  a.href=url; a.download=name;
  document.body.appendChild(a); a.click(); a.remove();
}
function saveBlobAs(blob,name){
  const url=URL.createObjectURL(blob);
  saveUrlAs(url,name);
  setTimeout(()=>{ try{ URL.revokeObjectURL(url); }catch(_){} },30000);
}
function shotBusy(b){
  const btn=document.querySelector('[data-act="shot-take"]');
  if(!btn) return;
  btn.disabled=b;
  const lb=btn.querySelector('.shot-label');
  if(lb) lb.textContent=b?'正在截图…':'立即截图';
}
function shotRender(){
  const box=$('#shotGrid'); if(!box) return;
  if(!SHOTS.list.length){
    box.innerHTML='<div class="shot-empty">还没有截图</div>';
    return;
  }
  box.innerHTML=SHOTS.list.map((s,i)=>
    '<button class="shot-item" data-act="shot-open" data-i="'+i+'" title="'+esc(s.name)+'">'+
      '<img src="'+s.url+'" alt="'+esc(s.name)+'">'+
      '<span class="shot-meta">'+Math.max(1,Math.round(s.size/1024))+' KB · '+new Date(s.time).toLocaleTimeString('zh-CN',{hour12:false})+'</span>'+
    '</button>').join('');
}
async function shotTake(){
  if(state.mode!=='real'){ toast('请先连接真机','warn'); return; }
  if(SHOTS.busy){ toast('正在截图，请稍候','warn'); return; }
  SHOTS.busy=true; shotBusy(true);
  const name=shotName();
  let remote='/sdcard/'+name;
  try{
    /* 优先写入系统相册目录（相册里立刻可见），目录不可用则退回 /sdcard 根目录 */
    let ok=false;
    try{
      await realShell('mkdir -p /sdcard/DCIM/Screenshots');
      const album='/sdcard/DCIM/Screenshots/'+name;
      await realShell('screencap -p '+album);
      const size=parseInt(String(await realShell('stat -c %s '+album+' 2>/dev/null')).trim(),10);
      if(size>1024){ remote=album; ok=true; }
    }catch(_){ ok=false; }
    if(!ok) await realShell('screencap -p '+remote);
    let sync=null, u8=null;
    try{
      sync=await state.adb.sync();
      u8=new Uint8Array(await withTimeout(new Response(sync.read(remote)).arrayBuffer(),15000,'读取截图超时'));
    }finally{ if(sync){ try{ await sync.dispose(); }catch(_){} } }
    if(!pngOK(u8)) throw new Error('设备未返回有效 PNG');
    const blob=new Blob([u8],{type:'image/png'});
    SHOTS.list.unshift({name,url:URL.createObjectURL(blob),size:u8.length,time:Date.now(),where:SHOTS.keep?remote:''});
    if(SHOTS.list.length>8) SHOTS.list.length=8;
    saveBlobAs(blob,name);
    if(!SHOTS.keep){
      try{ await realShell('rm -f '+remote); }catch(_){}
      toast('截图已下载，手机内临时文件已删除','ok');
    }else toast('截图已保存并下载到电脑','ok');
  }catch(e){
    toast('截图失败：'+String((e&&e.message)||e),'err');
  }finally{
    SHOTS.busy=false;
    /* 重渲染整页可同步「清空列表」按钮的出现/消失；不在显示控制页时只更新网格 */
    if(state.active==='display') renderDisplay(); else shotRender();
  }
}

/* 读取设备当前状态栏设置，只回填控件、不重建 DOM，避免打断用户勾选 */
async function loadSystemUI(silent){
  if(state.mode!=='real'){ if(!silent) toast('请先连接真机','warn'); return; }
  if(state.sysui.reading) return;
  state.sysui.reading=true;
  try{
    const [bl,rot,sec,qqs,pad]=await Promise.all([
      realShell('settings get secure icon_blacklist'),
      realShell('settings get secure show_rotation_suggestions'),
      realShell('settings get secure clock_seconds'),
      realShell('settings get secure sysui_qqs_count'),
      realShell('settings get secure sysui_rounded_content_padding')
    ]);
    const raw=String(bl).trim();
    const list=(!raw||raw==='null')?[]:raw.split(',').map(x=>x.trim()).filter(Boolean);
    state.sysui.raw=list.join(',');
    const icons={}; ICON_SLOTS.forEach(x=>{ icons[x[1]]=list.includes(x[1]); });
    state.sysui.icons=icons;
    state.sysui.rotationHide=String(rot).trim()==='0';
    state.sysui.clockSeconds=String(sec).trim()==='1';
    const q=String(qqs).trim(), p=String(pad).trim();
    state.sysui.qqs=/^[3-9]$/.test(q)?q:'';
    state.sysui.pad=['0','5','10','15','20','30'].includes(p)?p:'';
    state.sysui.at=Date.now();
    applySystemUIState();
  }catch(e){
    if(!silent) toast('读取状态栏设置失败：'+esc(e.message||e),'err');
  }finally{ state.sysui.reading=false; }
}
function applySystemUIState(){
  const s=state.sysui;
  $$('#page-systemui [data-icon]').forEach(el=>{ el.checked=!!s.icons[el.dataset.icon]; });
  const rot=$('#page-systemui [data-icon-opt="rot"]'); if(rot) rot.checked=s.rotationHide;
  const clk=$('#page-systemui [data-icon-opt="clock"]'); if(clk) clk.checked=s.clockSeconds;
  const q=$('#suiQqs'); if(q) q.value=s.qqs||'';
  const p=$('#suiPad'); if(p) p.value=s.pad||'';
}
async function applyIconBlacklist(){
  if(state.mode!=='real'){ toast('请先连接真机','warn'); return; }
  const controlled=ICON_SLOTS.map(x=>x[1]);
  const kept=(state.sysui.raw||'').split(',').filter(x=>x&&!controlled.includes(x));
  const picked=ICON_SLOTS.filter(x=>state.sysui.icons[x[1]]).map(x=>x[1]);
  const value=Array.from(new Set(kept.concat(picked))).join(',');
  await runCmd(value?'settings put secure icon_blacklist '+value:'settings delete secure icon_blacklist',true);
  await runCmd('settings put secure show_rotation_suggestions '+(state.sysui.rotationHide?0:1),true);
  await runCmd('settings put secure clock_seconds '+(state.sysui.clockSeconds?1:0),true);
  state.sysui.raw=value;
  toast(picked.length?('已隐藏 '+picked.length+' 个状态栏图标'):'已恢复全部状态栏图标','ok');
}

  if(state.mode!=='real'){ toast('请先连接真机','warn'); return; }

function quickCmd(label,cmd){ return '<button class="btn quick-btn" data-act="run" data-cmd="'+esc(cmd)+'" title="'+esc(cmd)+'">'+label+'</button>'; }
function quickGrid(items){ return '<div class="quick-grid">'+items.map(o=>quickCmd(o[0],o[1])).join('')+'</div>'; }

/* ---------------- 页面：电池管理 ---------------- */
/* 数据来自 dumpsys battery；模拟走 dumpsys battery set / unplug，恢复走 reset。
   统计在浏览器侧定时采样，退出页面不会中断；断开或刷新页面即丢弃（与参考实现一致）。 */
const BAT={
  info:{level:null,voltage:null,temp:null,status:null,health:null,ac:false,usb:false,wireless:false,stopped:false,raw:''},
  reading:false,
  stats:{running:false,rows:[],start:0,interval:3000,power:false,timer:null,busy:false,model:''}
};
const BAT_STATUS={1:'未知',2:'充电中',3:'放电中',4:'未充电',5:'已充满'};
const BAT_HEALTH={1:'未知',2:'良好',3:'过热',4:'损坏',5:'过压',6:'故障',7:'过冷'};
function parseBattery(text){
  const kv={};
  String(text||'').split(/\r?\n/).forEach(line=>{
    const m=line.match(/^\s*([^:]+):\s*(.*?)\s*$/);
    if(m) kv[m[1].trim().toLowerCase()]=m[2];
  });
  const num=k=>{ const v=kv[k]; if(v===undefined) return null; const n=Number(v); return Number.isFinite(n)?n:null; };
  const volt=num('voltage'), temp=num('temperature');
  return {
    level:num('level'),
    voltage:volt==null?null:volt/1000,
    temp:temp==null?null:temp/10,
    status:num('status'), health:num('health'),
    ac:kv['ac powered']==='true', usb:kv['usb powered']==='true', wireless:kv['wireless powered']==='true',
    stopped:/updates stopped/i.test(String(text||'')),
    raw:String(text||'')
  };
}
function batPlugged(b){
  if(b.ac) return '直流充电';
  if(b.usb) return 'USB 充电';
  if(b.wireless) return '无线充电';
  if(b.stopped) return '未插电';
  return '电池';
}
function batSourceNow(b){
  if(b.ac) return 'ac';
  if(b.usb) return 'usb';
  if(b.wireless) return 'wireless';
  if(b.stopped) return 'unplugged';
  return '';
}
function batRun(cmd){ return realShell(cmd).then(out=>{ log(cmd, out||'执行成功'); return out; }); }
async function batRead(){
  const info=parseBattery(await batRun('dumpsys battery'));
  BAT.info=info;
  /* 同步给主页「电池信息」，避免两处数值不一致 */
  state.device.battery={
    level:info.level==null?0:info.level,
    voltage:info.voltage==null?'—':info.voltage.toFixed(3)+' V',
    temp:info.temp==null?'—':info.temp.toFixed(1)+'°C',
    health:BAT_HEALTH[info.health]||'—',
    status:BAT_STATUS[info.status]||'—',
    plugged:batPlugged(info)
  };
  return info;
}
async function batRefresh(quiet){
  if(state.mode!=='real' || !state.adb){ batPaint(); if(!quiet) toast('请先连接真机','warn'); return; }
  if(BAT.reading) return;
  BAT.reading=true;
  try{ await batRead(); batPaint(); }
  catch(e){ if(!quiet) toast('读取失败：'+esc((e&&e.message)||e),'err'); }
  finally{ BAT.reading=false; }
}
function batPaint(){
  const b=BAT.info, real=state.mode==='real';
  const lv=(b.level==null?0:b.level), C=2*Math.PI*54;
  const arc=$('#batteryArc'); if(arc) arc.setAttribute('stroke-dashoffset',String(C*(1-lv/100)));
  const l=$('#batteryLv'); if(l) l.textContent=real&&b.level!=null?b.level+'%':'—';
  const st=$('#batteryStatus'); if(st) st.textContent=real?(BAT_STATUS[b.status]||'—'):'—';
  const vals=[
    b.voltage==null?'—':b.voltage.toFixed(3)+' V',
    b.temp==null?'—':b.temp.toFixed(1)+' ℃',
    b.health==null?'—':(BAT_HEALTH[b.health]||'—'),
    real?batPlugged(b):'—',
    real?(BAT_STATUS[b.status]||'—'):'—',
    state.device.model||'—'
  ];
  $$('#page-battery .metric-grid .m-v').forEach((el,i)=>{ if(vals[i]!=null) el.textContent=vals[i]; });
  const raw=$('#batRaw'); if(raw) raw.textContent=(real&&b.raw)?b.raw.trim():'连接设备后读取';
  const now=batSourceNow(b);
  $$('#page-battery [data-src]').forEach(btn=>btn.classList.toggle('on',btn.dataset.src===now));
  batPaintLog();
}
function hms(sec){ const p=n=>String(n).padStart(2,'0'); return p(Math.floor(sec/3600))+':'+p(Math.floor(sec%3600/60))+':'+p(sec%60); }
function batPaintLog(){
  const st=BAT.stats, box=$('#batLog');
  if(box){
    box.classList.toggle('power',!!st.power);
    const prev=box.scrollTop, near=box.scrollHeight-prev-box.clientHeight<40;
    const rows=st.rows.slice(-200);
    if(!rows.length){
      box.innerHTML='<div class="bat-empty">开始后每 '+Math.round(st.interval/1000)+' 秒记录一次</div>';
    }else{
      box.innerHTML='<div class="bat-row head"><span>时间</span><span>电量</span><span>温度</span>'+(st.power?'<span>功率</span>':'')+'</div>'+
        rows.map(r=>'<div class="bat-row"><span>'+r.time+'</span><span>'+(r.level==null?'—':r.level+'%')+'</span>'+
          '<span>'+(r.temp==null?'—':r.temp.toFixed(1)+'℃')+'</span>'+
          (st.power?'<span>'+(r.power==null?'—':r.power.toFixed(2)+'W')+'</span>':'')+'</div>').join('');
      box.scrollTop=near?box.scrollHeight:prev;
    }
  }
  const c=$('#batCount'); if(c) c.textContent=st.rows.length?st.rows.length+' 条':'0 条';
  const s2=$('#batState');
  if(s2) s2.textContent=st.running?('统计中 · 每 '+Math.round(st.interval/1000)+' 秒'):(st.rows.length?'已停止':'未开始');
  const btn=$('#batStartBtn');
  if(btn){
    btn.innerHTML=icon(st.running?'stop':'play',15)+(st.running?'停止':'开始');
    btn.classList.toggle('primary',!st.running);
  }
}
async function readPower(){
  try{
    const t=await realShell('printf "c:"; cat /sys/class/power_supply/battery/current_now 2>/dev/null; printf " v:"; cat /sys/class/power_supply/battery/voltage_now 2>/dev/null');
    const c=t.match(/c:\s*(-?\d+)/), v=t.match(/v:\s*(-?\d+)/);
    if(c&&v){ const w=Math.abs(Number(c[1])*Number(v[1])/1e12); if(Number.isFinite(w)) return w; }
  }catch(_){}
  return null;
}
async function batSample(){
  const st=BAT.stats;
  if(!st.running || st.busy) return;
  if(state.mode!=='real' || !state.adb){ batStop(); return; }
  st.busy=true;
  try{
    const info=await batRead();
    if(!st.running) return;
    const power=st.power?await readPower():null;
    const sec=Math.floor((Date.now()-st.start)/1000);
    st.rows.push({time:hms(sec), level:info.level, temp:info.temp, power});
    if(st.rows.length>=50000){ batStop(); toast('已记录 50000 条，请导出后重新开始','warn'); }
    batPaint();
  }catch(e){
    batStop();
    toast('统计已停止：'+esc((e&&e.message)||e),'err');
  }finally{ st.busy=false; }
}
function batLoop(){
  const st=BAT.stats;
  if(st.timer){ clearTimeout(st.timer); st.timer=null; }
  if(!st.running || st.interval<=0) return;
  st.timer=setTimeout(async()=>{ if(!st.running) return; await batSample(); batLoop(); }, st.interval);
}
function batStop(){
  const st=BAT.stats;
  st.running=false;
  if(st.timer){ clearTimeout(st.timer); st.timer=null; }
  batPaintLog();
}
async function batToggle(){
  const st=BAT.stats;
  if(st.running){ batStop(); toast('已停止统计','ok'); return; }
  if(state.mode!=='real' || !state.adb){ toast('请先连接真机','warn'); return; }
  st.rows=[]; st.start=Date.now(); st.model=state.device.model||'';
  const sel=$('#batInterval');
  const sec=parseInt(sel&&sel.value,10);
  st.interval=(Number.isFinite(sec)&&sec>0?sec:3)*1000;
  if(st.power){
    const p=await readPower();
    if(p==null){
      st.power=false;
      const t=$('[data-act="bat-power"]');
      if(t){ t.classList.remove('on'); t.setAttribute('aria-pressed','false'); }
      toast('功率节点不可读，本次只记电量与温度','warn');
    }
  }
  st.running=true;
  batPaintLog();
  await batSample();
  batLoop();
}
async function batSet(key){
  if(state.mode!=='real'){ toast('请先连接真机','warn'); return; }
  let cmd='';
  const raw=String((($(key==='level'?'#batLevel':'#batTemp')||{}).value)??'').trim();
  if(raw===''){ toast('请先填写数值','warn'); return; }
  if(key==='level'){
    const v=Math.round(Number(raw));
    if(!Number.isFinite(v)||v<0||v>100){ toast('电量需在 0 – 100 之间','warn'); return; }
    cmd='dumpsys battery set level '+v;
  }else{
    const v=Number(raw);
    if(!Number.isFinite(v)||v<-50||v>150){ toast('温度需在 -50 – 150 ℃ 之间','warn'); return; }
    cmd='dumpsys battery set temp '+Math.round(v*10);
  }
  try{ await batRun(cmd); await batRead(); batPaint(); toast('已写入模拟值','ok'); }
  catch(e){ toast('写入失败：'+esc((e&&e.message)||e),'err'); }
}
async function batSource(kind){
  if(state.mode!=='real'){ toast('请先连接真机','warn'); return; }
  const both='dumpsys battery set ac 1; dumpsys battery set usb 0; dumpsys battery set wireless 0; dumpsys battery set status 2';
  const cmds={
    unplugged:'dumpsys battery unplug',
    usb:'dumpsys battery set ac 0; dumpsys battery set usb 1; dumpsys battery set wireless 0; dumpsys battery set status 2',
    wireless:'dumpsys battery set ac 0; dumpsys battery set usb 0; dumpsys battery set wireless 1; dumpsys battery set status 2',
    ac:both
  };
  const cmd=cmds[kind]; if(!cmd) return;
  try{ await batRun(cmd); await batRead(); batPaint(); toast('已模拟：'+({unplugged:'非充电',usb:'USB 充电',wireless:'无线充电',ac:'直流充电'}[kind]),'ok'); }
  catch(e){ toast('模拟失败：'+esc((e&&e.message)||e),'err'); }
}
async function batReset(){
  if(state.mode!=='real'){ toast('请先连接真机','warn'); return; }
  try{ await batRun('dumpsys battery reset'); await batRead(); batPaint(); toast('已恢复真实电池参数','ok'); }
  catch(e){ toast('恢复失败：'+esc((e&&e.message)||e),'err'); }
}
function batFileName(){
  const d=new Date(), p=n=>String(n).padStart(2,'0');
  const ts=d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+'_'+p(d.getHours())+'-'+p(d.getMinutes())+'-'+p(d.getSeconds());
  const model=String(BAT.stats.model||state.device.model||'未知机型').replace(/[\\/:*?"<>|\s]+/g,'_').slice(0,60)||'未知机型';
  return model+'_'+ts+'.csv';
}
function batCsvText(){
  const st=BAT.stats;
  const head='时间,电量(%),温度(℃)'+(st.power?',电池功率(W)':'');
  const body=st.rows.map(r=>[r.time, r.level==null?'':r.level, r.temp==null?'':r.temp.toFixed(1)]
    .concat(st.power?[r.power==null?'':r.power.toFixed(3)]:[]).join(','));
  return '\uFEFF'+head+'\r\n'+body.join('\r\n');
}
function batExport(){
  const st=BAT.stats;
  if(!st.rows.length){ toast('暂无统计数据','warn'); return; }
  saveBlobAs(new Blob([batCsvText()],{type:'text/csv;charset=utf-8'}),batFileName());
  toast('已导出 '+st.rows.length+' 条记录','ok');
}

/* 读取设备当前字体 / 动画 / 锁屏参数，只回填控件不重建 DOM */
async function loadTuning(silent){
  if(state.mode!=='real'){ if(!silent) toast('请先连接真机','warn'); return; }
  if(state.tuning.reading) return;
  state.tuning.reading=true;
  try{
    const [f,w,tr,a,to]=await Promise.all([
      realShell('settings get system font_scale'),
      realShell('settings get global window_animation_scale'),
      realShell('settings get global transition_animation_scale'),
      realShell('settings get global animator_duration_scale'),
      realShell('settings get system screen_off_timeout')
    ]);
    const num=(v,d)=>{ const n=parseFloat(String(v).trim()); return Number.isFinite(n)?n:d; };
    const clamp=(n,a,b)=>Math.min(b,Math.max(a,n));
    state.tuner.fontScale=clamp(num(f,1),0.2,4);
    state.tuner.winScale=clamp(num(w,1),0,4);
    state.tuner.transScale=clamp(num(tr,1),0,4);
    state.tuner.animScale=clamp(num(a,1),0,4);
    state.tuner.timeoutSec=Math.round(clamp(num(to,60000),1000,2147483000)/1000);
    state.tuning.at=Date.now();
    applyTuningState();
  }catch(e){
    if(!silent) toast('读取调节参数失败：'+esc(e.message||e),'err');
  }finally{ state.tuning.reading=false; }
}
function applyTuningState(){
  ['fontScale','winScale','transScale','animScale'].forEach(k=>{
    const el=$('[data-skey="'+k+'"]');
    if(el) el.value=state.tuner[k];
    const out=$('#v-'+k); if(out) out.textContent=fmtScale(state.tuner[k]);
  });
  const sleep=$('#sleepSec'); if(sleep) sleep.value=state.tuner.timeoutSec;
  const now=$('#sleepNow'); if(now) now.textContent='当前：'+state.tuner.timeoutSec+' 秒';
  $$('#page-tuner [data-act="font-preset"]').forEach(b=>{
    b.classList.toggle('primary', Math.abs(state.tuner.fontScale-parseFloat(b.dataset.v))<0.001);
  });
}
async function applySleepTimeout(){
  if(state.mode!=='real'){ toast('请先连接真机','warn'); return; }
  const el=$('#sleepSec');
  const sec=parseInt(el?el.value:'',10);
  if(!Number.isFinite(sec)||sec<1||sec>2147483){ toast('请输入 1 - 2147483 之间的秒数','warn'); return; }
  await runCmd('settings put system screen_off_timeout '+(sec*1000),true);
  state.tuner.timeoutSec=sec;
  const now=$('#sleepNow'); if(now) now.textContent='当前：'+sec+' 秒';
  toast('锁屏时间已设为 '+sec+' 秒','ok');
}

    '</div>';
  drawTerminal();

function termClass(t){ return t==='cmd'?'t-cmd':t==='err'?'t-err':t==='sys'?'t-sys':'t-out'; }
function drawTerminal(){
  const box=$('#termBox'); if(!box) return;
  if(!state.termLines.length) state.termLines=[{t:'sys',s:'搞机工具箱 ADB Terminal · 输入 help 查看可用命令\n'+(state.mode==='real'?'已连接真机，输入 shell 命令开始':'尚未连接设备，请先点击右上角「连接设备」')}];
  box.innerHTML=state.termLines.map(l=>'<div class="'+termClass(l.t)+'">'+esc(l.s)+'</div>').join('');
  box.scrollTop=box.scrollHeight;
}
/* 增量追加：长历史不再每次重建 innerHTML，并限制最多 500 行 */
function appendTermLine(l){
  const box=$('#termBox'); if(!box) return;
  state.termLines.push(l);
  const div=document.createElement('div');
  div.className=termClass(l.t); div.textContent=l.s;
  box.appendChild(div);
  const MAX=500;
  if(state.termLines.length>MAX){
    const drop=state.termLines.length-MAX;
    state.termLines.splice(0,drop);
    for(let i=0;i<drop && box.firstChild;i++) box.removeChild(box.firstChild);
  }
  box.scrollTop=box.scrollHeight;
}
async function termExec(cmd){
  cmd=cmd.trim(); if(!cmd) return;
  state.termHistory.push(cmd); state.termIdx=state.termHistory.length;
  if(cmd==='clear'){ state.termLines=[]; drawTerminal(); return; }
  if(cmd==='help'){
    appendTermLine({t:'cmd',s:'$ help'});
    appendTermLine({t:'sys',s:'可用命令：getprop / dumpsys / pm / wm / settings / input / am / reboot / screencap 等设备端 shell 命令。\n未连接设备时会提示先连接真机；连接后所有命令真实下发。'});
    return;
  }
  appendTermLine({t:'cmd',s:'$ '+cmd});
  let out;
  try{ out=await shell(cmd); log(cmd,out||'成功'); }
  catch(e){ out='ERROR: '+(e.message||e); }
  if(out==='__CLEAR__'){ state.termLines=[]; drawTerminal(); return; }
  appendTermLine({t:out.indexOf('ERROR')===0||/not found/.test(out)?'err':'out',s:out||'(无输出)'});
}

/* ---------------- 事件委托 ---------------- */
document.addEventListener('click', async e=>{
  const nav=e.target.closest('[data-nav]');
  if(nav){ showPage(nav.dataset.nav); return; }
  const el=e.target.closest('[data-act]');
  if(!el) return;
  const act=el.dataset.act, cmd=el.dataset.cmd||'', key=el.dataset.key;
  switch(act){
    case 'toggle-theme': {
      settings.theme = document.documentElement.getAttribute('data-theme')==='dark'?'light':'dark';
      saveSettings(); applyTheme(); break;
    }
    case 'conn-toggle': {
      if(state.connecting){ cancelConnect(); break; }
      if(state.mode!=='none'){ await disconnect(); break; }
      connectFlow();
      break;
    }
    case 'diagnose': showDiagnostics(); break;
    case 'refresh': refreshDevices(); break;
    case 'toggle-board': state.showBoard=!state.showBoard; renderHome(); break;
    case 'reboot': {
      if(state.mode==='none'){ toast('请先连接真机','warn'); return; }
      const label=el.dataset.label;
      const go=async()=>{ await runCmd(cmd,true); toast('已下发「'+label+'」指令：'+esc(cmd),'ok'); };
      if(settings.confirm){
        const i=await dialog('确认执行「'+label+'」？','将向设备下发命令：<br><code class="code-inline">'+esc(cmd)+'</code><br><br>设备会立即重启或关机，此操作不可撤销。',[{label:'取消'},{label:'确认执行',primary:true,danger:true}]);
        if(i===1) go();
      }else go();
      break;
    }
    case 'run': runCmd(cmd); break;
    case 'apply': {
      const tpl=el.dataset.tpl||cmd;
      const v=key&&state.tuner[key]!=null?state.tuner[key]:'';
      await runCmd(tpl.replace(/\{v\}/g,String(v)));
      if(key==='bright') await runCmd('settings put system screen_brightness_mode 0',true);
      break;
    }
    case 'wm-size': await runCmd('wm size '+state.tuner.w+'x'+state.tuner.h); break;
    case 'wm-density': await runCmd('wm density '+state.tuner.dpi); break;
    case 'wm-reset': await runCmd('wm size reset',true); await runCmd('wm density reset',true); toast('分辨率与密度已重置','ok'); break;
    case 'anim-apply': {
      const v=state.tuner.anim;
      await runCmd('settings put global window_animation_scale '+v,true);
      await runCmd('settings put global transition_animation_scale '+v,true);
      await runCmd('settings put global animator_duration_scale '+v,true);
      toast('动画速度已设置为 '+v+'×','ok'); break;
    }
    case 'app-refresh': appRefresh(); break;
    case 'app-kind': {
      const k=el.dataset.kind;
      if(k!==state.appKind){ state.appKind=k; filterAppRows(); }
      $$('#page-apps .app-kind .chip').forEach(c=>{
        const on=c.dataset.kind===state.appKind;
        c.classList.toggle('active',on); c.setAttribute('aria-selected',on?'true':'false');
      });
      break;
    }
    case 'refresh-sysui': await loadSystemUI(); break;
    case 'hide-icons': await applyIconBlacklist(); break;
    case 'statusbar-apply': await applyStatusbarSettings(); break;
    case 'wifi-fix': await fixWifiPortal(); break;
    case 'immersive': await applyImmersive(el.dataset.kind); break;
    case 'refresh-tuning': await loadTuning(); break;
    case 'set-timeout': await applySleepTimeout(); break;
    case 'font-preset': {
      if(state.mode!=='real'){ toast('请先连接真机','warn'); break; }
      const v=parseFloat(el.dataset.v);
      state.tuner.fontScale=v;
      await runCmd('settings put system font_scale '+v.toFixed(2),true);
      renderTuner();
      toast('字体大小已设为 '+fmtScale(v),'ok'); break;
    }
    case 'sleep-preset': {
      if(state.mode!=='real'){ toast('请先连接真机','warn'); break; }
      const sec=parseInt(el.dataset.v,10);
      const inp=$('#sleepSec'); if(inp) inp.value=sec;
      await applySleepTimeout(); break;
    }
    case 'bat-refresh': await batRefresh(false); break;
    case 'bat-level': await batSet('level'); break;
    case 'bat-temp': await batSet('temp'); break;
    case 'bat-src': await batSource(el.dataset.src); break;
    case 'bat-reset': await batReset(); break;
    case 'bat-start': await batToggle(); break;
    case 'bat-export': batExport(); break;
    case 'bat-power': {
      BAT.stats.power=!BAT.stats.power;
      el.classList.toggle('on',BAT.stats.power);
      el.setAttribute('aria-pressed',BAT.stats.power?'true':'false');
      batPaintLog();
      if(BAT.stats.power) toast('采样时将记录电池功率','ok'); else toast('已关闭功率记录','');
      break;
    }
    case 'mirror-toggle': state.mirror.running?stopMirror():startMirror(); break;
    case 'mirror-save': mirrorSave(); break;
    case 'shot-take': shotTake(); break;
    case 'shot-open': await shotOpen(+el.dataset.i); break;

      const cb=el.querySelector('input');

    case 'app-toggle': {
      const a=state.apps.find(x=>x.pkg===el.dataset.pkg); if(!a) return;
      const next=a.state==='on'?'off':'on';
      await runCmd('pm '+(next==='off'?'disable-user':'enable')+' '+a.pkg,true);

    case 'app-force': await runCmd('am force-stop '+el.dataset.pkg); break;
    case 'app-clear': {
      const i=await dialog('清除应用数据？','将执行 <code class="code-inline">pm clear '+esc(el.dataset.pkg)+'</code>，该应用的登录状态与本地数据会被清空。',[{label:'取消'},{label:'确认清除',primary:true,danger:true}]);
      if(i===1){ await runCmd('pm clear '+el.dataset.pkg,true); toast('已清除应用数据','ok'); }
      break;
    }
    case 'app-export': await appExport(el.dataset.pkg, el); break;
    case 'app-uninstall': {
      const i=await dialog('卸载应用？','将执行 <code class="code-inline">pm uninstall -k --user 0 '+esc(el.dataset.pkg)+'</code>。',[{label:'取消'},{label:'确认卸载',primary:true,danger:true}]);
      if(i===1){ await runCmd('pm uninstall -k --user 0 '+el.dataset.pkg,true); state.apps=state.apps.filter(x=>x.pkg!==el.dataset.pkg); renderApps(); toast('应用卸载指令已下发','ok'); }
      break;
    }
    case 'preset': {
      const p=el.dataset.preset;
      const map={'省电':[634,1498,3,60],'均衡':[634,2016,7,120],'性能':[1098,3000,11,144]};
      const v=map[p]; state.tuner.cpuMin=v[0]; state.tuner.cpuMax=v[1]; state.tuner.volume=v[2]; state.tuner.refresh=v[3];
      await runCmd('settings put system peak_refresh_rate '+v[3],true);
      toast('已应用「'+p+'」预设','ok'); renderTuner(); break;
    }
    case 'tpl': {
      const t=TEMPLATES[+el.dataset.i];
      if(!t) return; state.scriptText=t.code; renderScripts(); toast('已载入模板：'+t.name,''); break;
    }
    case 'script-run': runScript(); break;
    case 'script-save': {
      state.scriptText=$('#scriptEditor').value;
      const i=await dialog('保存脚本',
        '<div class="label" style="margin-bottom:8px">脚本名称</div><input class="input" id="scriptName" value="'+esc('自定义脚本 '+(state.scripts.length+1))+'" autocomplete="off">',
        [{label:'取消'},{label:'保存',primary:true}]);
      if(i!==1) break;
      const el=$('#scriptName');
      const name=((el&&el.value)||'').trim()||('自定义脚本 '+(state.scripts.length+1));
      state.scripts.push({name,code:state.scriptText});
      try{ localStorage.setItem('gjbox.scripts',JSON.stringify(state.scripts)); }catch(e){}
      renderScripts(); toast('脚本已保存','ok');
      break;
    }
    case 'script-clear': state.scriptText=''; state.scriptOutput=''; renderScripts(); break;
    case 'load-script': state.scriptText=state.scripts[+el.dataset.i].code; renderScripts(); break;
    case 'del-script': state.scripts.splice(+el.dataset.i,1); localStorage.setItem('gjbox.scripts',JSON.stringify(state.scripts)); renderScripts(); break;
    case 'term-clear': state.termLines=[]; drawTerminal(); break;
    case 'term-run': { const i=$('#termInput'); await termExec(i.value); i.value=''; i.focus(); break; }
    case 'term-quick': { const i=$('#termInput'); i.value=cmd; await termExec(cmd); i.value=''; i.focus(); break; }
    case 'clear-local': {
      const i=await dialog('清空本地数据？','将删除保存的脚本与所有偏好设置，页面将恢复默认值。',[{label:'取消'},{label:'确认清空',primary:true,danger:true}]);
      if(i===1){ localStorage.removeItem('gjbox.scripts'); localStorage.removeItem('gjbox.settings'); toast('已清空，即将刷新页面','ok'); setTimeout(()=>location.reload(),900); }
      break;
    }
  }
});

/* 开关 / 下拉 / 滑块 / 输入 */
document.addEventListener('click', async e=>{
  const s=e.target.closest('[data-switch]');
  if(!s) return;
  const key=s.dataset.key;
  state.switches[key]=!state.switches[key];
  const v=state.switches[key]?1:0;
  let cmd=s.dataset.cmd||'';
  if(cmd.indexOf('{v}')>=0) cmd=cmd.replace(/\{v\}/g,v);
  else if(!state.switches[key]) cmd=cmd.replace(/immersive\.\w+=\*/,'null').replace(/night yes/,'night no');
  if(cmd.indexOf('uimode')>=0) cmd='cmd uimode night '+(state.switches[key]?'yes':'no');
  if(cmd.indexOf('power set-mode')>=0) cmd='cmd power set-mode '+(state.switches[key]?1:0);
  if(cmd.indexOf('charging_limit')>=0 && !state.switches[key]) cmd='settings delete global charging_limit';
  if(cmd.indexOf('status_bar_show')>=0) cmd='settings put system status_bar_show_battery_percent '+v;
  // 两个开关共用 policy_control，必须按当前组合合并写入，否则关闭其一会清掉另一个
  if(key==='immersive'||key==='nav'){
    const f=state.switches.immersive, n=state.switches.nav;
    cmd='settings put global policy_control '+(f&&n?'immersive.full=*:immersive.navigation=*':f?'immersive.full=*':n?'immersive.navigation=*':'null');
  }
  s.classList.toggle('on',state.switches[key]);
  if(state.mode==='none'){ toast('请先连接真机','warn'); return; }
  await runCmd(cmd,true);
  toast('设置已'+(state.switches[key]?'开启':'关闭'),'ok');
});
document.addEventListener('input', e=>{
  const t=e.target;
  if(t.id==='appSearch'){
    state.appFilter=t.value.trim().toLowerCase();
    filterAppRows();
    return;
  }
  if(t.dataset.range){
    const k=t.dataset.range, v=parseFloat(t.value); state.tuner[k]=v;
    const unit=({bright:'',font:'×',refresh:' Hz',cpuMin:' MHz',cpuMax:' MHz',volume:'',level:'%'})[k]||'';
    const out=$('#v-'+k); if(out) out.textContent=v+unit;
    return;
  }
  if(t.dataset.scale){
    const k=t.dataset.skey; state.tuner[k]=parseFloat(t.value);
    const out=$('#v-'+k); if(out) out.textContent=fmtScale(state.tuner[k]);
    return;
  }
  if(t.dataset.num){ state.tuner[t.dataset.num]=parseInt(t.value,10)||0; return; }
  if(t.id==='scriptEditor'){ state.scriptText=t.value; return; }
});
document.addEventListener('change', async e=>{
  const t=e.target;
  if(t.dataset.icon){ state.sysui.icons[t.dataset.icon]=!!t.checked; return; }
  if(t.dataset.iconOpt){ if(t.dataset.iconOpt==='rot') state.sysui.rotationHide=!!t.checked; else state.sysui.clockSeconds=!!t.checked; return; }
  if(t.id==='suiQqs'){ state.sysui.qqs=t.value; return; }
  if(t.id==='suiPad'){ state.sysui.pad=t.value; return; }
  if(t.dataset.scale){
    const key=t.dataset.scale, k=t.dataset.skey;
    const min=parseFloat(t.min)||0, max=parseFloat(t.max)||4;
    const v=Math.min(max,Math.max(min,parseFloat(t.value)||0));
    state.tuner[k]=v;
    const scope=key==='font_scale'?'system':'global';
    await runCmd('settings put '+scope+' '+key+' '+v.toFixed(2),true);
    toast('已设置 '+key+' = '+fmtScale(v),'ok');
    return;
  }
  if(t.dataset.select==='timeout'){ state.tuner.timeout=+t.value; await runCmd('settings put system screen_off_timeout '+t.value,true); toast('休眠时间已设置','ok'); return; }
  if(t.dataset.select==='anim'){ state.tuner.anim=parseFloat(t.value); return; }
  if(t.dataset.setting){
    settings[t.dataset.setting]=t.value; saveSettings();
    if(t.dataset.setting==='theme'){ applyTheme(); toast('主题已切换','ok'); }
    if(t.dataset.setting==='refresh'){ startPolling(); toast('刷新间隔已更新','ok'); }
    return;
  }
  if(t.dataset.change==='bat-interval'){
    const sec=parseInt(t.value,10);
    BAT.stats.interval=(Number.isFinite(sec)&&sec>0?sec:3)*1000;
    if(BAT.stats.running) batLoop();
    batPaintLog();
    return;
  }
  if(t.dataset.change==='mirror-quality'){ mirrorSetQuality(t.value); return; }
  if(t.dataset.change==='mirror-bitrate'){
    const v=parseInt(t.value,10);
    settings.mirrorBitrate=String(Number.isFinite(v)&&v>=500?v:8000); saveSettings();
    if(state.mirror.running){ toast('码率已改为 '+(settings.mirrorBitrate/1000)+' Mbps，正在重连视频流',''); stopMirror(); startMirror(); }
    return;
  }
  if(t.dataset.change==='apk'){
    const f=t.files&&t.files[0]; if(!f) return;
    toast('已选择 '+esc(f.name)+'（'+(f.size/1048576).toFixed(1)+' MB）','');
    if(state.mode!=='real'){ toast('请先连接真机后再安装 APK','warn'); return; }
    // 直接用 File.stream() 分块推送，避免整个 APK 进内存导致大文件 OOM
    let sync=null;
    try{
      const stream=f.stream();
      sync=await state.adb.sync();
      await sync.write({filename:'/data/local/tmp/base.apk',file:stream});
      await runCmd('pm install -r /data/local/tmp/base.apk',true);
      toast('APK 安装流程已下发','ok');
    }catch(err){ toast('APK 安装失败：'+esc(err.message||err),'err'); }
    finally{ if(sync){ try{ await sync.dispose(); }catch(_){} } }
    return;
  }
});
document.addEventListener('click', e=>{
  const s=e.target.closest('[data-setting-sw]');
  if(!s) return;
  const k=s.dataset.settingSw; settings[k]=!settings[k]; saveSettings(); s.classList.toggle('on',settings[k]);
  toast('设置已'+(settings[k]?'开启':'关闭'),'ok');
});
/* 投屏画面：点击 = tap，拖动 = swipe，停住 620ms = 长按，滚轮 = 单指滑动 */
document.addEventListener('pointerdown', e=>{
  const st=e.target.closest && e.target.closest('#mirrorStage');
  if(!st || state.mode!=='real' || !state.adb) return;
  const p=mirrorPoint(e.clientX,e.clientY); if(!p) return;
  try{ st.focus({preventScroll:true}); }catch(_){}
  const d={x:p.x,y:p.y,t:Date.now(),px:e.clientX,py:e.clientY,moved:false,fired:false,hold:null};
  state.mirror.down=d;
  d.hold=setTimeout(async()=>{
    if(state.mirror.down!==d || d.moved || d.fired) return;
    d.fired=true;
    await runCmd('input swipe '+d.x+' '+d.y+' '+d.x+' '+d.y+' 800',true);
  },620);
});
document.addEventListener('pointermove', e=>{
  const d=state.mirror.down; if(!d) return;
  if(Math.abs(e.clientX-d.px)+Math.abs(e.clientY-d.py)>6) d.moved=true;
});
document.addEventListener('pointerup', async e=>{
  const d=state.mirror.down; if(!d) return;
  state.mirror.down=null;
  if(d.hold){ clearTimeout(d.hold); d.hold=null; }
  if(d.fired) return;
  const p=mirrorPoint(e.clientX,e.clientY); if(!p) return;
  const dist=Math.abs(p.x-d.x)+Math.abs(p.y-d.y);
  const dur=Math.max(80,Math.min(900,Date.now()-d.t));
  if(dist>8) await runCmd('input swipe '+d.x+' '+d.y+' '+p.x+' '+p.y+' '+dur,true);
  else await runCmd('input tap '+p.x+' '+p.y,true);
});
document.addEventListener('pointercancel', ()=>{
  const d=state.mirror.down; if(d&&d.hold) clearTimeout(d.hold);
  state.mirror.down=null;
});
document.addEventListener('wheel', e=>{
  const st=e.target.closest && e.target.closest('#mirrorStage');
  if(!st) return;
  e.preventDefault();
  mirrorWheel(e);
},{passive:false});
/* 画面聚焦时的键盘映射（Esc 返回 / F 全屏 / 方向键 / 空格电源键） */
document.addEventListener('keydown', async e=>{
  const st=$('#mirrorStage');
  if(!st || document.activeElement!==st) return;
  if(state.mode!=='real' || !state.adb) return;
  const k=e.key;
  if(e.ctrlKey && (k==='ArrowLeft'||k==='ArrowRight')){ e.preventDefault(); await mirrorKey(k==='ArrowLeft'?4:187); return; }
  if(e.ctrlKey||e.metaKey||e.altKey) return;
  if(k==='f'||k==='F'){ e.preventDefault(); mirrorFull(); return; }
  if(k===' '){ e.preventDefault(); await runCmd('input keyevent 26',true); return; }
  const map={Escape:4,ArrowLeft:21,ArrowRight:22,ArrowUp:19,ArrowDown:20,Enter:66,Backspace:67};
  if(map[k]!==undefined){ e.preventDefault(); await runCmd('input keyevent '+map[k],true); }
});
document.addEventListener('keydown', async e=>{
  const i=$('#termInput');
  if(e.target===i){
    if(e.key==='Enter'){ e.preventDefault(); const v=i.value; i.value=''; await termExec(v); }
    else if(e.key==='ArrowUp'){ e.preventDefault(); if(state.termIdx>0){ state.termIdx--; i.value=state.termHistory[state.termIdx]||''; } }
    else if(e.key==='ArrowDown'){ e.preventDefault(); if(state.termIdx<state.termHistory.length-1){ state.termIdx++; i.value=state.termHistory[state.termIdx]||''; } else { state.termIdx=state.termHistory.length; i.value=''; } }
  }
  if(e.key==='Escape' && !$('#mask').hidden) closeDialog(-1);
});
$('#mask').addEventListener('click', e=>{ if(e.target.id==='mask') closeDialog(-1); });
$('#deviceSelect').addEventListener('change', async e=>{
  const id=e.target.value;
  if(!id || state.mode!=='real'){ toast('请先连接真机','warn'); return; }
  const cur=(state.realDevice&&state.realDevice.serial)||'adb';
  if(id===cur){ toast('当前已连接该设备',''); return; }
  if(state.connecting){ toast('正在连接中，请稍候…',''); return; }
  toast('正在切换到设备 '+esc(id)+'…','');
  await disconnect();
  await attemptConnect(true,id);
});

/* ---------------- 启动 ---------------- */
function boot(){
  applyTheme(); renderNav();
  if(location.protocol!=='file:') warmLibs();
  const hash=(location.hash||'').replace(/^#/,'');
  showPage(NAV.some(n=>n.id===hash)?hash:'home');
  if(settings.refresh!=='0') startPolling();
  // 自动重连（仅在开启且已获得过 USB 授权时静默尝试，不弹系统选择器）
  if(settings.autoReconnect && navigator.usb && location.protocol!=='file:'){
    navigator.usb.getDevices().then(list=>{
      if(list.length) toast('检测到 '+list.length+' 台已授权设备，点击「连接设备」即可重连','');
    }).catch(()=>{});
  }
}
boot();
})();
