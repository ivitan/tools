<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" id="themeColorMeta" content="#ffffff">
<title>搞机工具箱 - 全安卓通用免ROOT玩机神器（网页版）</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%232563eb'/><rect x='11' y='6' width='10' height='20' rx='2' fill='none' stroke='white' stroke-width='2'/><path d='M14 23h4' stroke='white' stroke-width='2' stroke-linecap='round'/></svg>">
<style>
:root{
  color-scheme:light;
  /* ivitan 统一色板：slate 中性色 + blue-600 主色 */
  --brand:#2563eb; --brand-600:#1d4ed8; --brand-500:#3b82f6; --brand-on:#ffffff;
  --brand-soft:#eff6ff; --brand-soft-2:rgba(37,99,235,.10);
  --bg:#f8fafc; --card:#ffffff; --card-hover:#f1f5f9;
  --text:#0f172a; --text-2:#475569; --muted:#64748b;
  --border:#e2e8f0; --border-hover:#cbd5e1; --line:#f1f5f9; --field:#f8fafc;
  --ok:#059669; --ok-text:#047857; --ok-bg:#ecfdf5;
  --warn:#d97706; --warn-bg:#fef3c7;
  --danger:#dc2626; --danger-bg:#fef2f2; --danger-text:#b91c1c;
  --shadow:0 1px 3px rgba(0,0,0,.05), 0 1px 2px rgba(0,0,0,.03);
  --shadow-lg:0 10px 15px -3px rgba(0,0,0,.08), 0 4px 6px -2px rgba(0,0,0,.04);
  --scrollbar-thumb:#cbd5e1; --scrollbar-thumb-hover:#94a3b8;
  --term-bg:#f1f5f9; --term-border:#e2e8f0; --term-text:#0f172a;
  --term-cmd:#2563eb; --term-err:#dc2626; --term-sys:#64748b;
  --mask:rgba(15,23,42,.45);
  --radius:10px;
}
html[data-theme="dark"]{
  color-scheme:dark;
  --brand:#60a5fa; --brand-600:#3b82f6; --brand-500:#93c5fd; --brand-on:#0b1220;
  --brand-soft:rgba(96,165,250,.18); --brand-soft-2:rgba(96,165,250,.22);
  --bg:#0b1220; --card:#111827; --card-hover:#1e293b;
  --text:#f1f5f9; --text-2:#cbd5e1; --muted:#94a3b8;
  --border:#1f2937; --border-hover:#475569; --line:#1e293b; --field:#0f172a;
  --ok:#34d399; --ok-text:#6ee7b7; --ok-bg:rgba(52,211,153,.18);
  --warn:#fbbf24; --warn-bg:rgba(251,191,36,.20);
  --danger:#f87171; --danger-bg:rgba(248,113,113,.18); --danger-text:#fca5a5;
  --shadow:0 1px 3px rgba(0,0,0,.5);
  --shadow-lg:0 10px 25px rgba(0,0,0,.5);
  --scrollbar-thumb:#475569; --scrollbar-thumb-hover:#64748b;
  --term-bg:#0a1224; --term-border:#1f2937; --term-text:#f1f5f9;
  --term-cmd:#60a5fa; --term-err:#f87171; --term-sys:#94a3b8;
  --mask:rgba(0,0,0,.62);
}
*{box-sizing:border-box}
html,body{height:100%}
html{-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%;overscroll-behavior:none}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;transition:background-color .15s,color .15s}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation;user-select:none;-webkit-user-select:none}
a{color:var(--brand);text-decoration:none}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--scrollbar-thumb);border-radius:4px}
::-webkit-scrollbar-thumb:hover{background:var(--scrollbar-thumb-hover)}

/* ---------- 顶栏（对齐站点 .header：52px 白底 + 底部细线） ---------- */
.topbar{height:52px;background:var(--card);border-bottom:1px solid var(--border);color:var(--text);display:flex;align-items:center;justify-content:space-between;padding:0 16px;gap:12px;position:sticky;top:0;z-index:30;box-shadow:var(--shadow)}
.brand-group{display:flex;align-items:center;gap:10px;min-width:0;flex:1 1 auto}
.logo-icon{width:28px;height:28px;border-radius:6px;background:var(--brand);color:var(--brand-on);display:flex;align-items:center;justify-content:center;flex-shrink:0;user-select:none;transition:background-color .15s}
.logo-icon:hover{background:var(--brand-600)}
.logo-icon svg{width:16px;height:16px}
.brand-title{font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.brand-title .sub{font-weight:400;color:var(--muted);font-size:13px;margin-left:4px}
.home-btn{width:30px;height:30px;border-radius:50%;border:none;background:var(--card-hover);color:var(--brand);display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;transition:.15s}
.home-btn:hover{background:var(--brand);color:var(--brand-on)}
.home-btn svg{width:16px;height:16px}
.status #statusName{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.top-right{display:flex;align-items:center;gap:6px;flex-shrink:0}
.status{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--text-2);margin-right:6px;white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;background:var(--border-hover);display:inline-block;flex-shrink:0}
.dot.green{background:var(--ok);box-shadow:0 0 0 3px var(--ok-bg)}
.ghost-btn{height:32px;padding:0 12px;border-radius:6px;border:1px solid var(--border);background:var(--card);color:var(--text);font-size:13px;display:inline-flex;align-items:center;gap:6px;transition:.15s;white-space:nowrap}
.ghost-btn:hover{background:var(--card-hover);border-color:var(--border-hover)}
.ghost-btn.solid{background:var(--brand);border-color:var(--brand);color:var(--brand-on)}
.ghost-btn.solid:hover{background:var(--brand-600);border-color:var(--brand-600)}
.ghost-btn.icon{width:32px;padding:0;justify-content:center}
.ghost-btn:disabled{opacity:.4;cursor:not-allowed}
.ghost-btn svg{width:15px;height:15px}

/* ---------- 布局 ---------- */
.layout{display:flex;min-height:calc(100vh - 52px)}
.sidebar{width:200px;flex:0 0 200px;background:var(--card);border-right:1px solid var(--border);display:flex;flex-direction:column;padding:10px 0 14px;position:sticky;top:52px;height:calc(100vh - 52px)}
.nav{display:flex;flex-direction:column;gap:2px;overflow-y:auto;flex:1}
.nav-item{position:relative;display:flex;align-items:center;gap:10px;height:38px;padding:0 16px;color:var(--text-2);font-size:13px;border:none;background:transparent;width:100%;text-align:left;transition:.15s}
.nav-item svg{width:16px;height:16px;flex-shrink:0;opacity:.75}
.nav-item:hover{background:var(--card-hover);color:var(--text)}
.nav-item.active{background:var(--brand-soft);color:var(--brand);font-weight:600}
.nav-item.active::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--brand)}
.nav-item.active svg{opacity:1}
.side-foot{padding:12px 16px 0;color:var(--muted);font-size:11.5px;line-height:1.7;border-top:1px solid var(--line)}
.side-foot b{font-weight:600;color:var(--text-2)}
.main{flex:1;min-width:0;padding:24px 28px 50px}
.container{max-width:1180px;margin:0 auto}
.page{display:none;animation:fade .18s ease}
.page.active{display:block}
@keyframes fade{from{opacity:0}to{opacity:1}}
.page-title{font-size:19px;font-weight:600;margin:0 0 18px}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:20px 22px;min-width:0}
.card-title{font-size:15px;font-weight:600;margin:0 0 16px}
.card-title-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.card-title-row .card-title{margin:0}
.badge-soft{font-size:11.5px;color:var(--muted);background:var(--card-hover);border:1px solid var(--border);padding:3px 8px;border-radius:6px}

/* ---------- 设备信息 ---------- */
.info-card{padding:24px 28px 22px;margin-bottom:20px}
.info-grid{display:grid;grid-template-columns:minmax(0,1.02fr) minmax(0,1.28fr) minmax(0,1.84fr);column-gap:26px;row-gap:4px}
.info-col{display:flex;flex-direction:column;gap:0;min-width:0}
.cpu-pane{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);column-gap:26px;align-content:start;min-width:0}
.kv{display:grid;grid-template-columns:66px minmax(0,1fr);align-items:baseline;min-height:29px;line-height:1.5}
.kv .k{color:var(--muted);font-size:13px;white-space:nowrap}
.kv .v{color:var(--text);font-size:13px;word-break:break-all}
.kv .v.blue{color:var(--brand);font-weight:500}
.kv .v.mono{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:12.5px}
.info-divider{height:1px;background:var(--line);margin:16px 0 14px}
.info-bottom{display:flex;flex-direction:column;gap:2px}
.info-bottom .kv{grid-template-columns:66px minmax(0,1fr);min-height:26px}
.info-bottom .v{color:var(--text-2);font-size:12.5px;font-family:ui-monospace,SFMono-Regular,Consolas,monospace;word-break:break-all}
.link-btn{border:none;background:none;color:var(--brand);font-size:12.5px;padding:0 0 0 8px}
.link-btn:hover{text-decoration:underline}
.empty-hint{color:var(--muted)}

/* ---------- 主页下半区 ---------- */
.home-lower{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px}
.reboot-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.btn-reboot{height:40px;border:1px solid var(--brand);border-radius:6px;background:var(--brand);color:var(--brand-on);font-size:13px;display:flex;align-items:center;justify-content:center;gap:7px;transition:.15s;font-weight:600}
.btn-reboot:hover{background:var(--brand-600);border-color:var(--brand-600)}
.btn-reboot:disabled{opacity:.4;filter:saturate(.5);cursor:not-allowed;transform:none}
.btn-reboot:disabled:hover{background:var(--brand);transform:none}
html[data-theme="dark"] .btn-reboot:disabled:hover{background:var(--brand-600)}
.btn-reboot svg{width:15px;height:15px}
.connected-line{display:flex;align-items:center;gap:9px;font-size:13.5px;font-weight:500;margin-bottom:16px}
.device-picker{display:flex;gap:10px}
.device-picker select{flex:1;min-width:0;height:34px;padding:0 12px;border:1px solid var(--border);border-radius:6px;background:var(--card);color:var(--text);outline:none}
.device-picker select:focus{border-color:var(--brand)}
.btn-outline{height:34px;padding:0 12px;border:1px solid var(--border);background:var(--card);border-radius:6px;color:var(--text);font-size:13px;display:inline-flex;align-items:center;gap:7px;white-space:nowrap;transition:.15s}
.btn-outline:hover{border-color:var(--brand);color:var(--brand)}
.btn-outline svg{width:15px;height:15px}
#refreshIcon{display:inline-flex}
.hint{color:var(--muted);font-size:12.5px;line-height:1.7;margin:18px 0 0}

/* ---------- 通用控件 ---------- */
.btn{height:32px;padding:0 12px;border:1px solid var(--border);background:var(--card);color:var(--text);border-radius:6px;font-size:13px;display:inline-flex;align-items:center;justify-content:center;gap:6px;transition:.15s;white-space:nowrap}
.btn:hover{border-color:var(--border-hover);background:var(--card-hover)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--brand-on)}
.btn.primary:hover{background:var(--brand-600);border-color:var(--brand-600)}
.btn.danger{color:var(--danger)}
.btn svg{width:15px;height:15px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.input{height:34px;padding:0 12px;border:1px solid var(--border);border-radius:6px;background:var(--card);outline:none;min-width:0}
.input:focus{border-color:var(--brand)}
.input.num-sm{width:74px}
.input.num-md{width:90px}
textarea.input{height:auto;padding:10px 12px;resize:vertical;line-height:1.6}
.toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.toolbar .input{flex:1;max-width:320px}
.stat{color:var(--muted);font-size:12.5px;margin-left:auto}
.stat b{color:var(--text)}
.grid-2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px}
.grid-3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.section-title{font-size:14px;font-weight:600;margin:0 0 12px}
.muted{color:var(--muted)}
.mt16{margin-top:16px}
.mt20{margin-top:20px}

/* 表格 */
.table-card{padding:0;overflow:hidden}
/* 无数据 / 无匹配时取消表格最小宽度，避免空态提示在窄屏被横向裁切 */
.table-card.empty{overflow:hidden}
.table-card.empty table{min-width:0}
.table-card.empty thead{display:none}
table{width:100%;border-collapse:collapse;font-size:13px;table-layout:fixed}
th,td{text-align:left;padding:12px 16px;border-bottom:1px solid var(--line)}
table th:nth-child(1){width:36%}
table th:nth-child(2){width:14%}
table th:nth-child(3){width:13%}
table th:nth-child(4){width:13%}
table th.col-ops{width:24%}
th{background:var(--field);color:var(--muted);font-weight:500;font-size:12.5px;white-space:nowrap}
tbody tr:last-child td{border-bottom:none}
tbody tr:hover{background:var(--field)}
.td-ops{display:flex;gap:6px;flex-wrap:wrap}
.mini-btn{border:1px solid var(--border);background:var(--card);color:var(--text-2);border-radius:6px;padding:4px 9px;font-size:12px;white-space:nowrap}
.mini-btn:hover{border-color:var(--brand);color:var(--brand)}
.mini-btn.red:hover{border-color:var(--danger);color:var(--danger)}
.pill{font-size:11.5px;padding:2px 8px;border-radius:20px;background:var(--brand-soft-2);color:var(--brand);white-space:nowrap}
.pill.gray{background:var(--card-hover);color:var(--muted)}
.pill.green{background:var(--ok-bg);color:var(--ok-text)}
.app-cell{display:flex;align-items:center;gap:10px}
.app-icon{width:30px;height:30px;border-radius:6px;background:var(--brand-soft-2);color:var(--brand);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;flex-shrink:0}
.app-name{font-weight:500}
.app-pkg{font-size:11.5px;color:var(--muted);font-family:ui-monospace,Consolas,monospace}

/* 设置行 */
.row-item{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px 18px;padding:13px 0;border-bottom:1px solid var(--line)}
.row-item:last-child{border-bottom:none}
.row-item .label{font-size:13.5px}
.row-item .desc{font-size:12px;color:var(--muted);margin-top:3px;line-height:1.5}
.row-item .ctrl{display:flex;align-items:center;flex-wrap:wrap;gap:10px;min-width:0}
.row-item select{min-width:130px;height:34px;padding:0 10px;border:1px solid var(--border);border-radius:6px;background:var(--field);outline:none}
.switch{position:relative;width:42px;height:23px;border-radius:20px;background:var(--border);border:none;transition:.2s;flex-shrink:0}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:17px;height:17px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.2);transition:.2s}
.switch.on{background:var(--brand)}
.switch.on::after{transform:translateX(19px)}
.range-wrap{display:flex;align-items:center;gap:12px}
input[type=range]{-webkit-appearance:none;appearance:none;width:190px;height:5px;border-radius:5px;background:var(--border);outline:none}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;background:var(--brand);cursor:pointer;box-shadow:0 1px 4px rgba(37,99,235,.35)}
.range-val{min-width:66px;font-size:13px;font-variant-numeric:tabular-nums;color:var(--brand);font-weight:600}

/* 电池 */
.battery-wrap{display:flex;align-items:center;gap:26px;flex-wrap:wrap}
.ring{position:relative;width:128px;height:128px;flex-shrink:0}
.ring svg{transform:rotate(-90deg)}
.ring .ring-text{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring .ring-text b{font-size:28px;line-height:1}
.ring .ring-text span{font-size:11px;color:var(--muted);margin-top:5px}
.metric-grid{display:grid;grid-template-columns:repeat(2,minmax(130px,1fr));gap:14px 26px;flex:1}
.metric .m-k{font-size:12px;color:var(--muted)}
.metric .m-v{font-size:17px;font-weight:600;margin-top:4px}

/* 终端 */
.terminal{background:var(--term-bg);border:1px solid var(--term-border);border-radius:6px;padding:16px;height:400px;overflow-y:auto;font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:12.8px;line-height:1.75;color:var(--term-text)}
.terminal .t-cmd{color:var(--term-cmd)}
.terminal .t-out{white-space:pre-wrap;word-break:break-all;color:var(--term-text)}
.terminal .t-err{color:var(--term-err)}
.terminal .t-sys{color:var(--term-sys)}
.term-input{display:flex;align-items:center;gap:10px;margin-top:12px}
.term-input .prompt{font-family:ui-monospace,Consolas,monospace;color:var(--brand);font-weight:700}
.term-input input{flex:1;height:34px;background:var(--card);border:1px solid var(--border);border-radius:6px;padding:0 12px;outline:none;font-family:ui-monospace,Consolas,monospace}
.term-input input:focus{border-color:var(--brand)}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.chip{border:1px solid var(--border);background:var(--card);border-radius:20px;padding:5px 12px;font-size:12px;color:var(--text-2);font-family:ui-monospace,Consolas,monospace}
.chip:hover{border-color:var(--brand);color:var(--brand)}

/* 脚本 */
.code-area{width:100%;min-height:180px;background:var(--field);border:1px solid var(--border);border-radius:6px;padding:12px;font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:12.8px;line-height:1.7;outline:none;color:var(--text)}
.code-area:focus{border-color:var(--brand)}
.tpl-list{display:flex;flex-direction:column;gap:8px}
.tpl{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 13px;border:1px solid var(--border);border-radius:6px;background:var(--card);cursor:pointer;transition:.15s}
.tpl:hover{border-color:var(--brand);background:var(--brand-soft)}
.tpl .t-name{font-size:13px;font-weight:500}
.tpl .t-desc{font-size:11.5px;color:var(--muted);margin-top:3px}
.output-box{background:var(--field);border:1px solid var(--border);border-radius:6px;padding:12px;min-height:110px;max-height:220px;overflow:auto;white-space:pre-wrap;word-break:break-all;font-family:ui-monospace,Consolas,monospace;font-size:12.3px;line-height:1.65;color:var(--text-2)}

/* 关于 */
.about-hero{display:flex;align-items:center;gap:16px;margin-bottom:18px}
.about-logo{width:52px;height:52px;border-radius:10px;background:var(--brand);color:var(--brand-on);display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:700;flex-shrink:0}
.kv-list{display:grid;grid-template-columns:repeat(2,1fr);gap:12px 28px}
.kv-list .kv{grid-template-columns:82px 1fr}
.code-inline{font-family:ui-monospace,Consolas,monospace;background:var(--field);border:1px solid var(--border);border-radius:4px;padding:1px 5px;font-size:12px}
.notice{background:var(--brand-soft);border:1px solid var(--border);border-radius:6px;padding:12px 14px;font-size:12.8px;line-height:1.8;color:var(--text-2)}

/* toast & dialog */
#toasts{position:fixed;right:22px;bottom:22px;display:flex;flex-direction:column;gap:9px;z-index:100}
.toast{min-width:220px;max-width:380px;background:var(--card);border:1px solid var(--border);border-left:3px solid var(--brand);border-radius:6px;box-shadow:var(--shadow-lg);padding:11px 15px;font-size:13px;line-height:1.6;animation:slidein .2s ease;color:var(--text)}
.toast.ok{border-left-color:var(--ok)}
.toast.warn{border-left-color:var(--warn)}
.toast.err{border-left-color:var(--danger)}
@keyframes slidein{from{opacity:0;transform:translateX(16px)}to{opacity:1;transform:none}}
.mask{position:fixed;inset:0;background:var(--mask);display:flex;align-items:center;justify-content:center;z-index:90;padding:20px;-webkit-backdrop-filter:blur(2px);backdrop-filter:blur(2px)}
.mask[hidden]{display:none}
.dialog{background:var(--card);border:1px solid var(--border);border-radius:10px;width:min(440px,100%);max-height:calc(100vh - 40px);overflow:auto;box-shadow:var(--shadow-lg);padding:22px 24px}
.dialog h3{margin:0 0 12px;font-size:16px}
.dialog .dlg-body{font-size:13.2px;line-height:1.8;color:var(--text-2)}
.dialog .dlg-body p{margin:0}
.dialog .dlg-body ol{margin:10px 0 0;padding-left:20px}
.dialog .dlg-body li{margin:5px 0}
.dialog .dlg-body b{color:var(--text)}
.dlg-actions{flex-wrap:wrap}
.dlg-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:22px;flex-wrap:wrap}
.choice{display:block;width:100%;text-align:left;border:1px solid var(--border);border-radius:6px;background:var(--field);padding:12px 14px;margin-top:10px;transition:.15s}
.choice:hover{border-color:var(--brand);background:var(--brand-soft)}
.choice b{display:block;font-size:13.5px;margin-bottom:3px}
.choice span{font-size:12px;color:var(--muted);line-height:1.6}
.spin{animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* ---------- 暗色模式微调 ---------- */
html[data-theme="dark"] .nav-item.active,
html[data-theme="dark"] .app-icon,
html[data-theme="dark"] .pill,
html[data-theme="dark"] .link-btn{color:var(--brand)}
html[data-theme="dark"] .switch::after{background:#f5f7ff}
html[data-theme="dark"] .dot{background:#7d86a8}
html[data-theme="dark"] input[type=range]::-webkit-slider-thumb{box-shadow:0 1px 6px rgba(96,165,250,.6)}

/* 长命令 / 长文本不撑破容器，表格可横向滚动 */
.code-inline,.hint,.notice,.muted,.dlg-body,.output-box{overflow-wrap:anywhere}
.about-hero{flex-wrap:wrap}
.device-picker{flex-wrap:wrap}
.table-card{overflow:auto}
table{min-width:720px}
.ring svg{width:100%;height:100%}
input[type=range]{width:clamp(120px,16vw,190px)}
.scripts-layout{display:grid;grid-template-columns:300px minmax(0,1fr);gap:20px}

/* ---------- 响应式断点 ---------- */
@media (min-width:1600px){
  .main{padding:30px 36px 60px}
  .page-title{font-size:22px}
  .card{padding:24px 28px}
}
@media (max-width:1279px){
  .main{padding:22px 22px 44px}
  .card{padding:20px 22px}
  .info-card{padding:22px 24px 20px}
  .info-grid{column-gap:18px}
  .status{max-width:190px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
}
@media (max-width:1023px){
  .home-lower,.grid-2,.grid-3,.kv-list,.scripts-layout{grid-template-columns:minmax(0,1fr)}
  .info-grid{grid-template-columns:minmax(0,1fr) minmax(0,1fr);row-gap:10px}
  .cpu-pane{grid-column:1/-1}
  .toolbar .stat{margin-left:0}
  .row-item .ctrl{flex-wrap:wrap;justify-content:flex-end}
  .terminal{height:360px}
}
@media (max-width:860px){
  .topbar{padding:0 14px;gap:10px}
  .top-right{gap:6px}
  .brand-title .sub{display:none}
  .ghost-btn{padding:0 10px;font-size:12.5px}
  .status{font-size:12px;max-width:150px;margin-right:0}
  .main{padding:20px 18px 40px}
}
@media (max-width:720px){
  .sidebar{width:60px;flex-basis:60px}
  .nav-item{justify-content:center;padding:0}
  .nav-item span,.side-foot{display:none}
  .nav-item.active::before{top:6px;bottom:6px}
  .brand-title{font-size:15px}
  .info-grid{grid-template-columns:1fr;row-gap:8px}
  .row-item{flex-direction:column;align-items:stretch;gap:10px}
  .row-item .ctrl{justify-content:flex-start;width:100%}
  .range-wrap{flex:1 1 220px}
  input[type=range]{width:clamp(110px,40vw,190px)}
  .metric-grid{grid-template-columns:1fr 1fr}
  .terminal{height:330px;font-size:12.2px}
  .ring{width:112px;height:112px}
  #toasts{right:12px;bottom:12px;left:12px}
  .toast{min-width:0;max-width:none}
  .dialog{padding:20px 18px}
  .dlg-actions .btn{flex:1 1 auto}
}
@media (max-width:480px){
  .topbar{padding:0 10px;gap:8px}
  .brand-title{font-size:14px}
  .status{display:none}
  .ghost-btn{height:30px;padding:0 9px;font-size:12px}
  .ghost-btn.icon{width:30px;padding:0}
  .main{padding:16px 12px 36px}
  .page-title{font-size:18px;margin-bottom:14px}
  .card,.info-card{padding:16px 14px}
  .card-title{font-size:15px}
  .home-lower{gap:14px}
  .reboot-grid{grid-template-columns:repeat(2,1fr);gap:10px}
  .btn-reboot{height:40px;font-size:12.5px}
  .device-picker{gap:8px}
  .device-picker select,.device-picker .btn-outline{flex:1 1 100%}
  .btn-outline{justify-content:center}
  .kv,.info-bottom .kv{grid-template-columns:62px minmax(0,1fr)}
  .cpu-pane{column-gap:12px}
  .metric-grid{grid-template-columns:1fr}
  .toolbar{gap:8px}
  .toolbar .input{flex:1 1 100%;max-width:none}
  .toolbar .btn{flex:1 1 auto}
  .toolbar .stat{flex:1 1 auto;text-align:right}
  th,td{padding:10px 12px}
  .terminal{height:300px;padding:12px}
  .term-input{flex-wrap:wrap}
  .term-input input{flex:1 1 calc(100% - 26px)}
  .term-input .btn{flex:1 1 100%}
  .chips .chip{font-size:11px;padding:4px 9px}
  .about-hero{gap:12px}
  .code-area{min-height:150px}
  .hint{font-size:12px;margin-top:14px}
  .input.num-sm{width:62px}
  .input.num-md{width:74px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition-property:opacity,color,background-color,border-color,box-shadow!important;transition-duration:.15s!important}
}
@media (hover:none) and (pointer:coarse){
  input,textarea,select{font-size:16px}
  .btn:active,.ghost-btn:active,.btn-reboot:not(:disabled):active,.mini-btn:active{transform:scale(.97)}
}

<body>
<header class="topbar">
  <div class="brand-group">
    <div class="logo-icon" aria-label="搞机工具箱">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="2" width="12" height="20" rx="2"/><path d="M11 18h2"/></svg>
    </div>
    <div class="brand-title">搞机工具箱 <span class="sub">网页版</span></div>
    <a class="home-btn" href="/" title="返回主页" aria-label="返回主页">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11.5 12 4l9 7.5"/><path d="M5 10.5V20a1 1 0 0 0 1 1h4v-6h4v6h4a1 1 0 0 0 1-1v-9.5"/></svg>
    </a>
  </div>
  <div class="top-right">
    <div class="status"><span class="dot" id="statusDot"></span><span id="statusName">未连接设备</span></div>
    <button class="ghost-btn icon" data-act="toggle-theme" title="切换深浅色主题" id="themeBtn"></button>
    <button class="ghost-btn solid" data-act="connect">连接设备</button>
    <button class="ghost-btn" data-act="disconnect" id="disconnectBtn">断开</button>
  </div>
</header>

<div class="layout">
  <aside class="sidebar">
    <nav class="nav" id="nav"></nav>
    <div class="side-foot">作者@<b>維坦</b><br>v1.0.0</div>
  </aside>
  <main class="main">
    <div class="container">

      <!-- 主页 -->
      <section class="page active" id="page-home">
        <h1 class="page-title">设备信息</h1>
        <div class="notice" id="homeNotice" style="margin-bottom:16px">当前未连接真机，设备信息与所有指令均不可用。请点击右上角「连接设备」，使用 Chrome / Edge 通过 USB 调试连接手机。</div>
        <div class="card info-card">
          <div class="info-grid" id="infoGrid"></div>
          <div class="info-divider"></div>
          <div class="info-bottom" id="infoBottom"></div>
        </div>
        <div class="home-lower">
          <div class="card">
            <h2 class="card-title">快捷重启</h2>
            <div class="reboot-grid" id="rebootGrid"></div>
          </div>
          <div class="card">
            <div class="card-title-row">
              <h2 class="card-title">连接设备</h2>
              <span class="badge-soft" id="modeBadge">未连接</span>
            </div>
            <div class="connected-line"><span class="dot" id="connDot"></span><span id="connectedName">暂无设备连接</span></div>
            <div class="device-picker">
              <select id="deviceSelect"></select>
              <button class="btn-outline" data-act="refresh"><span id="refreshIcon"></span>刷新</button>
            </div>
            <p class="hint">使用 Chrome / Edge，开启手机的 USB 调试，连接后在手机上允许授权。未连接设备时所有指令不可下发。</p>
          </div>
        </div>
      </section>

      <section class="page" id="page-apps"></section>
      <section class="page" id="page-display"></section>
      <section class="page" id="page-systemui"></section>
      <section class="page" id="page-battery"></section>
      <section class="page" id="page-tuner"></section>
      <section class="page" id="page-scripts"></section>
      <section class="page" id="page-terminal"></section>
      <section class="page" id="page-settings"></section>
      <section class="page" id="page-about"></section>
    </div>
  </main>
</div>

<div id="toasts"></div>
<div class="mask" id="mask" hidden>
  <div class="dialog">
    <h3 id="dlgTitle"></h3>
    <div class="dlg-body" id="dlgBody"></div>
    <div class="dlg-actions" id="dlgActions"></div>
  </div>
</div>

<script>
/* ============================================================
   搞机工具箱（网页版） — WebUSB/ADB 实现
   通过 Chrome/Edge + WebUSB + Tango ADB（动态加载 CDN）直连真机，
   所有设备信息与指令均来自真实 adb shell；未连接时为空态。
   ============================================================ */
(function () {
'use strict';

/* ---------------- 图标 ---------------- */
const P = {
  home:'<path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/>',
  package:'<path d="m7.5 4.27 9 5.15"/><path d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z"/><path d="m3.3 7 8.7 5 8.7-5"/><path d="M12 22V12"/>',
  monitor:'<rect width="20" height="14" x="2" y="3" rx="2"/><line x1="8" x2="16" y1="21" y2="21"/><line x1="12" x2="12" y1="17" y2="21"/>',
  sliders:'<line x1="4" x2="4" y1="21" y2="14"/><line x1="4" x2="4" y1="10" y2="3"/><line x1="12" x2="12" y1="21" y2="12"/><line x1="12" x2="12" y1="8" y2="3"/><line x1="20" x2="20" y1="21" y2="16"/><line x1="20" x2="20" y1="12" y2="3"/><line x1="1" x2="7" y1="14" y2="14"/><line x1="9" x2="15" y1="8" y2="8"/><line x1="17" x2="23" y1="16" y2="16"/>',
  battery:'<rect width="16" height="10" x="2" y="7" rx="2"/><line x1="22" x2="22" y1="11" y2="13"/><path d="M6 12h6"/>',
  gauge:'<path d="m12 14 4-4"/><path d="M3.34 19a10 10 0 1 1 17.32 0"/>',
  code:'<polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/>',
  terminal:'<polyline points="4 17 10 11 4 5"/><line x1="12" x2="20" y1="19" y2="19"/>',
  settings:'<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1Z"/>',
  info:'<circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/>',
  power:'<path d="M12 2v10"/><path d="M18.4 6.6a9 9 0 1 1-12.77.04"/>',
  refresh:'<path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/>',
  moon:'<path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/>',
  sun:'<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/>',
  play:'<polygon points="5 3 19 12 5 21 5 3"/>',
  save:'<path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/>',
  trash:'<path d="M3 6h18M8 6V4a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v2m3 0v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/>',
  download:'<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" x2="12" y1="15" y2="3"/>'
};
function icon(name, size){ const s = size || 18; return '<svg width="'+s+'" height="'+s+'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">'+(P[name]||P.info)+'</svg>'; }
function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
const $ = (s, r) => (r||document).querySelector(s);
const $$ = (s, r) => Array.from((r||document).querySelectorAll(s));

/* ---------------- 设备数据模板（连接真机后由 getprop / dumpsys 填充） ---------------- */
const EMPTY_DEVICE = {
  name:'未连接设备', serial:'—', brand:'—', model:'—', device:'—', android:'—', board:'—',
  cpuArch:'—', flash:'—', display:'—', sysArch:'—', build:'—', kernel:'—', uptime:'—',
  battery:{level:0,voltage:'—',temp:'—',health:'—',status:'—',plugged:'—'}
};
const EMPTY_CPU = [0,0,0,0,0,0,0,0];

/* ---------------- 状态 ---------------- */
const DEFAULT_SETTINGS = { theme:'light', refresh:'2', confirm:true, autoReconnect:true };
let settings = Object.assign({}, DEFAULT_SETTINGS);
try { Object.assign(settings, JSON.parse(localStorage.getItem('gjbox.settings')||'{}')); } catch(e){}
// 剔除旧版本遗留的未知配置项
Object.keys(settings).forEach(k=>{ if(!Object.prototype.hasOwnProperty.call(DEFAULT_SETTINGS,k)) delete settings[k]; });

const state = {
  mode:'none',                 // real | none
  adb:null, manager:null, realDevice:null, connecting:false,
  device:Object.assign({}, EMPTY_DEVICE),
  cpu:EMPTY_CPU.slice(),
  active:'home', showBoard:false,
  devices:[],
  apps:[], appFilter:'',
  termLines:[], termHistory:[], termIdx:0,
  scriptText:'# 在此输入 shell 命令，每行一条\ngetprop ro.product.model\ndumpsys battery | grep level',
  scriptOutput:'', scripts:[],
  tuner:{cpuMin:634,cpuMax:2016,bright:160,refresh:120,volume:9,font:1.0,anim:1,dpi:520,w:1280,h:2772,timeout:60000,level:100},
  switches:{rotate:true,night:false,batteryPct:true,immersive:false,nav:false,animOff:false,powerSave:false,chargeLimit:false},
  logs:[]
};
try { state.scripts = JSON.parse(localStorage.getItem('gjbox.scripts')||'[]'); } catch(e){}

const NAV = [
  {id:'home',label:'主页',ic:'home'}, {id:'apps',label:'软件管理',ic:'package'},
  {id:'display',label:'显示控制',ic:'monitor'}, {id:'systemui',label:'系统界面',ic:'sliders'},
  {id:'battery',label:'电池管理',ic:'battery'}, {id:'tuner',label:'无极调节',ic:'gauge'},
  {id:'scripts',label:'控机脚本',ic:'code'}, {id:'terminal',label:'ADB 终端',ic:'terminal'},
  {id:'settings',label:'软件设置',ic:'settings'}, {id:'about',label:'关于',ic:'info'}
];
const TITLES = {home:'设备信息',apps:'软件管理',display:'显示控制',systemui:'系统界面',battery:'电池管理',tuner:'无极调节',scripts:'控机脚本',terminal:'ADB 终端',settings:'软件设置',about:'关于'};
const REBOOT = [
  {act:'reboot',label:'重启',cmd:'reboot',ic:'refresh'}, {act:'bootloader',label:'Fastboot',cmd:'reboot bootloader',ic:'power'},
  {act:'edl',label:'EDL',cmd:'reboot edl',ic:'download'},
  {act:'shutdown',label:'关机',cmd:'reboot -p',ic:'power'}, {act:'fastbootd',label:'Fastbootd',cmd:'reboot fastboot',ic:'power'},
  {act:'recovery',label:'Recovery',cmd:'reboot recovery',ic:'refresh'}
];

/* ---------------- Toast / Dialog ---------------- */
function toast(msg, type){
  const d=document.createElement('div'); d.className='toast '+(type||'');
  d.innerHTML=msg; $('#toasts').appendChild(d);
  setTimeout(()=>{ d.style.opacity='0'; d.style.transform='translateX(16px)'; d.style.transition='.25s'; setTimeout(()=>d.remove(),260); }, 3200);
}
function dialog(title, body, buttons){
  return new Promise(resolve=>{
    $('#dlgTitle').textContent=title;
    $('#dlgBody').innerHTML=body;
    const box=$('#dlgActions'); box.innerHTML='';
    buttons.forEach((b,i)=>{
      const el=document.createElement('button');
      el.className='btn '+(b.primary?'primary':'')+(b.danger?' danger':'');
      el.textContent=b.label;
      el.onclick=()=>{ $('#mask').hidden=true; resolve(i); };
      box.appendChild(el);
    });
    $('#mask').hidden=false;
  });
}
function log(cmd, result){
  state.logs.unshift({t:new Date().toLocaleTimeString('zh-CN',{hour12:false}),cmd,result:result||'已下发'});
  if(state.logs.length>60) state.logs.length=60;
}

/* ---------------- 主题 ---------------- */
const systemDark = window.matchMedia ? window.matchMedia('(prefers-color-scheme: dark)') : null;
function systemPrefersDark(){ return !!(systemDark && systemDark.matches); }
function applyTheme(){
  const t = settings.theme==='auto' ? (systemPrefersDark()?'dark':'light') : settings.theme;
  document.documentElement.setAttribute('data-theme',t);
  const meta=$('#themeColorMeta'); if(meta) meta.setAttribute('content',t==='dark'?'#0b1220':'#ffffff');
  const btn=$('#themeBtn');
  if(btn){
    btn.innerHTML = icon(t==='dark'?'sun':'moon',15);
    btn.title = '当前'+(t==='dark'?'深色':'浅色')+'主题'+(settings.theme==='auto'?'（跟随系统）':'')+'，点击切换';
  }
}
/* 跟随系统主题时，系统深浅色变化实时同步 */
if(systemDark){
  const onSysChange=()=>{ if(settings.theme==='auto'){ applyTheme(); toast('系统主题已变化，界面已自动同步',''); } };
  try{ systemDark.addEventListener('change',onSysChange); }
  catch(e){ if(systemDark.addListener) systemDark.addListener(onSysChange); }
}
function saveSettings(){ try{ localStorage.setItem('gjbox.settings',JSON.stringify(settings)); }catch(e){} }

/* ---------------- 侧栏 / 页面切换 ---------------- */
function renderNav(){
  $('#nav').innerHTML = NAV.map(n=>'<button class="nav-item'+(state.active===n.id?' active':'')+'" data-nav="'+n.id+'">'+icon(n.ic)+'<span>'+n.label+'</span></button>').join('');
}
function showPage(id){
  state.active=id;
  $$('.page').forEach(p=>p.classList.toggle('active', p.id==='page-'+id));
  renderNav();
  const fn = RENDER[id]; if(fn) fn();
  document.querySelector('.main').scrollTop=0;
  window.scrollTo({top:0,behavior:'smooth'});
  try{ history.replaceState(null,'','#'+id); }catch(e){}
}
window.addEventListener('hashchange',()=>{
  const id=(location.hash||'').replace(/^#/,'');
  if(NAV.some(n=>n.id===id) && id!==state.active) showPage(id);
});

/* ---------------- 主页渲染 ---------------- */
function val(k){
  if(state.mode==='none') return '—';
  const d=state.device;
  const map={brand:d.brand,model:d.model,device:d.device,android:d.android,
    cpuArch:d.cpuArch,flash:d.flash,display:d.display,
    battery:d.battery.level+'%, '+d.battery.voltage+' '+d.battery.temp,
    sysArch:d.sysArch,build:d.build,kernel:d.kernel};
  return map[k]==null?'—':map[k];
}
function uptimeText(){
  if(state.mode==='none') return '—';
  return state.device.uptime||'—';
}
function kv(k,v,cls){ return '<div class="kv"><span class="k">'+k+'</span><span class="v '+(cls||'')+'">'+v+'</span></div>'; }
function renderHome(){
  const d=state.device;
  const board = state.showBoard ? esc(d.board||'—') : '********';
  const c1 = kv('品牌',esc(val('brand')))+kv('型号',esc(val('model')))+kv('代号',esc(val('device')))+kv('系统',esc(val('android')))
    + '<div class="kv"><span class="k">主板 ID</span><span class="v">'+board+'<button class="link-btn" data-act="toggle-board">'+(state.showBoard?'隐藏':'显示')+'</button></span></div>';

/* ---------------- 统一 shell 执行层 ---------------- */
/* 三个包统一锁定到 adb 2.3.1，避免 esm.sh 解析出多份不兼容的 adb 实例 */
const CDN = {
  adb:'https://esm.sh/@yume-chan/adb@2.3.1',
  webusb:'https://esm.sh/@yume-chan/adb-daemon-webusb@2.3.2?deps=@yume-chan/adb@2.3.1',
  cred:'https://esm.sh/@yume-chan/adb-credential-web@2.1.0?deps=@yume-chan/adb@2.3.1'
};
async function loadLibs(){
  const [a,b,c]=await Promise.all([import(CDN.adb),import(CDN.webusb),import(CDN.cred)]);
  return {a,b,c};
}
async function realShell(cmd){
  if(!state.adb) throw new Error('设备未连接');
  const svc=state.adb.subprocess;
  const runner=(svc && svc.noneProtocol) || svc;
  if(!runner) throw new Error('当前 ADB 组件不支持 shell 命令');
  const timer=new Promise((_,rej)=>setTimeout(()=>rej(new Error('命令执行超时')),10000));
  if(typeof runner.spawnWaitText==='function') return await Promise.race([runner.spawnWaitText(cmd),timer]);
  // 兼容旧版 Tango：spawn() 返回可读流
  const proc=await runner.spawn(cmd);
  const read=new Response(proc.stdout||proc.output).text();
  return await Promise.race([read,timer]);
}
/* 统一 shell 执行层：仅连接真机后可用，未连接时返回明确提示，不再提供模拟输出 */
async function shell(cmd){
  if(state.mode!=='real' || !state.adb) return '设备未连接，请先点击右上角「连接设备」连接真机';
  return await realShell(cmd);
}
async function runCmd(cmd, silent){
  if(state.mode!=='real'){ toast('请先连接真机后再执行操作','warn'); return ''; }
  try{
    const out=await shell(cmd);
    log(cmd, out||'执行成功');
    if(!silent && out) toast('命令已执行：<code>'+esc(cmd)+'</code>','ok');
    else if(!silent) toast('命令已下发：<code>'+esc(cmd)+'</code>','ok');
    return out;
  }catch(e){
    if(!silent) toast('执行失败：'+esc(e.message||e),'err');
    return 'ERROR: '+(e.message||e);
  }
}

/* ---------------- 连接 / 断开 / 刷新 ---------------- */
/* ADB 的 USB 接口是独占的。claimInterface() 被拒时 Tango ADB 会抛
   DeviceBusyError（"The device is already in used by another program"）。
   常见原因：电脑端 adb server / Android Studio / scrcpy / 手机助手占用，
   其他标签页或本页上一次连接失败后残留句柄未释放。 */
function isBusyError(e){
  const t=String((e&&e.message)||e||'').toLowerCase();
  const n=String((e&&e.name)||'').toLowerCase();
  return /already in used|already in use|in use by another|device.{0,24}busy|claim.?interface|unable to claim|failed to claim/.test(t)
      || n==='networkerror' || n==='devicebusyerror';
}
async function releaseUsb(dev){
  const raw=dev && (dev.raw || (typeof dev.close==='function'?dev:null));
  if(!raw) return 0;
  let n=0;
  try{
    if(raw.opened){
      const cfg=raw.configuration;
      if(cfg && cfg.interfaces){
        for(const itf of cfg.interfaces){
          if(itf.claimed){ try{ await raw.releaseInterface(itf.interfaceNumber); n++; }catch(_){} }
        }
      }
      try{ await raw.close(); }catch(_){}
    }
  }catch(_){}
  return n;
}
async function releaseAllUsb(){
  if(!navigator.usb) return 0;
  let n=0;
  try{ for(const d of await navigator.usb.getDevices()) n+=await releaseUsb(d); }catch(_){}
  return n;
}
function setConnecting(on){
  const b=document.querySelector('[data-act="connect"]');
  if(b){ b.disabled=on; b.textContent=on?'连接中…':'连接设备'; }
}
async function connectReal(preferPaired){
  if(state.connecting) throw new Error('正在连接中，请稍候');
  if(!navigator.usb) throw new Error('当前浏览器或页面环境不支持 WebUSB。请使用 Chrome / Edge，并通过 HTTPS 或 localhost 打开本页。');
  state.connecting=true; setConnecting(true);
  let dev=null;
  try{
    toast('正在加载 ADB 组件，首次连接可能需要几秒…','');
    const libs=await loadLibs();
    const Manager=libs.b.AdbDaemonWebUsbDeviceManager.BROWSER;
    if(!Manager) throw new Error('WebUSB 不可用（需要安全上下文：HTTPS 或 localhost）');
    state.manager=Manager;
    // 已有授权设备时直接复用，避免重复弹出系统选择器、减少 USB 句柄累积
    if(preferPaired){
      const list=await Manager.getDevices();
      if(list.length) dev=list[0];
    }
    if(!dev){
      dev=await Manager.requestDevice();
      if(!dev) throw new Error('CANCELLED');
    }
    // 先释放本页可能残留的句柄
    if(state.realDevice) await releaseUsb(state.realDevice);
    let connection;
    try{ connection=await dev.connect(); }
    catch(e){
      if(!isBusyError(e)) throw e;
      // 自动清理浏览器内所有残留 USB 句柄后重试一次
      await releaseAllUsb();
      await releaseUsb(dev);
      connection=await dev.connect();
    }
    const Store=libs.c.AdbWebCredentialStore||libs.c.default;
    if(typeof Store!=='function') throw new Error('ADB 凭证组件加载失败，请检查网络后重试');
    const store=new Store('GeekToolboxWeb');
    const transport=await libs.a.AdbDaemonTransport.authenticate({serial:dev.serial,connection,credentialStore:store});
    state.adb=new libs.a.Adb(transport);
    state.realDevice=dev; state.mode='real';
    const devName=(typeof dev.name==='string'&&dev.name)||((dev.raw||{}).productName)||dev.serial||'Android 设备';
    state.device={name:devName,serial:dev.serial||'unknown'};
    state.devices=[{id:dev.serial||'adb',label:devName+' · '+(dev.serial||'adb')}];
    // 读取设备信息失败不应判定为连接失败，否则残留接口会导致下次连接报「被占用」
    try{ await loadRealInfo(); }catch(e){ console.warn('设备信息读取部分失败',e); }
    toast('真机已连接，设备信息已读取','ok');
  }catch(e){
    // 任何失败都释放刚打开的 USB 接口，避免污染后续连接
    await releaseUsb(dev);
    if(state.adb){ try{ await state.adb.close(); }catch(_){} }
    state.adb=null; state.realDevice=null; state.mode='none'; state.devices=[];
    throw e;
  }finally{
    state.connecting=false; setConnecting(false);
  }
}
async function disconnect(){
  const dev=state.realDevice;
  if(state.adb){ try{ await state.adb.close(); }catch(_){} }
  state.adb=null; state.realDevice=null; state.manager=null;
  state.mode='none'; state.devices=[]; state.showBoard=false;
  const n=await releaseUsb(dev);
  toast(n?'设备已断开，USB 接口已释放（可重新连接）':'设备已断开','');
  renderHome();
  if(state.active!=='home' && RENDER[state.active]) RENDER[state.active]();
}
function busyHelp(){
  return '<p>浏览器无法独占手机的 ADB 接口（<code class="code-inline">claimInterface</code> 失败）。这通常<strong>不是</strong>浏览器或 HTTPS 的问题，而是设备已被其他程序占用：</p>'+
    '<ol>'+
    '<li>关闭电脑上的 <b>adb server</b>：Android Studio、命令行 adb、scrcpy、各品牌手机助手、模拟器等，或执行 <code class="code-inline">adb kill-server</code></li>'+
    '<li>关闭其他打开本页或 WebADB 的<b>标签页 / 窗口</b>，只保留当前一个</li>'+
    '<li>电脑上只保留<b>一台</b> Android 设备连接</li>'+
    '<li>重新插拔 USB 数据线，手机上重新点「允许 USB 调试」</li>'+

}
async function attemptConnect(preferPaired){
  try{
    await connectReal(preferPaired);
    renderHome(); showPage('home');
  }catch(e){
    const msg=String((e&&e.message)||e||'');
    if(msg==='CANCELLED'){ toast('已取消选择设备',''); return; }
    if(isBusyError(e)){
      const i=await dialog('设备被占用，无法连接',busyHelp(),
        [{label:'释放接口并重试',primary:true},{label:'查看排查步骤后关闭'},{label:'取消'}]);
      if(i===0){ await releaseAllUsb(); await attemptConnect(true); }
      return;
    }
    const hint=/WebUSB|安全上下文|HTTPS|localhost|凭证组件|加载|不支持/.test(msg)
      ? '<br>请确认使用 Chrome / Edge 并通过 HTTPS 或 localhost 打开，且网络可访问 esm.sh。'
      : '<br>可重新插拔数据线后重试；详情见「关于 → 连接失败排查」。';
    toast('真机连接失败：'+esc(msg)+hint,'warn');
  }
}
async function connectFlow(){
  if(state.connecting){ toast('正在连接中，请稍候…',''); return; }
  if(state.mode!=='none'){ toast('设备已连接，如需切换请先断开',''); return; }
  let paired=0;
  try{ paired=navigator.usb?(await navigator.usb.getDevices()).length:0; }catch(_){}
  const body='连接真机需要 Chrome / Edge，并通过 HTTPS 或 localhost 打开本页。<br><br>'+
    '<b>连接前请先关闭</b>电脑上的 adb / Android Studio / scrcpy / 手机助手，并只保留一个浏览器标签页，否则会提示「设备已被其他程序占用」。<br><br>'+
    '手机需开启 USB 调试，在系统弹窗中选择设备后于手机上允许 RSA 授权。'+
    (paired?'<div class="notice mt16">检测到 '+paired+' 台已授权设备，选「重连已授权设备」可跳过系统选择器。</div>':'');
  const i=await dialog('连接设备',body,paired
    ? [{label:'重连已授权设备',primary:true},{label:'选择其他设备'},{label:'取消'}]
    : [{label:'连接真机（WebUSB）',primary:true},{label:'取消'}]);
  if(i===(paired?2:1)) return;
  await attemptConnect(paired>0 && i===0);
}
async function refreshDevices(){
  const el=$('#refreshIcon'); el.classList.add('spin');
  try{
    if(state.mode==='real' && state.manager){
      const list=await state.manager.getDevices();
      state.devices=list.map(d=>({id:d.serial||'adb',label:(d.name||((d.raw||{}).productName)||'Android 设备')+' · '+(d.serial||'adb')}));
      toast('已刷新，找到 '+state.devices.length+' 台设备','ok');
    }else{
      state.devices=[];
      toast('尚未连接设备，请先点击「连接设备」','warn');
    }
    renderHome();
  }catch(e){ toast('刷新失败：'+esc(e.message||e),'err'); }
  finally{ setTimeout(()=>el.classList.remove('spin'),600); }
}
async function loadRealInfo(){
  const d=state.device;
  const g=async(k,def)=>{ try{ return (await realShell('getprop '+k)).trim()||def; }catch(e){ return def; } };
  const s=async(cmd,def)=>{ try{ return (await realShell(cmd)).trim()||def; }catch(e){ return def; } };
  const [brand,model,dev,rel,sdk,board,abi,fp,kernel,flash,wmsize,wmdens,batt,cpus]=await Promise.all([
    g('ro.product.brand','—'),g('ro.product.model','—'),g('ro.product.device','—'),
    g('ro.build.version.release','—'),g('ro.build.version.sdk','—'),g('ro.product.board','—'),
    g('ro.product.cpu.abi','—'),g('ro.build.fingerprint','—'),s('uname -r','—'),
    g('ro.boot.bootdevice','—'),s('wm size',''),s('wm density',''),s('dumpsys battery',''),readRealCpu()
  ]);
  Object.assign(d,{
    brand,model,device:dev,android:'Android '+rel+' (API '+sdk+')',board,
    cpuArch:abi,build:fp,kernel,flash:/ufs/i.test(flash)?'UFS':(/mmc/i.test(flash)?'eMMC':flash||'—'),
    display:((wmsize.match(/(\d+)x(\d+)/)||[]).slice(1).join('×')||'—')+' ('+((wmdens.match(/(\d+)/)||[])[1]||'—')+' dpi)',
    sysArch:'aarch64',uptime:uptimeFromProc(await s('cat /proc/uptime','0'))
  });
  let level=+((batt.match(/level:\s*(\d+)/)||[])[1]||0);
  let volt=+((batt.match(/voltage:\s*(\d+)/)||[])[1]||0);
  let temp=+((batt.match(/temperature:\s*(\d+)/)||[])[1]||0);
  let stat=+((batt.match(/status:\s*(\d+)/)||[])[1]||0);
  d.battery={level,voltage:(volt/1000).toFixed(3)+' V',temp:(temp/10).toFixed(1)+'°C',
    health:'良好',status:stat===2?'充电中':'未充电',plugged:stat===2?'USB / 充电器':'电池'};
  state.cpu=cpus;
}
function uptimeFromProc(p){
  const sec=Math.floor(parseFloat(p.split(' ')[0])||0);
  return Math.floor(sec/86400)+'天'+Math.floor(sec%86400/3600)+'时'+Math.floor(sec%3600/60)+'分';
}
async function readRealCpu(){
  try{
    const out=await realShell('for i in 0 1 2 3 4 5 6 7; do cat /sys/devices/system/cpu/cpu$i/cpufreq/scaling_cur_freq 2>/dev/null || echo 0; done');
    const nums=out.split('\n').map(x=>parseInt(x.trim(),10)).filter(x=>!isNaN(x));
    if(nums.length>=8) return nums.slice(0,8).map(x=>Math.round(x/1000));
  }catch(e){}
  return EMPTY_CPU.slice();
}

let pollTimer=null;
function startPolling(){
  clearInterval(pollTimer);
  const ms=(parseInt(settings.refresh,10)||2)*1000;
  pollTimer=setInterval(async()=>{
    if(state.mode!=='real' || !state.adb) return;
    state.cpu=await readRealCpu();
    const b=await realShell('dumpsys battery').catch(()=> '');
    if(b){
      const lv=+((b.match(/level:\s*(\d+)/)||[])[1]||state.device.battery.level);
      state.device.battery.level=lv;
    }
    if(state.active==='home') renderHome();
    if(state.active==='battery') renderBattery();
  },ms);
}

    '</div></div>';

async function runScript(){
  if(state.mode!=='real'){ toast('请先连接真机后再运行脚本','warn'); return; }
  state.scriptText=$('#scriptEditor').value;
  const lines=state.scriptText.split('\n').map(x=>x.trim()).filter(x=>x&&!x.startsWith('#'));
  let out='';
  $('#scriptOutput').textContent='正在执行…';
  for(const line of lines){
    out+='$ '+line+'\n';
    try{ const r=await shell(line); if(r && r!=='__CLEAR__') out+=r+'\n'; log(line,r||'成功'); }
    catch(e){ out+='ERROR: '+(e.message||e)+'\n'; }
    $('#scriptOutput').textContent=out;
  }
  state.scriptOutput=out+'\n✔ 执行完成，共 '+lines.length+' 条命令';
  $('#scriptOutput').textContent=state.scriptOutput;
  toast('脚本执行完成，共 '+lines.length+' 条命令','ok');
}

function renderTerminal(){
  $('#page-terminal').innerHTML='<h1 class="page-title">ADB 终端</h1>'+
    '<div class="card" style="padding:20px 22px">'+
      '<div class="toolbar" style="margin-bottom:12px"><span class="stat" style="margin-left:0">'+(state.mode==='real'?'已连接真机 · 命令将真实下发至设备':'未连接设备 · 请先点击右上角「连接设备」连接真机')+'</span>'+
      '<button class="btn" data-act="term-clear">清屏</button></div>'+
      '<div class="terminal" id="termBox"></div>'+
      '<div class="term-input"><span class="prompt">$</span><input id="termInput" placeholder="输入 shell 命令，按 Enter 执行；↑ / ↓ 查看历史" autocomplete="off" spellcheck="false"><button class="btn primary" data-act="term-run">执行</button></div>'+
      '<div class="chips">'+['getprop ro.product.model','dumpsys battery','pm list packages -3','wm size','uname -a','id','date','help'].map(c=>'<button class="chip" data-act="term-quick" data-cmd="'+esc(c)+'">'+esc(c)+'</button>').join('')+'</div>'+
    '</div>';
  drawTerminal();
}
function drawTerminal(){
  const box=$('#termBox'); if(!box) return;
  if(!state.termLines.length) state.termLines=[{t:'sys',s:'搞机工具箱 ADB Terminal · 输入 help 查看可用命令\n'+(state.mode==='real'?'已连接真机，输入 shell 命令开始':'尚未连接设备，请先点击右上角「连接设备」')}];
  box.innerHTML=state.termLines.map(l=>'<div class="'+(l.t==='cmd'?'t-cmd':l.t==='err'?'t-err':l.t==='sys'?'t-sys':'t-out')+'">'+esc(l.s)+'</div>').join('');
  box.scrollTop=box.scrollHeight;
}
async function termExec(cmd){
  cmd=cmd.trim(); if(!cmd) return;
  state.termHistory.push(cmd); state.termIdx=state.termHistory.length;
  if(cmd==='clear'){ state.termLines=[]; drawTerminal(); return; }
  if(cmd==='help'){
    state.termLines.push({t:'cmd',s:'$ help'});
    state.termLines.push({t:'sys',s:'可用命令：getprop / dumpsys / pm / wm / settings / input / am / reboot / screencap 等设备端 shell 命令。\n未连接设备时会提示先连接真机；连接后所有命令真实下发。'});
    drawTerminal(); return;
  }
  state.termLines.push({t:'cmd',s:'$ '+cmd});
  drawTerminal();
  let out;
  try{ out=await shell(cmd); log(cmd,out||'成功'); }
  catch(e){ out='ERROR: '+(e.message||e); }
  if(out==='__CLEAR__'){ state.termLines=[]; drawTerminal(); return; }
  state.termLines.push({t:out.indexOf('ERROR')===0||/not found/.test(out)?'err':'out',s:out||'(无输出)'});
  drawTerminal();
}

      '<div class="muted" style="font-size:13px;line-height:2.1">1. 手机开启「开发者选项 → USB 调试」<br>2. <b>关闭电脑端 adb</b>：Android Studio / 命令行 adb / scrcpy / 手机助手 / 模拟器（或执行 <code class="code-inline">adb kill-server</code>），否则 ADB 接口会被独占<br>3. 数据线连接电脑，USB 模式选「传输文件」，电脑上只保留这一台 Android 设备<br>4. 使用 Chrome 或 Edge 打开本页（HTTPS 或 localhost），只保留一个标签页<br>5. 点击右上角「连接设备」，在弹出列表中选择手机<br>6. 手机上勾选「一律允许」并点击「允许」完成 RSA 授权</div>'+
      '<div class="info-divider"></div><h2 class="card-title">部署与本地运行</h2>'+
      '<div class="muted" style="font-size:12.8px;line-height:1.9">部署到 HTTPS 站点后即可直接使用，无需后端或额外配置。本地调试可在本目录启动静态服务：<br><code class="code-inline">python3 -m http.server 8000</code><br>然后打开 <code class="code-inline">http://localhost:8000</code>。直接双击打开 HTML 文件（<code class="code-inline">file://</code>）时浏览器会禁用 WebUSB。</div>'+
      '<div class="info-divider"></div><h2 class="card-title">连接失败：设备被占用</h2>'+
      '<div class="muted" style="font-size:12.8px;line-height:1.9">若提示 <code class="code-inline">The device is already in used by another program</code>，表示 ADB 的 USB 接口已被独占，与浏览器或 HTTPS 无关。按顺序处理：<br>① 电脑端执行 <code class="code-inline">adb kill-server</code>，并关闭 Android Studio、scrcpy、手机助手、模拟器；<br>② 关闭其他打开本页或 WebADB 的标签页 / 窗口；<br>③ 只保留一台 Android 设备，重新插拔数据线并在手机上重新允许 USB 调试；<br>④ 回到本页点「连接设备」，或选择「释放接口并重试」。<br>页面已内置自动释放：连接前清理残留句柄、失败自动回滚、断开时主动 <code class="code-inline">releaseInterface</code> / <code class="code-inline">close</code>。</div>'+
      '<div class="info-divider"></div><h2 class="card-title">技术实现</h2>'+
      '<div class="muted" style="font-size:12.8px;line-height:1.9">纯静态单文件实现，无需后端。连接真机后动态加载 <code class="code-inline">@yume-chan/adb</code>（Tango ADB）通过 WebUSB 直连 adbd，执行 <code class="code-inline">getprop</code> / <code class="code-inline">dumpsys</code> / <code class="code-inline">pm</code> / <code class="code-inline">wm</code> / <code class="code-inline">settings</code> / <code class="code-inline">reboot</code> 等指令。设备信息、频率采样、脚本与终端共用同一执行层。</div>'+
      '<div class="notice mt16">免责声明：重启、清除数据、修改系统设置等操作可能影响设备状态，请确认已备份重要数据后再执行。本工具仅在用户明确点击时下发命令。</div>'+
    '</div></div>';
}

const RENDER={home:renderHome,apps:renderApps,display:renderDisplay,systemui:renderSystemUI,battery:renderBattery,tuner:renderTuner,scripts:renderScripts,terminal:renderTerminal,settings:renderSettings,about:renderAbout};

/* ---------------- 事件委托 ---------------- */
document.addEventListener('click', async e=>{
  const nav=e.target.closest('[data-nav]');
  if(nav){ showPage(nav.dataset.nav); return; }
  const el=e.target.closest('[data-act]');
  if(!el) return;
  const act=el.dataset.act, cmd=el.dataset.cmd||'', key=el.dataset.key;
  switch(act){
    case 'toggle-theme': {
      settings.theme = document.documentElement.getAttribute('data-theme')==='dark'?'light':'dark';
      saveSettings(); applyTheme(); break;
    }
    case 'connect': connectFlow(); break;
    case 'disconnect': await disconnect(); break;
    case 'refresh': refreshDevices(); break;
    case 'toggle-board': state.showBoard=!state.showBoard; renderHome(); break;
    case 'reboot': {
      if(state.mode==='none'){ toast('请先连接真机','warn'); return; }
      const label=el.dataset.label;
      const go=async()=>{ await runCmd(cmd,true); toast('已下发「'+label+'」指令：'+esc(cmd),'ok'); };
      if(settings.confirm){
        const i=await dialog('确认执行「'+label+'」？','将向设备下发命令：<br><code class="code-inline">'+esc(cmd)+'</code><br><br>设备会立即重启或关机，此操作不可撤销。',[{label:'取消'},{label:'确认执行',primary:true,danger:true}]);
        if(i===1) go();
      }else go();
      break;
    }
    case 'run': runCmd(cmd); break;
    case 'apply': {
      const tpl=el.dataset.tpl||cmd;
      const v=key&&state.tuner[key]!=null?state.tuner[key]:'';
      await runCmd(tpl.replace(/\{v\}/g,String(v)));
      if(key==='bright') await runCmd('settings put system screen_brightness_mode 0',true);
      break;
    }
    case 'wm-size': await runCmd('wm size '+state.tuner.w+'x'+state.tuner.h); break;
    case 'wm-density': await runCmd('wm density '+state.tuner.dpi); break;
    case 'wm-reset': await runCmd('wm size reset'); await runCmd('wm density reset'); toast('分辨率与密度已重置','ok'); break;
    case 'anim-apply': {
      const v=state.tuner.anim;
      await runCmd('settings put global window_animation_scale '+v,true);
      await runCmd('settings put global transition_animation_scale '+v,true);
      await runCmd('settings put global animator_duration_scale '+v,true);
      toast('动画速度已设置为 '+v+'×','ok'); break;
    }
    case 'app-refresh': appRefresh(); break;
    case 'app-toggle': {
      const a=state.apps.find(x=>x.pkg===el.dataset.pkg); if(!a) return;
      const next=a.state==='on'?'off':'on';
      await runCmd('pm '+(next==='off'?'disable-user':'enable')+' '+a.pkg,true);
      a.state=next; toast((next==='off'?'已禁用 ':'已启用 ')+a.name,'ok'); renderApps(); break;
    }
    case 'app-force': await runCmd('am force-stop '+el.dataset.pkg); break;
    case 'app-clear': {
      const i=await dialog('清除应用数据？','将执行 <code class="code-inline">pm clear '+esc(el.dataset.pkg)+'</code>，该应用的登录状态与本地数据会被清空。',[{label:'取消'},{label:'确认清除',primary:true,danger:true}]);
      if(i===1){ await runCmd('pm clear '+el.dataset.pkg,true); toast('已清除应用数据','ok'); }
      break;
    }
    case 'app-uninstall': {
      const i=await dialog('卸载应用？','将执行 <code class="code-inline">pm uninstall -k --user 0 '+esc(el.dataset.pkg)+'</code>。',[{label:'取消'},{label:'确认卸载',primary:true,danger:true}]);
      if(i===1){ await runCmd('pm uninstall -k --user 0 '+el.dataset.pkg,true); state.apps=state.apps.filter(x=>x.pkg!==el.dataset.pkg); renderApps(); toast('应用卸载指令已下发','ok'); }
      break;
    }
    case 'preset': {
      const p=el.dataset.preset;
      const map={'省电':[634,1498,3,60],'均衡':[634,2016,7,120],'性能':[1098,3000,11,144]};
      const v=map[p]; state.tuner.cpuMin=v[0]; state.tuner.cpuMax=v[1]; state.tuner.volume=v[2]; state.tuner.refresh=v[3];
      await runCmd('settings put system peak_refresh_rate '+v[3],true);
      toast('已应用「'+p+'」预设','ok'); renderTuner(); break;
    }
    case 'tpl': {
      const t=TEMPLATES[+el.dataset.i];
      if(!t) return; state.scriptText=t.code; renderScripts(); toast('已载入模板：'+t.name,''); break;
    }
    case 'script-run': runScript(); break;
    case 'script-save': {
      state.scriptText=$('#scriptEditor').value;
      const name=prompt('脚本名称：','自定义脚本 '+(state.scripts.length+1));
      if(name){ state.scripts.push({name,code:state.scriptText}); localStorage.setItem('gjbox.scripts',JSON.stringify(state.scripts)); renderScripts(); toast('脚本已保存','ok'); }
      break;
    }
    case 'script-clear': state.scriptText=''; state.scriptOutput=''; renderScripts(); break;
    case 'load-script': state.scriptText=state.scripts[+el.dataset.i].code; renderScripts(); break;
    case 'del-script': state.scripts.splice(+el.dataset.i,1); localStorage.setItem('gjbox.scripts',JSON.stringify(state.scripts)); renderScripts(); break;
    case 'term-clear': state.termLines=[]; drawTerminal(); break;
    case 'term-run': { const i=$('#termInput'); await termExec(i.value); i.value=''; i.focus(); break; }
    case 'term-quick': { const i=$('#termInput'); i.value=cmd; await termExec(cmd); i.value=''; i.focus(); break; }
    case 'clear-local': {
      const i=await dialog('清空本地数据？','将删除保存的脚本与所有偏好设置，页面将恢复默认值。',[{label:'取消'},{label:'确认清空',primary:true,danger:true}]);
      if(i===1){ localStorage.removeItem('gjbox.scripts'); localStorage.removeItem('gjbox.settings'); toast('已清空，即将刷新页面','ok'); setTimeout(()=>location.reload(),900); }
      break;
    }
  }
});

/* 开关 / 下拉 / 滑块 / 输入 */
document.addEventListener('click', async e=>{
  const s=e.target.closest('[data-switch]');
  if(!s) return;
  const key=s.dataset.key;
  state.switches[key]=!state.switches[key];
  const v=state.switches[key]?1:0;
  let cmd=s.dataset.cmd||'';
  if(cmd.indexOf('{v}')>=0) cmd=cmd.replace(/\{v\}/g,v);
  else if(!state.switches[key]) cmd=cmd.replace(/immersive\.\w+=\*/,'null').replace(/night yes/,'night no');
  if(cmd.indexOf('uimode')>=0) cmd='cmd uimode night '+(state.switches[key]?'yes':'no');
  if(cmd.indexOf('power set-mode')>=0) cmd='cmd power set-mode '+(state.switches[key]?1:0);
  if(cmd.indexOf('charging_limit')>=0 && !state.switches[key]) cmd='settings delete global charging_limit';
  if(cmd.indexOf('status_bar_show')>=0) cmd='settings put system status_bar_show_battery_percent '+v;
  s.classList.toggle('on',state.switches[key]);
  if(state.mode==='none'){ toast('请先连接真机','warn'); return; }
  await runCmd(cmd,true);
  toast('设置已'+(state.switches[key]?'开启':'关闭'),'ok');
});
document.addEventListener('input', e=>{
  const t=e.target;
  if(t.id==='appSearch'){
    state.appFilter=t.value.trim().toLowerCase();
    let shown=0;
    $$('#page-apps tbody tr[data-search]').forEach(r=>{ const ok=r.dataset.search.indexOf(state.appFilter)>=0; r.style.display=ok?'':'none'; if(ok) shown++; });
    const empty=$('#noMatch'); if(empty) empty.style.display=shown===0?'':'none';
    const card=$('#page-apps .table-card'); if(card) card.classList.toggle('empty',shown===0);
    return;
  }
  if(t.dataset.range){
    const k=t.dataset.range, v=parseFloat(t.value); state.tuner[k]=v;
    const unit=({bright:'',font:'×',refresh:' Hz',cpuMin:' MHz',cpuMax:' MHz',volume:'',level:'%'})[k]||'';
    const out=$('#v-'+k); if(out) out.textContent=v+unit;
    return;
  }
  if(t.dataset.num){ state.tuner[t.dataset.num]=parseInt(t.value,10)||0; return; }
  if(t.id==='scriptEditor'){ state.scriptText=t.value; return; }
});
document.addEventListener('change', async e=>{
  const t=e.target;
  if(t.dataset.select==='timeout'){ state.tuner.timeout=+t.value; await runCmd('settings put system screen_off_timeout '+t.value,true); toast('休眠时间已设置','ok'); return; }
  if(t.dataset.select==='anim'){ state.tuner.anim=parseFloat(t.value); return; }
  if(t.dataset.setting){
    settings[t.dataset.setting]=t.value; saveSettings();
    if(t.dataset.setting==='theme'){ applyTheme(); toast('主题已切换','ok'); }
    if(t.dataset.setting==='refresh'){ startPolling(); toast('刷新间隔已更新','ok'); }
    return;
  }
  if(t.dataset.change==='apk'){
    const f=t.files&&t.files[0]; if(!f) return;
    toast('已选择 '+esc(f.name)+'（'+(f.size/1048576).toFixed(1)+' MB）','');
    if(state.mode==='real'){
      // 真机安装：通过 adb sync 分块推送到 /data/local/tmp 后 pm install
      try{
        const bytes=new Uint8Array(await f.arrayBuffer());
        const sync=await state.adb.sync();
        let off=0;
        const stream=new ReadableStream({pull(c){
          if(off>=bytes.length){ c.close(); return; }
          const end=Math.min(off+65536,bytes.length);
          c.enqueue(bytes.subarray(off,end)); off=end;
        }});
        await sync.write({filename:'/data/local/tmp/base.apk',file:stream});
        try{ await sync.dispose(); }catch(e){}
        await runCmd('pm install -r /data/local/tmp/base.apk',true);
        toast('APK 安装流程已下发','ok');
      }catch(err){ toast('APK 安装失败：'+esc(err.message||err),'err'); }
    }else toast('请先连接真机后再安装 APK','warn');
    return;
  }
});
document.addEventListener('click', e=>{
  const s=e.target.closest('[data-setting-sw]');
  if(!s) return;
  const k=s.dataset.settingSw; settings[k]=!settings[k]; saveSettings(); s.classList.toggle('on',settings[k]);
  toast('设置已'+(settings[k]?'开启':'关闭'),'ok');
});
document.addEventListener('keydown', async e=>{
  const i=$('#termInput');
  if(e.target===i){
    if(e.key==='Enter'){ e.preventDefault(); const v=i.value; i.value=''; await termExec(v); }
    else if(e.key==='ArrowUp'){ e.preventDefault(); if(state.termIdx>0){ state.termIdx--; i.value=state.termHistory[state.termIdx]||''; } }
    else if(e.key==='ArrowDown'){ e.preventDefault(); if(state.termIdx<state.termHistory.length-1){ state.termIdx++; i.value=state.termHistory[state.termIdx]||''; } else { state.termIdx=state.termHistory.length; i.value=''; } }
  }
  if(e.key==='Escape' && !$('#mask').hidden) $('#mask').hidden=true;
});
$('#mask').addEventListener('click', e=>{ if(e.target.id==='mask') $('#mask').hidden=true; });
$('#deviceSelect').addEventListener('change', e=>{
  toast('已选择设备 '+e.target.value,'');
});

/* ---------------- 启动 ---------------- */
function boot(){
  applyTheme(); renderNav();
  const hash=(location.hash||'').replace(/^#/,'');
  showPage(NAV.some(n=>n.id===hash)?hash:'home');
  if(settings.refresh!=='0') startPolling();
  // 自动重连（仅在开启且已获得过 USB 授权时静默尝试，不弹系统选择器）
  if(settings.autoReconnect && navigator.usb && location.protocol!=='file:'){
    navigator.usb.getDevices().then(list=>{
      if(list.length) toast('检测到 '+list.length+' 台已授权设备，点击「连接设备」即可重连','');
    }).catch(()=>{});
  }
}
boot();
})();
