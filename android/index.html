<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" id="themeColorMeta" content="#ffffff">
<title>搞机工具箱 - 全安卓通用免ROOT玩机</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%232563eb'/><rect x='11' y='6' width='10' height='20' rx='2' fill='none' stroke='white' stroke-width='2'/><path d='M14 23h4' stroke='white' stroke-width='2' stroke-linecap='round'/></svg>">
<script id="theme-boot">
/* 首帧前确定主题：在样式表和页面内容解析之前就写好 data-theme，
   避免先按浅色绘制再切暗色造成的白闪。判定逻辑须与主脚本 applyTheme() 一致。 */
(function(){
  var t = 'light';
  try {
    var s = JSON.parse(localStorage.getItem('gjbox.settings') || '{}').theme;
    if (s === 'dark') t = 'dark';
    else if (s === 'light') t = 'light';
    else if (s === 'auto' && window.matchMedia &&
             window.matchMedia('(prefers-color-scheme: dark)').matches) t = 'dark';
  } catch (e) {}
  document.documentElement.setAttribute('data-theme', t);
  var m = document.getElementById('themeColorMeta');
  if (m) m.setAttribute('content', t === 'dark' ? '#0b1220' : '#ffffff');
})();
</script>
<style>
:root{
  color-scheme:light;
  /* ivitan 统一色板：slate 中性色 + blue-600 主色 */
  --brand:#2563eb; --brand-600:#1d4ed8; --brand-on:#ffffff;
  --brand-soft:#eff6ff; --brand-soft-2:rgba(37,99,235,.10);
  --bg:#f8fafc; --card:#ffffff; --card-hover:#f1f5f9;
  --text:#0f172a; --text-2:#475569; --muted:#64748b;
  --border:#e2e8f0; --border-hover:#cbd5e1; --line:#f1f5f9; --field:#f8fafc;
  --ok:#059669; --ok-text:#047857; --ok-bg:#ecfdf5;
  --warn:#d97706;
  --danger:#dc2626;
  --shadow:0 1px 3px rgba(0,0,0,.05), 0 1px 2px rgba(0,0,0,.03);
  --shadow-lg:0 10px 15px -3px rgba(0,0,0,.08), 0 4px 6px -2px rgba(0,0,0,.04);
  --scrollbar-thumb:#cbd5e1; --scrollbar-thumb-hover:#94a3b8;
  --term-bg:#f1f5f9; --term-border:#e2e8f0; --term-text:#0f172a;
  --term-cmd:#2563eb; --term-err:#dc2626; --term-sys:#64748b;
  --mask:rgba(15,23,42,.45);
  --radius:10px;
}
html[data-theme="dark"]{
  color-scheme:dark;
  --brand:#60a5fa; --brand-600:#3b82f6; --brand-on:#0b1220;
  --brand-soft:rgba(96,165,250,.18); --brand-soft-2:rgba(96,165,250,.22);
  --bg:#0b1220; --card:#111827; --card-hover:#1e293b;
  --text:#f1f5f9; --text-2:#cbd5e1; --muted:#94a3b8;
  --border:#1f2937; --border-hover:#475569; --line:#1e293b; --field:#0f172a;
  --ok:#34d399; --ok-text:#6ee7b7; --ok-bg:rgba(52,211,153,.18);
  --warn:#fbbf24;
  --danger:#f87171;
  --shadow:0 1px 3px rgba(0,0,0,.5);
  --shadow-lg:0 10px 25px rgba(0,0,0,.5);
  --scrollbar-thumb:#475569; --scrollbar-thumb-hover:#64748b;
  --term-bg:#0a1224; --term-border:#1f2937; --term-text:#f1f5f9;
  --term-cmd:#60a5fa; --term-err:#f87171; --term-sys:#94a3b8;
  --mask:rgba(0,0,0,.62);
}
*{box-sizing:border-box}
html,body{height:100%}
html{-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%;overscroll-behavior:none}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;transition:background-color .15s,color .15s}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation;user-select:none;-webkit-user-select:none}
a{color:var(--brand);text-decoration:none}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--scrollbar-thumb);border-radius:4px}
::-webkit-scrollbar-thumb:hover{background:var(--scrollbar-thumb-hover)}

/* ---------- 顶栏（对齐站点 .header：52px 白底 + 底部细线） ---------- */
.topbar{height:52px;background:var(--card);border-bottom:1px solid var(--border);color:var(--text);display:flex;align-items:center;justify-content:space-between;padding:0 16px;gap:12px;position:sticky;top:0;z-index:30;box-shadow:var(--shadow)}
.brand-group{display:flex;align-items:center;gap:10px;min-width:0;flex:1 1 auto}
.logo-icon{width:28px;height:28px;border-radius:6px;background:var(--brand);color:var(--brand-on);display:flex;align-items:center;justify-content:center;flex-shrink:0;user-select:none;transition:background-color .15s}
.logo-icon:hover{background:var(--brand-600)}
.logo-icon svg{width:16px;height:16px}
.brand-title{font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.brand-title .sub{font-weight:400;color:var(--muted);font-size:13px;margin-left:4px}
.home-btn{width:30px;height:30px;border-radius:50%;border:none;background:var(--card-hover);color:var(--brand);display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;transition:.15s}
.home-btn:hover{background:var(--brand);color:var(--brand-on)}
.home-btn svg{width:16px;height:16px}
.status #statusName{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.top-right{display:flex;align-items:center;gap:6px;flex-shrink:0}
.status{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--text-2);margin-right:6px;white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;background:var(--border-hover);display:inline-block;flex-shrink:0}
.dot.green{background:var(--ok);box-shadow:0 0 0 3px var(--ok-bg)}
.ghost-btn{height:32px;padding:0 12px;border-radius:6px;border:1px solid var(--border);background:var(--card);color:var(--text);font-size:13px;display:inline-flex;align-items:center;gap:6px;transition:.15s;white-space:nowrap}
.ghost-btn:hover{background:var(--card-hover);border-color:var(--border-hover)}
.ghost-btn.solid{background:var(--brand);border-color:var(--brand);color:var(--brand-on)}
.ghost-btn.solid:hover{background:var(--brand-600);border-color:var(--brand-600)}
.ghost-btn.icon{width:32px;padding:0;justify-content:center}
.ghost-btn:disabled{opacity:.4;cursor:not-allowed}
.ghost-btn svg{width:15px;height:15px}
#connBtn{min-width:74px;justify-content:center}

/* ---------- 布局 ---------- */
.layout{display:flex;min-height:calc(100vh - 52px)}
.sidebar{width:200px;flex:0 0 200px;background:var(--card);border-right:1px solid var(--border);display:flex;flex-direction:column;padding:10px 0 14px;position:sticky;top:52px;height:calc(100vh - 52px)}
.nav{display:flex;flex-direction:column;gap:2px;overflow-y:auto;flex:1}
.nav-item{position:relative;display:flex;align-items:center;gap:10px;height:38px;padding:0 16px;color:var(--text-2);font-size:13px;border:none;background:transparent;width:100%;text-align:left;border-radius:6px;transition:.15s}
.nav-item svg{width:16px;height:16px;flex-shrink:0;opacity:.75}
.nav-item:hover{background:var(--card-hover);color:var(--text)}
.nav-item.active{background:var(--brand-soft);color:var(--brand);font-weight:600;box-shadow:inset 3px 0 0 var(--brand)}
.nav-item.active svg{opacity:1}
.side-foot{padding:12px 16px 0;color:var(--muted);font-size:11.5px;line-height:1.7;border-top:1px solid var(--line)}
.side-foot b{font-weight:600;color:var(--text-2)}
.main{flex:1;min-width:0;padding:24px 28px 50px}
.container{max-width:1180px;margin:0 auto}
.page{display:none;animation:fade .18s ease}
.page.active{display:block}
@keyframes fade{from{opacity:0}to{opacity:1}}
.page-title{font-size:19px;font-weight:600;margin:0 0 16px;letter-spacing:-.01em}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px 20px;min-width:0}
.card-title{font-size:14.5px;font-weight:600;margin:0 0 12px}
.card-title-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.card-title-row .card-title{margin:0}
.badge-soft{font-size:11.5px;color:var(--muted);background:var(--card-hover);border:1px solid var(--border);padding:3px 8px;border-radius:6px}

/* ---------- 设备信息 ---------- */
.info-card{padding:24px 28px 22px;margin-bottom:20px}
.info-grid{display:grid;grid-template-columns:minmax(0,1.02fr) minmax(0,1.28fr) minmax(0,1.84fr);column-gap:26px;row-gap:4px}
.info-col{display:flex;flex-direction:column;gap:0;min-width:0}
.cpu-pane{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);column-gap:26px;align-content:start;min-width:0}
.kv{display:grid;grid-template-columns:66px minmax(0,1fr);align-items:baseline;min-height:29px;line-height:1.5}
.kv .k{color:var(--muted);font-size:13px;white-space:nowrap}
.kv .v{color:var(--text);font-size:13px;word-break:break-all}
.kv .v.blue{color:var(--brand);font-weight:500}
.kv .v.mono{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:12.5px}
.info-divider{height:1px;background:var(--line);margin:16px 0 14px}
.info-bottom{display:flex;flex-direction:column;gap:2px}
.info-bottom .kv{grid-template-columns:66px minmax(0,1fr);min-height:26px}
.info-bottom .v{color:var(--text-2);font-size:12.5px;font-family:ui-monospace,SFMono-Regular,Consolas,monospace;word-break:break-all}
.link-btn{border:none;background:none;color:var(--brand);font-size:12.5px;padding:0 0 0 8px}
.link-btn:hover{text-decoration:underline}

/* ---------- 主页下半区 ---------- */
.home-lower{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;align-items:start}
.reboot-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.btn-reboot{height:40px;border:1px solid var(--border);border-radius:6px;background:var(--card);color:var(--text-2);font-size:13px;display:flex;align-items:center;justify-content:center;gap:7px;transition:.15s;font-weight:500}
.btn-reboot:hover{background:var(--field);border-color:var(--brand);color:var(--brand)}
.btn-reboot:disabled{opacity:.4;filter:saturate(.5);cursor:not-allowed;transform:none}
.btn-reboot:disabled:hover{background:var(--card);transform:none}
.btn-reboot svg{width:15px;height:15px;color:var(--brand)}
.btn-reboot:hover svg{color:var(--brand)}
.connected-line{display:flex;align-items:center;gap:9px;font-size:13.5px;font-weight:500;margin-bottom:16px}
.device-picker{display:flex;gap:10px}
.device-picker select{flex:1;min-width:0;height:34px;padding:0 12px;border:1px solid var(--border);border-radius:6px;background:var(--card);color:var(--text);outline:none}
.device-picker select:focus{border-color:var(--brand)}
.btn-outline{height:34px;padding:0 12px;border:1px solid var(--border);background:var(--card);border-radius:6px;color:var(--text);font-size:13px;display:inline-flex;align-items:center;gap:7px;white-space:nowrap;transition:.15s}
.btn-outline:hover{border-color:var(--brand);color:var(--brand)}
.btn-outline svg{width:15px;height:15px}
#refreshIcon{display:inline-flex}
.hint{color:var(--muted);font-size:12px;line-height:1.7;margin:14px 0 0}

/* ---------- 通用控件 ---------- */
.btn{height:32px;padding:0 12px;border:1px solid var(--border);background:var(--card);color:var(--text);border-radius:6px;font-size:13px;display:inline-flex;align-items:center;justify-content:center;gap:6px;transition:.15s;white-space:nowrap}
.btn:hover{border-color:var(--border-hover);background:var(--card-hover)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--brand-on)}
.btn.primary:hover{background:var(--brand-600);border-color:var(--brand-600)}
.btn.danger{color:var(--danger)}
.btn svg{width:15px;height:15px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.input{height:34px;padding:0 12px;border:1px solid var(--border);border-radius:6px;background:var(--card);outline:none;min-width:0}
.input:focus{border-color:var(--brand)}
.input.num-sm{width:74px}
.input.num-md{width:90px}
textarea.input{height:auto;padding:10px 12px;resize:vertical;line-height:1.6}
.toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.toolbar .input{flex:1;max-width:320px}
.stat{color:var(--muted);font-size:12.5px;margin-left:auto}
.stat b{color:var(--text)}
/* 应用类型筛选：三个等宽胶囊按钮，数字随列表实时更新 */
.app-kind{display:inline-flex;gap:0;padding:2px;border:1px solid var(--border);border-radius:9px;background:var(--field);flex-wrap:nowrap}
.app-kind .chip{border:0;background:transparent;border-radius:7px;padding:5px 11px;color:var(--text-2);font-family:inherit;font-size:12.5px;line-height:1.4;white-space:nowrap;transition:background .15s,color .15s}
.app-kind .chip:hover{color:var(--brand);background:transparent}
.app-kind .chip.active{background:var(--card);color:var(--brand);font-weight:600;box-shadow:var(--shadow)}
html[data-theme="dark"] .app-kind .chip.active{background:var(--brand-soft);box-shadow:none}
.app-kind .chip i{font-style:normal;opacity:.55;margin-left:5px;font-weight:400;font-size:11.5px}
.app-kind .chip.active i{opacity:.8}
.list-meta{color:var(--muted);font-size:12.5px;margin:-4px 0 10px}
.list-meta b{color:var(--text)}
.grid-2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}
.grid-2.align-start{align-items:start}
.section-title{font-size:14px;font-weight:600;margin:0 0 12px}
.muted{color:var(--muted)}
.mt16{margin-top:16px}
.mt20{margin-top:20px}

/* 表格 */
.table-card{padding:0;overflow:hidden}
/* 无数据 / 无匹配时取消表格最小宽度，避免空态提示在窄屏被横向裁切 */
.table-card.empty{overflow:hidden}
.table-card.empty table{min-width:0}
.table-card.empty thead{display:none}
table{width:100%;border-collapse:collapse;font-size:13px;table-layout:fixed}
th,td{text-align:left;padding:12px 16px;border-bottom:1px solid var(--line)}
table th:nth-child(1){width:36%}
table th:nth-child(2){width:14%}
table th:nth-child(3){width:13%}
table th:nth-child(4){width:13%}
table th.col-ops{width:28%}
th{background:var(--field);color:var(--muted);font-weight:500;font-size:12.5px;white-space:nowrap}
tbody tr:last-child td{border-bottom:none}
tbody tr:hover{background:var(--field)}
.td-ops{display:flex;gap:5px;flex-wrap:wrap}
.mini-btn{border:1px solid var(--border);background:var(--card);color:var(--text-2);border-radius:6px;padding:4px 8px;font-size:12px;white-space:nowrap}
.mini-btn:hover{border-color:var(--brand);color:var(--brand)}
.mini-btn.red:hover{border-color:var(--danger);color:var(--danger)}
.pill{font-size:11.5px;padding:2px 8px;border-radius:20px;background:var(--brand-soft-2);color:var(--brand);white-space:nowrap}
.pill.gray{background:var(--card-hover);color:var(--muted)}
.pill.green{background:var(--ok-bg);color:var(--ok-text)}
.app-cell{display:flex;align-items:center;gap:10px}
.app-icon{width:30px;height:30px;border-radius:6px;background:var(--brand-soft-2);color:var(--brand);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;flex-shrink:0}
.app-name{font-weight:500}
.app-pkg{font-size:11.5px;color:var(--muted);font-family:ui-monospace,Consolas,monospace}

/* 设置行 */
.row-item{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px 16px;padding:11px 0;border-bottom:1px solid var(--line)}
.row-item:last-child{border-bottom:none}
.row-item .label{font-size:13.5px}
.row-item .desc{font-size:12px;color:var(--muted);margin-top:2px;line-height:1.5}
.row-item .desc code{font-size:11px}
.row-item .ctrl{display:flex;align-items:center;flex-wrap:wrap;gap:10px;min-width:0}
.row-item select{min-width:130px;height:34px;padding:0 10px;border:1px solid var(--border);border-radius:6px;background:var(--field);outline:none}
.switch{position:relative;width:42px;height:23px;border-radius:20px;background:var(--border);border:none;transition:.2s;flex-shrink:0}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:17px;height:17px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.2);transition:.2s}
.switch.on{background:var(--brand)}
.switch.on::after{transform:translateX(19px)}
.range-wrap{display:flex;align-items:center;gap:12px}
input[type=range]{-webkit-appearance:none;appearance:none;width:190px;height:5px;border-radius:5px;background:var(--border);outline:none}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;background:var(--brand);cursor:pointer;box-shadow:0 1px 4px rgba(37,99,235,.35)}
.range-val{min-width:66px;font-size:13px;font-variant-numeric:tabular-nums;color:var(--brand);font-weight:600}

/* 截图 */
.shot-card{grid-column:1/-1}
.shot-bar{display:flex;align-items:center;flex-wrap:wrap;gap:10px 14px}
.shot-bar .btn{display:inline-flex;align-items:center;gap:6px}
.chk{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;color:var(--text-2);cursor:pointer;user-select:none}
.chk input{width:15px;height:15px;accent-color:var(--brand);margin:0;cursor:pointer}
.shot-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:12px;margin-top:16px}
.shot-item{display:flex;flex-direction:column;gap:6px;padding:0;border:1px solid var(--border);border-radius:8px;background:var(--field);overflow:hidden;cursor:zoom-in;text-align:left;transition:.15s;font-family:inherit}
.shot-item:hover{border-color:var(--brand);box-shadow:var(--shadow)}
.shot-item img{display:block;width:100%;height:132px;object-fit:cover;background:var(--card-hover)}
.shot-meta{font-size:11px;color:var(--muted);padding:0 8px 7px;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.shot-empty{grid-column:1/-1;font-size:12.5px;color:var(--muted);line-height:1.9;padding:16px;border:1px dashed var(--border);border-radius:8px;text-align:center}
.shot-preview{max-height:60vh;overflow:auto;text-align:center;background:var(--field);border-radius:8px;padding:6px}
.shot-preview img{max-width:100%;display:block;margin:0 auto}

/* 系统界面 / 无级调节 */
.icon-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:11px 18px}
.icon-grid-2{grid-template-columns:repeat(2,minmax(0,1fr))}
.btn-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.btn-grid .btn{justify-content:center}
.stack{display:flex;flex-direction:column;gap:16px;min-width:0}
.range-wrap .range-val{min-width:60px;text-align:right}
@media(max-width:640px){.icon-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}

/* 电池 */
.battery-wrap{display:flex;align-items:center;gap:26px;flex-wrap:wrap}
.ring{position:relative;width:128px;height:128px;flex-shrink:0}
.ring svg{transform:rotate(-90deg)}
.ring .ring-text{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring .ring-text b{font-size:28px;line-height:1}
.ring .ring-text span{font-size:11px;color:var(--muted);margin-top:5px}
.metric-grid{display:grid;grid-template-columns:repeat(2,minmax(130px,1fr));gap:14px 26px;flex:1}
.metric .m-k{font-size:12px;color:var(--muted)}
.metric .m-v{font-size:17px;font-weight:600;margin-top:4px}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.card-head .card-title{margin:0}
.bat-details{margin-top:14px}
.bat-details summary{cursor:pointer;font-size:12px;color:var(--muted);user-select:none}
.bat-details[open] summary{margin-bottom:8px}
.bat-raw{margin:0;max-height:168px;overflow:auto;background:var(--field);border-radius:6px;padding:10px 12px;font-size:11.5px;line-height:1.6;color:var(--text-2);white-space:pre-wrap;word-break:break-all}
.bat-src{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
#page-battery .input.num-sm{width:100px}
.bat-src button{height:30px;border:1px solid var(--border);border-radius:6px;background:var(--card);color:var(--text-2);font-size:12px;cursor:pointer;transition:.15s}
.bat-src button:hover{border-color:var(--border-hover)}
.bat-src button.on{border-color:var(--brand);color:var(--brand);background:var(--brand-soft);font-weight:600}
.bat-ctrl{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.bat-ctrl .btn.on{border-color:var(--brand);color:var(--brand);background:var(--brand-soft)}
.bat-log{min-height:150px;max-height:320px;overflow:auto;border:1px solid var(--line);border-radius:6px;font-size:12px}
.bat-row{display:grid;grid-template-columns:1fr .7fr .8fr;gap:8px;padding:6px 10px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
.bat-log.power .bat-row{grid-template-columns:1fr .7fr .8fr .9fr}
.bat-row.head{position:sticky;top:0;background:var(--card);color:var(--muted);font-size:11.5px;z-index:1}
.bat-row span:not(:first-child){text-align:right}
.bat-empty{padding:20px 12px;text-align:center;color:var(--muted);font-size:12px}
.bat-foot{display:flex;justify-content:space-between;gap:10px;margin-top:8px;font-size:12px;color:var(--muted)}

/* 终端 */
.terminal{background:var(--term-bg);border:1px solid var(--term-border);border-radius:6px;padding:16px;height:400px;overflow-y:auto;font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:12.8px;line-height:1.75;color:var(--term-text)}
.terminal .t-cmd{color:var(--term-cmd)}
.terminal .t-out{white-space:pre-wrap;word-break:break-all;color:var(--term-text)}
.terminal .t-err{color:var(--term-err)}
.terminal .t-sys{color:var(--term-sys)}
.term-input{display:flex;align-items:center;gap:10px;margin-top:12px}
.term-input .prompt{font-family:ui-monospace,Consolas,monospace;color:var(--brand);font-weight:700}
.term-input input{flex:1;height:34px;background:var(--card);border:1px solid var(--border);border-radius:6px;padding:0 12px;outline:none;font-family:ui-monospace,Consolas,monospace}
.term-input input:focus{border-color:var(--brand)}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.chip{border:1px solid var(--border);background:var(--card);border-radius:20px;padding:5px 12px;font-size:12px;color:var(--text-2);font-family:ui-monospace,Consolas,monospace}
.chip:hover{border-color:var(--brand);color:var(--brand)}

/* 脚本 */
.code-area{width:100%;min-height:180px;background:var(--field);border:1px solid var(--border);border-radius:6px;padding:12px;font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:12.8px;line-height:1.7;outline:none;color:var(--text)}
.code-area:focus{border-color:var(--brand)}
.tpl-list{display:flex;flex-direction:column;gap:8px}
.tpl{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 13px;border:1px solid var(--border);border-radius:6px;background:var(--card);cursor:pointer;transition:.15s}
.tpl:hover{border-color:var(--brand);background:var(--brand-soft)}
.tpl .t-name{font-size:13px;font-weight:500}
.tpl .t-desc{font-size:11.5px;color:var(--muted);margin-top:3px}
.output-box{background:var(--field);border:1px solid var(--border);border-radius:6px;padding:12px;min-height:110px;max-height:220px;overflow:auto;white-space:pre-wrap;word-break:break-all;font-family:ui-monospace,Consolas,monospace;font-size:12.3px;line-height:1.65;color:var(--text-2)}

/* 关于 */
.about-hero{display:flex;align-items:center;gap:16px;margin-bottom:18px}
.about-logo{width:52px;height:52px;border-radius:10px;background:var(--brand);color:var(--brand-on);display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:700;flex-shrink:0}
.about-logo svg{width:28px;height:28px}
.app-guess{font-size:11px;font-weight:400;color:var(--muted);margin-left:6px;white-space:nowrap}
.kv-list{display:grid;grid-template-columns:repeat(2,1fr);gap:12px 28px}
.kv-list .kv{grid-template-columns:82px 1fr}
.code-inline{font-family:ui-monospace,Consolas,monospace;background:var(--field);border:1px solid var(--border);border-radius:4px;padding:1px 5px;font-size:12px}
.notice{background:transparent;border:0;border-left:2px solid var(--border);border-radius:0;padding:2px 0 2px 10px;font-size:12px;line-height:1.7;color:var(--muted)}

/* toast & dialog */
#toasts{position:fixed;top:calc(16px + env(safe-area-inset-top));right:calc(16px + env(safe-area-inset-right));display:flex;flex-direction:column;align-items:flex-end;gap:9px;z-index:100}
.toast{min-width:220px;max-width:380px;background:var(--card);border:1px solid var(--border);border-left:3px solid var(--brand);border-radius:6px;box-shadow:var(--shadow-lg);padding:11px 15px;font-size:13px;line-height:1.6;animation:slidein .2s ease;color:var(--text)}
.toast.ok{border-left-color:var(--ok)}
.toast.warn{border-left-color:var(--warn)}
.toast.err{border-left-color:var(--danger);color:var(--danger)}
@keyframes slidein{from{opacity:0;transform:translateX(16px)}to{opacity:1;transform:none}}
.mask{position:fixed;inset:0;background:var(--mask);display:flex;align-items:center;justify-content:center;z-index:90;padding:20px;-webkit-backdrop-filter:blur(2px);backdrop-filter:blur(2px)}
.mask[hidden]{display:none}
.dialog{background:var(--card);border:1px solid var(--border);border-radius:10px;width:min(440px,100%);max-height:calc(100vh - 40px);overflow:auto;box-shadow:var(--shadow-lg);padding:22px 24px}
.dialog h3{margin:0 0 12px;font-size:16px}
.dialog .dlg-body{font-size:13.2px;line-height:1.8;color:var(--text-2)}
.dialog .dlg-body p{margin:0}
.dialog .dlg-body ol{margin:10px 0 0;padding-left:20px}
.dialog .dlg-body li{margin:5px 0}
.dialog .dlg-body b{color:var(--text)}
.dlg-actions{flex-wrap:wrap}
.dlg-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:22px;flex-wrap:wrap}
.spin{animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* ---------- 暗色模式微调 ---------- */
html[data-theme="dark"] .nav-item.active,
html[data-theme="dark"] .app-icon,
html[data-theme="dark"] .pill,
html[data-theme="dark"] .link-btn{color:var(--brand)}
html[data-theme="dark"] .switch::after{background:#f5f7ff}
/* 暗色：未连接用柔和灰蓝；已连接保持醒目绿点（.dot.green 不再被覆盖） */
html[data-theme="dark"] .dot:not(.green){background:#6b7692}
html[data-theme="dark"] .dot.green{background:#34d399;box-shadow:0 0 0 3px rgba(52,211,153,.16),0 0 9px rgba(52,211,153,.5)}
html[data-theme="dark"] input[type=range]::-webkit-slider-thumb{box-shadow:0 1px 6px rgba(96,165,250,.6)}

/* 长命令 / 长文本不撑破容器，表格可横向滚动 */
.code-inline,.hint,.notice,.muted,.dlg-body,.output-box{overflow-wrap:anywhere}
.about-hero{flex-wrap:wrap}
.device-picker{flex-wrap:wrap}
.table-card{overflow:auto}
table{min-width:720px}
.ring svg{width:100%;height:100%}
input[type=range]{width:clamp(120px,16vw,190px)}
.scripts-layout{display:grid;grid-template-columns:300px minmax(0,1fr);gap:20px}

/* ---------- 响应式断点 ---------- */
@media (min-width:1600px){
  .main{padding:30px 36px 60px}
  .page-title{font-size:22px}
  .card{padding:24px 28px}
}
@media (max-width:1279px){
  .main{padding:22px 22px 44px}
  .card{padding:20px 22px}
  .info-card{padding:22px 24px 20px}
  .info-grid{column-gap:18px}
  .status{max-width:190px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
}
@media (max-width:1023px){
  .home-lower,.grid-2,.kv-list,.scripts-layout{grid-template-columns:minmax(0,1fr)}
  .info-grid{grid-template-columns:minmax(0,1fr) minmax(0,1fr);row-gap:10px}
  .cpu-pane{grid-column:1/-1}
  .toolbar .stat{margin-left:0}
  .row-item .ctrl{flex-wrap:wrap;justify-content:flex-end}
  .terminal{height:360px}
}
@media (max-width:860px){
  .topbar{padding:0 14px;gap:10px}
  .top-right{gap:6px}
  .brand-title .sub{display:none}
  .ghost-btn{padding:0 10px;font-size:12.5px}
  .status{font-size:12px;max-width:150px;margin-right:0}
  .main{padding:20px 18px 40px}
}
@media (max-width:720px){
  .sidebar{width:60px;flex-basis:60px}
  .nav-item{justify-content:center;padding:0}
  .nav-item span,.side-foot{display:none}
  .brand-title{font-size:15px}
  .info-grid{grid-template-columns:1fr;row-gap:8px}
  .row-item{flex-direction:column;align-items:stretch;gap:10px}
  .row-item .ctrl{justify-content:flex-start;width:100%}
  .range-wrap{flex:1 1 220px}
  input[type=range]{width:clamp(110px,40vw,190px)}
  .metric-grid{grid-template-columns:1fr 1fr}
  .terminal{height:330px;font-size:12.2px}
  .ring{width:112px;height:112px}
  #toasts{top:56px;right:12px;left:12px;align-items:stretch}
  .toast{min-width:0;max-width:none}
  .dialog{padding:20px 18px}
  .dlg-actions .btn{flex:1 1 auto}
}
@media (max-width:480px){
  .topbar{padding:0 10px;gap:8px}
  .brand-title{font-size:14px}
  .status{display:none}
  .ghost-btn{height:30px;padding:0 9px;font-size:12px}
  .ghost-btn.icon{width:30px;padding:0}
  .main{padding:16px 12px 36px}
  .page-title{font-size:18px;margin-bottom:14px}
  .card,.info-card{padding:16px 14px}
  .card-title{font-size:15px}
  .home-lower{gap:14px}
  .reboot-grid{grid-template-columns:repeat(2,1fr);gap:10px}
  .btn-reboot{height:40px;font-size:12.5px}
  .device-picker{gap:8px}
  .device-picker select,.device-picker .btn-outline{flex:1 1 100%}
  .btn-outline{justify-content:center}
  .kv,.info-bottom .kv{grid-template-columns:62px minmax(0,1fr)}
  .cpu-pane{column-gap:12px}
  .metric-grid{grid-template-columns:1fr}
  #page-battery .battery-wrap{flex-direction:column;align-items:center;gap:16px}
  #page-battery .metric-grid{grid-template-columns:1fr 1fr;width:100%;gap:12px 14px}
  #page-battery .metric .m-k{font-size:11.5px}
  #page-battery .metric .m-v{font-size:15px}
  .toolbar{gap:8px}
  .toolbar .input{flex:1 1 100%;max-width:none}
  .toolbar .btn{flex:1 1 auto}
  .toolbar .stat{flex:1 1 auto;text-align:right}
  th,td{padding:10px 12px}
  .terminal{height:300px;padding:12px}
  .term-input{flex-wrap:wrap}
  .term-input input{flex:1 1 calc(100% - 26px)}
  .term-input .btn{flex:1 1 100%}
  .chips .chip{font-size:11px;padding:4px 9px}
  .about-hero{gap:12px}
  .code-area{min-height:150px}
  .hint{font-size:12px;margin-top:14px}
  .input.num-sm{width:62px}
  .input.num-md{width:74px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition-property:opacity,color,background-color,border-color,box-shadow!important;transition-duration:.15s!important}
}
@media (hover:none) and (pointer:coarse){
  input,textarea,select{font-size:16px}
  .btn:active,.ghost-btn:active,.btn-reboot:not(:disabled):active,.mini-btn:active{transform:scale(.97)}
}
/* ---------------- 投屏 ---------------- */
.mirror-layout{display:flex;gap:16px;align-items:stretch}
.mirror-view{flex:1;min-width:0;display:flex;align-items:center;justify-content:center;background:#070b14;border:1px solid var(--border);border-radius:8px;padding:16px;min-height:240px}
.mirror-stage{position:relative;height:min(74vh,760px);aspect-ratio:var(--ar,9 / 19.5);width:auto;max-width:100%;background:#05080f;border:1px solid rgba(148,163,184,.26);border-radius:10px;overflow:hidden;display:flex;align-items:center;justify-content:center;touch-action:none;user-select:none;box-shadow:0 10px 32px rgba(0,0,0,.42)}
.mirror-stage:fullscreen{height:100vh;max-height:none;aspect-ratio:auto;width:100%;min-height:0;background:#000;border:none;border-radius:0}
.mirror-placeholder{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:#94a3b8;font-size:13px;text-align:center;padding:24px;pointer-events:none;background:#070b14}
.mirror-placeholder svg{width:36px;height:36px;opacity:.6}
.mirror-side{width:200px;flex:none;display:flex;flex-direction:column;gap:10px;scrollbar-width:thin}
.mirror-side-group{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:10px;display:flex;flex-direction:column;gap:6px;min-width:0}
.mirror-side-label{font-size:11px;font-weight:600;letter-spacing:.06em;color:var(--muted);padding:2px 2px 4px}
.mirror-side-group>.btn{width:100%;padding:0 8px;justify-content:flex-start;gap:7px}
.mirror-side .mirror-input-row{flex-direction:column;gap:6px;margin-top:0}
.mirror-side .mirror-input-row .btn{width:100%}
.mirror-input-row{display:flex;gap:8px;margin-top:12px}
.mirror-input-row .input{flex:1;min-width:0}
.mirror-rate{height:32px;padding:0 8px;border:1px solid var(--border);border-radius:6px;background:var(--field);color:var(--text);font-size:12.5px}
.quick-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:4px}
.quick-btn{height:34px;justify-content:flex-start;padding:0 11px;font-size:12.5px}
.mirror-tip{margin-top:14px}
/* --- 流式投屏（WebCodecs） --- */
.mirror-stage canvas{width:100%;height:100%;object-fit:contain;display:none;background:#05080f}
.mirror-stage canvas.on{display:block}
.mirror-stage:focus{outline:none}
.mirror-stage:focus-visible{box-shadow:0 0 0 2px var(--brand-40,rgba(37,99,235,.4))}
.mirror-toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.mirror-opt{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted)}
/* 窄屏：标签文字收起（保留给读屏），两个下拉与开始按钮同一行 */
@media(max-width:430px){
  .mirror-opt{font-size:0;gap:0}
  .mirror-opt .mirror-rate{font-size:12px;padding:0 6px}
}
.mirror-key-row{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.mirror-stage.recording{border-color:rgba(248,113,113,.55);box-shadow:0 10px 32px rgba(0,0,0,.42),0 0 0 2px rgba(220,38,38,.25)}
.mirror-stage:fullscreen{border-radius:0}
.mirror-stage:fullscreen canvas{max-height:100vh}
@media(max-width:900px){
  .mirror-layout{flex-direction:column}
  .mirror-side{width:100%;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
  .mirror-side .mirror-input-row{flex-direction:row}
  .mirror-side .mirror-input-row .btn{width:auto}
}
@media(max-width:640px){
  .mirror-view{min-height:220px;padding:10px}
  .mirror-stage{height:min(60vh,480px)}
  .mirror-side{grid-template-columns:1fr}
}
/* 搜索框清空按钮 —— 与 SQLite 侧边栏一致：有内容显示、空隐藏。
   position:fixed 浮层，不参与页面布局，位置由 JS 按输入框实时定位 */
.search-clear{position:fixed;left:0;top:0;width:18px;height:18px;border:none;border-radius:50%;background:var(--muted);color:var(--card);font-size:13px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center;opacity:.6;transition:opacity .15s,transform .15s;z-index:50}
.search-clear[hidden]{display:none}
.search-clear:hover{opacity:1}
.search-clear:active{transform:scale(.9);opacity:1}
#appSearch{padding-right:30px}
</style>

<header class="topbar">
  <div class="brand-group">
    <div class="logo-icon" aria-label="搞机工具箱">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="2" width="12" height="20" rx="2"/><path d="M11 18h2"/></svg>
    </div>
    <div class="brand-title">搞机工具箱</div>

      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11.5 12 4l9 7.5"/><path d="M5 10.5V20a1 1 0 0 0 1 1h4v-6h4v6h4a1 1 0 0 0 1-1v-9.5"/></svg>
    </a>
  </div>
  <div class="top-right">
    <div class="status"><span class="dot" id="statusDot"></span><span id="statusName">未连接设备</span></div>
    <button class="ghost-btn icon" data-act="toggle-theme" title="切换深浅色主题" id="themeBtn"></button>
    <button class="ghost-btn solid" data-act="conn-toggle" id="connBtn">连接设备</button>
  </div>
</header>

<div class="layout">
  <aside class="sidebar">
    <nav class="nav" id="nav"></nav>
    <div class="side-foot">作者@<b>維坦</b><br>v1.4.7</div>
  </aside>
  <main class="main">
    <div class="container">

      <!-- 主页 -->
      <section class="page active" id="page-home">
        <h1 class="page-title">设备信息</h1>
        <div class="notice" id="homeNotice" style="margin-bottom:14px">未连接设备。点右上角「连接设备」并用 USB 调试授权。</div>
        <div class="card info-card">
          <div class="info-grid" id="infoGrid"></div>

            <div class="reboot-grid" id="rebootGrid"></div>
          </div>
          <div class="card">

              <h2 class="card-title">连接设备</h2>

      <section class="page" id="page-tuner"></section>
      <section class="page" id="page-scripts"></section>

      <section class="page" id="page-settings"></section>

</div>

<div id="toasts"></div>
<div class="mask" id="mask" hidden>
  <div class="dialog">
    <h3 id="dlgTitle"></h3>
    <div class="dlg-body" id="dlgBody"></div>
    <div class="dlg-actions" id="dlgActions"></div>
  </div>

/* ---------------- 统一 shell 执行层 ---------------- */
/* 统一 shell 执行层：三个包已内联打包并锁定 adb 2.3.1，避免多份不兼容实例 */
/* ADB 依赖已内联打包进本页（见 <script id="adb-bundle">）：
   @yume-chan/adb@2.3.1 / adb-daemon-webusb@2.3.2 / adb-credential-web@2.1.0。
   不再从外部 CDN 动态 import，离线与国内网络均可直接使用。 */
let libsPromise=null;
function loadLibs(){
  if(!libsPromise){
    // 依赖已内联，取用同步完成；保留 Promise 形式以兼容连接链路的 stage() 超时包装
    libsPromise=Promise.resolve().then(()=>{
      const L=globalThis.__ADB_LIBS__;
      if(!L) throw new Error('ADB 组件未就绪，请刷新页面重试');
      return L;
    }).catch(e=>{ libsPromise=null; throw e; });
  }
  return libsPromise;
}
/* 预先取好组件：navigator.usb.requestDevice() 必须在用户手势有效期内调用，
   若等点击后才现场下载 3 个 ESM 包，手势过期会导致系统设备选择器不弹出。 */
function warmLibs(){ if(navigator.usb && window.isSecureContext) loadLibs().catch(()=>{}); }
async function realShell(cmd){
  if(!state.adb) throw new Error('设备未连接');
  const svc=state.adb.subprocess;
  const runner=(svc && svc.noneProtocol) || svc;
  if(!runner) throw new Error('当前 ADB 组件不支持 shell 命令');
  let timerId=null;
  const timer=new Promise((_,rej)=>{ timerId=setTimeout(()=>rej(new Error('命令执行超时')),10000); });
  try{
    if(typeof runner.spawnWaitText==='function') return await Promise.race([runner.spawnWaitText(cmd),timer]);
    // 兼容旧版 Tango：spawn() 返回可读流，读完后再等待进程退出
    const proc=await runner.spawn(cmd);
    const read=(async()=>{
      const text=await new Response(proc.stdout||proc.output).text();
      if(proc && typeof proc.wait==='function'){ try{ await proc.wait(); }catch(_){} }
      return text;
    })();
    return await Promise.race([read,timer]);
  }finally{ if(timerId!=null) clearTimeout(timerId); }
}
/* 统一 shell 执行层：仅连接真机后可用，未连接时返回明确提示，不再提供模拟输出 */
async function shell(cmd){
  if(state.mode!=='real' || !state.adb) return '设备未连接，请先点击右上角「连接设备」连接真机';
  return await realShell(cmd);
}
async function runCmd(cmd, silent){
  if(state.mode!=='real'){ toast('请先连接真机后再执行操作','warn'); return ''; }
  try{
    const out=await shell(cmd);
    log(cmd, out||'执行成功');
    if(!silent && out) toast('命令已执行：<code>'+esc(cmd)+'</code>','ok');
    else if(!silent) toast('命令已下发：<code>'+esc(cmd)+'</code>','ok');
    return out;
  }catch(e){
    if(!silent) toast('执行失败：'+esc(e.message||e),'err');
    return 'ERROR: '+(e.message||e);
  }
}

/* ---------------- 连接诊断 ---------------- */
const BUILD='v1.4.7';
function hex4(n){ return '0x'+(Number(n)||0).toString(16).padStart(4,'0'); }
function errText(e){
  if(!e) return '无';
  const c=e.cause ? (' | cause='+((e.cause.name||'')+': '+(e.cause.message||e.cause))) : '';
  return ((e.name||'Error')+': '+(e.message||String(e))+c);
}
async function probeUsb(dev, verdict){
  const out=[];
  const V=verdict||{};
  const cfg=dev.configuration;
  let target=null;
  if(cfg && cfg.interfaces){
    for(const itf of cfg.interfaces){
      const a=(itf.alternates&&itf.alternates[0])||{};
      if(a.interfaceClass===255 && a.interfaceSubclass===66 && a.interfaceProtocol===1){ target=itf.interfaceNumber; break; }
    }
  }
  out.push('接口探测: '+(target===null?'未找到 ADB 接口':'目标接口 #'+target));
  if(target===null){ V.status='no-adb'; return out; }
  let openedByUs=false;
  const wasOpened=!!dev.opened;
  try{
    if(!dev.opened){ await dev.open(); openedByUs=true; out.push('  open(): 成功'); }
    else out.push('  open(): 设备已处于打开状态（残留句柄）');
  }catch(e){ out.push('  open(): 失败 -> '+errText(e)); V.status='open-failed'; return out; }
  try{
    const live=dev.configuration && dev.configuration.interfaces.find(i=>i.interfaceNumber===target);
    if(live && live.claimed){ out.push('  claimInterface('+target+'): 已处于 claimed 状态'); V.status='claimed'; }
    else{
      await dev.claimInterface(target);
      V.status='ok';
      out.push('  claimInterface('+target+'): 成功');
      try{ await dev.releaseInterface(target); out.push('  releaseInterface('+target+'): 成功'); }
      catch(e){ out.push('  releaseInterface: '+errText(e)); }
    }
  }catch(e){
    V.status='busy';
    out.push('  claimInterface('+target+'): 失败 -> '+errText(e));
    out.push('  => 接口被占用或驱动不支持。');
  }
  // 本函数打开的一定 close；原本就打开且当前无活跃连接时也释放残留，避免诊断污染后续连接
  const canRelease = openedByUs || (wasOpened && state.mode!=='real');
  try{
    if(dev.opened && canRelease){
      await dev.close();
      out.push('  close(): 成功'+(openedByUs?'':'（已释放残留句柄）'));
    }else if(dev.opened && wasOpened){
      out.push('  close(): 跳过（设备正在使用中）');
    }
  }catch(e){ out.push('  close(): '+errText(e)); }
  return out;
}
async function runDiagnostics(){
  const L=[];
  const p=(k,v)=>L.push(k+': '+v);
  p('构建', BUILD);
  p('时间', new Date().toLocaleString('zh-CN',{hour12:false}));
  p('页面', location.origin+location.pathname);
  p('协议 / 安全上下文', location.protocol+' / '+(window.isSecureContext?'安全（WebUSB 可用）':'不安全（WebUSB 会被禁用）'));
  const ua=navigator.userAgent||'';
  const br=(ua.match(/(Edg|Chrome|CriOS|Firefox)\/[\d.]+/)||[])[0]||'未知浏览器';
  const os=/Windows/.test(ua)?'Windows':/Mac OS/.test(ua)?'macOS':/Android/.test(ua)?'Android':/Linux|CrOS/.test(ua)?'Linux':'其他';
  p('浏览器', br+' / '+os);
  p('WebUSB 接口', navigator.usb?'存在':'不存在');
  p('当前状态', 'mode='+state.mode+' connecting='+!!state.connecting+' manager='+!!state.manager);
  p('连接阶段', state.connectStage||'—');
  p('最近连接错误', errText(state.lastError));
  L.push('');
  if(!navigator.usb){ L.push('无法继续：当前浏览器不支持 WebUSB。'); return L.join('\n'); }
  let list=[];
  try{ list=await navigator.usb.getDevices(); p('已授权设备数', list.length); }
  catch(e){ p('枚举设备失败', errText(e)); return L.join('\n'); }
  function guideFor(v){
    const s=(v&&v.status)||'unknown';
    const L=['--- 处理建议 ---'];
    if(s==='ok'){
      L.push('接口可被浏览器独占，USB 层正常。连接失败多在 RSA 授权：撤销 USB 调试授权 → 拔插数据线 → 重新允许。');
      return L;
    }
    if(s==='claimed'){
      L.push('接口被浏览器占用（残留句柄）：点「释放接口并重试」，或先断开再重连。');
      return L;
    }
    L.push('浏览器未能独占 ADB 接口，通常不是浏览器或 HTTPS 的问题。');
    if(s==='open-failed') L.push('设备 open() 失败：驱动或系统权限异常。');
    else if(s==='no-adb') L.push('未找到 ADB 接口：手机切回「传输文件(MTP)」并开启 USB 调试。');
    else L.push('浏览器侧已干净，多为电脑端占用或 Windows 驱动：');
    L.push('1) 关掉电脑端 adb / 手机助手 / scrcpy，只留一个标签页、一台设备，重插数据线；');
    L.push('2) 手机切回「传输文件(MTP)」，撤销 USB 调试授权后重新允许；');
    L.push('3) Windows 需 WinUSB 驱动（Zadig 可换）；Linux / macOS 免驱动，可直接连。');
    return L;
  }
  if(!list.length){
    L.push('未发现已授权设备。请先点「连接设备」在系统弹窗中选择手机。');
    L.push('', ...guideFor({status:'unknown'}));
    return L.join('\n');
  }
  for(let i=0;i<list.length;i++){
    const d=list[i];
    L.push('--- 设备 '+i+' ---');
    p('  VID:PID', hex4(d.vendorId)+':'+hex4(d.productId));
    p('  名称', (d.productName||'-')+' / '+(d.manufacturerName||'-')+' / serial='+(d.serialNumber||'-'));
    p('  opened', String(d.opened));
    const cfg=d.configuration;
    p('  configuration', cfg?'#'+cfg.configurationValue:'null (未选择配置)');
    if(cfg && cfg.interfaces){
      for(const itf of cfg.interfaces){
        const a=(itf.alternates&&itf.alternates[0])||{};
        const isAdb=a.interfaceClass===255&&a.interfaceSubclass===66&&a.interfaceProtocol===1;
        p('  接口 #'+itf.interfaceNumber,
          'claimed='+itf.claimed+' class='+(a.interfaceClass==null?'-':a.interfaceClass)+
          ' sub='+(a.interfaceSubclass==null?'-':a.interfaceSubclass)+
          ' proto='+(a.interfaceProtocol==null?'-':a.interfaceProtocol)+(isAdb?'   <== ADB 接口':''));
      }
      const audioItfs=cfg.interfaces.filter(i=>{const a=(i.alternates&&i.alternates[0])||{};return a.interfaceClass===1;}).length;
      if(audioItfs) p('  注意', '存在 USB 音频类接口，建议手机切回「传输文件(MTP)」');
    }
  }
  L.push('');
  L.push('--- 接口实测 ---');
  const verdict={status:'unknown'};
  L.push(...await probeUsb(list[0], verdict));
  L.push('', ...guideFor(verdict));
  return L.join('\n');
}

/* ADB 的 USB 接口是独占的，claimInterface 被拒会抛 DeviceBusyError。
   释放逻辑只能清理浏览器自己的句柄；外部占用与驱动需在电脑端处理。 */
function isBusyError(e){
  const t=String((e&&e.message)||e||'').toLowerCase();
  const n=String((e&&e.name)||'').toLowerCase();
  const busyText=/already in used|already in use|in use by another|device.{0,24}busy|claim.?interface|unable to claim|failed to claim/.test(t);
  if(busyText || n==='devicebusyerror') return true;
  // open() 失败也会抛 NetworkError，必须明确指向 claim/占用才判定为「设备被占用」
  return n==='networkerror' && /claim|busy|in use|already in use/.test(t);
}
async function releaseUsb(dev){
  const raw=dev && (dev.raw || (typeof dev.close==='function'?dev:null));
  if(!raw) return 0;
  let n=0;
  try{
    if(raw.opened){
      const cfg=raw.configuration;
      if(cfg && cfg.interfaces){
        for(const itf of cfg.interfaces){
          if(itf.claimed){ try{ await raw.releaseInterface(itf.interfaceNumber); n++; }catch(_){} }
        }
      }
      try{ await raw.close(); }catch(_){}
    }
  }catch(_){}
  return n;
}
async function releaseAllUsb(){
  if(!navigator.usb) return 0;
  let n=0;
  try{ for(const d of await navigator.usb.getDevices()) n+=await releaseUsb(d); }catch(_){}
  return n;
}
/* 顶栏只有一个连接按钮，文案随状态切换：
   未连接 →「连接设备」（实心主操作）／连接中 →「取消连接」（描边，可中止）／已连接 →「断开」（描边） */
function syncConnBtn(){

  b.textContent = on?'取消连接':(off?'断开中…':(conn?'断开':'连接设备'));
  b.classList.toggle('solid', !on && !off && !conn);   // 只有「连接设备」是主操作，其余保持描边避免误点
  b.title = on?'点击取消本次连接':(off?'正在释放 USB 接口':(conn?'断开当前设备并释放 USB 接口':'通过 WebUSB 连接真机'));

/* 连接阶段实时显示在顶栏；卡住时能一眼看出停在哪一步，而不是只看到「连接中」 */
function setStage(full, short){

  const s=$('#statusName');
  if(s && state.connecting) s.textContent=short||full;
}
/* 连接链路里 CDN 挂起 / adbd 半死 / 系统选择器被抑制，任一 await 都可能永不 settle。
   每个阶段都包上「超时 + 可取消」，保证 state.connecting 一定能复位。 */
let connectAbort=null;
function beginConnect(){
  let rej; const p=new Promise((_,r)=>{ rej=r; });
  connectAbort={promise:p,reject:rej};
}
function cancelConnect(){
  const a=connectAbort; connectAbort=null;
  if(a) a.reject(new Error('CANCELLED'));
}
/* optional=true：系统设备选择器由用户操作，不设超时，但可被取消 */
function stage(promise, ms, label, optional){
  const parts=[Promise.resolve(promise)];
  if(connectAbort) parts.push(connectAbort.promise);
  let timer=null;
  // 系统选择器由用户操作，给 60 秒兜底；否则弹窗被静默抑制时会永久停在「连接中」
  const limit=optional?60000:ms;
  if(limit>0) parts.push(new Promise((_,rej)=>{ timer=setTimeout(()=>rej(new Error(label)),limit); }));
  return Promise.race(parts).finally(()=>{ if(timer!=null) clearTimeout(timer); });
}
async function connectReal(preferPaired, targetSerial){
  if(state.connecting) throw new Error('正在连接中，请稍候');
  if(!navigator.usb) throw new Error('当前浏览器或页面环境不支持 WebUSB。请使用 Chrome / Edge，并通过 HTTPS 或 localhost 打开本页。');
  state.connecting=true; setConnecting(true); beginConnect();
  let dev=null, connection=null;
  try{
    setStage('加载 ADB 组件','加载组件…');
    toast(preferPaired?'正在重连已授权设备（不会弹出系统选择器）…':'正在连接真机，请在系统弹窗中选择设备…','');
    const libs=await stage(loadLibs(),15000,'ADB 组件加载超时，请刷新页面重试');
    const Manager=libs.b.AdbDaemonWebUsbDeviceManager.BROWSER;
    if(!Manager) throw new Error('WebUSB 不可用（需要安全上下文：HTTPS 或 localhost）');
    state.manager=Manager;
    // 已有授权设备时直接复用，避免重复弹出系统选择器、减少 USB 句柄累积
    if(preferPaired){
      setStage('枚举已授权设备','查找设备…');
      const list=await stage(Manager.getDevices(),8000,'枚举已授权设备超时');
      if(list.length) dev=(targetSerial && list.find(d=>d.serial===targetSerial)) || list[0];
    }
    if(!dev){
      // 库内部已默认按 ADB 接口过滤 (class 0xff / sub 0x42 / proto 1)，无需额外 filters
      setStage('等待选择设备（系统弹窗）','等待系统弹窗…');
      let slowTip=null;
      try{
        slowTip=setTimeout(()=>{ if(state.connecting) toast('还没弹出系统选择器？检查手机 USB 调试已开启、且本站点 USB 权限未被禁用','warn'); },15000);
        dev=await stage(Manager.requestDevice(),0,'等待设备选择超时：若没弹出系统弹窗，多为电脑端 adb 占用或站点 USB 权限被禁用',true);
      }finally{ if(slowTip!=null) clearTimeout(slowTip); }
      if(!dev) throw new Error('CANCELLED');
    }
    // 先释放本页可能残留的句柄
    if(state.realDevice) await releaseUsb(state.realDevice);
    setStage('打开 USB 接口','打开接口…');
    try{ connection=await stage(dev.connect(),20000,'打开 USB 接口超时（20 秒）'); }
    catch(e){
      if(!isBusyError(e)) throw e;
      // 自动清理浏览器内所有残留 USB 句柄后重试一次
      await releaseAllUsb();
      await releaseUsb(dev);
      connection=await stage(dev.connect(),20000,'打开 USB 接口超时（20 秒）');
    }
    setStage('ADB 授权握手','ADB 授权…');
    const Store=libs.c.AdbWebCredentialStore||libs.c.default;
    if(typeof Store!=='function') throw new Error('ADB 凭证组件加载失败，请检查网络后重试');
    const store=new Store('GeekToolboxWeb');
    // 杀掉电脑端 adb 后，手机端常需重新确认「允许 USB 调试」；握手可能长时间等待，故设 30 秒上限
    const transport=await stage(libs.a.AdbDaemonTransport.authenticate({serial:dev.serial,connection,credentialStore:store}),
      30000,'ADB 授权握手超时：请解锁手机并点「允许 USB 调试」，或撤销授权后重插数据线');
    state.adb=new libs.a.Adb(transport);
    state.realDevice=dev; state.mode='real';
    const devName=(typeof dev.name==='string'&&dev.name)||((dev.raw||{}).productName)||dev.serial||'Android 设备';
    state.device=freshDevice({name:devName,serial:dev.serial||'unknown'});
    state.lastError=null; state.appsAutoLoaded=false; state.apps=[]; state.appFilter='';
    state.devices=[{id:dev.serial||'adb',label:devName+' · '+(dev.serial||'adb')}];
    setStage('读取设备信息','读取信息…');
    // 读取设备信息失败不应判定为连接失败，否则残留接口会导致下次连接报「被占用」
    try{ await stage(loadRealInfo(),8000,'读取设备信息超时'); }catch(e){ console.warn('设备信息读取部分失败',e); }
    setStage('已连接','已连接');
    toast('真机已连接，设备信息已读取','ok');
  }catch(e){
    state.lastError={name:(e&&e.name)||'Error',message:(e&&e.message)||String(e),cause:e&&e.cause,stage:state.connectStage};
    // 任何失败都释放刚打开的 USB 接口，避免污染后续连接
    await releaseUsb(dev);
    // 超时往往伴随浏览器侧残留句柄，额外清一遍（会断开其它标签页的连接）
    if(/超时/.test(String((e&&e.message)||''))){ try{ await releaseAllUsb(); }catch(_){} }
    if(state.adb){ try{ await state.adb.close(); }catch(_){} }
    state.adb=null; state.realDevice=null; state.mode='none'; state.devices=[];
    throw e;
  }finally{
    state.connecting=false; setConnecting(false); connectAbort=null;
  }
}

async function attemptConnect(preferPaired, targetSerial){
  try{
    await connectReal(preferPaired, targetSerial);
    renderHome(); showPage('home');
  }catch(e){
    const msg=String((e&&e.message)||e||'');
    if(msg==='CANCELLED'){ toast('已取消连接，可重新点击「连接设备」重试',''); return; }
    if(isBusyError(e)){
      const i=await dialog('设备被占用，无法连接',busyHelp(),
        [{label:'释放接口并重试',primary:true},{label:'运行连接诊断'},{label:'关闭'}]);
      if(i===0){ await releaseAllUsb(); await attemptConnect(true, targetSerial); return; }
      if(i===1){ await showDiagnostics(); }
      return;
    }
    let hint;
    if(/ADB 组件加载超时|凭证组件|WebUSB|安全上下文|HTTPS|localhost|不支持/.test(msg))
      hint='<br>请刷新页面重试；确认使用 Chrome / Edge 并通过 HTTPS 打开。';
    else if(/ADB 授权握手超时/.test(msg))

    else if(/超时/.test(msg))
      hint='<br>已释放浏览器占用的 USB 接口，请重插数据线后重试。';
    else
      hint='<br>可重插数据线后重试，或运行连接诊断。';
    toast('真机连接失败：'+esc(msg)+hint,'warn');
  }
}

/* 闪存类型识别：先看 UFS / eMMC 关键字（含型号串里的版本号），
   再看块设备命名——UFS 在多数平台以 SCSI 盘 sda 暴露，eMMC 固定为 mmcblk0。 */
function detectFlash(raw){
  const t=String(raw||'').toLowerCase();
  if(!t.trim()) return '未知';
  const ver=(t.match(/ufs[\s_-]*([0-9]\.[0-9])/)||[])[1];
  if(/ufshc|\bufs/.test(t)) return 'UFS'+(ver?' '+ver:'');
  if(/mmcblk0|emmc/.test(t)) return 'eMMC';
  if(/(^|[^a-z0-9])sd[a-z]\d?\b/.test(t)) return 'UFS';
  return '未知';
}
async function loadRealInfo(){
  const d=state.device;
  const g=async(k,def)=>{ try{ return (await realShell('getprop '+k)).trim()||def; }catch(e){ return def; } };
  const s=async(cmd,def)=>{ try{ return (await realShell(cmd)).trim()||def; }catch(e){ return def; } };
  // 分三组串行下发，避免一次 14 条并发在慢设备 / 慢 USB 上堆积超时
  const [brand,model,dev,rel,sdk,board,abi,fp]=await Promise.all([
    g('ro.product.brand','—'),g('ro.product.model','—'),g('ro.product.device','—'),
    g('ro.build.version.release','—'),g('ro.build.version.sdk','—'),g('ro.product.board','—'),
    g('ro.product.cpu.abi','—'),g('ro.build.fingerprint','—')
  ]);
  // 闪存类型单次探测：/dev/block 与 /sys/block 的块设备命名最可靠，
  // ro.boot.bootdevice 在多数 ColorOS / HyperOS 机型为空或只给 ufshc 路径，仅作兜底
  const flashCmd='ls /dev/block 2>/dev/null; echo "|"; grep " /data " /proc/mounts 2>/dev/null | head -1; echo "|";'
    +' getprop ro.boot.bootdevice; echo "|"; ls /sys/block 2>/dev/null; echo "|";'
    +' cat /sys/block/sda/device/model 2>/dev/null; echo "|"; cat /sys/block/mmcblk0/device/name 2>/dev/null';
  const [kernel,flashProbe,wmsize,wmdens,batt]=await Promise.all([
    s('uname -r','—'),s(flashCmd,''),s('wm size',''),s('wm density',''),s('dumpsys battery','')
  ]);
  const [upt,cpus]=await Promise.all([s('cat /proc/uptime','0'),readRealCpu()]);
  Object.assign(d,{
    brand,model,device:dev,android:'Android '+rel+' (API '+sdk+')',board,
    cpuArch:abi,build:fp,kernel,flash:detectFlash(flashProbe),
    display:((wmsize.match(/(\d+)x(\d+)/)||[]).slice(1).join('×')||'—')+' ('+((wmdens.match(/(\d+)/)||[])[1]||'—')+' dpi)',
    sysArch:'aarch64',uptime:uptimeFromProc(upt)
  });
  let level=+((batt.match(/level:\s*(\d+)/)||[])[1]||0);
  let volt=+((batt.match(/voltage:\s*(\d+)/)||[])[1]||0);
  let temp=+((batt.match(/temperature:\s*(\d+)/)||[])[1]||0);
  let stat=+((batt.match(/status:\s*(\d+)/)||[])[1]||0);
  d.battery={level,voltage:(volt/1000).toFixed(3)+' V',temp:(temp/10).toFixed(1)+'°C',
    health:'良好',status:stat===2?'充电中':'未充电',plugged:stat===2?'USB / 充电器':'电池'};
  state.cpu=cpus;
}
function uptimeFromProc(p){
  const sec=Math.floor(parseFloat(p.split(' ')[0])||0);
  return Math.floor(sec/86400)+'天'+Math.floor(sec%86400/3600)+'时'+Math.floor(sec%3600/60)+'分';
}
async function readRealCpu(){
  try{
    const out=await realShell('for i in 0 1 2 3 4 5 6 7; do cat /sys/devices/system/cpu/cpu$i/cpufreq/scaling_cur_freq 2>/dev/null || echo 0; done');
    const nums=out.split('\n').map(x=>parseInt(x.trim(),10)).filter(x=>!isNaN(x));
    if(nums.length>=8) return nums.slice(0,8).map(x=>Math.round(x/1000));
  }catch(e){}
  return EMPTY_CPU.slice();
}

    if(state.cpu[i]!=null) el.textContent=(state.mode==='none'?'—':state.cpu[i]+' MHz');
  });
}
function startPolling(){
  clearInterval(pollTimer); pollTimer=null;
  if(String(settings.refresh)==='0') return;           // 「关闭」真的停表
  const ms=(parseInt(settings.refresh,10)||2)*1000;
  pollTimer=setInterval(async()=>{
    if(polling) return;                                 // 慢设备不堆积 ADB 请求
    if(state.mode!=='real' || !state.adb) return;
    polling=true;
    try{
      state.cpu=await readRealCpu();
      const b=await realShell('dumpsys battery').catch(()=> '');
      if(b){
        const m=b.match(/level:\s*(\d+)/);
        if(m){
          if(!state.device.battery) state.device.battery=Object.assign({},EMPTY_DEVICE.battery);
          state.device.battery.level=+m[1];
        }
      }
      if(state.active==='home') updateHomeLive();
      else if(state.active==='battery' && !BAT.stats.running) await batRefresh(true);
      else if(state.active==='tuner') updateTunerCpu();
    }catch(e){ /* 单次采样失败静默跳过，不影响下一轮 */ }
    finally{ polling=false; }
  },ms);
}

const PKG_SKIP = new Set(['com','org','net','cn','io','me','tv','app','xyz','edu','gov','android','google','mobile']);
/* 未识别的包名不再整串展示，转成可读简称；完整包名仍在副行保留 */
function prettyPkg(pkg){
  const parts=String(pkg||'').split('.').filter(Boolean);
  let w=parts.filter(p=>!PKG_SKIP.has(p.toLowerCase()));
  if(!w.length) w=parts.slice(-1);
  const t=w.slice(-2).join(' ')
    .replace(/([a-z0-9])([A-Z])/g,'$1 $2')
    .replace(/[_-]+/g,' ').trim().split(/\s+/).filter(Boolean).slice(0,3)
    .map(x=>x.charAt(0).toUpperCase()+x.slice(1)).join(' ');
  return t || String(pkg);
}
function appDisplayName(pkg, rawLabel){
  const l=String(rawLabel||'').trim().replace(/^['"]|['"]$/g,'');
  if(l && l!=='null' && l!=='0x0' && l!=='0') return {name:l, exact:true};  // 设备明文 label
  if(KNOWN_APP_NAMES[pkg]) return {name:KNOWN_APP_NAMES[pkg], exact:true};   // 精确包名库
  const seg=String(pkg).split('.').pop().toLowerCase();
  if(SEGMENT_NAMES[seg]) return {name:SEGMENT_NAMES[seg], exact:true};       // 末段语义
  return {name:prettyPkg(pkg), exact:false};                                  // 包名简称
}

function appCounts(){
  const sys=state.apps.filter(a=>a.sys).length;
  return {all:state.apps.length, third:state.apps.length-sys, sys, off:state.apps.filter(a=>a.state==='off').length};

/* 搜索与类型筛选都只切行的 display，不重渲染，避免输入框失焦、按钮进度丢失 */
function filterAppRows(){
  const q=state.appFilter, kind=state.appKind;
  let shown=0;
  $$('#page-apps tbody tr[data-search]').forEach(r=>{
    const raw=r.dataset.full?decodeURIComponent(r.dataset.full):r.dataset.search;
    const okQ=!q||raw.indexOf(q)>=0;
    const okK=kind==='all'||(kind==='sys'?r.dataset.kind==='sys':r.dataset.kind!=='sys');
    const ok=okQ&&okK;
    r.style.display=ok?'':'none';
    if(ok) shown++;
  });
  const empty=$('#noMatch'); if(empty) empty.style.display=shown?'none':'';
  const card=$('#page-apps .table-card'); if(card) card.classList.toggle('empty',!shown);
  const cnt=$('#appShown'); if(cnt) cnt.textContent=shown;
  return shown;
}
/* 搜索框清空按钮 —— 与 SQLite 侧边栏一致：有内容显示、空隐藏、Esc 清空、点击清空并聚焦。
   按钮为 position:fixed 浮层（不参与布局），位置由 placeAllSearchClears() 按输入框实时定位。*/
function placeAllSearchClears(){
  document.querySelectorAll('.search-clear:not([hidden])').forEach(btn => {
    const input = btn.previousElementSibling;
    if (!input || typeof input.getBoundingClientRect !== 'function') return;
    const r = input.getBoundingClientRect();
    if (!r.width && !r.height) return;
    btn.style.left = (r.right - 26) + 'px';
    btn.style.top  = (r.top + (r.height - 18) / 2) + 'px';
  });
  // 有内容时隐藏放大镜图标，避免与清空按钮重合；空内容时恢复
  document.querySelectorAll('[data-search-icon]').forEach(icon => {
    const input = icon.parentElement && icon.parentElement.querySelector('input');
    if (input) icon.style.display = input.value.length ? 'none' : '';
  });
}
function bindSearchClear(input, btn){
  if(!input||!btn) return;
  const sync=()=>{ btn.hidden = input.value.length === 0; placeAllSearchClears(); };
  sync();
  input.addEventListener('input', sync);
  input.addEventListener('focus', placeAllSearchClears);
  input.addEventListener('keydown', e=>{
    if(e.key==='Escape' && input.value){
      input.value='';
      input.dispatchEvent(new Event('input',{bubbles:true}));
      input.blur();
    }
  });
  btn.addEventListener('click', ()=>{
    input.value='';
    input.dispatchEvent(new Event('input',{bubbles:true}));
    input.focus();
  });
}

async function appRefresh(auto){
  if(state.mode!=='real'){ if(!auto){ toast('请先连接真机后再刷新应用列表','warn'); renderApps(); } return; }
  if(!auto) toast('正在读取应用列表…','');
  // 单条命令失败不影响其它数据；版本从一次全量 package dump 里解析，失败则降级为 —
  const safe=async c=>{ try{ return String(await shell(c)||''); }catch(e){ return ''; } };
  const [outAll,outS,out3,outD,dump]=await Promise.all([
    safe('pm list packages'), safe('pm list packages -s'), safe('pm list packages -3'),
    safe('pm list packages -d'),
    safe('dumpsys package | grep -E "Package \[|versionName=|nonLocalizedLabel=|application-label|codePath="')
  ]);
  const parse=t=>t.split('\n').map(x=>x.replace(/^package:/,'').trim()).filter(Boolean);
  let allPkgs=Array.from(new Set(parse(outAll)));   // 个别 ROM 会重复输出同一包名
  const thirdSet=new Set(parse(out3));
  const sysSet=new Set(parse(outS));
  if(!allPkgs.length) allPkgs=Array.from(new Set([].concat(parse(out3),parse(outS))));
  const disabled=new Set(parse(outD));
  const verMap={}, labelMap={}, pathMap={};
  try{
    const chunks=dump.split(/^\s*Package \[/m);
    for(let i=1;i<chunks.length;i++){
      const pkg=chunks[i].slice(0,chunks[i].indexOf(']')).trim();
      const m=chunks[i].match(/versionName=([^\s]+)/);
      const l=chunks[i].match(/nonLocalizedLabel=(.*)/);
      const a=chunks[i].match(/application-label(?:-[\w-]+)?[:=]\s*['"]?([^'"\r\n]+)/);
      const cp=chunks[i].match(/codePath=([^\s]+)/);
      let lab=l?l[1]:'';
      if(!lab && a) lab=a[1];
      lab=String(lab||'').trim().replace(/^['"]|['"]$/g,'');
      if(pkg && m) verMap[pkg]=m[1];
      if(pkg && cp) pathMap[pkg]=cp[1];
      if(pkg && lab && lab!=='null' && lab!=='0x0' && lab!=='0') labelMap[pkg]=lab;
    }
  }catch(_){}
  // 系统应用判定：优先 pm list packages -s；部分 ROM 不支持 -s 时回退看安装路径
  const isSys=p=>sysSet.size?sysSet.has(p):(!thirdSet.has(p)&&/^\/(system|system_ext|product|vendor|odm|apex|vendor_dlkm)\//.test(pathMap[p]||''));
  const olds={}; state.apps.forEach(a=>olds[a.pkg]=a);
  state.apps=allPkgs.map(p=>{
    const d=appDisplayName(p,labelMap[p]);
    return {name:d.name, guess:!d.exact, pkg:p,
      ver:verMap[p]||(olds[p]&&olds[p].ver)||'—', sys:isSys(p),
      state:disabled.has(p)?'off':'on'};
  }).sort((a,b)=>(a.sys?1:0)-(b.sys?1:0)||a.name.localeCompare(b.name,'zh-Hans-CN'));
  const n=appCounts();
  toast((auto?'已自动刷新 ':'已读取 ')+n.all+' 个应用（第三方 '+n.third+' · 系统 '+n.sys+'）','ok');
  renderApps();
}

/* ---------------- 导出安装包 ---------------- */
/* 只读设备上现成的 APK：pm path 拿到 base.apk 与各 split，再走 adb sync 读回。
   单包直接下载 .apk；有拆分包的打包成 .apks（其实就是 zip，SAI 可直接安装）。 */
const ZIP_CRC=(()=>{const t=new Uint32Array(256);for(let i=0;i<256;i++){let c=i;for(let k=0;k<8;k++)c=(c&1)?(0xEDB88320^(c>>>1)):(c>>>1);t[i]=c>>>0;}return t;})();
function zipCrc(crc,u8){
  let c=crc;
  for(let i=0;i<u8.length;i++) c=ZIP_CRC[(c^u8[i])&0xFF]^(c>>>8);
  return c>>>0;
}
/* store 模式（method=0）：APK 本身已压缩，再 deflate 既慢又几乎不减小 */
function zipStore(files){
  const enc=new TextEncoder();
  const d=new Date();
  const tm=((d.getHours()<<11)|(d.getMinutes()<<5)|(d.getSeconds()>>1))&0xFFFF;
  const dt=(((d.getFullYear()-1980)<<9)|((d.getMonth()+1)<<5)|d.getDate())&0xFFFF;
  const parts=[], dirs=[]; let off=0;
  for(const f of files){
    const nm=enc.encode(f.name);
    const lh=new Uint8Array(30+nm.length), lv=new DataView(lh.buffer);
    lv.setUint32(0,0x04034b50,true); lv.setUint16(4,20,true); lv.setUint16(6,0x0800,true);
    lv.setUint16(8,0,true); lv.setUint16(10,tm,true); lv.setUint16(12,dt,true);
    lv.setUint32(14,f.crc,true); lv.setUint32(18,f.size,true); lv.setUint32(22,f.size,true);
    lv.setUint16(26,nm.length,true); lv.setUint16(28,0,true);
    lh.set(nm,30);
    parts.push(lh,f.blob);
    const ch=new Uint8Array(46+nm.length), cv=new DataView(ch.buffer);
    cv.setUint32(0,0x02014b50,true); cv.setUint16(4,20,true); cv.setUint16(6,20,true);
    cv.setUint16(8,0x0800,true); cv.setUint16(10,0,true); cv.setUint16(12,tm,true); cv.setUint16(14,dt,true);
    cv.setUint32(16,f.crc,true); cv.setUint32(20,f.size,true); cv.setUint32(24,f.size,true);
    cv.setUint16(28,nm.length,true); cv.setUint32(42,off,true);
    ch.set(nm,46);
    dirs.push(ch);
    off+=lh.length+f.size;
  }
  const cdSize=dirs.reduce((n,x)=>n+x.length,0);
  const eo=new Uint8Array(22), ev=new DataView(eo.buffer);
  ev.setUint32(0,0x06054b50,true);
  ev.setUint16(8,files.length,true); ev.setUint16(10,files.length,true);
  ev.setUint32(12,cdSize,true); ev.setUint32(16,off,true);
  return new Blob([...parts,...dirs,eo],{type:'application/zip'});
}
function appExportName(pkg,ver,ext){
  const base=String(pkg||'app').replace(/[^\w.\-]+/g,'_');
  const v=(ver&&ver!=='—')?('-'+String(ver).replace(/[^\w.\-]+/g,'_')):'';
  return base+v+ext;
}
async function appExport(pkg,btn){
  if(state.mode!=='real'||!state.adb){ toast('请先连接真机后再导出安装包','warn'); return; }
  if(state.exporting){ toast('正在导出'+(state.exporting===pkg?'该应用':'另一个应用')+'，请等它完成','warn'); return; }
  state.exporting=pkg;
  const label=btn?btn.textContent:'导出';
  const labelTitle=btn?btn.title:'';
  const setBtn=t=>{ if(btn) btn.textContent=t; };
  let sync=null;
  try{
    setBtn('查询…');
    const out=String(await shell('pm path '+pkg)||'');
    let paths=[...out.matchAll(/package:(\S+)/g)].map(m=>m[1]);
    if(!paths.length){ toast('未找到安装包：该应用可能已卸载，或系统不提供可读的 APK','warn'); return; }
    /* base.apk 排第一：SAI 靠它识别主包 */
    paths=paths.sort((a,b)=>(/(^|\/)base\.apk$/.test(b)?1:0)-(/(^|\/)base\.apk$/.test(a)?1:0));
    sync=await state.adb.sync();
    const files=[]; let total=0, lastPaint=0;
    for(let i=0;i<paths.length;i++){
      const path=paths[i];
      const name=path.split('/').pop()||('part'+i+'.apk');
      let crc=0xFFFFFFFF, size=0;
      const chunks=[];
      setBtn(paths.length>1?('读取 '+(i+1)+'/'+paths.length):'读取中…');
      /* sync.read() 返回 ReadableStream（也可被当作异步可迭代），for await 两种形态都吃得下 */
      for await (const v of sync.read(path)){
        if(!v||!v.length) continue;
        total+=v.length;
        if(total>800*1048576) throw new Error('安装包超过 800 MB，网页内导出会占满内存，建议改用 adb pull');
        chunks.push(v); crc=zipCrc(crc,v); size+=v.length;
        if(Date.now()-lastPaint>200){
          lastPaint=Date.now();
          /* 进度写 title 而不是按钮文案：文案每 120ms 变一次会让整行按钮左右乱跳 */
          if(btn) btn.title='已读取 '+(total/1048576).toFixed(1)+' MB';
          await new Promise(r2=>setTimeout(r2,0));   // 让出一帧，避免大包把页面卡死
        }
      }
      if(!size) throw new Error(name+' 读到的内容为空（可能没有读取权限）');
      files.push({name:name,size:size,crc:(crc^0xFFFFFFFF)>>>0,blob:new Blob(chunks)});
    }
    const ver=(state.apps.find(a=>a.pkg===pkg)||{}).ver||'';
    const split=files.length>1;
    const blob=split?zipStore(files):files[0].blob;
    const fname=appExportName(pkg,ver,split?'.apks':'.apk');
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');
    a.href=url; a.download=fname;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>{ try{ URL.revokeObjectURL(url); }catch(_){} },120000);
    toast('已导出 '+esc(fname)+'（'+(total/1048576).toFixed(1)+' MB'+(split?'，含 '+files.length+' 个拆分包':'')+'）','ok');
  }catch(e){
    const msg=String((e&&e.message)||e);
    const hint=/permission|denied|EACCES/i.test(msg)?'（该机型限制读取 /data/app，需 root 或用系统自带的备份功能）':'';
    toast('导出失败：'+esc(msg)+hint,'err');
  }finally{
    state.exporting=null;
    if(btn){ btn.textContent=label; btn.title=labelTitle; btn.disabled=false; }
    if(sync){ try{ await sync.dispose(); }catch(_){} }
  }
}

/* ---------------- 页面：投屏 ---------------- */
/* 单引擎：设备端 screenrecord --output-format=h264 输出 Annex-B 码流，
   浏览器 WebCodecs 硬解后直接画到 canvas。控制统一走 input tap / swipe /
   keyevent / text，零外部依赖、不推送任何 server 二进制。
   解码队列积压时主动丢弃非关键帧，保证「当前画面」而不是「排队的历史画面」。 */
/* 起始码：00 00 01 或 00 00 00 01（兼容部分设备在 SPS 前补 0） */
function avcFindSC(b,from){
  for(let i=from;i+2<b.length;i++){
    if(b[i]===0&&b[i+1]===0){
      if(b[i+2]===1) return {at:i,len:3};
      if(b[i+2]===0&&i+3<b.length&&b[i+3]===1) return {at:i,len:4};
    }
  }
  return null;
}
/* H.264 等级表：[level_idc, 最大宏块数, 最大宏块/秒]，按 30fps 估算 */
const AVC_LEVELS=[[9,25344,1485],[10,99,1485],[11,396,3000],[12,396,6000],[13,396,11880],
  [20,396,11880],[21,792,19800],[22,1620,40500],[30,1620,40500],[31,3600,108000],
  [32,5120,216000],[40,8192,245760],[41,8192,245760],[42,8704,522240],
  [50,22080,589824],[51,36864,983040],[52,36864,2073600],[60,139264,4177920],
  [61,139264,8355840],[62,139264,16711680]];
function avcLevelOK(v){ return AVC_LEVELS.some(l=>l[0]===v); }
function avcLevelFor(w,h){
  const mbs=Math.ceil(w/16)*Math.ceil(h/16), mbps=mbs*30;
  for(const l of AVC_LEVELS){ if(l[1]>=mbs&&l[2]>=mbps) return l[0]; }
  return 62;
}
/* SPS 前三个字节决定 codec 字符串（profile / constraints / level）。
   部分设备的编码器会写出非法 level（如 0x0E 即 Level 1.4），Chrome 会直接判为
   「Unsupported configuration」，这里用实际编码尺寸算出的合法等级兜底。 */
function avcCodecStr(sps,w,h){
  if(!sps||sps.length<4) return 'avc1.42E01E';
  let lv=avcLevelOK(sps[3])?sps[3]:0;
  if(w&&h){ const need=avcLevelFor(w,h); if(need>lv) lv=need; }
  if(!lv) lv=31;
  return 'avc1.'+[sps[1],sps[2],lv].map(v=>('0'+v.toString(16)).slice(-2).toUpperCase()).join('');
}
/* 把 SPS/PPS 包成 AVCDecoderConfigurationRecord（WebCodecs 的 description） */
function avcCBox(sps,pps){
  const out=new Uint8Array(11+sps.length+pps.length);
  out[0]=1; out[1]=sps[1]; out[2]=sps[2]; out[3]=sps[3];
  out[4]=0xff;                       // lengthSizeMinusOne = 3（4 字节长度前缀）
  out[5]=0xe1;                       // 1 个 SPS
  out[6]=(sps.length>>8)&255; out[7]=sps.length&255;
  out.set(sps,8);
  let p=8+sps.length;
  out[p]=1; p++;                     // 1 个 PPS
  out[p]=(pps.length>>8)&255; out[p+1]=pps.length&255; p+=2;
  out.set(pps,p);
  return out;
}
/* Annex-B → 以访问单元（一帧）为单位输出，每帧内 NAL 改成 4 字节长度前缀 */
class AvcParser{
  constructor(onAU){ this.onAU=onAU; this.buf=new Uint8Array(0); this.cur=[]; this.hasVcl=false; this.key=false; this.sps=null; this.pps=null; }
  push(chunk){
    if(!chunk||!chunk.length) return;
    const buf=new Uint8Array(this.buf.length+chunk.length);
    buf.set(this.buf,0); buf.set(chunk,this.buf.length);
    const first=avcFindSC(buf,0);
    if(!first){ this.buf=buf.length>3?buf.slice(buf.length-3):buf; return; }
    let start=first.at, len=first.len;
    for(;;){
      const nx=avcFindSC(buf,start+len);
      if(!nx){
        /* 下一个 NAL 的起始码已经出现，说明当前访问单元已经完整；
           立即交付而不是等下一帧的全部字节到齐，少一帧（约 33ms）延迟 */
        if(this.hasVcl && start>0) this.flush();
        this.buf=buf.slice(start); return;
      }
      const nal=buf.subarray(start+len,nx.at);
      if(nal.length) this.nalOf(nal);
      start=nx.at; len=nx.len;
    }
  }
  nalOf(nal){
    const t=nal[0]&31;
    if(t===7||t===8){
      if(this.hasVcl) this.flush();          // 新参数集前先把上一帧交付
      if(t===7) this.sps=nal; else this.pps=nal;
      this.cur.push(nal); return;
    }
    if(t===1||t===5){
      if(this.hasVcl) this.flush();          // 遇到新的 VCL NAL = 上一帧结束
      this.cur.push(nal); this.hasVcl=true; if(t===5) this.key=true; return;
    }
    this.cur.push(nal);
  }
  flush(){
    const nals=this.cur, key=this.key, has=this.hasVcl;
    this.cur=[]; this.hasVcl=false; this.key=false;
    if(!has||!nals.length||!this.sps||!this.pps) return;
    let size=0; for(const n of nals) size+=4+n.length;
    const out=new Uint8Array(size); let o=0;
    for(const n of nals){
      const l=n.length;
      out[o]=(l>>>24)&255; out[o+1]=(l>>>16)&255; out[o+2]=(l>>>8)&255; out[o+3]=l&255;
      out.set(n,o+4); o+=4+l;
    }
    this.onAU({data:out,key:key,sps:this.sps,pps:this.pps});
  }
}
function joinBytes(a,b){
  const out=new Uint8Array(a.length+b.length);

}
function hasStartCode(u8){
  const n=Math.min(u8.length-3,64);
  for(let i=0;i<n;i++) if(u8[i]===0&&u8[i+1]===0&&u8[i+2]===0&&u8[i+3]===1) return true;
  return false;
}
function textOf(u8){
  try{
    const s=new TextDecoder('utf-8',{fatal:false}).decode(u8.slice(0,300)).trim();
    return /^[\x09\x0a\x0d\x20-\x7e]+$/.test(s)?s:'';

}
function shText(cmd,ms){
  const svc=state.adb&&state.adb.subprocess, runner=(svc&&svc.noneProtocol)||svc;
  if(!runner) return Promise.reject(new Error('设备未连接'));
  if(typeof runner.spawnWaitText==='function') return withTimeout(runner.spawnWaitText(cmd),ms||6000,'命令超时');
  return runner.spawn(cmd).then(async p=>{

  });

/* 编码尺寸：短边跟画质走，保持设备原始宽高比，宽高取偶数 */
async function mirrorEncSize(){
  const m=state.mirror;
  let W=m.devW||0, H=m.devH||0;
  if(!W||!H){
    try{
      const t=await shText('wm size',5000);
      const a=/Override size:\s*(\d+)x(\d+)/.exec(t)||/Physical size:\s*(\d+)x(\d+)/.exec(t);
      if(a){ W=+a[1]; H=+a[2]; m.devW=W; m.devH=H; }
    }catch(_){}
  }
  if(!W||!H){ W=1080; H=1920; }
  const want=parseInt(settings.mirrorQuality,10)||720;
  const short=Math.min(W,H), long=Math.max(W,H);
  /* H.264 编码器要求宽高为 16 的倍数，向下取整避免超过屏幕分辨率 */
  const snap=v=>Math.max(16,Math.floor(v/16)*16);
  if(want>=short) return {w:snap(W),h:snap(H)};         // 选「原始」时不放大
  const k=want/short;
  const sw=snap(short*k), lw=snap(long*k);
  return W<=H ? {w:sw,h:lw} : {w:lw,h:sw};
}

  const parser=new AvcParser(au=>{
    if(st.closed) return;
    st.aus++; st.lastAt=Date.now();
    /* 解码器要用 SPS/PPS 建 avcC，解析器每帧都带上，随流更新 */
    if(au.sps&&au.pps){ st.sps=au.sps; st.pps=au.pps; }
    mirrorStreamDecode(st,au);
  });
  /* screenrecord 提前退出时把退出码留作诊断信息 */
  try{ Promise.resolve(proc.exited).then(c=>{ st.exitCode=c; }).catch(()=>{}); }catch(_){}
  st.reader=out.getReader();
  (async()=>{
    try{
      for(;;){
        const r=await st.reader.read();
        if(r.done||st.closed) break;
        if(!r.value||!r.value.length) continue;
        if(!st.bytes){
          /* 首包可能被拆开，先攒一小段再判断是不是 Annex-B */
          st.head=st.head?joinBytes(st.head,r.value):r.value.slice();
          if(!hasStartCode(st.head)){
            const txt=textOf(st.head);
            if(txt.length>=4){ st.err=txt; break; }   // screenrecord 的错误提示
            if(st.head.length<96) continue;
            st.err='设备未返回 H.264 视频流';
            break;
          }
        }
        st.bytes+=r.value.length;
        parser.push(r.value);
      }
    }catch(e){ if(!st.closed) st.err=String((e&&e.message)||e); }
    finally{ if(!st.closed && st.w && m.running && m.stream===st) mirrorStreamRestart(); }
  })();
  const t0=Date.now();
  while(Date.now()-t0<6500){
    if(st.closed) throw new Error(st.err||'视频流已关闭');
    if(st.w) return st;
    if(st.err){
      const e=st.err;
      try{ await mirrorStreamClose(); }catch(_){}
      throw new Error(e);
    }
    await new Promise(r=>setTimeout(r,120));
  }
  const extra=st.lastCfgErr?('，'+String(st.lastCfgErr).slice(0,48)):'';
  const msg=st.aus?('视频流出帧但无法解码（'+avcCodecStr(st.sps,st.encW,st.encH)+extra+'）'):('设备未返回视频流（screenrecord 被限制或屏幕未点亮'+(st.exitCode?'，退出码 '+st.exitCode:'')+'）');
  try{ await mirrorStreamClose(); }catch(_){}
  throw new Error(msg);
}
const MIRROR_MODES=[{},{hardwareAcceleration:'prefer-software'}];
function mirrorStreamDecode(st,au){
  if(!st.sps||!st.pps) return;
  const key=avcCodecStr(st.sps,st.encW,st.encH)+'|'+st.sps.length+'-'+st.pps.length;
  if(!st.dec||st.cfgKey!==key){
    if(st.dec){ try{ st.dec.close(); }catch(_){} st.dec=null; }
    const base={ codec:avcCodecStr(st.sps,st.encW,st.encH), description:avcCBox(st.sps,st.pps), optimizeForLatency:true };
    /* 依次尝试：浏览器默认（有硬解会自己用硬解）→ 强制软解。
       实测「prefer-hardware」在某些 Chrome 上是异步失败（configure 不报错、error 回调才报），
       所以不主动指定，失败一次就往后挪一位 */
    let built=false;
    for(let i=st.tryIdx||0;i<MIRROR_MODES.length;i++){
      let d=null;
      try{
        d=new VideoDecoder({
          output:f=>mirrorDrawFrame(f,st),
          error:e=>mirrorDecErr(st,String((e&&e.message)||e))
        });
        d.configure(Object.assign({},base,MIRROR_MODES[i]));
        st.dec=d; st.tryIdx=i; built=true; break;
      }catch(e){
        try{ if(d) d.close(); }catch(_){}
        st.lastCfgErr=String((e&&e.message)||e);
      }
    }
    if(!built){ st.err='解码器初始化失败：'+(st.lastCfgErr||'当前浏览器不支持该视频格式'); return; }
    st.cfgKey=key;
  }
  /* 解码队列积压说明浏览器已经跟不上编码节奏：直接丢非关键帧，
     宁可少几帧也不要让延迟越积越大（这是「越看越卡」的根因） */
  if((st.dec.decodeQueueSize||0)>2 && !au.key){
    st.dropped=(st.dropped||0)+1;
    state.mirror.dropped=st.dropped;
    return;
  }
  try{
    st.ts+=Math.round(1e6/30);
    st.dec.decode(new EncodedVideoChunk({type:au.key?'key':'delta',timestamp:st.ts,data:au.data}));
  }catch(e){
    if(st.dec) st.err='解码失败：'+((e&&e.message)||e);   // 解码器已被 error 回调回收时忽略这次
  }
}
/* 解码器异步报错：换下一种加速配置重试，全部失败才判定投屏失败 */
function mirrorDecErr(st,msg){
  if(st.closed) return;
  try{ if(st.dec) st.dec.close(); }catch(_){}
  st.dec=null; st.cfgKey='';
  st.lastCfgErr=msg;
  st.tryIdx=(st.tryIdx||0)+1;
  if(st.tryIdx>=MIRROR_MODES.length) st.err='解码错误：'+msg;
}
function mirrorDrawFrame(frame,st){
  const w=frame.displayWidth||frame.codedWidth, h=frame.displayHeight||frame.codedHeight;
  const cv=$('#mirrorCanvas');
  if(cv&&w&&h){
    if(!st.ctx) st.ctx=cv.getContext('2d',{alpha:false});
    if(cv.width!==w||cv.height!==h){
      cv.width=w; cv.height=h; st.ctx=st.ctx||cv.getContext('2d',{alpha:false});
      cv.classList.add('on');
      const ph=$('#mirrorPlaceholder'); if(ph) ph.style.display='none';
    }
    try{ st.ctx.drawImage(frame,0,0,w,h); }catch(_){}
  }
  const m=state.mirror;
  if(m.w!==w||m.h!==h){ m.w=w; m.h=h; mirrorFit(); }   // CSS 变量只在尺寸变化时写
  m.frames++; m.err='';
  st.w=w; st.h=h; st.lastAt=Date.now();
  try{ frame.close(); }catch(_){}
}
async function mirrorStreamClose(){
  const m=state.mirror, st=m.stream;
  m.stream=null;
  if(!st) return;
  st.closed=true;
  /* 有 reader 时流已被锁定，只能取消 reader；再取消流会抛 Cannot cancel a locked stream */
  try{
    if(st.reader) Promise.resolve(st.reader.cancel()).catch(()=>{});
    else if(st.out&&typeof st.out.cancel==='function') Promise.resolve(st.out.cancel()).catch(()=>{});
  }catch(_){}
  try{ if(st.dec){ st.dec.close(); st.dec=null; } }catch(_){}
  try{ if(st.proc&&typeof st.proc.kill==='function') st.proc.kill(); }catch(_){}
}
/* screenrecord 单次上限 180 秒，到点静默续流；连续两次起不来才判定失败 */
async function mirrorStreamRestart(){
  const m=state.mirror;
  if(!m.running) return;
  try{ await mirrorStreamClose(); }catch(_){}
  if(!m.running) return;
  for(let i=0;i<2;i++){
    try{
      await mirrorStreamOpen();
      if(!m.running){ await mirrorStreamClose(); return; }
      m.streamErr='';
      return;
    }catch(e){
      m.streamErr=String((e&&e.message)||e);
      if(!m.running) return;
      await new Promise(r=>setTimeout(r,600));
    }
  }
  if(m.running){
    stopMirror();
    toast('投屏已中断：'+(m.streamErr||'设备未返回视频流'),'err');
  }
}

/* 显示区自适应：按「视口剩余高度 + 设备画面比例」算出画面能占的最大尺寸。
   旧实现固定 height:74vh，竖屏长条机（20:9 / 21:9）或窗口较矮时整块画面会超出屏幕，
   现在先量出显示区离页面顶部的距离，把剩余高度全部留给画面，再按比例收紧宽度。 */
function mirrorFit(){
  const st=$('#mirrorStage'); if(!st) return;
  const m=state.mirror, has=m.w>0&&m.h>0;
  const ar=has? m.w/m.h : 9/19.5;
  st.style.setProperty('--ar', has? (m.w+' / '+m.h) : '9 / 19.5');
  if(document.fullscreenElement){       // 全屏由 CSS 接管，内联尺寸必须让位
    st.style.width=''; st.style.height='';
    return;
  }
  const view=st.parentElement;
  if(!view || !view.getClientRects().length) return;   // 页面不在前台（display:none）时不测量
  /* 用 offsetTop 链取文档坐标，而不是 getBoundingClientRect().top：
     后者随页面滚动变化，会让画面在滚动时忽大忽小 */
  let docTop=0;
  for(let el=view; el; el=el.offsetParent) docTop+=el.offsetTop;
  /* visualViewport 更贴近手机地址栏收起/展开后的真实可视高度 */
  const vh=Math.round((window.visualViewport&&window.visualViewport.height)||window.innerHeight||document.documentElement.clientHeight||720);
  const cs=getComputedStyle(view);
  const padX=(parseFloat(cs.paddingLeft)||0)+(parseFloat(cs.paddingRight)||0);
  const padY=(parseFloat(cs.paddingTop)||0)+(parseFloat(cs.paddingBottom)||0);
  const availH=Math.max(240, Math.min(vh-docTop-16, 980));   // 底部留 16px 呼吸
  const availW=Math.max(140, view.clientWidth-padX);
  const hBox=Math.max(140, availH-padY);
  const w=Math.max(120, Math.round(Math.min(availW, hBox*ar)));
  const h=Math.round(w/ar);
  /* 显示区高度 = 画面高度 + 内边距：
     竖屏时正好占满剩余高度；横屏/窄窗口时宽度先到顶，高度随之收紧，不再留一大片黑边。
     同时避免 flex 的 stretch 把显示区拉高、画面居中下移后底部跑出屏幕 */
  const viewH=Math.round(Math.min(availH, h+padY));
  view.style.height=viewH+'px';
  st.style.width=w+'px';
  st.style.height=h+'px';
  /* 宽屏右侧按钮栏与画面等高：矮窗口下按钮栏比画面长，页面会被顶出一条滚动条，
     让它自己内部滚动，整个投屏区仍在一屏内 */
  const layout=view.parentElement;
  const side=layout&&layout.querySelector('.mirror-side');
  if(side){
    if(getComputedStyle(layout).flexDirection!=='column'){
      /* 用「视口剩余高度」而不是画面高度：横屏画面矮，按钮栏不该跟着被切成一小截 */
      side.style.maxHeight=Math.round(availH)+'px';
      side.style.overflowY='auto';
    }else{
      side.style.maxHeight='';
      side.style.overflowY='';
    }
  }
}
