<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <link rel="icon" href="/img/Logo.svg" type="image/svg+xml" sizes="any" />
    <title>实用工具箱 · 高效工坊</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <style>
      /* ----- 变量与重置 ----- */
      :root {
        /* 日间模式 */
        --bg-gradient: linear-gradient(145deg, #f6f9fc 0%, #eef2f7 100%);
        --container-bg: #ffffff;
        --text-color: #1e293b;
        --text-secondary: #475569;
        --text-muted: #94a3b8;
        --primary-color: #3b82f6;
        --primary-hover: #2563eb;
        --border-color: #e2e8f0;
        --card-bg: #ffffff;
        --card-shadow:
          0 8px 20px rgba(0, 0, 0, 0.04), 0 2px 4px rgba(0, 0, 0, 0.02);
        --card-shadow-hover: 0 20px 30px -12px rgba(0, 0, 0, 0.12);
        --header-color: #0f172a;
        --code-bg: #f1f5f9;
        --highlight-bg: #fef9e3;
        --highlight-color: #c2410c;
        --tool-icon-bg: rgba(59, 130, 246, 0.1);
      }

      .dark-mode {
        /* 暗色模式优雅深邃 */
        --bg-gradient: linear-gradient(135deg, #0b1120 0%, #111827 100%);
        --container-bg: #0f172a;
        --text-color: #e2e8f0;
        --text-secondary: #cbd5e1;
        --text-muted: #64748b;
        --primary-color: #60a5fa;
        --primary-hover: #3b82f6;
        --border-color: #1e293b;
        --card-bg: #1e293b;
        --card-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
        --card-shadow-hover: 0 20px 30px -12px rgba(0, 0, 0, 0.5);
        --header-color: #f1f5f9;
        --code-bg: #0f172a;
        --highlight-bg: #2d2a1c;
        --highlight-color: #facc15;
        --tool-icon-bg: rgba(96, 165, 250, 0.12);
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
      }

      body {
        background: var(--bg-gradient);
        color: var(--text-color);
        font-family:
          system-ui,
          -apple-system,
          "Segoe UI",
          "PingFang SC",
          "Microsoft YaHei",
          "Roboto",
          sans-serif;
        line-height: 1.5;
        padding: 20px 16px 40px;
        min-height: 100vh;
        transition:
          background 0.25s ease,
          color 0.2s;
      }

      .container {
        max-width: 1280px;
        margin: 0 auto;
        width: 100%;
      }

      /* ----- 头部区域 (flex居中+按钮右侧，无绝对定位) ----- */
      header {
        margin-bottom: 24px;
      }

      .header-content {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
      }

      .header-placeholder {
        width: 48px;
        height: 48px;
        visibility: hidden;
      }

      .header-title {
        flex: 1;
        text-align: center;
      }

      .header-title h1 {
        font-size: 1.9rem;
        font-weight: 700;
        background: linear-gradient(120deg, var(--primary-color), #8b5cf6);
        background-clip: text;
        -webkit-background-clip: text;
        color: transparent;
        letter-spacing: -0.3px;
        margin-bottom: 6px;
      }

      .header-title p {
        color: var(--text-secondary);
        font-size: 0.9rem;
        font-weight: 450;
      }

      .theme-toggle {
        width: 48px;
        height: 48px;
        background: var(--card-bg);
        border-radius: 60px;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        border: 1px solid var(--border-color);
        box-shadow: var(--card-shadow);
        transition: all 0.2s ease;
        flex-shrink: 0;
      }

      .theme-toggle:hover {
        transform: scale(1.02);
        background: var(--primary-color);
        border-color: var(--primary-color);
      }

      .theme-toggle i {
        font-size: 1.4rem;
        color: var(--primary-color);
        transition: color 0.2s;
      }

      .theme-toggle:hover i {
        color: white;
      }

      /* 搜索框 */
      .search-box {
        max-width: 560px;
        margin: 0 auto 16px auto;
        position: relative;
      }

      .search-box input {
        width: 100%;
        padding: 14px 48px 14px 20px;
        background: var(--card-bg);
        border: 1.5px solid var(--border-color);
        border-radius: 56px;
        font-size: 1rem;
        color: var(--text-color);
        outline: none;
        transition: all 0.2s;
        font-weight: 450;
        backdrop-filter: blur(2px);
      }

      .search-box input:focus {
        border-color: var(--primary-color);
        box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2);
      }

      .search-box input::placeholder {
        color: var(--text-muted);
        font-weight: 400;
      }

      .search-box i {
        position: absolute;
        right: 20px;
        top: 50%;
        transform: translateY(-50%);
        color: var(--text-muted);
        font-size: 1.2rem;
        pointer-events: none;
      }

      /* 分类筛选条 */
      .category-bar {
        max-width: 880px;
        margin: 0 auto 32px auto;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 10px;
      }

      .category-chip {
        padding: 8px 18px;
        border-radius: 40px;
        background: var(--card-bg);
        border: 1px solid var(--border-color);
        color: var(--text-secondary);
        font-size: 0.85rem;
        font-weight: 500;
        cursor: pointer;
        transition: all 0.2s ease;
        box-shadow: var(--card-shadow);
        user-select: none;
      }

      .category-chip:hover {
        border-color: var(--primary-color);
        color: var(--primary-color);
      }

      .category-chip.active {
        background: var(--primary-color);
        border-color: var(--primary-color);
        color: #fff;
      }

      /* 工具网格 - 核心响应式一行两个 */
      .tools-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
        gap: 20px;
        margin-bottom: 48px;
      }

      /* 手机端强制两列 (≥360px 保持两列优雅) */
      @media (max-width: 680px) {
        .tools-grid {
          grid-template-columns: repeat(2, 1fr);
          gap: 14px;
        }
      }

      /* 极小设备确保两列不过于拥挤 */
      @media (max-width: 480px) {
        body {
          padding: 16px 12px 32px;
        }
        .tools-grid {
          gap: 12px;
        }
      }

      /* 卡片设计 */
      .tool-card {
        background: var(--card-bg);
        border-radius: 24px;
        padding: 20px 14px 18px;
        text-decoration: none;
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
        border: 1px solid var(--border-color);
        transition: all 0.25s cubic-bezier(0.2, 0, 0, 1);
        box-shadow: var(--card-shadow);
        position: relative;
        backdrop-filter: blur(2px);
        cursor: pointer;
      }

      .tool-card:active {
        transform: scale(0.97);
        transition: transform 0.1s;
      }

      @media (hover: hover) {
        .tool-card:hover {
          transform: translateY(-4px);
          box-shadow: var(--card-shadow-hover);
          border-color: var(--primary-color);
        }
      }

      .tool-card i.tool-icon {
        font-size: 2.5rem;
        margin-bottom: 14px;
        background: var(--tool-icon-bg);
        width: 64px;
        height: 64px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        border-radius: 32px;
        color: var(--primary-color);
        transition: all 0.2s;
      }

      .tool-card:hover i.tool-icon {
        transform: scale(1.05);
        background: rgba(59, 130, 246, 0.2);
      }

      .tool-card h3 {
        font-size: 1.2rem;
        font-weight: 600;
        margin-bottom: 8px;
        color: var(--header-color);
        letter-spacing: -0.2px;
      }

      .tool-card p {
        font-size: 0.85rem;
        color: var(--text-secondary);
        line-height: 1.4;
        max-width: 100%;
      }

      /* 卡片右上角徽标 (可选: badge) */
      .tool-card .card-badge {
        position: absolute;
        top: 12px;
        right: 12px;
        background: #ef4444;
        color: #fff;
        font-size: 0.65rem;
        font-weight: 700;
        letter-spacing: 0.5px;
        padding: 2px 8px;
        border-radius: 20px;
        box-shadow: 0 2px 6px rgba(239, 68, 68, 0.4);
      }

      /* 无结果提示 */
      .no-result {
        grid-column: 1 / -1;
        text-align: center;
        padding: 48px 20px;
        background: var(--card-bg);
        border-radius: 40px;
        color: var(--text-secondary);
        border: 1px dashed var(--border-color);
        font-size: 1rem;
      }

      .no-result i {
        font-size: 3rem;
        margin-bottom: 12px;
        opacity: 0.6;
      }

      /* 使用说明卡片 */
      .instructions {
        background: var(--card-bg);
        border-radius: 28px;
        padding: 24px 28px;
        border: 1px solid var(--border-color);
        box-shadow: var(--card-shadow);
        margin-top: 20px;
      }

      .instructions h2 {
        font-size: 1.4rem;
        margin-bottom: 16px;
        color: var(--header-color);
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .instructions h2 i {
        color: var(--primary-color);
        font-size: 1.3rem;
      }

      .instructions ol {
        padding-left: 1.3rem;
        display: flex;
        flex-direction: column;
        gap: 12px;
      }

      .instructions li {
        color: var(--text-secondary);
        font-size: 0.95rem;
      }

      .code-example {
        background: var(--code-bg);
        border-left: 4px solid var(--primary-color);
        padding: 12px 16px;
        border-radius: 16px;
        font-family: "SF Mono", "Fira Code", monospace;
        font-size: 0.85rem;
        margin-top: 12px;
        overflow-x: auto;
      }

      .highlight {
        background: var(--highlight-bg);
        color: var(--highlight-color);
        padding: 2px 8px;
        border-radius: 20px;
        font-size: 0.8rem;
        font-weight: 500;
      }

      footer {
        margin-top: 32px;
        text-align: center;
        font-size: 0.75rem;
        color: var(--text-muted);
        border-top: 1px solid var(--border-color);
        padding-top: 24px;
      }

      @media (max-width: 500px) {
        .header-title h1 {
          font-size: 1.6rem;
        }
        .tool-card {
          padding: 16px 10px 14px;
        }
        .tool-card i.tool-icon {
          width: 52px;
          height: 52px;
          font-size: 2rem;
          margin-bottom: 10px;
        }
        .tool-card h3 {
          font-size: 1rem;
        }
        .tool-card p {
          font-size: 0.75rem;
        }
        .instructions {
          padding: 20px 18px;
        }
      }

      /* 平滑滚动 */
      html {
        scroll-behavior: smooth;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <header>
        <div class="header-content">
          <div class="header-placeholder" aria-hidden="true"></div>
          <div class="header-title">
            <h1>⚙️ 实用工具箱</h1>
            <p>轻量 · 高效 · 即刻使用</p>
          </div>
          <div
            class="theme-toggle"
            id="themeToggle"
            aria-label="切换深色/浅色模式"
            title="切换主题"
          >
            <i class="fas fa-moon"></i>
          </div>
        </div>
      </header>

      <div class="search-box">
        <input
          type="text"
          id="toolSearch"
          placeholder="搜索工具名称、分类或描述..."
        />
        <i class="fas fa-search"></i>
      </div>

      <!-- 分类筛选条 (由 JS 根据工具列表自动生成) -->
      <div class="category-bar" id="categoryBar"></div>

      <div class="tools-grid" id="toolsGrid"></div>

      <div class="instructions">
        <h2><i class="fas fa-compass"></i> 使用说明</h2>
        <ol>
          <li>🔍 点击任意工具卡片，即刻跳转至对应功能页面。</li>
          <li>✨ 使用上方搜索栏或分类标签快速筛选所需工具。</li>
          <li>🌓 点击右上角图标可切换日间/暗色主题，适配不同环境。</li>
          <li>➕ 新增工具只需在脚本顶部的 <span class="highlight">TOOLS</span> 数组中追加一项。</li>
        </ol>
        <div class="code-example">
          💡 提示：所有工具无需安装，即开即用。<span class="highlight"
            >收藏本页</span
          >
          工作更高效
        </div>
      </div>
      <footer>
        <span>⚡ 让工具回归纯粹 · 随时随地的效率伙伴</span>
      </footer>
    </div>

    <script>
      (function () {
        // ============================================================
        //  工具配置区 —— 后续新增功能卡片只需在此数组追加一项即可
        //  字段说明：
        //    name     工具名称（必填）
        //    icon     Font Awesome 图标类名，如 "fas fa-search"
        //             （品牌图标用 "fab ..."，常规图标用 "fas ..."）
        //    href     点击跳转地址（必填）
        //    category 所属分类（用于自动生成筛选标签，必填）
        //    desc     卡片描述文字（必填）
        //    badge    可选，右上角徽标文字，如 "NEW"
        // ============================================================
        const TOOLS = [
          {
            name: "Type搜索",
            icon: "fas fa-search",
            href: "/TypeSearch",
            category: "搜索工具",
            desc: "智能类型检索 & 快速定位",
          },
          {
            name: "单位换算",
            icon: "fas fa-calculator",
            href: "/Exchange",
            category: "计算工具",
            desc: "百分数 · 小数 · 单位互换",
          },
          {
            name: "Markdown编辑器",
            icon: "fab fa-markdown",
            href: "/Markdown",
            category: "编辑器",
            desc: "即时预览 · 优雅写作",
          },
          {
            name: "WebUSB Imager",
            icon: "fas fa-sd-card",
            href: "/WebUSB",
            category: "系统工具",
            desc: "浏览器内制作USB启动盘",
          },
          {
            name: "Airport Information",
            icon: "fas fa-plane",
            href: "/Airport",
            category: "航班工具",
            desc: "航班节点信息提取",
          },
          {
            name: "Daily Tool",
            icon: "fa-regular fa-clipboard",
            href: "/Daily",
            category: "办公工具",
            desc: "日报生成工具",
            badge: "NEW",
          },
        ];

        // 当前激活的分类筛选（"全部" 表示不筛选）
        let activeCategory = "全部";

        const toolsGrid = document.getElementById("toolsGrid");
        const categoryBar = document.getElementById("categoryBar");
        const searchInput = document.getElementById("toolSearch");

        // -------------------- 渲染卡片 --------------------
        function renderTools() {
          toolsGrid.innerHTML = "";
          TOOLS.forEach((t) => {
            const card = document.createElement("a");
            card.className = "tool-card";
            card.href = t.href;
            card.dataset.name = t.name;
            card.dataset.category = t.category;
            card.dataset.desc = t.desc;

            const badge = t.badge
              ? `<span class="card-badge">${t.badge}</span>`
              : "";
            card.innerHTML = `
              ${badge}
              <i class="tool-icon ${t.icon}"></i>
              <h3>${t.name}</h3>
              <p>${t.desc}</p>
            `;
            toolsGrid.appendChild(card);
          });
        }

        // -------------------- 渲染分类标签 --------------------
        function renderCategories() {
          const cats = ["全部", ...new Set(TOOLS.map((t) => t.category))];
          categoryBar.innerHTML = "";
          cats.forEach((cat) => {
            const chip = document.createElement("button");
            chip.type = "button";
            chip.className =
              "category-chip" + (cat === activeCategory ? " active" : "");
            chip.textContent = cat;
            chip.addEventListener("click", () => {
              activeCategory = cat;
              renderCategories();
              filterTools();
            });
            categoryBar.appendChild(chip);
          });
        }

        // -------------------- 筛选（搜索 + 分类） --------------------
        function filterTools() {
          const term = searchInput.value.trim().toLowerCase();
          const cards = Array.from(toolsGrid.querySelectorAll(".tool-card"));
          let hasVisible = false;

          cards.forEach((card) => {
            const name = (card.dataset.name || "").toLowerCase();
            const category = (card.dataset.category || "").toLowerCase();
            const desc = (card.dataset.desc || "").toLowerCase();

            const matchCategory =
              activeCategory === "全部" ||
              category === activeCategory.toLowerCase();
            const matchSearch =
              term === "" ||
              name.includes(term) ||
              category.includes(term) ||
              desc.includes(term);

            const show = matchCategory && matchSearch;
            card.style.display = show ? "flex" : "none";
            if (show) hasVisible = true;
          });

          // 清理/插入无结果提示
          const existing = toolsGrid.querySelector(".no-result");
          if (existing) existing.remove();
          if (!hasVisible && cards.length > 0) {
            const noResult = document.createElement("div");
            noResult.className = "no-result";
            noResult.innerHTML = `
              <i class="fas fa-tools"></i>
              <p>✨ 没有找到相关工具 ✨</p>
              <small style="opacity:0.7;">试试其他关键词或分类~</small>
            `;
            toolsGrid.appendChild(noResult);
          }
        }

        // -------------------- 主题切换 --------------------
        const themeToggle = document.getElementById("themeToggle");
        const body = document.body;
        const toggleIcon = themeToggle.querySelector("i");

        function setTheme(theme) {
          if (theme === "dark") {
            body.classList.add("dark-mode");
            toggleIcon.className = "fas fa-sun";
            localStorage.setItem("theme", "dark");
          } else {
            body.classList.remove("dark-mode");
            toggleIcon.className = "fas fa-moon";
            localStorage.setItem("theme", "light");
          }
        }

        function initTheme() {
          const saved = localStorage.getItem("theme");
          const prefersDark = window.matchMedia(
            "(prefers-color-scheme: dark)",
          ).matches;
          setTheme(saved === "dark" || (!saved && prefersDark) ? "dark" : "light");
        }

        themeToggle.addEventListener("click", () => {
          setTheme(body.classList.contains("dark-mode") ? "light" : "dark");
        });
        initTheme();

        window
          .matchMedia("(prefers-color-scheme: dark)")
          .addEventListener("change", (e) => {
            if (!localStorage.getItem("theme")) {
              setTheme(e.matches ? "dark" : "light");
            }
          });

        // -------------------- 搜索（防抖） --------------------
        let debounceTimer;
        searchInput.addEventListener("input", () => {
          clearTimeout(debounceTimer);
          debounceTimer = setTimeout(filterTools, 180);
        });

        // -------------------- 初始化 --------------------
        renderTools();
        renderCategories();
        filterTools();

        // 移动端触感优化
        if ("ontouchstart" in window) {
          toolsGrid.addEventListener(
            "touchstart",
            (e) => {
              const card = e.target.closest(".tool-card");
              if (card) card.style.transform = "scale(0.97)";
            },
            { passive: true },
          );
          toolsGrid.addEventListener("touchend", (e) => {
            const card = e.target.closest(".tool-card");
            if (card) card.style.transform = "";
          });
        }
      })();
    </script>
  </body>
</html>
