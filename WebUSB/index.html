<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/svg+xml" href="/img/WebUSB.svg">
<link rel="stylesheet" href="https://cdn.bootcdn.net/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<title>USB启动盘制作工具</title>
<script>
  /* 提前应用主题，避免刷新时闪白（沿用 SQLite 工具的 data-theme 方案，
     同时兼容旧版 localStorage 键名 "theme"） */
  (function () {
    try {
      var saved = localStorage.getItem('webusb-theme') || localStorage.getItem('theme');
      var dark = saved ? saved === 'dark'
        : window.matchMedia('(prefers-color-scheme: dark)').matches;
      document.documentElement.dataset.theme = dark ? 'dark' : 'light';
    } catch (e) {}
  })();
</script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg: #f8fafc;
    --panel: #ffffff;
    --panel-hover: #f1f5f9;
    --border: #e2e8f0;
    --border-hover: #cbd5e1;
    --text: #0f172a;
    --text-secondary: #475569;
    --text-muted: #64748b;

    --primary: #2563eb;
    --primary-hover: #1d4ed8;
    --primary-light: #eff6ff;
    --primary-soft: rgba(37, 99, 235, 0.10);
    --primary-on: #ffffff;

    --success: #059669;
    --success-light: #ecfdf5;
    --danger: #dc2626;
    --danger-light: #fef2f2;
    --warn: #f59e0b;
    --warn-ink: #b45309;
    --warn-light: #fef3c7;

    --scrollbar-thumb: #cbd5e1;
    --scrollbar-thumb-hover: #94a3b8;
    --shadow: 0 1px 3px rgba(0,0,0,0.05), 0 1px 2px rgba(0,0,0,0.03);
    --shadow-lg: 0 10px 15px -3px rgba(0,0,0,0.08), 0 4px 6px -2px rgba(0,0,0,0.04);
    --header-row: #f8fafc;
    --row-hover: #f8fafc;
    --table-row-border: #f1f5f9;
    --code-bg: #f1f5f9;

    --r: 8px;
    --r-sm: 6px;

    /* 兼容旧变量名的别名 */
    --card-bg: var(--panel);
    --card-border: var(--border);
    --text-primary: var(--text);
    --accent: var(--primary);
    --accent-hover: var(--primary-hover);
    --accent-light: var(--primary-light);
    --danger-hover: var(--danger);
    --warning: var(--warn);
    --warning-light: var(--warn-light);
    --shadow-sm: var(--shadow);
    --shadow-md: var(--shadow);
    --radius-sm: 6px;
    --radius: 8px;
    --radius-lg: 10px;
    --radius-xl: 12px;
    --transition: 0.15s ease;
    --font-mono: "SF Mono", Monaco, Consolas, "Courier New", monospace;
    --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    --success-ink: #047857;
    --danger-ink: #b91c1c;
    --danger-on: #ffffff;
    --primary-ink: #1d4ed8;
}

  [data-theme="dark"] {
    --bg: #0b1220;
    --panel: #111827;
    --panel-hover: #1e293b;
    --border: #1f2937;
    --border-hover: #475569;
    --text: #f1f5f9;
    --text-secondary: #cbd5e1;
    --text-muted: #94a3b8;
    --primary: #60a5fa;
    --primary-hover: #93c5fd;
    --primary-light: rgba(96,165,250,0.18);
    --primary-soft: rgba(96,165,250,0.22);
    --primary-on: #0b1220;
    --success: #34d399;
    --success-light: rgba(52,211,153,0.18);
    --danger: #f87171;
    --danger-light: rgba(248,113,113,0.18);
    --warn: #fbbf24;
    --warn-ink: #fbbf24;
    --warn-light: rgba(251,191,36,0.18);
    --scrollbar-thumb: #475569;
    --scrollbar-thumb-hover: #64748b;
    --shadow: 0 1px 3px rgba(0,0,0,0.5);
    --shadow-lg: 0 10px 25px rgba(0,0,0,0.5);
    --header-row: #0f172a;
    --row-hover: #1e293b;
    --table-row-border: #1e293b;
    --code-bg: #0a1224;
    --success-ink: #6ee7b7;
    --danger-ink: #fca5a5;
    --danger-on: #0b1220;
    --primary-ink: #93c5fd;
}

  html { font-size: 16px; -webkit-font-smoothing: antialiased; }

  body {
    font-family: var(--font-sans);
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    transition: background-color 0.15s, color 0.15s;
  }

  /* ===== Header ===== */
  .header {
    height: 52px;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    padding: 0 16px;
    box-shadow: var(--shadow);
    position: sticky;
    top: 0;
    z-index: 20;
    gap: 8px;
  }
  .header-inner {
    width: 100%;
    max-width: 1180px;
    margin: 0 auto;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .logo { display: flex; align-items: center; gap: 10px; font-weight: 600; font-size: 15px; }
  .logo-icon {
    width: 28px; height: 28px;
    background: var(--primary);
    border-radius: 6px;
    display: flex; align-items: center; justify-content: center;
    color: var(--primary-on);
    font-size: 14px;
    flex-shrink: 0;
  }
  .logo span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .logo .subtitle { font-size: 12px; color: var(--text-muted); font-weight: 400; }
  .home-btn {
    width: 30px; height: 30px;
    border-radius: 50%;
    border: none;
    background: var(--panel-hover);
    color: var(--primary);
    cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center;
    flex-shrink: 0;
    transition: background-color 0.15s, transform 0.15s, color 0.15s;
  }
  .home-btn:hover { background: var(--primary); color: #fff; transform: translateY(-1px); }
  .home-btn:active { transform: translateY(0); }
  .header-spacer { flex: 1; }
  .icon-btn {
    width: 32px; height: 32px;
    border-radius: 6px;
    border: 1px solid transparent;
    background: transparent;
    color: var(--text-secondary);
    cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center;
    font-size: 13px;
    transition: all 0.15s;
  }
  .icon-btn:hover { background: var(--panel-hover); color: var(--text); border-color: var(--border); }

  /* ===== Layout ===== */
  .page {
    max-width: 1180px;
    margin: 0 auto;
    padding: 16px;
    padding-bottom: max(32px, env(safe-area-inset-bottom));
  }
  .container {
    width: 100%;
    max-width: 680px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  /* ===== 卡片 / 步骤 ===== */
  .card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: var(--r);
    box-shadow: var(--shadow);
    transition: border-color 0.15s, box-shadow 0.15s;
  }
  .card.highlight { border-color: var(--primary); }
  .card-title {
    padding: 10px 14px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 13.5px;
    font-weight: 600;
    color: var(--text);
  }
  .card-body { padding: 14px; }

  .step-badge {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 22px; height: 22px;
    border-radius: 50%;
    background: var(--primary-soft);
    color: var(--primary);
    font-weight: 700;
    font-size: 12px;
    flex-shrink: 0;
  }
  .step-badge.done { background: var(--success-light); color: var(--success); }

  /* ===== 按钮 ===== */
  .btn {
    height: 32px;
    padding: 0 12px;
    border-radius: var(--r-sm);
    border: 1px solid var(--border);
    background: var(--panel-hover);
    color: var(--text);
    font-size: 13px;
    font-weight: 500;
    font-family: inherit;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    white-space: nowrap;
    transition: all 0.15s;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
  }
  .btn:hover { border-color: var(--border-hover); background: var(--border-hover); }
  .btn i { font-size: 12px; line-height: 1; }
  .btn:active { transform: scale(0.97); }
  .btn-primary { background: var(--primary); border-color: var(--primary); color: var(--primary-on); font-weight: 600; }
  .btn-primary:hover { background: var(--primary-hover); border-color: var(--primary-hover); color: var(--primary-on); }
  .btn-primary:disabled { background: var(--primary); border-color: var(--primary); opacity: 0.45; cursor: not-allowed; }
  .btn-danger { background: var(--danger); border-color: var(--danger); color: var(--danger-on); font-weight: 600; }
  .btn-danger:hover { background: var(--danger); border-color: var(--danger); color: var(--danger-on); filter: brightness(0.94); }
  .btn-danger:disabled { opacity: 0.45; cursor: not-allowed; }
  /* 暗色模式：实心按钮保持饱和底色 + 白字（字色反转），用更深底色保证白字≥4.5:1 */
  [data-theme="dark"] .btn-primary { background: #2563eb; border-color: #2563eb; color: #ffffff; }
  [data-theme="dark"] .btn-primary:hover { background: #1d4ed8; border-color: #1d4ed8; color: #ffffff; }
  [data-theme="dark"] .btn-danger { background: #dc2626; border-color: #dc2626; color: #ffffff; }
  [data-theme="dark"] .btn-danger:hover { background: #b91c1c; border-color: #b91c1c; color: #ffffff; }
  [data-theme="dark"] .btn-danger:disabled { background: #dc2626; border-color: #dc2626; color: #ffffff; }
  .btn-outline { background: var(--primary-light); color: var(--primary-ink); }
  .btn-outline:hover { border-color: var(--primary); color: var(--primary-on); background: var(--primary); }
  .btn-sm { height: 28px; padding: 0 10px; font-size: 12.5px; }
  .btn-group { display: flex; flex-wrap: wrap; gap: 8px; }
  #cardStep3 .btn-group { margin-top: 14px; }

  /* ===== 设备信息 ===== */
  .device-info {
    display: none;
    margin-top: 12px;
    padding: 10px 12px;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: var(--r-sm);
    font-size: 12.5px;
  }
  .device-info.show { display: block; }
  .info-row {
    display: flex;
    justify-content: space-between;
    gap: 12px;
    padding: 5px 0;
    border-bottom: 1px solid var(--table-row-border);
  }
  .info-row:last-child { border-bottom: none; }
  .info-label { color: var(--text-muted); flex-shrink: 0; font-size: 11.5px; text-transform: uppercase; letter-spacing: 0.3px; }
  .info-value {
    color: var(--text);
    font-weight: 500;
    text-align: right;
    word-break: break-all;
    font-family: var(--font-mono);
    font-size: 12px;
  }
  .info-value.capacity { font-weight: 700; color: var(--primary); }

  /* ===== 拖放区 ===== */
  .drop-zone {
    border: 2px dashed var(--border-hover);
    border-radius: var(--r);
    padding: 26px 20px;
    text-align: center;
    cursor: pointer;
    transition: all 0.2s;
    background: var(--panel);
    user-select: none;
    min-height: 118px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 5px;
  }
  .drop-zone:hover, .drop-zone.drag-over { border-color: var(--primary); background: var(--primary-light); }
  .drop-zone .drop-icon { font-size: 26px; color: var(--text-muted); }
  .drop-zone:hover .drop-icon { color: var(--primary); }
  .drop-zone .drop-text { font-size: 13.5px; color: var(--text); font-weight: 500; }
  .drop-zone .drop-hint { font-size: 12px; color: var(--text-muted); }
  .drop-zone.has-file { border-style: solid; border-color: var(--success); background: var(--success-light); }

  .file-info-display {
    display: none;
    margin-top: 10px;
    font-size: 12.5px;
    color: var(--text-secondary);
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
  }
  .file-info-display.show { display: flex; }
  .file-name { font-weight: 600; color: var(--text); }
  .file-size {
    background: var(--primary-soft);
    color: var(--primary);
    padding: 2px 8px;
    border-radius: 4px;
    font-size: 11.5px;
    font-weight: 600;
  }
  .file-type-badge {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 2px 8px;
    border-radius: 4px;
    font-size: 11.5px;
    font-weight: 600;
  }
  .file-type-badge.img { background: var(--primary-light); color: var(--primary); }
  .file-type-badge.iso { background: var(--warn-light); color: var(--warn-ink); }
  .file-type-badge.bin { background: var(--success-light); color: var(--success); }
  .file-type-badge.raw { background: var(--panel-hover); color: var(--text-secondary); }

  /* ===== 进度 ===== */
  .progress-section { display: none; margin-top: 14px; }
  .progress-section.show { display: block; }
  .progress-bar-outer {
    width: 100%;
    height: 8px;
    background: var(--panel-hover);
    border-radius: 4px;
    overflow: hidden;
  }
  .progress-bar-inner {
    height: 100%;
    background: var(--primary);
    border-radius: 4px;
    width: 0%;
    transition: width 0.3s ease-out;
  }
  .progress-text {
    display: flex;
    justify-content: space-between;
    margin-top: 6px;
    font-size: 12px;
    color: var(--text-secondary);
    font-variant-numeric: tabular-nums;
  }

  .status-badge {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: 2px 8px;
    border-radius: 4px;
    font-size: 11.5px;
    font-weight: 600;
  }
  .status-badge.connected { background: var(--success-light); color: var(--success); }
  .status-badge.disconnected { background: var(--danger-light); color: var(--danger-ink); }
  .status-dot { width: 7px; height: 7px; border-radius: 50%; display: inline-block; }
  .status-dot.green { background: var(--success); animation: pulse-dot 2s ease-in-out infinite; }
  .status-dot.red { background: var(--danger); }
  @keyframes pulse-dot {
    0%, 100% { opacity: 1; box-shadow: 0 0 0 0 rgba(16,185,129,0.4); }
    50% { opacity: 0.6; box-shadow: 0 0 0 7px rgba(16,185,129,0); }
  }

  /* ===== 提示条 ===== */
  .alert {
    display: flex;
    align-items: baseline;
    gap: 8px;
    padding: 9px 12px;
    border-radius: var(--r-sm);
    font-size: 12.5px;
    line-height: 1.5;
    margin-top: 12px;
    border: 1px solid var(--border);
  }
  .alert-warning { background: var(--warn-light); color: var(--warn-ink); border-color: var(--warn-light); border-left: 3px solid var(--warn); }
  .alert-info { background: var(--primary-light); color: var(--primary); border-color: var(--primary-light); border-left: 3px solid var(--primary); }
  .alert-danger { background: var(--danger-light); color: var(--danger); border-color: var(--danger-light); border-left: 3px solid var(--danger); }
  .alert-success { background: var(--success-light); color: var(--success); border-color: var(--success-light); border-left: 3px solid var(--success); }
  .alert-icon { display: inline-flex; align-items: center; flex-shrink: 0; font-size: 13px; }

  .fas, .far, .fab { vertical-align: -0.125em; }

  /* ===== 日志 ===== */
  .log-panel {
    margin-top: 12px;
    border: 1px solid var(--border);
    border-radius: var(--r-sm);
    overflow: hidden;
  }
  .log-header {
    padding: 8px 12px;
    background: var(--panel-hover);
    cursor: pointer;
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 12.5px;
    font-weight: 600;
    color: var(--text);
  }
  .log-header > span:first-child { display: inline-flex; align-items: center; gap: 6px; }
  .log-header > span:first-child i { color: var(--primary); }
  .log-content {
    display: none;
    max-height: 200px;
    overflow-y: auto;
    padding: 10px 12px;
    font-family: var(--font-mono);
    font-size: 11.5px;
    background: var(--code-bg);
  }
  .log-content.show { display: block; }
  .log-entry { padding: 2px 0; border-bottom: 1px solid var(--table-row-border); color: var(--text-secondary); }
  .log-entry.error { color: var(--danger); }
  .log-entry.success { color: var(--success); }
  .log-entry.warn { color: var(--warn); }
  .log-entry.info { color: var(--text-secondary); }

  /* ===== 勾选框 ===== */
  .checkbox-group { position: relative; margin-top: 10px; font-size: 12.5px; color: var(--text-secondary); }
  .checkbox-group input[type="checkbox"] { position: absolute; opacity: 0; width: 1px; height: 1px; pointer-events: none; }
  .checkbox-group label {
    display: block;
    cursor: pointer;
    line-height: 1.5;
    position: relative;
    padding-left: 26px;
    min-height: 18px;
  }
  .checkbox-group label::before {
    content: "";
    position: absolute;
    left: 0;
    top: 1px;
    width: 17px;
    height: 17px;
    border-radius: 4px;
    border: 1px solid var(--border-hover);
    background: var(--panel);
    transition: all 0.15s;
  }
  .checkbox-group input[type="checkbox"]:checked + label::before {
    background: var(--primary);
    border-color: var(--primary);
    color: #fff;
    content: "\f00c";
    font-family: "Font Awesome 6 Free";
    font-weight: 900;
    font-size: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    line-height: 1;
  }
  .checkbox-group label i { display: none; }
  .checkbox-group:hover label::before { border-color: var(--primary); }

  /* ===== 多阶段指示器 ===== */
  .stage-indicator {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    margin-top: 12px;
    padding: 8px;
    background: var(--bg);
    border-radius: var(--r-sm);
    border: 1px solid var(--border);
    flex-wrap: wrap;
  }
  .stage-item {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: 3px 9px;
    border-radius: 4px;
    font-size: 11.5px;
    font-weight: 600;
    color: var(--text-muted);
    border: 1px solid var(--border);
    transition: all 0.15s;
  }
  .stage-item .stage-icon { display: inline-flex; align-items: center; justify-content: center; font-size: 12px; }
  .stage-item.active { color: var(--primary); border-color: var(--primary); background: var(--primary-light); }
  .stage-item.done { color: var(--success); border-color: var(--success); background: var(--success-light); }
  .stage-arrow { color: var(--text-muted); font-size: 10px; }

  .footer {
    display: flex;
    justify-content: center;
    align-items: center;
    flex-wrap: wrap;
    gap: 6px;
    font-size: 12px;
    color: var(--text-muted);
    padding: 6px 0;
    line-height: 1.5;
  }
  .footer i { font-size: 11px; }
  .footer-text { text-align: center; }
  .hidden-input { display: none; }

  /* Scrollbar */
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--scrollbar-thumb); border-radius: 4px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--scrollbar-thumb-hover); }

  /* ===== 响应式：≥1024px 两栏 ===== */
  @media (min-width: 1024px) {
    .container {
      max-width: 1180px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      grid-template-areas:
        "step1 step3"
        "step2 step3";
      align-items: start;
    }
    #cardStep1 { grid-area: step1; }
    #cardStep2 { grid-area: step2; }
    #cardStep3 { grid-area: step3; }
    .log-content { max-height: 220px; }
  }

  @media (max-width: 768px) {
    .header { height: 48px; padding: 0 10px; gap: 4px; }
    .logo { font-size: 13.5px; }
    .logo span { max-width: 44vw; }
    .page { padding: 12px 10px; padding-bottom: max(24px, env(safe-area-inset-bottom)); }
    .card-body { padding: 12px; }
    .card-title { padding: 9px 12px; }
  }

  @media (max-width: 480px) {
    .drop-zone { padding: 20px 14px; min-height: 100px; }
    .info-row { flex-direction: column; gap: 2px; }
    .info-value { text-align: left; }
    .stage-indicator { gap: 4px; }
    .stage-item { padding: 3px 7px; font-size: 11px; }
  }
</style>
</head>
<body>

<header class="header">
  <div class="header-inner">
    <div class="logo">
      <div class="logo-icon"><i class="fas fa-compact-disc"></i></div>
      <span>USB 启动盘制作工具</span>
      <a href="../" class="home-btn" title="返回主页" aria-label="返回主页">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 11.5 12 4l9 7.5"/>
          <path d="M5 10.5V20a1 1 0 0 0 1 1h4v-6h4v6h4a1 1 0 0 0 1-1v-9.5"/>
        </svg>
      </a>
    </div>
    <div class="header-spacer"></div>
    <div class="header-actions">
      <button class="icon-btn" id="themeToggle" title="切换主题">
        <svg id="iconSun" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display:none;">

<div class="page">
  <div class="container">

    <!-- 步骤1 -->
    <div class="card" id="cardStep1">
      <div class="card-title">

          <button class="btn btn-outline btn-sm" id="btnRefreshDevices" style="display: none">

        <div class="checkbox-group">

    <!-- 步骤3 -->
    <div class="card" id="cardStep3">
      <div class="card-title">
        <span class="step-badge" id="badgeStep3">3</span> 写入镜像
      </div>
      <div class="card-body">
        <div class="alert alert-warning" style="margin-top: 0">
          <span class="alert-icon"><i class="fas fa-triangle-exclamation"></i></span>
          <span><strong>警告：</strong>写入将完全覆盖 U 盘所有数据！</span>
        </div>
        <div class="checkbox-group">
          <input type="checkbox" id="chkVerifyWrite" checked>
          <label for="chkVerifyWrite"><i class="fas fa-magnifying-glass"></i> 写入后验证数据（推荐，回读校验确保写入正确）</label>
        </div>
        <div class="stage-indicator" id="stageIndicator" style="display: none"></div>
        <div class="btn-group">
          <button class="btn btn-danger" id="btnStartWrite" disabled><i class="fas fa-rocket"></i>开始写入</button>
          <button class="btn btn-outline btn-sm" id="btnCancelWrite" style="display: none"><i class="fas fa-stop"></i>取消</button>
        </div>

          <div class="progress-bar-outer"><div class="progress-bar-inner" id="progressBar"></div></div>
          <div class="progress-text"><span id="progressPercent">0%</span><span class="speed" id="progressSpeed">—</span></div>
          <div class="progress-text"><span id="progressDetail">准备中...</span><span id="progressEta"></span></div>

  </div>

  <div class="footer">
    <i class="fas fa-lock"></i>
    <span class="footer-text">纯前端工具 · 数据仅在本地处理 · 需要 Chrome/Edge</span>

<script>

      (function () {
        const SCSI_WRITE_10 = 0x2a,
          SCSI_READ_10 = 0x28,
          SCSI_READ_CAPACITY_10 = 0x25,
          SCSI_TEST_UNIT_READY = 0x00,
          SCSI_REQUEST_SENSE = 0x03;
        const CBW_SIGNATURE = 0x43425355,
          CSW_SIGNATURE = 0x53425355;
        const CBW_FLAG_DATA_OUT = 0x00,
          CBW_FLAG_DATA_IN = 0x80;
        const DEFAULT_SECTOR_SIZE = 512,
          CHUNK_SECTORS = 256,
          VERIFY_CHUNK_SECTORS = 128;
        const MAX_RETRIES = 3,
          RETRY_DELAY_MS = 500;

        const $ = (s) => document.querySelector(s);
        const btnConnectUSB = $("#btnConnectUSB");
        const btnRefreshDevices = $("#btnRefreshDevices");
        const deviceStatusBadge = $("#deviceStatusBadge");
        const deviceInfo = $("#deviceInfo");
        const dropZone = $("#dropZone");
        const fileInput = $("#fileInput");
        const fileInfoDisplay = $("#fileInfoDisplay");
        const fileNameEl = $("#fileName");
        const fileSizeEl = $("#fileSize");
        const fileTypeBadge = $("#fileTypeBadge");
        const btnClearFile = $("#btnClearFile");
        const btnStartWrite = $("#btnStartWrite");
        const btnCancelWrite = $("#btnCancelWrite");
        const progressSection = $("#progressSection");
        const progressBar = $("#progressBar");
        const progressPercent = $("#progressPercent");
        const progressSpeed = $("#progressSpeed");
        const progressDetail = $("#progressDetail");
        const progressEta = $("#progressEta");
        const writeStatusArea = $("#writeStatusArea");
        const alertSizeCheck = $("#alertSizeCheck");
        const alertSizeCheckText = $("#alertSizeCheckText");
        const alertSizeCheckIcon = $("#alertSizeCheckIcon");
        const themeToggle = $("#themeToggle");
        const themeLabel = $("#themeLabel");
        const badgeStep1 = $("#badgeStep1"),
          badgeStep2 = $("#badgeStep2"),
          badgeStep3 = $("#badgeStep3");
        const cardStep1 = $("#cardStep1"),
          cardStep2 = $("#cardStep2"),
          cardStep3 = $("#cardStep3");
        const logContent = $("#logContent");
        const logToggle = $("#logToggle");
        const logHeader = $("#logHeader");
        const chkWideMode = $("#chkWideMode");
        const chkVerifyWrite = $("#chkVerifyWrite");
        const stageIndicator = $("#stageIndicator");
        const connectionSpeedInfo = $("#connectionSpeedInfo");

        let usbDevice = null,
          usbInterface = null,
          bulkOutEp = null,
          bulkInEp = null;
        let sectorSize = DEFAULT_SECTOR_SIZE,
          deviceCapacityBytes = 0,
          deviceMaxLBA = 0;
        let selectedFile = null,
          fileFormat = null;
        let isWriting = false,
          abortController = null;
        let writeStartTime = 0,
          bytesWritten = 0,
          totalBytesToWrite = 0;
        let currentStage = "idle"; // idle | writing | verifying | done
        let verifiedBytes = 0,
          verifyErrors = 0;
        let usbSpeed = ""; // "USB 2.0" / "USB 3.0" / "USB 3.1" / "未知"

        function addLog(msg, type = "info") {
          const time = new Date().toLocaleTimeString();
          logContent.innerHTML += `<div class="log-entry ${type}">[${time}] ${msg}</div>`;
          logContent.scrollTop = logContent.scrollHeight;
        }
        logHeader.addEventListener("click", () => {
          const isOpen = logContent.classList.toggle("show");
          logToggle.textContent = isOpen ? "收起" : "展开";
        });

        function applyTheme(t) {
          document.documentElement.dataset.theme = t;
          localStorage.setItem("webusb-theme", t);
          const dark = t === "dark";
          document.getElementById("iconSun").style.display = dark ? "block" : "none";
          document.getElementById("iconMoon").style.display = dark ? "none" : "block";
          themeToggle.title = dark ? "切换到浅色模式" : "切换到深色模式";
        }
        const saved = localStorage.getItem("webusb-theme") || localStorage.getItem("theme");
        const prefersDark = window.matchMedia(
          "(prefers-color-scheme: dark)",
        ).matches;
        applyTheme(
          saved === "dark" || (!saved && prefersDark) ? "dark" : "light",
        );
        themeToggle.addEventListener("click", () => {
          applyTheme(
            document.documentElement.dataset.theme === "dark" ? "light" : "dark",
          );
        });

        // 查找大容量存储接口（兼容各种子类）
        function findMassInterface(device) {
          for (const config of device.configurations) {
            for (const iface of config.interfaces) {
              for (const alt of iface.alternates) {
                if (alt.interfaceClass === 0x08) {
                  return {
                    interfaceNumber: iface.interfaceNumber,
                    alternate: alt,
                    endpoints: alt.endpoints,
                  };
                }
              }
            }
          }
          return null;
        }
        function findEndpoints(eps) {
          let out = null,
            inp = null;
          for (const ep of eps) {
            if (ep.type === "bulk") {
              if (ep.direction === "out" && !out) out = ep;
              else if (ep.direction === "in" && !inp) inp = ep;
            }
          }
          return { bulkOut: out, bulkIn: inp };
        }
        function buildCBW(tag, len, flags, lun, cb) {
          const buf = new ArrayBuffer(31),
            v = new DataView(buf);
          v.setUint32(0, CBW_SIGNATURE, true);
          v.setUint32(4, tag, true);
          v.setUint32(8, len, true);
          v.setUint8(12, flags);
          v.setUint8(13, lun);
          v.setUint8(14, cb.length);
          new Uint8Array(buf, 15, 16).set(new Uint8Array(cb).slice(0, 16));
          return buf;
        }
        function buildWrite10(lba, n) {
          const cmd = new ArrayBuffer(10),
            v = new DataView(cmd);
          v.setUint8(0, SCSI_WRITE_10);
          v.setUint32(2, lba, false);
          v.setUint16(7, n, false);
          return cmd;
        }
        function buildRead10(lba, n) {
          const cmd = new ArrayBuffer(10),
            v = new DataView(cmd);
          v.setUint8(0, SCSI_READ_10);
          v.setUint32(2, lba, false);
          v.setUint16(7, n, false);
          return cmd;
        }
        function buildTestUnitReady() {
          const cmd = new ArrayBuffer(6);
          new DataView(cmd).setUint8(0, SCSI_TEST_UNIT_READY);
          return cmd;
        }
        function buildRequestSense() {
          const cmd = new ArrayBuffer(6),
            v = new DataView(cmd);
          v.setUint8(0, SCSI_REQUEST_SENSE);
          v.setUint8(4, 18);
          return cmd;
        }
        function buildReadCap() {
          const cmd = new ArrayBuffer(10);
          new DataView(cmd).setUint8(0, SCSI_READ_CAPACITY_10);
          return cmd;
        }
        function parseCSW(buf) {
          const v = new DataView(buf);
          return {
            sig: v.getUint32(0, true),
            tag: v.getUint32(4, true),
            residue: v.getUint32(8, true),
            status: v.getUint8(12),
            valid: v.getUint32(0, true) === CSW_SIGNATURE,
          };
        }
        function parseReadCap(buf) {
          const v = new DataView(buf);
          return {
            maxLBA: v.getUint32(0, false),
            blockSize: v.getUint32(4, false),
          };
        }
        function parseSenseData(buf) {
          if (!buf || buf.byteLength < 18) return null;
          const v = new DataView(buf);
          return {
            senseKey: v.getUint8(2) & 0x0f,
            asc: v.getUint8(12),
            ascq: v.getUint8(13),
          };
        }
        function senseKeyText(key) {
          const map = {
            0: "无检测",
            1: "已恢复错误",
            2: "未就绪",
            3: "介质错误",
            4: "硬件错误",
            5: "非法请求",
            6: "单元注意",
            7: "数据保护",
            8: "空白检查",
            9: "供应商特有",
            10: "已复制",
            11: "已中止命令",
            13: "卷溢出",
            14: "错误已消除",
          };
          return map[key] || `未知(0x${key.toString(16)})`;
        }
        function signal_aborted() {
          return abortController && abortController.signal.aborted;
        }
        function sleep(ms) {
          return new Promise((r) => setTimeout(r, ms));
        }
        async function testUnitReady() {
          const cmd = buildTestUnitReady();
          const tag = Date.now() & 0xffffffff;
          const cbw = buildCBW(tag, 0, CBW_FLAG_DATA_OUT, 0, cmd);
          await usbDevice.transferOut(bulkOutEp.endpointNumber, cbw);
          const cswRes = await usbDevice.transferIn(
            bulkInEp.endpointNumber,
            13,
          );
          if (cswRes.data && cswRes.data.byteLength >= 13) {
            const csw = parseCSW(cswRes.data.buffer);
            return csw.status === 0;
          }
          return false;
        }
        async function requestSense() {
          try {
            const cmd = buildRequestSense();
            const tag = (Date.now() + 1) & 0xffffffff;
            const cbw = buildCBW(tag, 18, CBW_FLAG_DATA_IN, 0, cmd);
            await usbDevice.transferOut(bulkOutEp.endpointNumber, cbw);
            const res = await usbDevice.transferIn(bulkInEp.endpointNumber, 18);
            await usbDevice.transferIn(bulkInEp.endpointNumber, 13);
            if (res.data && res.data.byteLength >= 18)
              return parseSenseData(res.data.buffer);
          } catch (_) {}
          return null;
        }
        // 带重试的错误恢复（参考 Android Flash Tool 的容错机制）
        async function recoverFromError() {
          try {
            await usbDevice.clearHalt(bulkOutEp.endpointNumber);
          } catch (_) {}
          try {
            await usbDevice.clearHalt(bulkInEp.endpointNumber);
          } catch (_) {}
          await sleep(RETRY_DELAY_MS);
          try {
            await testUnitReady();
          } catch (_) {}
        }
        // 检测 USB 连接速率
        function detectUsbSpeed(device) {
          if (device.usbVersionMajor === 3) {
            if (device.usbVersionMinor >= 1) return "USB 3.1";
            return "USB 3.0";
          }
          if (device.usbVersionMajor === 2) return "USB 2.0";
          return "USB 1.1";
        }

        async function connectUSB() {
          try {
            const useWide = chkWideMode.checked;
            const filters = useWide
              ? [{ classCode: 0x08 }] // 宽松：只要求大容量存储类
              : [{ classCode: 0x08, subclassCode: 0x06, protocolCode: 0x50 }]; // 严格：标准BOT

            addLog(
              `正在请求USB设备 (${useWide ? "宽松模式 - class=0x08" : "标准模式 - 仅BOT"})...`,
              "info",
            );
            const device = await navigator.usb.requestDevice({ filters });
            if (!device) {
              showStatus("未选择设备", "disconnected");
              return;
            }
            await setupDevice(device);
          } catch (err) {
            addLog(`连接失败: ${err.message}`, "error");
            if (err.name === "NotFoundError")
              addLog(
                '没有找到兼容设备。请尝试勾选"搜索所有大容量存储设备"，并确保U盘已从系统中卸载。',
                "warn",
              );
            showStatus("连接失败", "disconnected");
            resetDeviceState();
          }
        }
        async function setupDevice(device) {
          usbDevice = device;
          await device.open();
          const ms = findMassInterface(device);
          if (!ms) throw new Error("该设备不是大容量存储设备");
          usbInterface = ms;
          await device.claimInterface(ms.interfaceNumber);
          const { bulkOut, bulkIn } = findEndpoints(ms.endpoints);
          if (!bulkOut || !bulkIn) throw new Error("未找到批量端点");
          bulkOutEp = bulkOut;
          bulkInEp = bulkIn;
          usbSpeed = detectUsbSpeed(device);
          await readCapacity();
          updateDeviceInfoUI();
          showStatus("已连接", "connected");
          badgeStep1.classList.add("done");
          cardStep1.classList.add("highlight");
          btnConnectUSB.innerHTML = '<i class="fas fa-plug"></i>更换U盘';
          btnRefreshDevices.style.display = "inline-flex";
          addLog(
            `已连接: ${device.productName || "未知"} (${formatBytes(deviceCapacityBytes)}, ${usbSpeed})`,
            "success",
          );
          if (usbSpeed === "USB 2.0" || usbSpeed === "USB 1.1") {
            addLog(
              '<i class="fas fa-triangle-exclamation"></i> 设备连接速率较慢，写入大镜像可能需要较长时间。建议插入 USB 3.0 接口。',
              "warn",
            );
            connectionSpeedInfo.style.display = "flex";
            connectionSpeedInfo.querySelector("span:last-child").textContent =
              `${usbSpeed} · 速率较慢`;
          } else {
            connectionSpeedInfo.style.display = "flex";
            connectionSpeedInfo.querySelector("span:last-child").textContent =
              usbSpeed;
          }
          if (selectedFile) checkSize();
          updateWriteButton();
        }
        async function readCapacity() {
          const cmd = buildReadCap();
          const tag = Date.now() & 0xffffffff;
          const cbw = buildCBW(tag, 8, CBW_FLAG_DATA_IN, 0, cmd);
          await usbDevice.transferOut(bulkOutEp.endpointNumber, cbw);
          const res = await usbDevice.transferIn(bulkInEp.endpointNumber, 8);
          if (res.data?.byteLength >= 8) {
            const cap = parseReadCap(res.data.buffer);
            sectorSize = cap.blockSize;
            deviceMaxLBA = cap.maxLBA;
            deviceCapacityBytes = (deviceMaxLBA + 1) * sectorSize;
          }
          try {
            await usbDevice.transferIn(bulkInEp.endpointNumber, 13);
          } catch (e) {}
        }
        function updateDeviceInfoUI() {
          deviceInfo.classList.add("show");
          $("#devProductName").textContent = usbDevice.productName || "未知";
          $("#devManufacturer").textContent =
            usbDevice.manufacturerName || "未知";
          $("#devVidPid").textContent =
            `0x${usbDevice.vendorId.toString(16).toUpperCase()}:0x${usbDevice.deviceId.toString(16).toUpperCase()}`;
          $("#devBlockSize").textContent = `${sectorSize} 字节`;
          $("#devCapacity").textContent = formatBytes(deviceCapacityBytes);
        }
        function resetDeviceState() {
          usbDevice = null;
          usbInterface = null;
          bulkOutEp = null;
          bulkInEp = null;
          sectorSize = DEFAULT_SECTOR_SIZE;
          deviceCapacityBytes = 0;
          deviceMaxLBA = 0;
          usbSpeed = "";
          deviceInfo.classList.remove("show");
          connectionSpeedInfo.style.display = "none";
          badgeStep1.classList.remove("done");
          cardStep1.classList.remove("highlight");
          btnConnectUSB.innerHTML = '<i class="fas fa-plug"></i>选择U盘';
          btnRefreshDevices.style.display = "none";
          updateWriteButton();
        }
        function showStatus(msg, type) {
          if (type === "connected") {
            deviceStatusBadge.className = "status-badge connected";
            deviceStatusBadge.innerHTML =
              '<span class="status-dot green"></span> 已连接';
          } else {
            deviceStatusBadge.className = "status-badge disconnected";
            deviceStatusBadge.innerHTML = `<span class="status-dot red"></span> ${msg}`;
          }
        }

        function handleFile(file) {
          if (!file) return;
          selectedFile = file;
          const ext = file.name.split(".").pop().toLowerCase();
          fileFormat = [
            "img",
            "iso",
            "bin",
            "raw",
            "dmg",
            "vhd",
            "vhdx",
            "vmdk",
          ].includes(ext)
            ? ext
            : "raw";
          fileNameEl.textContent = file.name;
          fileSizeEl.textContent = formatBytes(file.size);
          fileTypeBadge.className = `file-type-badge ${fileFormat}`;
          fileTypeBadge.innerHTML =
            {
              img: '<i class="fas fa-floppy-disk"></i> IMG',
              iso: '<i class="fas fa-compact-disc"></i> ISO',
              bin: '<i class="fas fa-disc-drive"></i> BIN',
              raw: '<i class="fas fa-database"></i> RAW',
              dmg: '<i class="fab fa-apple"></i> DMG',
              vhd: '<i class="fas fa-hard-drive"></i> VHD',
              vhdx: '<i class="fas fa-hard-drive"></i> VHDX',
              vmdk: '<i class="fas fa-hard-drive"></i> VMDK',
            }[fileFormat] || '<i class="fas fa-file"></i> 镜像';
          fileTypeBadge.style.display = "inline-flex";
          fileInfoDisplay.classList.add("show");
          dropZone.classList.add("has-file");
          dropZone.querySelector(".drop-text").textContent = "点击更换镜像文件";
          badgeStep2.classList.add("done");
          cardStep2.classList.add("highlight");
          checkSize();
        }
        function checkSize() {
          if (!selectedFile || !deviceCapacityBytes) {
            alertSizeCheck.style.display = "none";
            updateWriteButton();
            return;
          }
          if (selectedFile.size > deviceCapacityBytes) {
            alertSizeCheck.style.display = "flex";
            alertSizeCheck.className = "alert alert-danger";
            alertSizeCheckIcon.innerHTML =
              '<i class="fas fa-circle-xmark"></i>';
            alertSizeCheckText.textContent = `镜像过大 (${formatBytes(selectedFile.size)} > ${formatBytes(deviceCapacityBytes)})`;
            btnStartWrite.disabled = true;
          } else {
            alertSizeCheck.style.display = "flex";
            alertSizeCheck.className = "alert alert-info";
            alertSizeCheckIcon.innerHTML =
              '<i class="fas fa-circle-check"></i>';
            alertSizeCheckText.innerHTML = `${formatBytes(selectedFile.size)} <i class="fas fa-arrow-right"></i> ${formatBytes(deviceCapacityBytes)}`;
            updateWriteButton();
          }
        }
        function clearFile() {
          selectedFile = null;
          fileFormat = null;
          fileInfoDisplay.classList.remove("show");
          dropZone.classList.remove("has-file");
          dropZone.querySelector(".drop-text").textContent =
            "拖放镜像文件到此处";
          fileInput.value = "";
          fileTypeBadge.style.display = "none";
          badgeStep2.classList.remove("done");
          cardStep2.classList.remove("highlight");
          alertSizeCheck.style.display = "none";
          stageIndicator.style.display = "none";
          updateWriteButton();
        }
        function updateWriteButton() {
          btnStartWrite.disabled =
            !(usbDevice && selectedFile && !isWriting) ||
            (selectedFile &&
              deviceCapacityBytes &&
              selectedFile.size > deviceCapacityBytes);
        }

        function setStage(stage) {
          currentStage = stage;
          const stages = [
            { key: "write", label: "写入", icon: '<i class="fas fa-pen-to-square"></i>' },
            { key: "verify", label: "验证", icon: '<i class="fas fa-magnifying-glass"></i>' },
            { key: "done", label: "完成", icon: '<i class="fas fa-circle-check"></i>' },
          ];
          const wantVerify = chkVerifyWrite.checked;
          const activeStages = wantVerify ? stages : [stages[0], stages[2]];
          let html = "";
          activeStages.forEach((s, i) => {
            let cls = "stage-item";
            const stageMap = {
              write: "writing",
              verify: "verifying",
              done: "done",
            };
            if (stage === s.key) cls += " active";
            else if (
              (s.key === "write" && (stage === "verify" || stage === "done")) ||
              (s.key === "verify" && stage === "done")
            )
              cls += " done";
            if (i > 0) html += '<i class="fas fa-arrow-right stage-arrow"></i>';
            html += `<span class="${cls}"><span class="stage-icon">${s.icon}</span> ${s.label}</span>`;
          });
          stageIndicator.innerHTML = html;
          stageIndicator.style.display = "flex";
        }

        async function startWrite() {
          if (!usbDevice || !selectedFile || isWriting) return;
          if (
            !confirm(
              `确定将 ${selectedFile.name} 写入 ${usbDevice.productName || "设备"}？此操作不可逆！${chkVerifyWrite.checked ? "\n\n将执行写入后验证，确保数据完整。" : ""}`,
            )
          )
            return;
          isWriting = true;
          abortController = new AbortController();
          bytesWritten = 0;
          verifiedBytes = 0;
          verifyErrors = 0;
          totalBytesToWrite = selectedFile.size;
          writeStartTime = performance.now();
          btnStartWrite.style.display = "none";
          btnCancelWrite.style.display = "inline-flex";
          progressSection.classList.add("show");
          progressBar.style.width = "0%";
          progressPercent.textContent = "0%";
          progressSpeed.textContent = "—";
          progressDetail.textContent = "准备写入...";
          progressEta.textContent = "";
          writeStatusArea.innerHTML = "";
          cardStep3.classList.add("highlight");
          btnConnectUSB.disabled = true;
          btnClearFile.disabled = true;
          chkVerifyWrite.disabled = true;
          dropZone.style.pointerEvents = "none";
          setStage("write");
          addLog("===== 开始写入流程 =====", "info");
          addLog(
            `镜像: ${selectedFile.name} (${formatBytes(selectedFile.size)})`,
            "info",
          );
          addLog(
            `目标: ${usbDevice.productName || "未知"} (${usbSpeed})`,
            "info",
          );
          addLog(
            `验证: ${chkVerifyWrite.checked ? "已启用" : "未启用"}`,
            "info",
          );
          try {
            await performWrite();
            addLog("写入阶段完成", "success");
            if (chkVerifyWrite.checked) {
              setStage("verify");
              progressDetail.textContent = "正在验证数据...";
              progressBar.style.width = "0%";
              progressPercent.textContent = "0%";
              writeStartTime = performance.now();
              addLog("===== 开始验证阶段 =====", "info");
              await performVerify();
              if (verifyErrors > 0) {
                addLog(`验证完成，发现 ${verifyErrors} 处不一致`, "error");
                throw new Error(`验证失败：${verifyErrors} 处数据不一致`);
              }
              addLog("验证通过，数据完整", "success");
            }
            setStage("done");
            progressBar.style.width = "100%";
            progressPercent.textContent = "100%";
            progressDetail.innerHTML =
              '<i class="fas fa-circle-check"></i> 全部完成！';
            progressSpeed.textContent = "";
            progressEta.textContent = "";
            writeStatusArea.innerHTML =
              '<div class="alert alert-success"><span class="alert-icon"><i class="fas fa-champagne-glasses"></i></span> 写入成功！数据已验证，可以安全弹出U盘。</div>';
            addLog("===== 全部完成 =====", "success");
          } catch (e) {
            if (e.name === "AbortError" || e.message === "用户取消") {
              progressDetail.innerHTML = '<i class="fas fa-stop"></i> 已取消';
              writeStatusArea.innerHTML =
                '<div class="alert alert-warning"><span class="alert-icon"><i class="fas fa-triangle-exclamation"></i></span> 操作已取消，数据不完整。</div>';
              addLog("用户取消操作", "warn");
            } else {
              progressBar.style.width = "0%";
              showError(e.message);
              addLog(`错误: ${e.message}`, "error");
            }
          } finally {
            isWriting = false;
            abortController = null;
            btnStartWrite.style.display = "inline-flex";
            btnCancelWrite.style.display = "none";
            btnStartWrite.disabled = false;
            btnConnectUSB.disabled = false;
            btnClearFile.disabled = false;
            chkVerifyWrite.disabled = false;
            dropZone.style.pointerEvents = "auto";
            updateWriteButton();
          }
        }
        async function performWrite() {
          const file = selectedFile,
            total = file.size,
            chunk = CHUNK_SECTORS * sectorSize;
          let lba = 0,
            offset = 0,
            tagC = Date.now() & 0xffff;
          while (offset < total) {
            if (signal_aborted()) throw new Error("用户取消");
            const remain = total - offset,
              curBytes = Math.min(chunk, remain);
            const curSectors = Math.ceil(curBytes / sectorSize);
            const blob = file.slice(offset, offset + curBytes);
            const buf = await new Response(blob).arrayBuffer();
            let aligned = buf;
            if (buf.byteLength < curSectors * sectorSize) {
              const pad = new ArrayBuffer(curSectors * sectorSize);
              new Uint8Array(pad).set(new Uint8Array(buf));
              aligned = pad;
            }
            let success = false;
            for (
              let attempt = 1;
              attempt <= MAX_RETRIES && !success;
              attempt++
            ) {
              try {
                if (signal_aborted()) throw new Error("用户取消");
                const cmd = buildWrite10(lba, curSectors);
                const cbw = buildCBW(
                  tagC++ & 0xffffffff,
                  aligned.byteLength,
                  CBW_FLAG_DATA_OUT,
                  0,
                  cmd,
                );
                await usbDevice.transferOut(bulkOutEp.endpointNumber, cbw);
                let pos = 0;
                const data = new Uint8Array(aligned);
                while (pos < data.length) {
                  if (signal_aborted()) throw new Error("用户取消");
                  const len = Math.min(
                    bulkOutEp.packetSize * 64,
                    data.length - pos,
                  );
                  await usbDevice.transferOut(
                    bulkOutEp.endpointNumber,
                    data.slice(pos, pos + len),
                  );
                  pos += len;
                }
                const cswRes = await usbDevice.transferIn(
                  bulkInEp.endpointNumber,
                  13,
                );
                if (!cswRes.data || cswRes.data.byteLength < 13)
                  throw new Error(`CSW响应异常 LBA ${lba}`);
                const csw = parseCSW(cswRes.data.buffer);
                if (!csw.valid) throw new Error(`CSW签名无效 LBA ${lba}`);
                if (csw.status !== 0) {
                  const sense = await requestSense();
                  const senseStr = sense
                    ? ` [${senseKeyText(sense.senseKey)}]`
                    : "";
                  throw new Error(
                    `SCSI错误 状态${csw.status}${senseStr} LBA ${lba}`,
                  );
                }
                success = true;
              } catch (e) {
                if (e.message === "用户取消") throw e;
                if (attempt < MAX_RETRIES) {
                  addLog(
                    `LBA ${lba} 写入失败(第${attempt}次): ${e.message}，重试中...`,
                    "warn",
                  );
                  await recoverFromError();
                } else {
                  throw e;
                }
              }
            }
            offset += curBytes;
            bytesWritten = offset;
            lba += curSectors;
            updateProgress(offset, total);
          }
        }
        async function performVerify() {
          const file = selectedFile,
            total = file.size,
            chunk = VERIFY_CHUNK_SECTORS * sectorSize;
          let lba = 0,
            offset = 0,
            tagC = (Date.now() + 0x8000) & 0xffff;
          while (offset < total) {
            if (signal_aborted()) throw new Error("用户取消");
            const remain = total - offset,
              curBytes = Math.min(chunk, remain);
            const curSectors = Math.ceil(curBytes / sectorSize);
            // 读取设备上的数据
            let readBuf = null;
            for (let attempt = 1; attempt <= MAX_RETRIES; attempt++) {
              try {
                if (signal_aborted()) throw new Error("用户取消");
                const cmd = buildRead10(lba, curSectors);
                const cbw = buildCBW(
                  tagC++ & 0xffffffff,
                  curSectors * sectorSize,
                  CBW_FLAG_DATA_IN,
                  0,
                  cmd,
                );
                await usbDevice.transferOut(bulkOutEp.endpointNumber, cbw);
                const res = await usbDevice.transferIn(
                  bulkInEp.endpointNumber,
                  curSectors * sectorSize,
                );
                if (!res.data) throw new Error(`验证读取无数据 LBA ${lba}`);
                readBuf = res.data.buffer;
                const cswRes = await usbDevice.transferIn(
                  bulkInEp.endpointNumber,
                  13,
                );
                if (!cswRes.data || cswRes.data.byteLength < 13)
                  throw new Error(`验证CSW异常 LBA ${lba}`);
                const csw = parseCSW(cswRes.data.buffer);
                if (!csw.valid) throw new Error(`验证CSW签名无效 LBA ${lba}`);
                if (csw.status !== 0)
                  throw new Error(`验证SCSI错误 状态${csw.status} LBA ${lba}`);
                break;
              } catch (e) {
                if (e.message === "用户取消") throw e;
                if (attempt < MAX_RETRIES) {
                  addLog(
                    `LBA ${lba} 验证读取失败(第${attempt}次): ${e.message}，重试中...`,
                    "warn",
                  );
                  await recoverFromError();
                } else {
                  throw e;
                }
              }
            }
            // 读取原始文件对应区块
            const blob = file.slice(offset, offset + curBytes);
            const fileBuf = await new Response(blob).arrayBuffer();
            // 逐字节比较
            const readData = new Uint8Array(readBuf, 0, curBytes);
            const fileData = new Uint8Array(fileBuf);
            let mismatch = false;
            for (let i = 0; i < fileData.length; i++) {
              if (readData[i] !== fileData[i]) {
                mismatch = true;
                verifyErrors++;
                if (verifyErrors <= 10) {
                  addLog(
                    `数据不一致 @ LBA ${lba} 偏移 ${i}: 文件=0x${fileData[i].toString(16)} 设备=0x${readData[i].toString(16)}`,
                    "error",
                  );
                }
                break; // 跳到下一个块
              }
            }
            if (mismatch && verifyErrors > 10) {
              addLog("验证错误过多，停止详细报告...", "warn");
            }
            offset += curBytes;
            verifiedBytes = offset;
            lba += curSectors;
            updateProgress(offset, total);
          }
        }
        function updateProgress(written, total) {
          const pct = Math.round((written / total) * 100);
          progressBar.style.width = pct + "%";
          progressPercent.textContent = pct + "%";
          progressDetail.textContent = `${formatBytes(written)} / ${formatBytes(total)}`;
          const elapsed = (performance.now() - writeStartTime) / 1000;
          if (elapsed > 0.5) {
            const speed = written / elapsed;
            progressSpeed.textContent = formatBytes(speed) + "/s";
            const remaining = total - written;
            if (speed > 0)
              progressEta.textContent = `剩余 ${formatDuration(remaining / speed)}`;
          }
        }
        function cancelWrite() {
          if (abortController) abortController.abort();
        }
        function showError(msg) {
          writeStatusArea.innerHTML = `<div class="alert alert-danger"><span class="alert-icon"><i class="fas fa-circle-xmark"></i></span> ${msg}</div>`;
        }

        function formatBytes(b) {
          if (!b) return "0 B";
          const u = ["B", "KB", "MB", "GB", "TB"];
          const i = Math.floor(Math.log(b) / Math.log(1024));
          return (b / Math.pow(1024, i)).toFixed(i > 0 ? 1 : 0) + " " + u[i];
        }
        function formatDuration(s) {
          if (s < 1) return "不到1秒";
          if (s < 60) return Math.round(s) + "秒";
          const m = Math.floor(s / 60),
            sec = Math.round(s % 60);
          return `${m}分${sec}秒`;
        }

        btnConnectUSB.addEventListener("click", connectUSB);
        btnRefreshDevices.addEventListener("click", async () => {
          try {
            const devs = await navigator.usb.getDevices();
            const massDevs = devs.filter((d) => {
              for (const cfg of d.configurations)
                for (const iface of cfg.interfaces)
                  for (const alt of iface.alternates)
                    if (alt.interfaceClass === 0x08) return true;
              return false;
            });
            if (massDevs.length === 0) {
              showStatus("无已授权U盘", "disconnected");
              addLog(
                '没有已授权的大容量存储设备。请插入U盘并点击"选择U盘"。',
                "warn",
              );
              return;
            }
            addLog(`找到 ${massDevs.length} 个已授权U盘，尝试连接...`, "info");
            for (const d of massDevs) {
              try {
                await d.open();
                await d.close();
                await setupDevice(d);
                return;
              } catch (e) {
                addLog(`设备 ${d.productName} 不在线或无法连接。`, "warn");
              }
            }
            showStatus("所有已授权U盘均不在线", "disconnected");
            addLog(
              '所有已授权U盘都未连接。请插入U盘后重试，或点击"选择U盘"重新授权。',
              "error",
            );
          } catch (e) {
            showStatus("刷新失败", "disconnected");
            addLog(`刷新失败: ${e.message}`, "error");
          }
        });

        dropZone.addEventListener("click", () => {
          if (!isWriting) fileInput.click();
        });
        dropZone.addEventListener("dragover", (e) => {
          e.preventDefault();
          if (!isWriting) dropZone.classList.add("drag-over");
        });
        dropZone.addEventListener("dragleave", () =>
          dropZone.classList.remove("drag-over"),
        );
        dropZone.addEventListener("drop", (e) => {
          e.preventDefault();
          dropZone.classList.remove("drag-over");
          if (!isWriting && e.dataTransfer.files.length)
            handleFile(e.dataTransfer.files[0]);
        });
        fileInput.addEventListener("change", () => {
          if (fileInput.files.length) handleFile(fileInput.files[0]);
        });
        btnClearFile.addEventListener("click", (e) => {
          e.stopPropagation();
          clearFile();
        });
        btnStartWrite.addEventListener("click", startWrite);
        btnCancelWrite.addEventListener("click", cancelWrite);
        document.addEventListener("keydown", (e) => {
          if (e.key === "Escape" && isWriting) cancelWrite();
        });
        window.addEventListener("beforeunload", async () => {
          if (isWriting && abortController) abortController.abort();
          if (usbDevice) {
            try {
              if (usbInterface && usbDevice.opened)
                await usbDevice.releaseInterface(usbInterface.interfaceNumber);
            } catch (e) {}
            try {
              await usbDevice.close();
            } catch (e) {}
          }
        });
        if (navigator.usb) {
          navigator.usb.addEventListener("disconnect", (e) => {
            if (e.device === usbDevice) {
              if (isWriting) cancelWrite();
              resetDeviceState();
              showStatus("设备已断开", "disconnected");
              writeStatusArea.innerHTML =
                '<div class="alert alert-danger"><span class="alert-icon"><i class="fas fa-plug-circle-xmark"></i></span> USB设备已断开！</div>';
            }
          });
        }
        if (!navigator.usb) {
          writeStatusArea.innerHTML =
            '<div class="alert alert-danger"><span class="alert-icon"><i class="fas fa-ban"></i></span> 浏览器不支持 WebUSB，请使用 Chrome/Edge 并确保 HTTPS/localhost。</div>';
          btnConnectUSB.disabled = true;
          btnStartWrite.disabled = true;
        } else {
          addLog(
            'WebUSB 就绪。请先卸载U盘（Windows删除盘符 / macOS卸载），然后点击"选择U盘"。',
            "info",
          );
        }
      })();
    
</script>
</body>
</html>
