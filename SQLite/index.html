/* ================== 悬浮到底按钮 ================== */
const fab = $('fabEnd');

// 显隐控制：仅「无限模式数据表」显示；已全部加载完毕时置灰
function updateFabEnd() {
  const tab = state.openTabs.find(t => tabKey(t) === state.activeTabKey);
  const active = tab && tab.table !== '__SCHEMA__' && tab.loadMode === 'infinite'
                 && $('dataView').style.display !== 'none'
                 && document.getElementById('infiniteContainer');
  if (!active) {
    fab.classList.remove('show');
    fab.disabled = true;
    return;
  }
  fab.classList.add('show');
  // 已全部加载完、或正在跳转中 → 禁用（避免连点重入）
  fab.disabled = !!tab.infiniteFinished || !!tab._jumping;
  fab.classList.toggle('loading', !!tab._jumping);
}

/* 快速到底：大块查询 + 批量构建 HTML + 批量插入 DOM。
   相比逐页调用 loadInfiniteBatch（每页 1 次查询 + 1 次 DOM 插入 + 1 次 rAF），
   这里把每页 100 行放大到每次 5000 行，并把 DOM 插入按阈值合并，
   10 万行的批次数从 1000 降到 20，rAF 等待从 ~16 秒降到 ~0.3 秒。 */
async function loadRemainingToEnd(db, tab) {
  const t = db.tables.find(x => x.name === tab.table);
  if (!t) return;
  const columns = tab._columns;
  const tbody = $('infiniteTbody');

  const CHUNK = 5000;        // 每次 SQL 查询的行数
  const FLUSH_ROWS = 20000;  // 累积多少行后合并插入一次 DOM

  let buf = [];
  let bufRows = 0;
  let guard = 0;
  const MAX_ROUND = 100000;

  const flush = () => {
    if (!bufRows || !tbody) { buf = []; bufRows = 0; return; }
    tbody.insertAdjacentHTML('beforeend', buf.join(''));
    buf = [];
    bufRows = 0;
  };

  while (!tab.infiniteFinished && guard++ < MAX_ROUND) {
    const offset = tab.infiniteCount || 0;
    const where = buildWhereClause(tab, t);
    let sql, params;
    if (where) {
      sql = `SELECT * FROM "${tab.table}" WHERE ${where.sql} LIMIT ${CHUNK} OFFSET ${offset}`;
      params = where.params;
    } else {
      sql = `SELECT * FROM "${tab.table}" LIMIT ${CHUNK} OFFSET ${offset}`;
      params = [];
    }

    const t0 = performance.now();
    let rows = [];
    try {
      const stmt = db.db.prepare(sql);
      if (params.length) stmt.bind(params);
      while (stmt.step()) rows.push(stmt.getAsObject());
      stmt.free();
    } catch (e) {
      console.error(e);
      flush();
      return false;
    }
    tab._totalElapsed = (tab._totalElapsed || 0) + Math.round(performance.now() - t0);

    if (rows.length) {
      buf.push(buildRowsHtml(rows, columns, offset));
      bufRows += rows.length;
      tab.infiniteCount = (tab.infiniteCount || 0) + rows.length;
      tab.infinitePage++;
    }

    // 收尾判定：本块不满、或已达总行数、或查不到新行
    if (rows.length < CHUNK || (tab.infiniteCount || 0) >= tab.infiniteTotal || rows.length === 0) {
      tab.infiniteFinished = true;
    }

    if (bufRows >= FLUSH_ROWS) flush();

    // 块级别刷新进度（块数很少，开销可忽略）
    const loadedEl = $('loadedCount');
    if (loadedEl) loadedEl.textContent = formatNum(tab.infiniteCount || 0);
    const elapsedEl = $('elapsedTime');
    if (elapsedEl) elapsedEl.textContent = tab._totalElapsed + 'ms';

    await new Promise(r => requestAnimationFrame(r));
  }

  flush();
  return true;
}

// 一键到最后一行：把剩余数据一次性补拉到全部，再滚动到网格底部
async function jumpToEnd() {
  const tab = state.openTabs.find(t => tabKey(t) === state.activeTabKey);
  if (!tab || tab.table === '__SCHEMA__' || tab.loadMode !== 'infinite') return;
  if (tab._jumping) return;                 // 防重入
  const db = state.databases.find(d => d.id === tab.dbId);
  if (!db) return;
  if (tab.infiniteFinished) {               // 已到底，直接滚
    const c = $('infiniteContainer');
    if (c) c.scrollTop = c.scrollHeight;
    return;
  }

  tab._jumping = true;
  updateFabEnd();                            // 立刻切到 loading 态

  const ok = await loadRemainingToEnd(db, tab);

  // 加载完成后收尾：更新 sentinel 文案、断开 observer
  if (tab.infiniteFinished) {
    const sentinel = $('infiniteSentinel');
    if (sentinel) {
      sentinel.innerHTML = `<span class="end-mark">✓</span><span>已加载全部 ${formatNum(tab.infiniteCount || 0)} 行</span>`;
      sentinel.onclick = null;
    }
    if (state.infiniteObserver) state.infiniteObserver.disconnect();
  }

  // 等一帧，确保最后一块 DOM 完成布局，scrollHeight 才是最新的
  await new Promise(r => requestAnimationFrame(r));
  // 结果导向的补滚（平板/手机修复）：固定延迟补滚不可靠——
  // ① 慢设备大表插入后布局完成时间不可预测（可能超过 1 秒），补滚可能全部
  //    赶在布局完成前执行，scrollHeight 是旧值，之后布局变高也无人再滚；
  // ② 触摸惯性滚动可持续 1~2 秒，期间程序化 scrollTop 赋值可能被忽略/覆盖
  //    （PC 鼠标滚动几乎无惯性，所以 PC 上没暴露）。
  // 因此轮询检测「真正到底 且 scrollHeight 连续两轮稳定」才停止，上限 5 秒。
  let tries = 0;
  let lastSh = -1;
  const keepBottom = () => {
    const c = $('infiniteContainer');
    if (!c || !tab.infiniteFinished) return;
    const sh = c.scrollHeight;          // 本轮统一用同一个值
    c.scrollTop = sh;
    const atBottom = c.scrollTop + c.clientHeight >= sh - 4;
    const stable = sh === lastSh;       // 连续两轮相同 → 布局已稳定
    lastSh = sh;
    if ((!atBottom || !stable) && ++tries < 50) {
      setTimeout(keepBottom, 100);
    }
  };
  keepBottom();

  tab._jumping = false;
  if (tab.infiniteFinished && ok) {
    toast(`已跳到最后一行，共 ${formatNum(tab.infiniteCount || 0)} 行`, 'success');
  } else {
    toast(`已加载 ${formatNum(tab.infiniteCount || 0)} 行，未到末尾`, 'error');
  }
  updateFabEnd();
}
fab.addEventListener('click', jumpToEnd);

/* ================== 导出 CSV ================== */
function exportCSV() {
  const tab = state.openTabs.find(t => tabKey(t) === state.activeTabKey);
  if (!tab || tab.table === '__SCHEMA__') {
    toast('请选择数据表后再导出', 'error');
    return;
  }
  const db = state.databases.find(d => d.id === tab.dbId);
  const t = db.tables.find(x => x.name === tab.table);
  const where = buildWhereClause(tab, t);
  let sql, params;
  if (where) {
    sql = `SELECT * FROM "${tab.table}" WHERE ${where.sql}`;
    params = where.params;
  } else {
    sql = `SELECT * FROM "${tab.table}"`;
    params = [];
  }
  const stmt = db.db.prepare(sql);
  stmt.bind(params);
  const rows = [];
  const cols = t.cols.map(c => c.name);
  while (stmt.step()) rows.push(stmt.getAsObject());
  stmt.free();

  const csv = [
    cols.join(','),
    ...rows.map(r => cols.map(c => {
      const v = r[c];
      if (v === null || v === undefined) return '';
      const s = typeof v === 'object' ? JSON.stringify(v) : String(v);
      return /[",\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s;
    }).join(','))
  ].join('\n');

  const blob = new Blob(['\ufeff' + csv], { type: 'text/csv;charset=utf-8;' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `${tab.table}.csv`;
  a.click();
  toast(`已导出 ${formatNum(rows.length)} 行`, 'success');
}

function switchLoadMode(tab, mode) {
  if (tab.loadMode === mode) return;
  tab.loadMode = mode;
  tab.infiniteLoaded = [];
  tab.infiniteCount = 0;
  tab.infinitePage = 0;
  tab.infiniteFinished = false;
  tab._loading = false;
  tab._totalElapsed = 0;
  if (mode === 'page') {
    tab.page = 1;
  }
  renderContent();
}

// 输入页数：失焦/回车均跳转，自动夹取到 [1, 总页数]，非法输入回写为当前页。
// 内联逻辑（仅依赖全局 getActiveTabSafe / renderContent，避免外部函数作用域问题）。
function clampPageInput(tab, inputEl) {
  const totalPages = parseInt($('totalPages').textContent) || 1;
  let p = parseInt(inputEl.value, 10);
  if (isNaN(p) || p < 1) p = 1;
  if (p > totalPages) p = totalPages;
  tab.page = p;
  inputEl.value = p;
  renderContent();
}
$('pageInput').onchange = (e) => {
  const tab = getActiveTabSafe();
  if (tab) clampPageInput(tab, e.target);
};
$('pageInput').onkeydown = (e) => {
  if (e.key === 'Enter') {
    e.preventDefault();
    // 直接用全局 state（避免 onkeydown 闭包解析 getActiveTabSafe / clampPageInput 时的作用域怪象）
    const tab = state.openTabs.find(t => tabKey(t) === state.activeTabKey);
    if (!tab) return;
    const totalPages = parseInt($('totalPages').textContent) || 1;
    let p = parseInt(e.target.value, 10);
    if (isNaN(p) || p < 1) p = 1;
    if (p > totalPages) p = totalPages;
    tab.page = p;
    e.target.value = p;
    renderContent();
  }
};

// 复制文本到剪贴板（兼容旧浏览器回退）
async function copyToClipboard(text) {
  try {
    await navigator.clipboard.writeText(text);
    return true;
  } catch (e) {
    try {
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      ta.remove();
      return true;
    } catch (e2) { return false; }
  }
}

// 内容区事件委托：双击任一数据单元格即复制其内容
$('contentArea').addEventListener('dblclick', async (e) => {

  const td = e.target.closest('td');

  // 保证是数据表格单元格（表头用 th，天然被跳过；schema 表格由 schema-table 渲染）
  if (!td.closest('.data-table')) return;

  // 取原始文本（json 单元格也是纯文本）
  const text = td.textContent;
  const ok = await copyToClipboard(text);
  if (ok) {
    toast(`已复制${text.length > 20 ? '（前 20 字）' : ''}：「${text.slice(0, 20)}${text.length > 20 ? '…' : ''}」`, 'success');
  } else {
    toast('复制失败，请手动选择复制', 'error');

});

/* ================== 表头列筛选交互 ==================
   模式：面板内交互全部操作 pending 副本（_pendingChecks/_pendingLike），
   不触发表格重渲染；点「确认」才一次性写入 columnChecks/columnFilters 并重渲染。
   关闭路径（ESC / 点击外部 / 再次点 ⌕）= 丢弃 pending，保留原筛选。
   × 直接清已提交状态（不打开面板的快捷路径）。 */

// 表格滚动容器位置保持：面板打开/关闭/确认前后视图不窜位
// （renderContent 重建 innerHTML 会让 .grid-container 滚动重置为 0，
//   用户点开面板后视图会跳回表格左上角，面板"不知去向"）
function preserveGridScroll(renderFn) {
  const c = document.querySelector('.grid-container');
  const saved = c ? { left: c.scrollLeft, top: c.scrollTop } : null;
  renderFn();
  const c2 = document.querySelector('.grid-container');
  if (saved && c2) {
    c2.scrollLeft = saved.left;
    c2.scrollTop = saved.top;
  }
  // 滚动恢复后再挂载悬浮面板：此时列头位置是最终值，面板定位才准确
  const tab = getActiveDataTab();
  if (tab && tab._openFilterCol) mountFilterPanelFixed(tab._openFilterCol);
}

/* 悬浮面板挂载：把面板从 th 内移到 body（fixed 定位），出现在列头正下方。
   - 表头行高度不变（面板不占文档流，不会把表格往下推）
   - 右侧溢出视口时左移；底部溢出时改为列头上方
   - 幂等：已挂载则只重新定位（滚动/渲染后可重复调用校准位置） */
function mountFilterPanelFixed(colName) {
  const sel = `[data-col-input="${cssEscape(colName)}"]`;
  let wrap = document.querySelector(`body > .col-filter-input-wrap` + sel);
  if (!wrap) {
    wrap = document.querySelector(sel);
    if (!wrap) return;
    wrap.classList.add('col-filter-float');
    document.body.appendChild(wrap);
  }
  const th = document.querySelector(`th.col-head[data-col="${cssEscape(colName)}"]`);
  if (!th) return;   // 列头不在（如切到 schema 视图），面板交给 renderContent 清理
  const r = th.getBoundingClientRect();
  const pw = wrap.offsetWidth || 250;
  const ph = wrap.offsetHeight || 300;
  let left = r.left;
  const maxLeft = window.innerWidth - pw - 8;
  if (left > maxLeft) left = Math.max(8, maxLeft);
  let top = r.bottom + 4;
  if (top + ph > window.innerHeight - 8) {
    top = Math.max(8, r.top - ph - 4);   // 放不下则改列头上方
  }
  wrap.style.left = left + 'px';
  wrap.style.top = top + 'px';
}

// 打开筛选面板：从已提交值拷一份到 pending 作初始值
function setFilterPanelOpen(tab, colName) {
  const cur = Array.isArray(tab.columnChecks && tab.columnChecks[colName]) ? tab.columnChecks[colName] : [];
  tab._pendingChecks = { ...(tab._pendingChecks || {}), [colName]: [...cur] };
  tab._pendingLike = { ...(tab._pendingLike || {}), [colName]: (tab.columnFilters && tab.columnFilters[colName]) || '' };
  tab._openFilterCol = colName;
  preserveGridScroll(() => renderContent());
  // preventScroll：焦点不触发浏览器自动滚动（面板就在点击位置，无需滚动）
  const input = document.querySelector(`[data-col-input-field="${cssEscape(colName)}"]`);
  if (input) { input.focus({ preventScroll: true }); input.select(); }
}

// 关闭并丢弃 pending（用于 ESC / 点击外部 / 再次点 ⌕）
function closeFilterPanelDiscard(tab) {
  if (!tab || !tab._openFilterCol) return false;
  tab._openFilterCol = null;
  preserveGridScroll(() => renderContent());
  return true;
}

// 轻量关闭：只移除悬浮面板节点 + 复位 ⌕ 图标，不重渲染表格。
// 用于滚动/resize 场景——fixed 面板不跟随列头，位置已错位必须关，
// 但滚动是高频事件，走全表重渲染（无限模式可能几千行）会卡顿。
function closeFilterPanelLight() {
  const tab = getActiveDataTab();
  const wraps = document.querySelectorAll('body > .col-filter-input-wrap');
  if (!wraps.length && !(tab && tab._openFilterCol)) return;
  wraps.forEach(el => el.remove());
  if (!tab || !tab._openFilterCol) return;
  const col = tab._openFilterCol;
  tab._openFilterCol = null;
  const btn = document.querySelector(`.col-filter-toggle[data-col-toggle="${cssEscape(col)}"]`);
  if (btn) btn.classList.remove('is-open');
}

// 读取某列当前 pending 勾选数组（不存在则从已提交值初始化）
function pendingChecksOf(tab, colName) {
  if (!tab._pendingChecks) tab._pendingChecks = {};
  if (!Array.isArray(tab._pendingChecks[colName])) {
    const cur = Array.isArray(tab.columnChecks && tab.columnChecks[colName]) ? tab.columnChecks[colName] : [];
    tab._pendingChecks[colName] = [...cur];
  }
  return tab._pendingChecks[colName];
}

// 读取某列当前 pending 模糊词（不存在则从已提交值初始化）
function pendingLikeOf(tab, colName) {
  if (!tab._pendingLike) tab._pendingLike = {};
  if (typeof tab._pendingLike[colName] !== 'string') {
    tab._pendingLike[colName] = (tab.columnFilters && tab.columnFilters[colName]) || '';
  }
  return tab._pendingLike[colName];
}

// 按关键词过滤面板候选词显示（纯 DOM，不触发查询）
function filterPanelOptions(colName, q) {
  const wrap = document.querySelector(`[data-col-input="${cssEscape(colName)}"]`);
  if (!wrap) return;
  const s = (q || '').trim().toLowerCase();
  wrap.querySelectorAll('.col-filter-option').forEach(o => {
    const v = (o.dataset.val || '').toLowerCase();
    o.style.display = (!s || v.includes(s)) ? '' : 'none';
  });
}

// 刷新面板内「已选 N」计数 + 同步 checkbox checked 态（与 pending 数组保持一致）
function refreshPanelCount(tab, colName) {
  const wrap = document.querySelector(`[data-col-input="${cssEscape(colName)}"]`);
  if (!wrap) return;
  const arr = pendingChecksOf(tab, colName);
  wrap.querySelectorAll('.col-filter-option').forEach(o => {
    const val = o.hasAttribute('data-isnull') ? null : o.dataset.val;
    const cb = o.querySelector('input[type=checkbox]');
    if (cb) cb.checked = arr.some(v => v === val);
  });
  const tools = wrap.querySelector('.col-filter-tools');
  if (!tools) return;
  const old = tools.querySelector('.col-filter-count');
  const html = arr.length ? `<span class="col-filter-count">已选 ${arr.length}</span>` : '';
  if (old) {
    if (html) old.outerHTML = html;
    else old.remove();
  } else if (html) {
    const confirmBtn = tools.querySelector('[data-col-confirm]');
    if (confirmBtn) confirmBtn.insertAdjacentHTML('beforebegin', html);
    else tools.insertAdjacentHTML('beforeend', html);
  }
}

// 点击交互：toggle / × / 全选 / 清空勾选 / 确认 / 列头切换
// （挂 document：悬浮面板在 body 下，事件不再经过 contentArea）
document.addEventListener('click', (e) => {
  // 切换按钮（⌕）→ 打开或关闭面板（关闭时丢弃 pending）
  const toggle = e.target.closest('[data-col-toggle]');
  if (toggle) {
    const colName = toggle.dataset.colToggle;
    const tab = getActiveDataTab();
    if (tab) {
      if (tab._openFilterCol === colName) closeFilterPanelDiscard(tab);
      else setFilterPanelOpen(tab, colName);
    }
    e.stopPropagation();
    return;
  }
  // 列头清除按钮（×）→ 直接清已提交筛选（快捷路径，不开面板）
  const clear = e.target.closest('[data-col-clear]');
  if (clear) {
    const colName = clear.dataset.colClear;
    const tab = getActiveDataTab();
    if (tab) {
      const nf = { ...(tab.columnFilters || {}) }; delete nf[colName]; tab.columnFilters = nf;
      const nc = { ...(tab.columnChecks || {}) }; delete nc[colName]; tab.columnChecks = nc;
      // 一并清掉 pending，避免下次打开面板残留旧 pending
      if (tab._pendingChecks) { const pc = { ...tab._pendingChecks }; delete pc[colName]; tab._pendingChecks = pc; }
      if (tab._pendingLike) { const pl = { ...tab._pendingLike }; delete pl[colName]; tab._pendingLike = pl; }
      resetTabLoading(tab);
      renderContent();
    }
    e.stopPropagation();
    return;
  }
  // 全选 → 把所有「可见」候选加入 pending（不写入 columnChecks）
  const selectAll = e.target.closest('[data-col-selectall]');
  if (selectAll) {
    const colName = selectAll.dataset.colSelectall;
    const tab = getActiveDataTab();
    if (tab) {
      const wrap = document.querySelector(`[data-col-input="${cssEscape(colName)}"]`);
      const opts = wrap ? [...wrap.querySelectorAll('.col-filter-option')] : [];
      const arr = pendingChecksOf(tab, colName);
      opts.forEach(o => {
        if (o.style.display === 'none') return;
        const val = o.hasAttribute('data-isnull') ? null : o.dataset.val;
        if (!arr.some(v => v === val)) arr.push(val);
      });
      refreshPanelCount(tab, colName);
    }
    e.stopPropagation();
    return;
  }
  // 清空勾选 → pending 数组清空（不动模糊词）
  const clearChecks = e.target.closest('[data-col-clearchecks]');
  if (clearChecks) {
    const colName = clearChecks.dataset.colClearchecks;
    const tab = getActiveDataTab();
    if (tab) {
      pendingChecksOf(tab, colName).length = 0;
      refreshPanelCount(tab, colName);
    }
    e.stopPropagation();
    return;
  }
  // 确认 → pending 写入 columnChecks/columnFilters，关闭面板，触发筛选
  const confirm = e.target.closest('[data-col-confirm]');
  if (confirm) {
    const colName = confirm.dataset.colConfirm;
    const tab = getActiveDataTab();
    if (tab) {
      const arr = pendingChecksOf(tab, colName);
      const like = pendingLikeOf(tab, colName).trim();
      if (arr.length) {
        tab.columnChecks = { ...(tab.columnChecks || {}), [colName]: [...arr] };
      } else {
        const next = { ...(tab.columnChecks || {}) }; delete next[colName]; tab.columnChecks = next;
      }
      if (like) {
        tab.columnFilters = { ...(tab.columnFilters || {}), [colName]: like };
      } else {
        const next = { ...(tab.columnFilters || {}) }; delete next[colName]; tab.columnFilters = next;
      }
      tab._openFilterCol = null;
      resetTabLoading(tab);
      preserveGridScroll(() => renderContent());
    }
    e.stopPropagation();
    return;
  }
  // 面板内部其余点击（label/checkbox 等）不触发表头切换
  if (e.target.closest('.col-filter-panel')) return;
  // 点击表头列名（非按钮/输入框）→ 切换面板
  const head = e.target.closest('th.col-head');
  if (head) {
    const colName = head.dataset.col;
    const tab = getActiveDataTab();
    if (tab) {
      if (tab._openFilterCol === colName) closeFilterPanelDiscard(tab);
      else setFilterPanelOpen(tab, colName);
    }
  }
});

// checkbox 变化 → 操作 pending（不重渲染；挂 document 以覆盖悬浮面板）
document.addEventListener('change', (e) => {
  const cb = e.target.closest('[data-col-check]');
  if (!cb) return;
  const colName = cb.dataset.colCheck;
  const tab = getActiveDataTab();
  if (!tab) return;
  const val = cb.hasAttribute('data-isnull') ? null : cb.value;
  const arr = pendingChecksOf(tab, colName);
  if (cb.checked) {
    if (!arr.some(v => v === val)) arr.push(val);
  } else {
    const idx = arr.findIndex(v => v === val);
    if (idx >= 0) arr.splice(idx, 1);
  }
  refreshPanelCount(tab, colName);
});

// 输入框 → ① 立即过滤候选词 ② 仅写 pending（不触发 SQL；挂 document 以覆盖悬浮面板）
document.addEventListener('input', (e) => {
  const input = e.target.closest('.col-filter-input');
  if (!input) return;
  const colName = input.dataset.colInputField;
  const tab = getActiveDataTab();
  if (!tab) return;
  pendingLikeOf(tab, colName);   // 确保 pendingLike 已初始化
  tab._pendingLike[colName] = input.value;
  filterPanelOptions(colName, input.value);
});

// ESC 关闭面板（丢弃 pending）
document.addEventListener('keydown', (e) => {
  if (e.key !== 'Escape') return;
  const tab = getActiveDataTab();
  if (closeFilterPanelDiscard(tab)) e.preventDefault();
});

// 点击面板外部 → 关闭面板（丢弃 pending）
document.addEventListener('click', (e) => {
  if (e.target.closest('.col-filter-panel')) return;
  if (e.target.closest('[data-col-toggle]')) return;
  if (e.target.closest('th.col-head')) return;
  closeFilterPanelDiscard(getActiveDataTab());
});

// CSS.escape polyfill（极少数老浏览器缺失）
function cssEscape(s) {
  if (window.CSS && CSS.escape) return CSS.escape(s);
  return String(s).replace(/[^a-zA-Z0-9_-]/g, c => '\\' + c);
}

// 悬浮筛选面板是 fixed 定位、不跟随列头：滚动导致列头移位后把面板重新对齐到列头当前位置。
// 不能在错位时直接关闭：手机软键盘弹出会引发 resize + 页面滚动，面板若被关闭，
// 用户会「还没来得及勾选/输入」就消失。重新对齐后面板持续可用（类似 Excel 筛选体验）。
// scroll 事件不冒泡，必须用捕获阶段监听；面板内部滚动（候选列表）除外。
document.addEventListener('scroll', (e) => {
  const t = e.target;
  if (t instanceof Element && t.closest('.col-filter-input-wrap')) return;
  const tab = getActiveDataTab();
  const wrap = document.querySelector('body > .col-filter-input-wrap');
  if (!wrap || !tab || !tab._openFilterCol) return;
  const th = document.querySelector(`th.col-head[data-col="${cssEscape(tab._openFilterCol)}"]`);
  if (!th) { closeFilterPanelLight(); return; }
  const wr = wrap.getBoundingClientRect();
  const tr = th.getBoundingClientRect();
  // 面板应在列头正下方（常规）或列头上方（视口底部放不下时），横向与列头对齐
  const okBelow = wr.top >= tr.bottom - 4 && wr.top <= tr.bottom + 8;
  const okAbove = wr.bottom <= tr.top + 4 && wr.bottom >= tr.top - 8;
  const alignedX = Math.abs(wr.left - tr.left) <= 6;
  if (!(alignedX && (okBelow || okAbove))) mountFilterPanelFixed(tab._openFilterCol);
}, true);

// 响应窗口尺寸变化
window.addEventListener('resize', () => {
  // 手机/平板上打开面板会 focus 输入框 → 软键盘弹出 → 视口 resize。
  // 此时不能关闭面板（用户还没来得及勾选），而是把面板重新对齐到列头当前位置。
  const tab = getActiveDataTab();
  if (tab && tab._openFilterCol) mountFilterPanelFixed(tab._openFilterCol);
  const nowMobile = matchMedia('(max-width: 768px)').matches;
  if (nowMobile !== state.isMobile) {
    state.isMobile = nowMobile;
    renderContent();
  }
});

/* ================== 启动 ================== */
if (localStorage.getItem('sqlite-sidebar-collapsed') === '1' && !state.isMobile) {
  document.body.classList.add('sidebar-collapsed');
}

theme.init();

(async () => {
  try {
    await initSQL();
    toast('SQLite 引擎已就绪', 'success');
  } catch (e) {
    toast('引擎加载失败，请检查网络', 'error');
    console.error(e);
  }
})();
</script>
</body>
</html>
