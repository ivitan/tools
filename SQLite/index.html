<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SQLite 读取工具</title>
<link rel="icon" type="image/svg+xml" href="/img/SQLite.svg" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.10.3/sql-wasm.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #f8fafc;
    --panel: #ffffff;
    --panel-hover: #f1f5f9;
    --border: #e2e8f0;
    --border-hover: #cbd5e1;
    --text: #0f172a;
    --text-secondary: #475569;
    --text-muted: #94a3b8;
    --primary: #3b82f6;
    --primary-hover: #2563eb;
    --primary-light: #eff6ff;
    --primary-soft: rgba(59,130,246,0.10);
    --success: #10b981;
    --success-light: #ecfdf5;
    --danger: #ef4444;
    --danger-light: #fef2f2;
    --warning: #d97706;
    --warning-light: #fef3c7;
    --scrollbar-thumb: #cbd5e1;
    --scrollbar-thumb-hover: #94a3b8;
    --shadow: 0 1px 3px rgba(0,0,0,0.05), 0 1px 2px rgba(0,0,0,0.03);
    --shadow-lg: 0 10px 15px -3px rgba(0,0,0,0.08), 0 4px 6px -2px rgba(0,0,0,0.04);
    --header-row: #f8fafc;
    --row-hover: #f8fafc;
    --dropzone-bg: #ffffff;
    --code-bg: #f1f5f9;
    --table-row-border: #f1f5f9;
  }

  [data-theme="dark"] {
    --bg: #0b1220;
    --panel: #111827;
    --panel-hover: #1e293b;          /* 提亮一档 */
    --border: #1f2937;
    --border-hover: #475569;        /* 提亮两档，用于 hover/focus */
    --text: #f1f5f9;                /* slate-100，提亮避免刺眼 */
    --text-secondary: #cbd5e1;      /* slate-300，关键次级文字 */
    --text-muted: #94a3b8;          /* slate-400，最低仍可读 */
    --primary: #60a5fa;             /* blue-400，深色下更亮 */
    --primary-hover: #93c5fd;
    --primary-light: rgba(96,165,250,0.18);
    --primary-soft: rgba(96,165,250,0.22);
    --primary-on: #0b1220;          /* 用于 primary 背景上的文字色 */
    --success: #34d399;
    --success-light: rgba(52,211,153,0.18);
    --danger: #f87171;
    --danger-light: rgba(248,113,113,0.18);
    --warning: #fbbf24;
    --warning-light: rgba(251,191,36,0.20);
    --scrollbar-thumb: #475569;
    --scrollbar-thumb-hover: #64748b;
    --shadow: 0 1px 3px rgba(0,0,0,0.5);
    --shadow-lg: 0 10px 25px rgba(0,0,0,0.5);
    --header-row: #0f172a;
    --row-hover: #1e293b;
    --dropzone-bg: #0f172a;
    --code-bg: #0a1224;
    --table-row-border: #1e293b;
    --tab-close-hover: rgba(255,255,255,0.12);
  }

  html, body { height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: var(--bg);
    color: var(--text);
    font-size: 14px;
    line-height: 1.5;
    overflow: hidden;
    transition: background-color 0.15s, color 0.15s;
  }

  /* ===== Header ===== */
  .header {
    height: 52px;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    padding: 0 16px;
    box-shadow: var(--shadow);
    z-index: 20;
    gap: 8px;
    position: sticky;
    top: 0;
  }
  .logo {
    display: flex;
    align-items: center;
    gap: 10px;
    font-weight: 600;
    font-size: 15px;
  }
  .logo-icon {
    width: 28px;
    height: 28px;
    background: var(--primary);
    border-radius: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #fff;
  }
  /* 标题旁的「返回主页」圆形按钮（参照参考图的样式） */
  .home-btn {
    margin-left: 4px;
    width: 30px;
    height: 30px;
    border-radius: 50%;
    border: none;
    background: var(--panel-hover);
    color: var(--primary);
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    transition: background-color 0.15s, transform 0.15s, color 0.15s;
  }
  .home-btn:hover {
    background: var(--primary);
    color: #fff;
    transform: translateY(-1px);
  }
  .home-btn:active { transform: translateY(0); }
  [data-theme="dark"] .home-btn { background: var(--panel-hover); }
  [data-theme="dark"] .home-btn:hover { color: #fff; }
  .header-spacer { flex: 1; }
  .header-actions {
    display: flex;
    gap: 6px;
    align-items: center;
  }
  .icon-btn {
    width: 32px;
    height: 32px;
    border-radius: 6px;
    border: 1px solid transparent;
    background: transparent;
    color: var(--text-secondary);
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    transition: all 0.15s;
  }
  .icon-btn:hover {
    background: var(--panel-hover);
    color: var(--text);
    border-color: var(--border);
  }
  .btn {
    height: 32px;
    padding: 0 12px;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: var(--panel);
    color: var(--text);
    font-size: 13px;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    transition: all 0.15s;
  }
  .btn:hover { border-color: var(--border-hover); background: var(--panel-hover); }
  .btn-primary {
    background: var(--primary);
    border-color: var(--primary);
    color: #fff;
  }
  .btn-primary:hover { background: var(--primary-hover); border-color: var(--primary-hover); }

  /* ===== Layout ===== */
  .layout {
    display: flex;
    /* dvh 随移动端地址栏收起/展开动态变化；100vh 是地址栏收起时的最大值，
       实际可视高度比它小 60~100px，会导致表格底部最后两行被地址栏遮挡 */
    height: calc(100vh - 52px);
    height: calc(100dvh - 52px);
    position: relative;
  }
  .sidebar {
    width: 240px;
    background: var(--panel);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    flex-shrink: 0;
    transition: width 0.2s ease, border-color 0.2s ease, transform 0.22s ease;
    overflow: hidden;
    min-width: 0;
  }
  body.sidebar-collapsed .sidebar { width: 0; border-right: 0; }
  .sidebar-overlay {
    display: none;
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    background: rgba(0,0,0,0.45);
    z-index: 40;
    opacity: 0;
    transition: opacity 0.2s;
  }
  body.sidebar-open .sidebar-overlay {
    display: block;
    opacity: 1;
  }
  .sidebar-header {
    padding: 10px 12px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    min-height: 38px;
  }
  .sidebar-title {
    font-size: 12px;
    font-weight: 600;
    color: var(--text-secondary);
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  .sidebar-count {
    background: var(--primary-soft);
    color: var(--primary);
    padding: 2px 8px;
    border-radius: 10px;
    font-size: 11px;
    font-weight: 600;
  }
  .db-list {
    flex: 1;
    overflow-y: auto;
    padding: 6px;
  }
  .db-item {
    margin-bottom: 2px;
    border-radius: 6px;
    overflow: hidden;
  }
  .db-item.active > .db-header {
    background: var(--primary-soft);
    color: var(--primary);
  }
  [data-theme="dark"] .db-item.active > .db-header {
    background: var(--primary-soft);
    color: var(--primary-hover);
  }
  .db-header {
    padding: 6px 8px;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 6px;
    border-radius: 4px;
    transition: background-color 0.12s;
    min-height: 28px;
  }
  .db-header:hover { background: var(--panel-hover); }
  .db-item.active > .db-header:hover { background: var(--primary-soft); }
  .db-chevron {
    width: 12px;
    height: 12px;
    flex-shrink: 0;
    color: var(--text-muted);
    transition: transform 0.15s;
  }
  .db-item.expanded .db-chevron { transform: rotate(90deg); }
  .db-icon {
    width: 14px;
    height: 14px;
    flex-shrink: 0;
    color: var(--primary);
  }
  .db-name {
    flex: 1;
    font-size: 13px;
    font-weight: 500;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .db-meta {
    font-size: 11px;
    color: var(--text-muted);
    font-weight: 500;
    flex-shrink: 0;
    font-variant-numeric: tabular-nums;
  }
  .db-remove {
    width: 18px;
    height: 18px;
    border-radius: 3px;
    border: none;
    background: transparent;
    color: var(--text-muted);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    transition: all 0.15s;
    flex-shrink: 0;
  }
  .db-header:hover .db-remove { opacity: 1; }
  .db-remove:hover { background: var(--danger-light); color: var(--danger); }
  .table-list {
    padding: 2px 4px 6px 22px;
    display: none;
  }
  .db-item.expanded .table-list { display: block; }
  .table-item {
    padding: 4px 8px;
    border-radius: 4px;
    cursor: pointer;
    font-size: 12.5px;
    color: var(--text-secondary);
    display: flex;
    align-items: center;
    gap: 6px;
    transition: all 0.12s;
    min-height: 26px;
  }
  .table-item:hover { background: var(--panel-hover); color: var(--text); }
  .table-item.active { background: var(--primary); color: #fff; }
  .table-item.active .table-count { color: rgba(255,255,255,0.85); }
  .table-icon {
    width: 12px;
    height: 12px;
    opacity: 0.7;
    flex-shrink: 0;
  }
  .table-name {
    flex: 1;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .table-count {
    font-size: 11px;
    font-weight: 500;
    color: var(--text-muted);
    font-variant-numeric: tabular-nums;
    flex-shrink: 0;
  }
  .table-item.active .table-count { color: rgba(255,255,255,0.95); font-weight: 600; }

  /* ===== Main ===== */
  .main {
    flex: 1;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    min-width: 0;
  }

  /* ===== Dropzone ===== */
  .dropzone {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    margin: 20px;
    border: 2px dashed var(--border-hover);
    border-radius: 12px;
    background: var(--dropzone-bg);
    transition: all 0.2s;
    cursor: pointer;
  }
  .dropzone:hover, .dropzone.drag-over {
    border-color: var(--primary);
    background: var(--primary-light);
  }
  .dropzone-icon {
    width: 56px;
    height: 56px;
    color: var(--text-muted);
    margin-bottom: 14px;
  }
  .dropzone.drag-over .dropzone-icon { color: var(--primary); }
  .dropzone-title {
    font-size: 15px;
    font-weight: 600;
    margin-bottom: 4px;
  }
  .dropzone-desc {
    color: var(--text-secondary);
    font-size: 13px;
    font-weight: 500;
    margin-bottom: 14px;
  }
  .dropzone button {
    height: 34px;
    padding: 0 18px;
    border-radius: 6px;
    border: none;
    background: var(--primary);
    color: #fff;
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.15s;
  }
  .dropzone button:hover { background: var(--primary-hover); }

  /* ===== Toolbar ===== */
  .toolbar {
    height: 44px;
    padding: 0 14px;
    border-bottom: 1px solid var(--border);
    background: var(--panel);
    display: flex;
    align-items: center;
    gap: 10px;
    flex-shrink: 0;
  }
  .breadcrumb {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 13px;
    flex: 1;
    min-width: 0;
    overflow: hidden;
  }
  .breadcrumb-item {
    color: var(--text-secondary);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .breadcrumb-item.current {
    color: var(--text);
    font-weight: 600;
  }
  .breadcrumb-sep {
    color: var(--text-muted);
    font-weight: 500;
    flex-shrink: 0;
  }
  .toolbar-input {
    height: 30px;
    padding: 0 10px;
    border: 1px solid var(--border);
    border-radius: 6px;
    font-size: 13px;
    width: 220px;
    outline: none;
    transition: border-color 0.15s;
    background: var(--panel);
    color: var(--text);
  }
  .toolbar-input:focus { border-color: var(--primary); }
  .toolbar-input::placeholder { color: var(--text-muted); font-weight: 400; }

  /* ===== Mode Toggle ===== */
  .mode-toggle {
    display: inline-flex;
    border: 1px solid var(--border);
    border-radius: 6px;
    overflow: hidden;
    background: var(--panel);
    flex-shrink: 0;
  }
  .mode-toggle button {
    height: 30px;
    padding: 0 10px;
    border: none;
    background: transparent;
    color: var(--text-secondary);
    font-weight: 500;
    cursor: pointer;
    font-size: 12px;
    display: inline-flex;
    align-items: center;
    gap: 4px;
    transition: all 0.12s;
    border-right: 1px solid var(--border);
  }
  .mode-toggle button:last-child { border-right: none; }
  .mode-toggle button:hover { background: var(--panel-hover); color: var(--text); }
  .mode-toggle button.active {
    background: var(--primary);
    color: #fff;
  }
  .mode-toggle button svg { flex-shrink: 0; }

  /* ===== Tabs ===== */
  .tabs {
    /* 不能用固定 height：标签页是「表名 + 数据库名」上下两行，固定高度会让
       .tab 被 stretch 压缩，row1/row2 各被 flex-shrink 削掉一半，文字被截半且两行重叠。
       改 min-height：没有标签时保持 34px 占位，有标签时按内容自动撑开。
       高度预留 ≈ 两行标签(42px) + 横向滚动条(≈6px)，避免桌面浏览器滚动条占用高度时
       把两行文字裁掉。 */
    min-height: 48px;
    padding: 0 14px;
    border-bottom: 1px solid var(--border);
    background: var(--panel);
    display: flex;
    align-items: stretch;
    gap: 2px;
    flex-shrink: 0;
    overflow-x: auto;
    overflow-y: hidden;
    /* 横向滚动条细一点、颜色淡一点，保持整体简洁 */
    scrollbar-width: thin;
    scrollbar-color: var(--border) transparent;
  }
  .tabs::-webkit-scrollbar { height: 6px; }
  .tabs::-webkit-scrollbar-track { background: transparent; }
  .tabs::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
  .tabs::-webkit-scrollbar-thumb:hover { background: var(--text-muted); }
  /* 标签页：上下两行显示——上行表名（突出），下行数据库名（小字灰色）。
     数据库名宽度上限由 JS 在 renderTabs 里按「不超过表名宽度」规则设置 */
  .tab {
    padding: 4px 10px;
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    justify-content: center;
    gap: 1px;
    font-size: 13px;
    font-weight: 500;
    color: var(--text-secondary);
    cursor: pointer;
    border-bottom: 2px solid transparent;
    transition: all 0.12s;
    position: relative;
    min-width: 60px;
    max-width: 220px;
    /* 不收缩：标签多时不挤压每个 tab 的宽度（避免名字被进一步截断），
       超出部分由 .tabs 横向滚动（左右滑动）切换 */
    flex-shrink: 0;
  }
  /* 两行都给右上角关闭按钮（16px 宽 + right:4px）预留空间，
     否则 width:100% 的文本行会被 absolute 的 .tab-close 盖住右半段。
     flex: none + 固定 line-height：禁止被压缩，否则文字会被截掉下半截。 */
  .tab-row1 {
    flex: none;
    width: 100%;
    padding-right: 22px;
    line-height: 17px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .tab-row2 {
    flex: none;
    width: 100%;
    padding-right: 22px;
    line-height: 14px;
    font-size: 11px;
    opacity: 0.55;
    font-weight: 400;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  /* max-width 由 renderTabs 用离屏探针按「不超过表名宽度」动态设置 */
  /* max-width 对 inline 元素无效，必须 inline-block，否则 JS 设的上限不生效 */
  .tab-db-name {
    display: inline-block;
    max-width: 100%;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    vertical-align: bottom;
  }
  .tab:hover { color: var(--text); background: var(--panel-hover); }
  .tab.active {
    color: var(--primary);
    border-bottom-color: var(--primary);
    font-weight: 600;
  }
  [data-theme="dark"] .tab.active {
    color: var(--primary-hover);
    border-bottom-color: var(--primary-hover);
  }
  .tab-close {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    right: 4px;
    width: 18px;
    height: 18px;
    border-radius: 4px;
    border: none;
    background: transparent;
    color: var(--text-secondary);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0.85;
    font-weight: 700;
    transition: background 0.12s, color 0.12s, opacity 0.12s;
  }
  /* 整行 hover 时 × 也提亮，提示可点 */
  .tab:hover .tab-close { opacity: 1; }
  .tab-close:hover {
    background: rgba(239,68,68,0.14);
    color: #ef4444;
    opacity: 1;
  }
  [data-theme="dark"] .tab-close:hover {
    background: rgba(248,113,113,0.20);
    color: #f87171;
  }

  /* ===== Content area ===== */
  .content-area {
    flex: 1;
    overflow: hidden;
    background: var(--bg);
    display: flex;
    flex-direction: column;
  }
  .empty-content {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--text-secondary);
    font-size: 13px;
    font-weight: 500;
  }

  /* ===== Schema view ===== */
  .schema-view {
    flex: 1;
    overflow: auto;
    padding: 16px;
  }
  .schema-card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    margin-bottom: 14px;
    overflow: hidden;
  }
  .schema-card-header {
    padding: 10px 14px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .schema-card-title {
    font-weight: 600;
    font-size: 13.5px;
  }
  .schema-card-meta {
    color: var(--text-muted);
    font-size: 12px;
    font-weight: 500;
  }
  .schema-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
  }
  .schema-table th {
    text-align: left;
    padding: 8px 14px;
    background: var(--header-row);
    border-bottom: 1px solid var(--border);
    font-weight: 600;
    font-size: 11.5px;
    color: var(--text);
    text-transform: uppercase;
    letter-spacing: 0.4px;
  }
  .schema-table td {
    padding: 7px 14px;
    border-bottom: 1px solid var(--table-row-border);
  }
  .schema-table tr:last-child td { border-bottom: none; }
  .badge {
    display: inline-block;
    padding: 1px 6px;
    border-radius: 4px;
    font-size: 10.5px;
    font-weight: 600;
    background: var(--primary-light);
    color: var(--primary);
  }
  .badge-pk { background: var(--warning-light); color: var(--warning); }
  .badge-nn { background: var(--success-light); color: var(--success); }

  /* ===== 数据网格 ===== */
  .data-wrap {
    flex: 1;
    display: flex;
    flex-direction: column;
    min-height: 0;
  }
  .status-bar {
    height: 30px;
    padding: 0 14px;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 14px;
    font-size: 12.5px;
    font-weight: 500;
    color: var(--text-secondary);
    flex-shrink: 0;
    flex-wrap: wrap;
  }
  .status-bar .stat { display: inline-flex; align-items: center; gap: 5px; }
  .status-bar .stat strong { color: var(--text); font-weight: 600; font-variant-numeric: tabular-nums; }
  .status-bar .stat-sep { color: var(--border-hover); font-weight: 400; }

  .grid-container {
    flex: 1;
    overflow: auto;
    background: var(--panel);
    position: relative;
  }
  .data-table {
    border-collapse: separate;
    border-spacing: 0;
    font-size: 12.5px;
    width: max-content;
    min-width: 100%;
  }
  .data-table th {
    background: var(--header-row);
    border-bottom: 1px solid var(--border);
    border-right: 1px solid var(--border);
    padding: 8px 10px;
    text-align: left;
    font-weight: 600;
    font-size: 12px;
    color: var(--text);
    white-space: nowrap;
    position: sticky;
    top: 0;
    user-select: none;
  }
  .data-table th .col-type {
    display: block;
    font-weight: 500;
    font-size: 11px;
    color: var(--text-muted);
    margin-top: 1px;
    font-family: "SF Mono", Monaco, Consolas, monospace;
    letter-spacing: 0.2px;
  }

  /* ===== 表头列筛选 ===== */
  .col-head { cursor: pointer; }
  /* 表头列内容改为上下两行：上行字段名 + 筛选按钮，下行数据类型（小字） */
  .col-head-main {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 1px;
  }
  /* 第一行：字段名 + ⌕ + ×，三者在同一行内 flex 布局 */
  .col-head-row1 {
    display: flex;
    align-items: center;
    gap: 4px;
    width: 100%;
    /* ⌕/× 按钮已改为绝对定位（不占 flex 空间），
       这里只需保证 col-name 自身能容纳按钮区域且字段名不会和按钮文字重叠 */
    position: relative;
  }
  .col-head .col-name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; text-align: center; }
  .col-head .col-type { flex: none; text-align: center; }
  .col-filter-toggle {
    width: 18px;
    height: 18px;
    border-radius: 3px;
    border: none;
    background: transparent;
    color: var(--text-muted);
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-size: 14px;
    font-weight: 600;
    line-height: 1;
    opacity: 0;
    transition: all 0.12s;
    /* 绝对定位浮在右上角，不再占 col-name 的横向空间 */
    position: absolute;
    right: 4px;
    top: 50%;
    transform: translateY(-50%);
    z-index: 2;
  }
  .col-head:hover .col-filter-toggle { opacity: 0.85; }
  .col-filter-toggle:hover { background: var(--primary-soft); color: var(--primary); opacity: 1; }
  .col-head.is-filtered .col-filter-toggle { opacity: 1; color: var(--primary); }
  .col-filter-toggle.is-open { opacity: 1; background: var(--primary-soft); color: var(--primary); }
  .col-filter-clear {
    width: 18px;
    height: 18px;
    border-radius: 3px;
    border: none;
    background: transparent;
    color: var(--danger);
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-size: 13px;
    font-weight: 700;
    line-height: 1;
    /* 绝对定位贴在 ⌕ 按钮左侧，与 ⌕ 一起浮在右上角 */
    position: absolute;
    right: 24px;
    top: 50%;
    transform: translateY(-50%);
    z-index: 2;
  }
  .col-filter-clear:hover { background: var(--danger-light); }
  .col-filter-val {
    margin-top: 2px;
    font-size: 10.5px;
    font-weight: 600;
    color: var(--primary);
    max-width: 200px;
    overflow: hidden;
    text-overflow: ellipsis;
    text-align: center;
  }
  .col-head.is-filtered {
    background: var(--primary-soft) !important;
    box-shadow: inset 0 -2px 0 var(--primary);
  }
  .col-filter-input-wrap { margin-top: 4px; }
  /* 悬浮面板：挂到 body、fixed 定位在列头正下方。
     表头行高度不变（面板不占文档流），面板浮在表格上层，出现在用户点击的位置 */
  .col-filter-input-wrap.col-filter-float {
    position: fixed;
    margin-top: 0;
    z-index: 400;
  }
  .col-filter-float .col-filter-panel {
    width: 250px;
    box-sizing: border-box;
  }
  .col-filter-panel {
    display: flex;
    flex-direction: column;
    gap: 5px;
    padding: 7px;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: var(--panel);
    box-shadow: var(--shadow-lg);
    min-width: 200px;
    text-align: left;
  }
  .col-filter-input {
    width: 100%;
    box-sizing: border-box;
    height: 24px;
    padding: 0 6px;
    border: 1px solid var(--border-hover);
    border-radius: 4px;
    background: var(--panel);
    color: var(--text);
    font-size: 12px;
    outline: none;
    user-select: text;
  }
  .col-filter-input:focus { border-color: var(--primary); }
  .col-filter-input::placeholder { color: var(--text-muted); font-size: 11px; }
  .col-filter-tools {
    display: flex;
    align-items: center;
    gap: 4px;
  }
  .col-filter-tool-btn {
    height: 21px;
    padding: 0 9px;
    border-radius: 4px;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--text-secondary);
    font-size: 11px;
    cursor: pointer;
    transition: all 0.12s;
    white-space: nowrap;
  }
  .col-filter-tool-btn:hover { border-color: var(--primary); color: var(--primary); }
  /* 确认按钮：主色突出，面板中最重要的操作 */
  .col-filter-tool-btn.col-filter-confirm {
    margin-left: auto;
    background: var(--primary);
    border-color: var(--primary);
    color: #fff;
    font-weight: 600;
  }
  .col-filter-tool-btn.col-filter-confirm:hover {
    background: var(--primary-hover);
    border-color: var(--primary-hover);
    color: #fff;
  }
  .col-filter-count {
    font-size: 10.5px;
    font-weight: 600;
    color: var(--primary);
    white-space: nowrap;
  }
  .col-filter-options {
    display: flex;
    flex-direction: column;
    max-height: 190px;
    overflow-y: auto;
    border: 1px solid var(--table-row-border);
    border-radius: 4px;
    padding: 2px;
  }
  .col-filter-options:empty { display: none; }
  .col-filter-option {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 3px 6px;
    border-radius: 3px;
    cursor: pointer;
    font-size: 12px;
    min-width: 0;
    color: var(--text);
  }
  .col-filter-option:hover { background: var(--row-hover); }
  .col-filter-option input[type="checkbox"] {
    flex: none;
    margin: 0;
    width: 13px;
    height: 13px;
    accent-color: var(--primary);
    cursor: pointer;
  }
  .col-filter-option .opt-val {
    flex: 1;
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    font-family: "SF Mono", Monaco, Consolas, monospace;
    font-size: 11.5px;
  }
  .col-filter-option .opt-count {
    flex: none;
    font-size: 10px;
    font-weight: 600;
    color: var(--primary);
    background: var(--primary-soft);
    border-radius: 9px;
    padding: 0 7px;
    line-height: 16px;
    font-variant-numeric: tabular-nums;
  }
  .col-filter-option .opt-null {
    font-style: italic;
    color: var(--text-secondary);
  }
  .col-filter-more {
    font-size: 10.5px;
    color: var(--text-muted);
    line-height: 1.4;
  }
  .data-table td {
    padding: 6px 10px;
    border-bottom: 1px solid var(--table-row-border);
    border-right: 1px solid var(--table-row-border);
    max-width: 360px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    color: var(--text);
    user-select: text;
    text-align: center;
  }
  /* 数据单元格提示可双击复制（排除行号列与表头） */
  .data-table tbody td:not(.row-num) { cursor: copy; }
  .data-table tbody tr:hover td { background: var(--row-hover); }
  [data-theme="dark"] .data-table tbody tr:hover td { background: #243044; }
  .data-table td.null {
    color: var(--text-secondary);
    font-style: italic;
    font-weight: 500;
  }
  .data-table td.number { text-align: center; font-variant-numeric: tabular-nums; }
  .data-table td.bool { text-align: center; }
  .data-table td.json { color: var(--primary); font-family: "SF Mono", Monaco, Consolas, monospace; font-size: 11.5px; }
  .row-num {
    background: var(--header-row) !important;
    color: var(--text-secondary);
    font-weight: 600;
    font-variant-numeric: tabular-nums;
    text-align: center;
    width: 50px;
    position: sticky;
    left: 0;
    z-index: 1;
  }
  .data-table thead th.row-num { z-index: 3; }

  /* ===== 无限滚动 Sentinel ===== */
  .infinite-sentinel {
    height: 60px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    color: var(--text-secondary);
    font-size: 12.5px;
    font-weight: 500;
  }
  .infinite-sentinel .end-mark {
    color: var(--success);
    font-weight: 600;
  }

  /* ===== Footer ===== */
  .footer-bar {
    height: 34px;
    padding: 0 14px;
    border-top: 1px solid var(--border);
    background: var(--panel);
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 12px;
    color: var(--text-secondary);
    flex-shrink: 0;
    gap: 12px;
  }
  .footer-bar.hidden { display: none !important; }
  .sql-box {
    background: var(--code-bg);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 5px 10px;
    font-family: "SF Mono", Monaco, Consolas, monospace;
    font-size: 11.5px;
    color: var(--text-secondary);
    flex: 1;
    overflow-x: auto;
    white-space: nowrap;
    min-width: 0;
  }
  [data-theme="dark"] .sql-box {
    background: #050b18;
    color: var(--text);
    border-color: var(--border);
  }
  .pager {
    display: flex;
    align-items: center;
    gap: 4px;
    flex-shrink: 0;
  }
  .pager button {
    height: 22px;
    min-width: 22px;
    padding: 0 6px;
    border-radius: 4px;
    border: 1px solid var(--border);
    background: var(--panel);
    color: var(--text);
    cursor: pointer;
    font-size: 11px;
    transition: all 0.12s;
  }
  .pager button:hover:not(:disabled) { border-color: var(--primary); color: var(--primary); }
  .pager button:disabled { opacity: 0.35; cursor: not-allowed; }
  .pager input {
    width: 40px;
    height: 22px;
    text-align: center;
    border: 1px solid var(--border);
    border-radius: 4px;
    font-size: 11px;
    outline: none;
    background: var(--panel);
    color: var(--text);
  }
  .pager input:focus { border-color: var(--primary); }
  .pager select {
    height: 22px;
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 0 4px;
    font-size: 11px;
    background: var(--panel);
    color: var(--text);
    cursor: pointer;
    outline: none;
  }
  .pager-text { font-size: 11px; color: var(--text-secondary); white-space: nowrap; }
  /* ===== Toast ===== */
  .toast {
    position: fixed;
    top: 16px;
    right: 16px;
    background: var(--text);
    color: var(--panel);
    padding: 9px 16px;
    border-radius: 6px;
    font-size: 13px;
    font-weight: 500;
    letter-spacing: 0.1px;
    box-shadow: var(--shadow-lg);
    z-index: 200;
    animation: slideIn 0.18s ease;
    display: flex;
    align-items: center;
    gap: 6px;
    max-width: calc(100vw - 32px);
  }
  .toast.success { background: var(--success); color: #052e1a; }
  .toast.error { background: var(--danger); color: #450a0a; }
  [data-theme="dark"] .toast.success { color: #02261a; }
  [data-theme="dark"] .toast.error { color: #3b0808; }
  @keyframes slideIn {
    from { transform: translateX(20px); opacity: 0; }
    to { transform: translateX(0); opacity: 1; }
  }

  /* ===== 悬浮到底按钮 ===== */
  .fab-end {
    position: fixed;
    right: 22px;
    bottom: 22px;
    width: 40px;
    height: 40px;
    border-radius: 50%;
    border: 1px solid var(--border);
    background: var(--panel);
    color: var(--primary);
    box-shadow: var(--shadow-lg);
    cursor: pointer;
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 45;
    transition: transform 0.15s, background-color 0.15s, color 0.15s;
  }
  .fab-end.show { display: flex; }
  .fab-end:hover {
    background: var(--primary);
    color: #fff;
    transform: translateY(-2px);
    border-color: var(--primary);
  }
  .fab-end:active { transform: translateY(0); }
  .fab-end:disabled { opacity: 0.4; cursor: not-allowed; }
  [data-theme="dark"] .fab-end { border-color: var(--border-hover); }
  /* 加载中：箭头换成转圈 */
  .fab-end.loading svg { display: none; }
  .fab-end.loading::after {
    content: '';
    width: 16px;
    height: 16px;
    border: 2px solid currentColor;
    border-top-color: transparent;
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
  }
  @media (max-width: 768px) {
    .fab-end { right: 16px; bottom: 16px; width: 44px; height: 44px; }
  }

  /* ===== Dialog 弹窗（替代原生浏览器 dialog，深色友好） ===== */
  .dialog-mask {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.55);
    z-index: 300;
    display: flex;
    align-items: center;
    justify-content: center;
    animation: fadeIn 0.15s ease;
  }
  [data-theme="dark"] .dialog-mask { background: rgba(0,0,0,0.7); }
  .dialog {
    background: var(--panel);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 10px;
    box-shadow: var(--shadow-lg);
    padding: 20px 22px;
    width: min(420px, calc(100vw - 32px));
    animation: dialogIn 0.18s cubic-bezier(0.2, 0.8, 0.3, 1);
  }
  .dialog-title {
    font-size: 15px;
    font-weight: 600;
    color: var(--text);
    margin-bottom: 8px;
  }
  .dialog-message {
    font-size: 13px;
    color: var(--text-secondary);
    line-height: 1.6;
    margin-bottom: 18px;
  }
  .dialog-actions {
    display: flex;
    justify-content: flex-end;
    gap: 8px;
  }
  .dialog-actions .btn { font-weight: 500; }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  @keyframes dialogIn {
    from { transform: translateY(-8px) scale(0.96); opacity: 0; }
    to   { transform: translateY(0) scale(1); opacity: 1; }
  }

  /* ===== Loading spinner ===== */
  .spinner {
    width: 14px;
    height: 14px;
    border: 2px solid var(--border);
    border-top-color: var(--primary);
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
    display: inline-block;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* Scrollbar */
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--scrollbar-thumb); border-radius: 4px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--scrollbar-thumb-hover); }

  /* ===== Responsive: 平板 ===== */
  @media (max-width: 1024px) {
    .sidebar { width: 200px; }
  }

  /* ===== Responsive: 手机 ===== */
  @media (max-width: 768px) {
    body { font-size: 13.5px; }
    [data-theme="dark"] body { font-size: 13.5px; }
    .header { height: 48px; padding: 0 10px; gap: 4px; }
    /* 手机端也显示标题：小字号 + 超出截断（窄屏设备兜底） */
    .logo span { display: block; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 44vw; }
    .header-actions { gap: 2px; }
    .header-actions .btn span { display: none; }
    .header-actions .btn { padding: 0; width: 32px; justify-content: center; }

    /* 抽屉模式（dvh 同上：避免底部被地址栏遮挡） */
    .layout { height: calc(100vh - 48px); height: calc(100dvh - 48px); }
    .sidebar {
      position: fixed;
      top: 48px;
      left: 0;
      bottom: 0;
      width: 84vw;
      max-width: 320px;
      z-index: 50;
      transform: translateX(-100%);
      box-shadow: 0 8px 24px rgba(0,0,0,0.18);
      /* 高度也用 dvh：抽屉底部不被地址栏挡住（bottom:0 在 iOS 上会延伸到地址栏后面） */
      height: calc(100dvh - 48px);
    }
    body.sidebar-open .sidebar { transform: translateX(0); }
    /* 手机端桌面折叠按钮隐藏 */
    #btnToggleSidebar { display: none; }
    /* 抽屉打开按钮显示 */
    #btnOpenDrawer { display: inline-flex !important; }

    .toolbar {
      height: auto;
      flex-wrap: wrap;
      padding: 8px 10px;
      gap: 6px;
    }
    .breadcrumb { width: 100%; order: 1; font-size: 12px; }
    .toolbar-input { flex: 1; order: 2; width: auto; min-width: 0; }
    .mode-toggle { order: 3; }
    #btnExport { order: 4; }

    .tabs { padding: 0 10px; }

    .footer-bar {
      flex-wrap: wrap;
      height: auto;
      padding: 6px 10px;
      gap: 4px;
    }
    .sql-box { width: 100%; font-size: 10px; order: 1; }
    .pager { width: 100%; justify-content: center; order: 2; flex-wrap: wrap; gap: 4px; }

    .dropzone { margin: 12px; }
    .dropzone-icon { width: 44px; height: 44px; margin-bottom: 10px; }
    .dropzone-title { font-size: 14px; }
    .dropzone-desc { font-size: 12px; margin-bottom: 12px; }
    .dropzone button { height: 32px; padding: 0 16px; font-size: 12px; }

    .data-table th, .data-table td { padding: 5px 8px; font-size: 11.5px; }
    .data-table th .col-type { font-size: 10px; }
    .row-num { width: 40px; }

    .status-bar { padding: 0 10px; gap: 8px; font-size: 11px; }

    .mode-toggle button { padding: 0 8px; }
    .mode-toggle button .mode-label { display: none; }

    .toast { top: 56px; right: 10px; left: 10px; max-width: none; }
  }
</style>
</head>
<body>

<div class="header">
  <button class="icon-btn" id="btnToggleSidebar" title="折叠/展开侧栏">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
  </button>
  <button class="icon-btn" id="btnOpenDrawer" style="display:none;" title="打开数据库列表">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <ellipse cx="12" cy="5" rx="9" ry="3"/>
      <path d="M3 5v14a9 3 0 0 0 18 0V5"/>
      <path d="M3 12a9 3 0 0 0 18 0"/>
      <line x1="11" y1="11" x2="17" y2="11"/>
      <polyline points="14 8 17 11 14 14"/>
    </svg>
  </button>
  <div class="logo">
    <div class="logo-icon">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
        <ellipse cx="12" cy="5" rx="9" ry="3"/>
        <path d="M3 5v14a9 3 0 0 0 18 0V5"/>
        <path d="M3 12a9 3 0 0 0 18 0"/>
      </svg>
    </div>
    <span>SQLite 读取工具</span>
    <button class="home-btn" id="btnHome" title="返回主页">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 11.5 12 4l9 7.5"/>
        <path d="M5 10.5V20a1 1 0 0 0 1 1h4v-6h4v6h4a1 1 0 0 0 1-1v-9.5"/>
      </svg>
    </button>
  </div>
  <div class="header-spacer"></div>
  <div class="header-actions">
    <button class="icon-btn" id="btnTheme" title="切换主题">
      <svg id="iconSun" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display:none;">
        <circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
      </svg>
      <svg id="iconMoon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
      </svg>
    </button>
    <button class="btn" id="btnAddDb">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
      <span>添加数据库</span>
    </button>
    <button class="icon-btn" id="btnClear" title="清空所有数据库" style="display:none;">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/></svg>
    </button>

          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>

            <option value="50">50 行</option>
            <option value="100" selected>100 行</option>

<!-- 悬浮到底按钮（仅无限模式） -->
<button class="fab-end" id="fabEnd" title="一键跳到最后一行" disabled>
  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <line x1="12" y1="3" x2="12" y2="21"/>
    <polyline points="5 14 12 21 19 14"/>
  </svg>
</button>

<script>
/* ================== 全局状态 ================== */
const state = {
  databases: [],
  activeDbId: null,
  openTabs: [],
  activeTabKey: null,
  SQL: null,
  loadMode: localStorage.getItem('sqlite-load-mode') || 'infinite', // 默认无限滚动
  isMobile: matchMedia('(max-width: 768px)').matches,
  infiniteObserver: null,
};

/* ================== 工具函数 ================== */
const $ = (id) => document.getElementById(id);
const uid = () => Math.random().toString(36).slice(2, 9);

function toast(msg, type = '') {
  const el = document.createElement('div');
  el.className = `toast ${type}`;
  el.textContent = msg;
  document.body.appendChild(el);
  setTimeout(() => { el.style.opacity = '0'; el.style.transition = 'opacity 0.2s'; }, 1800);
  setTimeout(() => el.remove(), 2200);
}

/* 自定义确认弹窗（替代浏览器原生 confirm，深色友好） */
function confirmDialog({ title = '确认', message = '', okText = '确定', cancelText = '取消', danger = false } = {}) {
  return new Promise(resolve => {
    const mask = document.createElement('div');
    mask.className = 'dialog-mask';
    mask.innerHTML = `
      <div class="dialog" role="dialog" aria-modal="true">
        <div class="dialog-title">${escapeHtml(title)}</div>
        <div class="dialog-message">${escapeHtml(message)}</div>
        <div class="dialog-actions">
          <button class="btn" data-act="cancel">${escapeHtml(cancelText)}</button>
          <button class="btn ${danger ? 'btn-danger' : 'btn-primary'}" data-act="ok" style="${danger ? 'background:var(--danger);border-color:var(--danger);color:#fff;' : ''}">${escapeHtml(okText)}</button>
        </div>
      </div>
    `;
    document.body.appendChild(mask);
    const close = (v) => { mask.remove(); resolve(v); };
    mask.querySelector('[data-act="ok"]').onclick = () => close(true);
    mask.querySelector('[data-act="cancel"]').onclick = () => close(false);
    mask.addEventListener('click', (e) => { if (e.target === mask) close(false); });
    document.addEventListener('keydown', function onEsc(e) {
      if (e.key === 'Escape') { document.removeEventListener('keydown', onEsc); close(false); }
      if (e.key === 'Enter') { document.removeEventListener('keydown', onEsc); close(true); }
    });
    setTimeout(() => mask.querySelector('[data-act="ok"]').focus(), 0);
  });
}

function formatSize(bytes) {
  if (bytes < 1024) return bytes + ' B';
  if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
  return (bytes / 1024 / 1024).toFixed(2) + ' MB';
}

function formatNum(n) {
  return new Intl.NumberFormat('zh-CN').format(n);
}

// 只在确实含特殊字符时才做替换；纯文本走快速路径，避免每条数据都跑正则
const ESC_RE = /[&<>"']/g;
const ESC_MAP = { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' };
function escapeHtml(s) {
  if (s === null || s === undefined) return '';
  const str = typeof s === 'string' ? s : String(s);
  ESC_RE.lastIndex = 0;
  if (!ESC_RE.test(str)) return str;            // 快速路径：无需转义
  ESC_RE.lastIndex = 0;
  return str.replace(ESC_RE, c => ESC_MAP[c]);
}

function isMobile() { return state.isMobile; }

/* ================== 主题管理 ================== */
const theme = {
  get current() { return document.documentElement.dataset.theme || 'light'; },
  set(t, manual = true) {
    document.documentElement.dataset.theme = t;
    if (manual) localStorage.setItem('sqlite-theme', t);
    this._updateIcon();
  },
  toggle() { this.set(this.current === 'dark' ? 'light' : 'dark'); },
  init() {
    const saved = localStorage.getItem('sqlite-theme');
    const initial = saved || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    this.set(initial, false);
    matchMedia('(prefers-color-scheme: dark)').addEventListener('change', e => {
      if (!localStorage.getItem('sqlite-theme')) {
        this.set(e.matches ? 'dark' : 'light', false);
      }
    });
  },
  _updateIcon() {
    const dark = this.current === 'dark';
    $('iconSun').style.display = dark ? 'block' : 'none';
    $('iconMoon').style.display = dark ? 'none' : 'block';
    $('btnTheme').title = dark ? '切换到浅色模式' : '切换到深色模式';
  },
};

/* ================== sql.js 初始化 ================== */
async function initSQL() {
  state.SQL = await initSqlJs({
    locateFile: file => `https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.10.3/${file}`
  });
}

/* ================== 加载数据库 ================== */
async function loadDatabase(file) {
  try {
    const buf = new Uint8Array(await file.arrayBuffer());
    const db = new state.SQL.Database(buf);
    const tables = [];
    const res = db.exec("SELECT name FROM sqlite_master WHERE type IN ('table','view') AND name NOT LIKE 'sqlite_%' ORDER BY name");
    if (res[0]) {
      for (const row of res[0].values) {
        const name = row[0];
        const countRes = db.exec(`SELECT COUNT(*) FROM "${name}"`);
        const count = countRes[0] ? countRes[0].values[0][0] : 0;
        const colsRes = db.exec(`PRAGMA table_info("${name}")`);
        const cols = colsRes[0] ? colsRes[0].values.map(r => ({
          cid: r[0], name: r[1], type: r[2], notnull: r[3], dflt: r[4], pk: r[5]
        })) : [];
        tables.push({ name, count, cols });
      }
    }
    const dbObj = {
      id: uid(),
      file,
      name: file.name,
      size: file.size,
      db,
      tables,
      expanded: false,    // 导入后默认收拢，不自动展开
    };
    // 不再展开任何库：导入后全部保持收拢（active 高亮与展开是两个独立概念）
    state.databases.push(dbObj);
    state.activeDbId = dbObj.id;
    renderSidebar();
    // 导入成功后收起上传区，进入「已就绪，等待选表」状态。
    // 早期版本靠自动 openTab 顺带触发 showDropzone(false)，需求「导入后不自动打开表」
    // 改掉后这条路径断了，导致上传区一直显示、表格区一直隐藏。
    showDropzone(false);
    renderContent();     // 未打开任何表时，刷新主区为「从左侧选择一张表查看数据」
    if (isMobile()) closeDrawer();
    toast(`已加载 ${file.name}`, 'success');
  } catch (e) {
    console.error(e);
    toast(`加载失败: ${file.name}`, 'error');
  }
}

/* ================== 抽屉控制 ================== */
function openDrawer() {
  document.body.classList.add('sidebar-open');
}
function closeDrawer() {
  document.body.classList.remove('sidebar-open');
}
function toggleDrawer() {
  document.body.classList.toggle('sidebar-open');
}

/* ================== 侧栏渲染 ================== */
// 判断某张表是否为「右侧当前正在查看」的表（用于在左侧列表高亮）
function isActiveTable(dbId, tableName) {
  const tab = state.openTabs.find(t => tabKey(t) === state.activeTabKey);
  return !!tab && tab.dbId === dbId && tab.table === tableName;
}

function renderSidebar() {
  const list = $('dbList');
  const count = $('dbCount');
  count.textContent = state.databases.length;

  if (state.databases.length === 0) {
    list.innerHTML = `
      <div style="padding: 30px 12px; text-align: center; color: var(--text-muted); font-size: 12px;">
        还未添加数据库<br>点击右上角或拖拽 .db 文件
      </div>`;
    return;
  }

  // 按数据库名称升序排序（自然排序：db2 在 db10 前；中文按拼音；忽略大小写）
  const sortedDbs = [...state.databases].sort((a, b) =>
    a.name.localeCompare(b.name, 'zh-CN', { numeric: true, sensitivity: 'base' })
    || a.name.localeCompare(b.name, 'zh-CN')
  );

  list.innerHTML = sortedDbs.map(d => {
    const isActive = d.id === state.activeDbId;
    const tablesHtml = d.tables.map(t => `
      <div class="table-item ${isActiveTable(d.id, t.name) ? 'active' : ''}" data-db="${d.id}" data-table="${t.name}" title="${escapeHtml(t.name)} · ${formatNum(t.count)} 行">
        <svg class="table-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="3" y="3" width="18" height="18" rx="2"/>
          <line x1="3" y1="9" x2="21" y2="9"/>
          <line x1="9" y1="3" x2="9" y2="21"/>
        </svg>
        <span class="table-name">${escapeHtml(t.name)}</span>
        <span class="table-count">${formatNum(t.count)}</span>
      </div>
    `).join('');

    return `
      <div class="db-item ${isActive ? 'active' : ''} ${d.expanded ? 'expanded' : ''}" data-db="${d.id}">
        <div class="db-header" data-toggle="${d.id}" title="${escapeHtml(d.name)} · ${d.tables.length} 张表">
          <svg class="db-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="9 18 15 12 9 6"/></svg>
          <svg class="db-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <ellipse cx="12" cy="5" rx="9" ry="3"/>
            <path d="M3 5v14a9 3 0 0 0 18 0V5"/>
            <path d="M3 12a9 3 0 0 0 18 0"/>
          </svg>
          <span class="db-name">${escapeHtml(d.name)}</span>
          <span class="db-meta">${d.tables.length}</span>
          <button class="db-remove" data-remove="${d.id}" title="移除">
            <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
          </button>
        </div>
        <div class="table-list">
          <div class="table-item ${isActiveTable(d.id, '__SCHEMA__') ? 'active' : ''}" data-db="${d.id}" data-table="__SCHEMA__" title="查看 ${escapeHtml(d.name)} 所有表结构">
            <svg class="table-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
              <polyline points="14 2 14 8 20 8"/>
            </svg>
            <span class="table-name">表结构</span>
            <span class="table-count">${d.tables.length}</span>
          </div>
          ${tablesHtml}
        </div>
      </div>`;
  }).join('');

  list.querySelectorAll('[data-toggle]').forEach(el => {
    el.onclick = (e) => {
      if (e.target.closest('[data-remove]')) return;
      toggleDb(el.dataset.toggle);
    };
  });
  list.querySelectorAll('[data-remove]').forEach(el => {
    el.onclick = async (e) => {
      e.stopPropagation();
      const id = el.dataset.remove;
      const db = state.databases.find(d => d.id === id);
      const ok = await confirmDialog({
        title: '移除数据库',
        message: `确定要移除「${db?.name || ''}」吗？相关标签页也会关闭。`,
        okText: '移除',
        danger: true,
      });
      if (!ok) return;
      removeDatabase(id);
    };
  });
  list.querySelectorAll('.table-item').forEach(el => {
    el.onclick = () => {
      openTab(el.dataset.db, el.dataset.table);
    };
  });
}

function toggleDb(id) {
  const target = state.databases.find(d => d.id === id);
  if (!target) return;
  const wasExpanded = target.expanded;
  state.databases.forEach(d => d.expanded = false);
  target.expanded = !wasExpanded;
  state.activeDbId = id;
  renderSidebar();
}

function removeDatabase(id) {
  const idx = state.databases.findIndex(d => d.id === id);
  if (idx === -1) return;
  const db = state.databases[idx];
  try { db.db.close(); } catch {}
  state.databases.splice(idx, 1);
  state.openTabs = state.openTabs.filter(t => t.dbId !== id);
  if (state.activeDbId === id) state.activeDbId = state.databases[0]?.id || null;
  if (state.activeTabKey && state.activeTabKey.startsWith(id)) {
    state.activeTabKey = state.openTabs[0] ? tabKey(state.openTabs[0]) : null;
  }
  renderSidebar();
  renderTabs();
  renderContent();
  if (state.databases.length === 0) showDropzone(true);
}

function tabKey(t) { return `${t.dbId}::${t.table}::${t.view}`; }

/* ================== Tab 管理 ================== */
function openTab(dbId, tableName) {
  const existing = state.openTabs.find(t => t.dbId === dbId && t.table === tableName);
  if (existing) {
    state.activeTabKey = tabKey(existing);
  } else {
    const tab = {
      dbId, table: tableName,
      view: 'data',
      page: 1,
      pageSize: 100,
      filter: '',
      columnFilters: {},          // 按列模糊筛选：{ 列名: '关键词' }，与 filter AND 组合
      columnChecks: {},           // 按列勾选筛选：{ 列名: [值...] }，IN 精确匹配，与模糊词 AND 组合
      _pendingChecks: {},         // 面板打开时的勾选副本（点确认才写入 columnChecks）
      _pendingLike: {},           // 面板打开时的模糊词副本（点确认才写入 columnFilters）
      loadMode: state.loadMode,   // 跟随全局当前模式
      infinitePage: 0,
      infiniteLoaded: [],
      infiniteCount: 0,
      infiniteTotal: 0,
      infiniteFinished: false,
    };
    state.openTabs.push(tab);
    state.activeTabKey = tabKey(tab);
  }
  state.activeDbId = dbId;
  showDropzone(false);
  renderSidebar();          // 同步左侧表名高亮
  renderTabs();
  renderContent();
  // 移动端：选完表关闭抽屉
  if (isMobile()) closeDrawer();
}

function closeTab(key) {
  const idx = state.openTabs.findIndex(t => tabKey(t) === key);
  if (idx === -1) return;
  state.openTabs.splice(idx, 1);
  if (state.activeTabKey === key) {
    state.activeTabKey = state.openTabs[idx] ? tabKey(state.openTabs[idx]) :
                         state.openTabs[idx-1] ? tabKey(state.openTabs[idx-1]) : null;
  }
  renderSidebar();          // 同步左侧表名高亮
  renderTabs();
  renderContent();
  // 上传区只在「一个数据库都没有」时出现：关闭标签但数据库还在时，
  // 应保持 dataView 的「从左侧选择一张表查看数据」提示，而不是跳回上传区
  if (state.databases.length === 0) showDropzone(true);
}

function renderTabs() {
  const tabs = $('tabs');
  if (state.openTabs.length === 0) {
    tabs.innerHTML = '';
    return;
  }
  tabs.innerHTML = state.openTabs.map(t => {
    const key = tabKey(t);
    const db = state.databases.find(d => d.id === t.dbId);
    const isActive = key === state.activeTabKey;
    const dbShort = db?.name.replace(/\.(db|sqlite.*|s3db)$/i, '') || '';
    return `
      <div class="tab ${isActive ? 'active' : ''}" data-key="${key}" title="${escapeHtml(db?.name || '')} / ${t.table === '__SCHEMA__' ? '表结构' : t.table}">
        <div class="tab-row1">
          <span class="tab-table-name">${t.table === '__SCHEMA__' ? '表结构' : escapeHtml(t.table)}</span>
        </div>
        <div class="tab-row2" title="${escapeHtml(dbShort)}">
          <span class="tab-db-name">${escapeHtml(dbShort)}</span>
        </div>
        <button class="tab-close" data-close="${key}" title="关闭">
          <svg width="9" height="9" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>`;
  }).join('');

  // 数据库名按「不超过表名宽度」截断（比表名长则省略后面文字）。
  // 注意：不能用 span.scrollWidth —— inline 元素的 scrollWidth 恒为 0，会把数据库名压成 0 宽。
  // 改用离屏探针（absolute + nowrap）测量两段文本的完整像素宽度。
  const probe = document.createElement('span');
  probe.style.cssText = 'position:absolute;visibility:hidden;white-space:nowrap;left:-9999px;top:0;pointer-events:none;';
  tabs.appendChild(probe);
  tabs.querySelectorAll('.tab').forEach(tabEl => {
    const tName = tabEl.querySelector('.tab-table-name');
    const dName = tabEl.querySelector('.tab-db-name');
    if (!tName || !dName) return;
    probe.style.font = getComputedStyle(tName).font;
    probe.textContent = tName.textContent;
    const tableW = probe.getBoundingClientRect().width;
    probe.style.font = getComputedStyle(dName).font;
    probe.textContent = dName.textContent;
    const dbW = probe.getBoundingClientRect().width;
    // 上限 = 表名宽度 + 6px 余量；下限 32px 保证短名也能完整显示
    dName.style.maxWidth = Math.max(32, Math.min(dbW, tableW + 6)) + 'px';
  });
  probe.remove();

  tabs.querySelectorAll('.tab').forEach(el => {
    el.onclick = (e) => {
      if (e.target.closest('[data-close]')) return;
      state.activeTabKey = el.dataset.key;
      renderSidebar();      // 同步左侧表名高亮
      renderTabs();
      renderContent();
    };
  });
  tabs.querySelectorAll('[data-close]').forEach(el => {
    el.onclick = (e) => {
      e.stopPropagation();
      closeTab(el.dataset.close);
    };
  });

  // 点击/打开/切换 tab 后，把当前激活的 tab 横向滚动到可视区：
  // 标签多、激活项被挤出右侧时，滚动条自动滑到对应位置（仅在不完全可见时才滚动，避免无谓跳动）。
  const activeTabEl = tabs.querySelector('.tab.active');
  if (activeTabEl) {
    const tRect = activeTabEl.getBoundingClientRect();
    const cRect = tabs.getBoundingClientRect();
    const tabLeft = tRect.left - cRect.left + tabs.scrollLeft;
    const tabRight = tRect.right - cRect.left + tabs.scrollLeft;
    const viewLeft = tabs.scrollLeft;
    const viewRight = viewLeft + tabs.clientWidth;
    if (tabLeft < viewLeft) {
      tabs.scrollTo({ left: Math.max(0, tabLeft - 8), behavior: 'smooth' });
    } else if (tabRight > viewRight) {
      tabs.scrollTo({ left: tabRight - tabs.clientWidth + 8, behavior: 'smooth' });
    }
  }
}

/* ================== 内容渲染 ================== */
function renderContent() {
  // 清理旧的 IntersectionObserver
  if (state.infiniteObserver) {
    state.infiniteObserver.disconnect();
    state.infiniteObserver = null;
  }

  // 清理上次挂到 body 的悬浮面板（下面 buildHeadHtml 会按需重新生成并挂载）
  document.querySelectorAll('body > .col-filter-input-wrap').forEach(el => el.remove());

  // 记录筛选面板交互状态：输入框焦点（列名+光标位）、候选列表滚动位置
  // 重渲染后恢复，保证「边输入边筛选」「连续勾选」不被打断
  let focusInfo = null;
  const ae = document.activeElement;
  if (ae && ae.classList && ae.classList.contains('col-filter-input') && ae.dataset.colInputField) {
    focusInfo = { col: ae.dataset.colInputField, start: ae.selectionStart, end: ae.selectionEnd };
  }
  const prevPanel = document.querySelector('.col-filter-options');
  const prevPanelScroll = prevPanel ? prevPanel.scrollTop : null;

  const tab = state.openTabs.find(t => tabKey(t) === state.activeTabKey);
  if (!tab) {
    $('contentArea').innerHTML = `<div class="empty-content">从左侧选择一张表查看数据</div>`;
    $('footerBar').classList.add('hidden');
    // 按「有没有数据库」判断：只有完全没有任何数据库时（此时由 showDropzone(true)
    // 负责显示上传区）才隐藏 dataView；否则保持显示，让「选表」提示可见。
    // 若按 openTabs 判断，未打开任何表时 dataView 会被隐藏，而上传区也已被
    // showDropzone(false) 隐藏 → 主区域一片空白。
    $('dataView').style.display = state.databases.length === 0 ? 'none' : 'flex';
    return;
  }
  $('dataView').style.display = 'flex';

  const db = state.databases.find(d => d.id === tab.dbId);
  if (!db) return;

  $('breadcrumb').innerHTML = `
    <div class="breadcrumb-item" title="${escapeHtml(db.name)}">${escapeHtml(db.name)}</div>
    <div class="breadcrumb-sep">/</div>
    <div class="breadcrumb-item current">${tab.table === '__SCHEMA__' ? '表结构总览' : escapeHtml(tab.table)}</div>
  `;

  if ($('searchInput').value !== (tab.filter || '')) {
    $('searchInput').value = tab.filter || '';
  }

  // 同步 mode-toggle
  document.querySelectorAll('#modeToggle button').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.mode === tab.loadMode);
  });

  if (tab.table === '__SCHEMA__') {
    renderSchemaView(db);
    $('footerBar').classList.add('hidden');
  } else {
    if (tab.loadMode === 'infinite') {
      renderInfiniteGrid(db, tab);
    } else {
      renderDataGrid(db, tab);
    }
  }

  // 恢复筛选面板：候选列表滚动位置 + 输入框焦点与光标
  const newPanel = document.querySelector('.col-filter-options');
  if (newPanel && typeof prevPanelScroll === 'number') {
    newPanel.scrollTop = prevPanelScroll;
  }
  if (focusInfo) {
    const inp = document.querySelector(`[data-col-input-field="${cssEscape(focusInfo.col)}"]`);
    if (inp) {
      inp.focus({ preventScroll: true });
      try { inp.setSelectionRange(focusInfo.start, focusInfo.end); } catch (err) {}
    }
  }
  // 面板打开时挂载为悬浮面板（表头不下移、出现在列头下方）
  // 注：preserveGridScroll 场景下这里先按当前滚动定位，滚动恢复后其尾部会再校准一次
  if (tab._openFilterCol) mountFilterPanelFixed(tab._openFilterCol);
  updateFabEnd();
}

function renderSchemaView(db) {
  const area = $('contentArea');
  if (db.tables.length === 0) {
    area.innerHTML = `<div class="empty-content">该数据库没有表</div>`;
    return;
  }
  const cards = db.tables.map(t => {
    const colsHtml = t.cols.map(c => `
      <tr>
        <td>
          ${c.pk ? '<span class="badge badge-pk" style="margin-right:4px;">PK</span>' : ''}
          ${c.notnull ? '<span class="badge badge-nn" style="margin-right:4px;">NN</span>' : ''}
          <span style="font-weight:500;">${escapeHtml(c.name)}</span>
        </td>
        <td><span style="color:var(--text-secondary); font-family:'SF Mono',monospace; font-size:11.5px;">${escapeHtml(c.type || 'ANY')}</span></td>
        <td><span style="color:var(--text-muted); font-size:11.5px;">${c.dflt !== null ? escapeHtml(c.dflt) : '—'}</span></td>
      </tr>
    `).join('');
    return `
      <div class="schema-card">
        <div class="schema-card-header">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="color:var(--primary);">
            <rect x="3" y="3" width="18" height="18" rx="2"/>
            <line x1="3" y1="9" x2="21" y2="9"/>
            <line x1="9" y1="3" x2="9" y2="21"/>
          </svg>
          <span class="schema-card-title">${escapeHtml(t.name)}</span>
          <span class="schema-card-meta">· ${t.cols.length} 列 · ${formatNum(t.count)} 行</span>
        </div>
        <table class="schema-table">
          <thead><tr><th style="width:50%;">列名</th><th style="width:25%;">类型</th><th>默认值</th></tr></thead>
          <tbody>${colsHtml}</tbody>
        </table>
      </div>`;
  }).join('');
  area.innerHTML = `<div class="schema-view">${cards}</div>`;
}

/* ================== 分页模式 ================== */
function renderDataGrid(db, tab) {
  const t = db.tables.find(x => x.name === tab.table);
  if (!t) {
    $('contentArea').innerHTML = `<div class="empty-content">表不存在</div>`;
    return;
  }
  const offset = (tab.page - 1) * tab.pageSize;
  const where = buildWhereClause(tab, t);
  let sql, countSql, params;
  if (where) {
    sql = `SELECT * FROM "${tab.table}" WHERE ${where.sql} LIMIT ${tab.pageSize} OFFSET ${offset}`;
    countSql = `SELECT COUNT(*) FROM "${tab.table}" WHERE ${where.sql}`;
    params = where.params;
  } else {
    sql = `SELECT * FROM "${tab.table}" LIMIT ${tab.pageSize} OFFSET ${offset}`;
    countSql = `SELECT COUNT(*) FROM "${tab.table}"`;
    params = [];
  }

  const t0 = performance.now();
  let rows = [], columns = [], total = 0;
  try {
    const stmt = db.db.prepare(sql);
    if (params.length) stmt.bind(params);
    while (stmt.step()) rows.push(stmt.getAsObject());
    stmt.free();
    if (rows.length) columns = Object.keys(rows[0]);
    const cntStmt = db.db.prepare(countSql);
    cntStmt.bind(params);
    if (cntStmt.step()) total = cntStmt.get()[0];
    cntStmt.free();
  } catch (e) {
    $('contentArea').innerHTML = `<div class="empty-content">查询失败: ${escapeHtml(e.message)}</div>`;
    $('sqlPreview').textContent = sql;
    return;
  }
  const elapsed = Math.round(performance.now() - t0);

  $('sqlPreview').textContent = sql;

  const totalPages = Math.max(1, Math.ceil(total / tab.pageSize));
  if (tab.page > totalPages) tab.page = totalPages;
  $('totalPages').textContent = totalPages;
  $('pageInput').value = tab.page;
  $('pageInput').max = totalPages;
  $('btnFirst').disabled = tab.page <= 1;
  $('btnPrev').disabled = tab.page <= 1;
  $('btnNext').disabled = tab.page >= totalPages;
  $('btnLast').disabled = tab.page >= totalPages;
  $('footerBar').classList.remove('hidden');

  if (rows.length === 0) {
    $('contentArea').innerHTML = `
      <div class="data-wrap">
        <div class="status-bar">
          <span class="stat">表 <strong>${escapeHtml(tab.table)}</strong></span>
          <span class="stat-sep">·</span>
          <span class="stat">当前 <strong>0</strong> 行</span>
          <span class="stat-sep">·</span>
          <span class="stat">共 <strong>${formatNum(total)}</strong> 行</span>
          <span class="stat-sep">·</span>
          <span class="stat">用时 <strong>${elapsed}ms</strong></span>
        </div>
        <div class="empty-content">${tab.filter ? '没有匹配的记录' : '表为空'}</div>
      </div>`;
    return;
  }

  const colTypes = {};
  t.cols.forEach(c => colTypes[c.name] = c.type);

  const headHtml = buildHeadHtml(columns, colTypes, tab);

  const bodyHtml = rows.map((row, i) => {
    const cells = columns.map(c => {
      const v = row[c];
      if (v === null || v === undefined) return `<td class="null">NULL</td>`;
      if (typeof v === 'number') return `<td class="number">${v}</td>`;
      if (typeof v === 'boolean') return `<td class="bool">${v ? 'true' : 'false'}</td>`;
      if (typeof v === 'object' && v !== null) {
        const j = JSON.stringify(v);
        return `<td class="json" title="${escapeHtml(j)}">${escapeHtml(j)}</td>`;
      }
      const text = String(v);
      return `<td title="${escapeHtml(text)}">${escapeHtml(text)}</td>`;
    }).join('');
    return `<tr><td class="row-num">${offset + i + 1}</td>${cells}</tr>`;
  }).join('');

  $('contentArea').innerHTML = `
    <div class="data-wrap">
      <div class="status-bar">
        <span class="stat">表 <strong>${escapeHtml(tab.table)}</strong></span>
        <span class="stat-sep">·</span>
        <span class="stat">当前页 <strong>${formatNum(rows.length)}</strong> 行</span>
        <span class="stat-sep">·</span>
        <span class="stat">${tab.filter ? '筛选命中' : '总计'} <strong>${formatNum(total)}</strong> 行</span>
        <span class="stat-sep">·</span>
        <span class="stat">用时 <strong>${elapsed}ms</strong></span>
        <span class="stat-sep">·</span>
        <span class="stat">列数 <strong>${columns.length}</strong></span>
      </div>
      <div class="grid-container">
        <table class="data-table">
          <thead>${headHtml}</thead>
          <tbody>${bodyHtml}</tbody>
        </table>
      </div>
    </div>`;
}

/* ================== 无限滚动模式 ================== */
function renderInfiniteGrid(db, tab) {
  // 重置累积状态
  tab.infinitePage = 0;
  tab.infiniteLoaded = [];
  tab.infiniteCount = 0;
  tab.infiniteFinished = false;

  const t = db.tables.find(x => x.name === tab.table);
  if (!t) {
    $('contentArea').innerHTML = `<div class="empty-content">表不存在</div>`;
    return;
  }

  const colTypes = {};
  t.cols.forEach(c => colTypes[c.name] = c.type);
  const columns = t.cols.map(c => c.name);

  // 先计算总行数（用于状态条）
  const where0 = buildWhereClause(tab, t);
  let countSql, countParams;
  if (where0) {
    countSql = `SELECT COUNT(*) FROM "${tab.table}" WHERE ${where0.sql}`;
    countParams = where0.params;
  } else {
    countSql = `SELECT COUNT(*) FROM "${tab.table}"`;
    countParams = [];
  }
  let total = 0;
  try {
    const cntStmt = db.db.prepare(countSql);
    cntStmt.bind(countParams);
    if (cntStmt.step()) total = cntStmt.get()[0];
    cntStmt.free();
  } catch (e) {
    $('contentArea').innerHTML = `<div class="empty-content">查询失败: ${escapeHtml(e.message)}</div>`;
    return;
  }

  tab.infiniteTotal = total;
  tab._columns = columns;
  tab._colTypes = colTypes;

  // 渲染骨架
  const headHtml = buildHeadHtml(columns, colTypes, tab);

  $('contentArea').innerHTML = `
    <div class="data-wrap">
      <div class="status-bar" id="infiniteStatus">
        <span class="stat">表 <strong>${escapeHtml(tab.table)}</strong></span>
        <span class="stat-sep">·</span>
        <span class="stat">已加载 <strong id="loadedCount">0</strong> / <strong>${formatNum(total)}</strong> 行</span>
        <span class="stat-sep">·</span>
        <span class="stat">用时 <strong id="elapsedTime">0ms</strong></span>
        <span class="stat-sep">·</span>
        <span class="stat">列数 <strong>${columns.length}</strong></span>
        <span class="stat-sep">·</span>
        <span class="stat" style="color:var(--primary);">∞ 无限模式</span>
      </div>
      <div class="grid-container" id="infiniteContainer">
        <table class="data-table">
          <thead>${headHtml}</thead>
          <tbody id="infiniteTbody"></tbody>
        </table>
        <div class="infinite-sentinel" id="infiniteSentinel">
          <span class="spinner"></span>
          <span>正在加载…</span>
        </div>
      </div>
    </div>`;

  // SQL 预览用首条
  $('sqlPreview').textContent = `SELECT * FROM "${tab.table}"${tab.filter ? ` WHERE … LIKE '%${tab.filter}%'` : ''} LIMIT ${tab.pageSize} OFFSET …`;
  $('footerBar').classList.add('hidden');

  // 启动 observer
  setupInfiniteObserver(db, tab);

  // 立即加载第一批
  loadInfiniteBatch(db, tab);
}

function setupInfiniteObserver(db, tab) {
  if (state.infiniteObserver) state.infiniteObserver.disconnect();

  const sentinel = $('infiniteSentinel');
  if (!sentinel) return;
  const container = $('infiniteContainer');

  state.infiniteObserver = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
      if (entry.isIntersecting && !tab.infiniteFinished && !tab._loading && !tab._jumping) {
        loadInfiniteBatch(db, tab);
      }
    });
  }, { root: container, rootMargin: '200px 0px' });

  state.infiniteObserver.observe(sentinel);
}

/* 把一批行对象渲染成 <tr> HTML 字符串（分页/无限/快速到底共用）。
   startIndex = 本批第一行对应的「已加载行数」，用于行号。
   escape 结果在 title 与内容间复用，避免每行每列算两次。 */

/* 构建 WHERE 子句：顶部搜索（跨列 OR） + 列筛选（精确列 AND）。
   列筛选含两种来源，同列 AND 组合：
   - columnFilters[col] = '关键词'  → LIKE 模糊匹配
   - columnChecks[col]  = [值...]   → IN 精确匹配（数组元素为 null 表示勾了 NULL）
   返回 { sql, params }，无任何筛选时返回 null。 */
function buildWhereClause(tab, table) {
  const parts = [];
  const params = [];
  // 顶部搜索：所有列 OR LIKE
  if (tab.filter) {
    const likeVal = `%${tab.filter}%`;
    const ors = table.cols.map(c => `CAST("${c.name}" AS TEXT) LIKE ?`).join(' OR ');
    parts.push(`(${ors})`);
    for (let i = 0; i < table.cols.length; i++) params.push(likeVal);
  }
  // 列筛选（模糊 LIKE）：多个 AND
  const colFilters = tab.columnFilters || {};
  for (const colName of Object.keys(colFilters)) {
    const v = (colFilters[colName] || '').trim();
    if (!v) continue;
    if (!table.cols.find(c => c.name === colName)) continue;   // 列已被删
    parts.push(`CAST("${colName}" AS TEXT) LIKE ?`);
    params.push(`%${v}%`);
  }
  // 列筛选（勾选 IN 精确）：多个 AND；勾了 NULL 时追加 IS NULL 分支
  const colChecks = tab.columnChecks || {};
  for (const colName of Object.keys(colChecks)) {
    const vals = colChecks[colName];
    if (!Array.isArray(vals) || !vals.length) continue;
    if (!table.cols.find(c => c.name === colName)) continue;   // 列已被删
    const hasNull = vals.includes(null);
    const real = vals.filter(v => v !== null);
    const castCol = `CAST("${colName}" AS TEXT)`;
    let expr;
    if (real.length && hasNull) {
      expr = `(${castCol} IN (${real.map(() => '?').join(',')}) OR ${castCol} IS NULL)`;
    } else if (real.length) {
      expr = `${castCol} IN (${real.map(() => '?').join(',')})`;
    } else {
      expr = `${castCol} IS NULL`;
    }
    parts.push(expr);
    params.push(...real);
  }
  if (!parts.length) return null;
  return { sql: parts.join(' AND '), params };
}

/* ================== 列筛选：高频候选词 ================== */
const COL_STATS_LIMIT = 30;   // 候选词最多展示数（多取 1 条用于探测是否还有更多）

// 当前激活的数据表 tab（schema 视图返回 null）
function getActiveDataTab() {
  const tab = state.openTabs.find(t => tabKey(t) === state.activeTabKey);
  if (!tab || tab.table === '__SCHEMA__') return null;
  return tab;
}

// 筛选条件变化后重置分页/无限加载状态
function resetTabLoading(tab) {
  tab.page = 1;
  tab.infinitePage = 0;
  tab.infiniteLoaded = [];
  tab.infiniteCount = 0;
  tab.infiniteFinished = false;
}

/* 统计某列高频值：GROUP BY 全表按计数降序取前 N。
   结果缓存到 tab._columnStats[col]（工具只读数据库，缓存不会过期）。
   返回 { entries: [{v, c}], more, error }，v 为 null 表示 NULL 组。 */
function getColumnStats(db, tab, colName) {
  if (!tab._columnStats) tab._columnStats = {};
  if (tab._columnStats[colName]) return tab._columnStats[colName];
  const entries = [];
  let more = false, error = null;
  try {
    const stmt = db.db.prepare(
      `SELECT CAST("${colName}" AS TEXT) AS v, COUNT(*) AS c ` +
      `FROM "${tab.table}" GROUP BY v ORDER BY c DESC LIMIT ${COL_STATS_LIMIT + 1}`
    );
    while (stmt.step()) {
      const o = stmt.getAsObject();
      entries.push({ v: o.v === undefined ? null : o.v, c: o.c });
    }
    stmt.free();
    if (entries.length > COL_STATS_LIMIT) {
      more = true;
      entries.length = COL_STATS_LIMIT;
    }
  } catch (e) {
    error = e.message || String(e);
  }
  const result = { entries, more, error };
  tab._columnStats[colName] = result;
  return result;
}

/* 构建列筛选面板 HTML。
   面板内的勾选/输入都操作 pending 副本（tab._pendingChecks/_pendingLike），
   不直接触发表格重渲染；点「确认」才一次性写回 tab.columnChecks/columnFilters。
   取消关闭（ESC / 点击外部 / 再次点击 ⌕）则 pending 丢弃，保留原筛选。 */
function buildFilterPanelHtml(tab, colName) {
  const pendingChecks = (tab._pendingChecks && tab._pendingChecks[colName]) || [];
  const pendingLike = (tab._pendingLike && tab._pendingLike[colName]) || '';
  const db = state.databases.find(d => d.id === tab.dbId);
  let optionsHtml = '';
  let footHtml = '';
  if (db) {
    const stats = getColumnStats(db, tab, colName);
    if (stats.error) {
      footHtml = `<div class="col-filter-more">候选统计失败，可使用上方输入框模糊筛选</div>`;
    } else if (!stats.entries.length) {
      footHtml = `<div class="col-filter-more">该列暂无数据</div>`;
    } else {
      const s = (pendingLike || '').trim().toLowerCase();
      optionsHtml = stats.entries.map(en => {
        const isNull = en.v === null;
        const raw = isNull ? '' : String(en.v);
        const checked = isNull ? pendingChecks.includes(null) : pendingChecks.includes(raw);
        const valAttr = escapeHtml(raw);
        const isNullAttr = isNull ? ' data-isnull="1"' : '';
        const hiddenAttr = (s && !raw.toLowerCase().includes(s)) ? ' style="display:none;"' : '';
        return `
          <label class="col-filter-option" data-val="${valAttr}"${isNullAttr}${hiddenAttr} title="${isNull ? 'NULL' : valAttr}">
            <input type="checkbox" data-col-check="${escapeHtml(colName)}" value="${valAttr}"${isNullAttr}${checked ? ' checked' : ''}>
            <span class="opt-val">${isNull ? '<i class="opt-null">NULL</i>' : escapeHtml(raw)}</span>
            <span class="opt-count">${formatNum(en.c)}</span>
          </label>`;
      }).join('');
      if (stats.more) {
        footHtml = `<div class="col-filter-more">仅显示前 ${COL_STATS_LIMIT} 个高频值，其余可用输入框模糊筛选</div>`;
      }
    }
  }
  const checkedCount = pendingChecks.length;
  return `
    <div class="col-filter-input-wrap" data-col-input="${escapeHtml(colName)}">
      <div class="col-filter-panel">
        <input type="text" class="col-filter-input" placeholder="模糊筛选 / 过滤候选…" value="${escapeHtml(pendingLike)}" data-col-input-field="${escapeHtml(colName)}">
        <div class="col-filter-tools">
          <button type="button" class="col-filter-tool-btn" data-col-selectall="${escapeHtml(colName)}">全选</button>
          <button type="button" class="col-filter-tool-btn" data-col-clearchecks="${escapeHtml(colName)}">清空勾选</button>
          ${checkedCount ? `<span class="col-filter-count">已选 ${checkedCount}</span>` : ''}
          <button type="button" class="col-filter-tool-btn col-filter-confirm" data-col-confirm="${escapeHtml(colName)}">确认</button>
        </div>
        <div class="col-filter-options">${optionsHtml}</div>
        ${footHtml}
      </div>
    </div>`;
}

/* 构建表头 HTML：每列可点击展开筛选面板。
   tab._openFilterCol 记录当前展开面板的列（重渲染后保持展开）。
   tab.columnFilters[col]=字符串 → LIKE；tab.columnChecks[col]=数组 → IN。
   面板打开时使用 tab._pendingChecks/_pendingLike（独立副本），不显示在摘要里。 */
function buildHeadHtml(columns, colTypes, tab) {
  const filters = tab.columnFilters || {};
  const checks = tab.columnChecks || {};
  const openCol = tab._openFilterCol || null;
  const cols = columns.map(c => {
    const likeVal = filters[c] || '';
    const checkedVals = Array.isArray(checks[c]) ? checks[c] : [];
    const filtered = !!likeVal || checkedVals.length > 0;
    // 摘要展示已提交的筛选（pending 不显示，pending 是面板预览态）
    let summaryHtml = '';
    if (checkedVals.length) {
      const list = checkedVals.map(v => v === null ? 'NULL' : String(v)).join('、');
      summaryHtml = `<div class="col-filter-val" title="已选 ${checkedVals.length} 项：${escapeHtml(list)}">已选 ${checkedVals.length} 项</div>`;
    } else if (likeVal) {
      summaryHtml = `<div class="col-filter-val" title="${escapeHtml(likeVal)}">${escapeHtml(likeVal)}</div>`;
    }
    const isOpen = openCol === c;
    return `
      <th class="col-head ${filtered ? 'is-filtered' : ''}" data-col="${escapeHtml(c)}">
        <div class="col-head-main">
          <div class="col-head-row1">
            <span class="col-name">${escapeHtml(c)}</span>
            <button class="col-filter-toggle ${isOpen ? 'is-open' : ''}" data-col-toggle="${escapeHtml(c)}" title="筛选此列">⌕</button>
            ${filtered ? `<button class="col-filter-clear" data-col-clear="${escapeHtml(c)}" title="清除筛选">×</button>` : ''}
          </div>
          <span class="col-type">${escapeHtml(colTypes[c] || '')}</span>
        </div>
        ${summaryHtml}
        ${isOpen ? buildFilterPanelHtml(tab, c) : ''}
      </th>`;
  }).join('');
  return `<tr><th class="row-num">#</th>${cols}</tr>`;
}

/* 把一批行对象渲染成 <tr> HTML 字符串（分页/无限/快速到底共用）。
   startIndex = 本批第一行对应的「已加载行数」，用于行号。 */
function buildRowsHtml(rows, columns, startIndex) {
  const out = [];
  for (let i = 0; i < rows.length; i++) {
    const row = rows[i];
    const cells = [];
    for (let k = 0; k < columns.length; k++) {
      const v = row[columns[k]];
      if (v === null || v === undefined) { cells.push('<td class="null">NULL</td>'); continue; }
      if (typeof v === 'number') { cells.push(`<td class="number">${v}</td>`); continue; }
      if (typeof v === 'boolean') { cells.push(`<td class="bool">${v ? 'true' : 'false'}</td>`); continue; }
      if (typeof v === 'object') {
        const j = JSON.stringify(v);
        const e = escapeHtml(j);
        cells.push(`<td class="json" title="${e}">${e}</td>`);
        continue;
      }
      const e = escapeHtml(v);
      cells.push(`<td title="${e}">${e}</td>`);
    }
    out.push(`<tr><td class="row-num">${startIndex + i + 1}</td>${cells.join('')}</tr>`);
  }
  return out.join('');
}

function loadInfiniteBatch(db, tab) {
  if (tab._loading || tab.infiniteFinished) return;
  tab._loading = true;

  const t = db.tables.find(x => x.name === tab.table);
  if (!t) { tab._loading = false; return; }

  // offset 统一取「已加载行数」，保证与普通分页路径口径一致
  const offset = tab.infiniteCount || 0;
  const where = buildWhereClause(tab, t);
  let sql, params;
  if (where) {
    sql = `SELECT * FROM "${tab.table}" WHERE ${where.sql} LIMIT ${tab.pageSize} OFFSET ${offset}`;
    params = where.params;
  } else {
    sql = `SELECT * FROM "${tab.table}" LIMIT ${tab.pageSize} OFFSET ${offset}`;
    params = [];
  }

  const t0 = performance.now();
  let rows = [];
  try {
    const stmt = db.db.prepare(sql);
    if (params.length) stmt.bind(params);
    while (stmt.step()) rows.push(stmt.getAsObject());
    stmt.free();
  } catch (e) {
    console.error(e);
    tab._loading = false;
    const sentinel = $('infiniteSentinel');
    if (sentinel) sentinel.innerHTML = `<span style="color:var(--danger);">加载失败，点击重试</span>`;
    if (sentinel) sentinel.onclick = () => {
      sentinel.innerHTML = `<span class="spinner"></span><span>正在加载…</span>`;
      sentinel.onclick = null;
      tab._loading = false;
      loadInfiniteBatch(db, tab);
    };
    return;
  }
  const elapsed = Math.round(performance.now() - t0);

  tab.infiniteCount = (tab.infiniteCount || 0) + rows.length;
  tab.infinitePage++;
  tab._totalElapsed = (tab._totalElapsed || 0) + elapsed;

  // 追加到 tbody
  const tbody = $('infiniteTbody');
  if (tbody) {
    tbody.insertAdjacentHTML('beforeend', buildRowsHtml(rows, tab._columns, offset));
  }

  // 更新状态条
  const loadedEl = $('loadedCount');
  if (loadedEl) loadedEl.textContent = formatNum(tab.infiniteCount || 0);
  const elapsedEl = $('elapsedTime');
  if (elapsedEl) elapsedEl.textContent = tab._totalElapsed + 'ms';

  // 判断是否加载完
  if (rows.length < tab.pageSize || (tab.infiniteCount || 0) >= tab.infiniteTotal) {
    tab.infiniteFinished = true;
    const sentinel = $('infiniteSentinel');
    if (sentinel) {
      sentinel.innerHTML = `<span class="end-mark">✓</span><span>已加载全部 ${formatNum(tab.infiniteCount || 0)} 行</span>`;
      sentinel.onclick = null;
    }
    if (state.infiniteObserver) state.infiniteObserver.disconnect();
  } else {
    // 还有更多，恢复 sentinel 文案
    const sentinel = $('infiniteSentinel');
    if (sentinel) sentinel.innerHTML = `<span class="spinner"></span><span>继续加载…</span>`;
  }

  tab._loading = false;
  updateFabEnd();
}
