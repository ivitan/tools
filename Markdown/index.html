<!doctype html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/svg+xml" href="/img/Markdown.svg" />
  <title>Markdown 编辑器 · 双向实时跟随</title>
  <link rel="stylesheet" href="https://cdn.bootcdn.net/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

  <!-- Marked.js -->
  <script src="https://cdn.jsdelivr.net/npm/marked@11.1.1/marked.min.js"></script>
  <!-- Highlight.js -->
  <link rel="stylesheet" id="hljs-theme"
    href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github.min.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
  <script>
    (function () {
      function isDark() {
        try {
          var saved = localStorage.getItem("md-editor-theme");
          if (saved === "dark") return true;
          if (saved === "light") return false;
          saved = localStorage.getItem("theme");
          if (saved === "dark") return true;
          if (saved === "light") return false;
        } catch (e) { }
        return window.matchMedia("(prefers-color-scheme: dark)").matches;
      }
      var dark = isDark();
      document.documentElement.dataset.theme = dark ? "dark" : "light";
      var hl = document.getElementById("hljs-theme");
      if (hl) {
        hl.href = dark
          ? "https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css"
          : "https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github.min.css";
      }
    })();
  </script>

  <style>
    :root {
      --bg: #f8fafc;
      --panel: #ffffff;
      --panel-hover: #f1f5f9;
      --border: #e2e8f0;
      --border-hover: #cbd5e1;
      --text: #0f172a;
      --text-secondary: #475569;
      --text-muted: #64748b;
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --primary-on: #ffffff;
      --primary-light: #eff6ff;
      --primary-soft: rgba(37, 99, 235, 0.10);
      --success: #059669;
      --success-light: #ecfdf5;
      --danger: #dc2626;
      --code-bg: #f6f8fa;
      --shadow: 0 1px 3px rgba(0, 0, 0, .05), 0 1px 2px rgba(0, 0, 0, .03);
      --font-sans: "Inter", "SF Pro Display", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
      --font-mono: "JetBrains Mono", "Fira Code", "SF Mono", "Cascadia Code", "Consolas", monospace;

      /* 旧变量别名（兼容历史命名） */
      --bg-primary: var(--bg);
      --bg-secondary: var(--panel);
      --bg-tertiary: var(--panel-hover);
      --bg-hover: var(--panel-hover);
      --bg-code: var(--code-bg);
      --bg-code-block: var(--code-bg);
      --bg-toolbar: var(--panel);
      --bg-input: var(--panel);
      --text-primary: var(--text);
      --text-color: var(--text);
      --text-code: var(--text);
      --text-tertiary: var(--text-muted);
      --text-placeholder: var(--text-muted);
      --border-primary: var(--border);
      --border-secondary: var(--border);
      --border-color: var(--border);
      --border-focus: var(--primary);
      --accent: var(--primary);
      --accent-hover: var(--primary-hover);
      --accent-light: var(--primary-light);
      --accent-subtle: var(--primary-soft);
      --primary-color: var(--primary);
      --success-color: var(--success);
      --danger-color: var(--danger);
      --panel-bg: var(--panel);
      --radius-sm: 6px;
      --radius-md: 8px;
      --radius-lg: 12px;
      --shadow-sm: var(--shadow);
      --shadow-md: var(--shadow);
      --transition-fast: .18s ease;
      --transition-normal: .18s ease;
      --success-ink: #047857;
      --danger-ink: #b91c1c;
      --danger-on: #ffffff;
    --primary-ink: #1d4ed8;
}

    [data-theme="dark"] {
      --bg: #0b1220;
      --panel: #111827;
      --panel-hover: #1e293b;
      --border: #1f2937;
      --border-hover: #475569;
      --text: #f1f5f9;
      --text-secondary: #cbd5e1;
      --text-muted: #94a3b8;
      --primary: #60a5fa;
      --primary-hover: #93c5fd;
      --primary-light: rgba(96, 165, 250, .12);
      --primary-soft: rgba(96, 165, 250, .14);
      --success: #34d399;
      --success-light: rgba(52, 211, 153, .12);
      --danger: #f87171;
      --code-bg: #0d1117;
      --shadow: 0 1px 3px rgba(0, 0, 0, .30), 0 1px 2px rgba(0, 0, 0, .20);
      --success-ink: #6ee7b7;
      --danger-ink: #fca5a5;
      --danger-on: #0b1220;
    --primary-ink: #93c5fd;
}

    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      height: 100%;
      -webkit-text-size-adjust: 100%;
    }

    body {
      font-family: var(--font-sans);
      background: var(--bg);
      color: var(--text);
      height: 100%;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      font-size: 14px;
      transition: background var(--transition-normal), color var(--transition-normal);
    }

    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }

    ::-webkit-scrollbar-track {
      background: transparent;
    }

    ::-webkit-scrollbar-thumb {
      background: var(--border-hover);
      border-radius: 4px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: var(--text-muted);
    }

    /* ============ Header ============ */
    .header {
      height: 52px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 0 16px;
      background: var(--panel);
      border-bottom: 1px solid var(--border);
      box-shadow: var(--shadow);
      flex-shrink: 0;
      z-index: 20;
    }

    .header-brand {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }

    .logo-icon {
      width: 28px;
      height: 28px;
      border-radius: 8px;
      background: var(--primary);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    [data-theme="dark"] .logo-icon {
      color: #0b1220;
    }

    .header-text {
      display: flex;
      align-items: baseline;
      gap: 6px;
      min-width: 0;
    }

    .header-title {
      font-size: 14.5px;
      font-weight: 600;
      color: var(--text);
      letter-spacing: .2px;
      white-space: nowrap;
    }

    .header-subtitle {
      font-size: 12px;
      color: var(--text-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }

    .home-btn,
    .icon-btn {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-secondary);
      text-decoration: none;
      flex-shrink: 0;
      transition: all var(--transition-fast);
    }

    .home-btn:hover,
    .icon-btn:hover {
      background: var(--panel-hover);
      border-color: var(--border-hover);
      color: var(--primary);
    }

    .home-btn svg {
      width: 15px;
      height: 15px;
      display: block;
    }

    .icon-btn svg {
      width: 15px;
      height: 15px;
      display: block;
    }

    /* ============ Toolbar ============ */
    .toolbar {
      display: flex;
      align-items: center;
      gap: 2px;
      padding: 6px 12px;
      background: var(--panel);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
      overflow-x: auto;
      scrollbar-width: none;
      z-index: 15;
    }

    .toolbar::-webkit-scrollbar {
      height: 0;
    }

    .toolbar-btn {
      min-width: 30px;
      height: 30px;
      padding: 0 7px;
      border: 1px solid transparent;
      background: var(--primary-soft);
      cursor: pointer;
      font-size: 13px;
      line-height: 1;
      color: var(--primary-ink);
      border-radius: 6px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-family: var(--font-sans);
      transition: all var(--transition-fast);
      flex-shrink: 0;
    }

    .toolbar-btn:hover {
      background: var(--primary-light);
      border-color: transparent;
      color: var(--primary-ink);
    }

    .toolbar-btn:active {
      transform: scale(.94);
    }

    .toolbar-btn i {
      font-size: 13px;
    }

    .toolbar-divider {
      width: 1px;
      height: 16px;
      background: var(--border);
      margin: 0 6px;
      flex-shrink: 0;
    }

    /* ============ Mobile tabs ============ */
    .mobile-tabs {
      display: none;
      gap: 4px;
      padding: 8px 12px;
      background: var(--panel);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }

    .mobile-tab-btn {
      flex: 1;
      height: 32px;
      border: 1px solid transparent;
      background: transparent;
      cursor: pointer;
      font-family: var(--font-sans);
      font-size: 13px;
      font-weight: 500;
      color: var(--text-secondary);
      border-radius: 6px;
      transition: all var(--transition-fast);
    }

    .mobile-tab-btn.active {
      background: var(--primary-soft);
      color: var(--primary);
      font-weight: 600;
    }

    /* ============ Main ============ */
    .main-container {
      display: flex;
      flex: 1;
      min-height: 0;
      gap: 8px;
      padding: 12px;
      background: var(--bg);
    }

    .panel {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
      overflow: hidden;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      box-shadow: var(--shadow);
    }

    .panel-header {
      height: 34px;
      display: flex;
      align-items: center;
      gap: 7px;
      padding: 0 12px;
      background: var(--panel);
      border-bottom: 1px solid var(--border);
      font-size: 12px;
      font-weight: 500;
      color: var(--text-secondary);
      flex-shrink: 0;
    }

    .panel-header .count {
      margin-left: auto;
      font-size: 11.5px;
      font-variant-numeric: tabular-nums;
      color: var(--text-muted);
      font-family: var(--font-mono);
    }

    .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .dot-edit {
      background: var(--primary);
    }

    .dot-preview {
      background: var(--success);
    }

    .editor-textarea {
      flex: 1;
      width: 100%;
      border: none;
      outline: none;
      resize: none;
      padding: 14px 16px;
      font-family: var(--font-mono);
      font-size: 13px;
      line-height: 1.75;
      background: var(--panel);
      color: var(--text);
      tab-size: 4;
    }

    .editor-textarea::placeholder {
      color: var(--text-muted);
    }

    .preview-wrapper {
      flex: 1;
      overflow-y: auto;
      padding: 16px 20px;
      background: var(--panel);
      word-wrap: break-word;
    }

    /* ============ Divider ============ */
    .divider-bar {
      width: 9px;
      background: transparent;
      cursor: col-resize;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 -3px;
      position: relative;
      z-index: 5;
    }

    .divider-bar::before {
      content: "";
      width: 3px;
      height: 42px;
      border-radius: 2px;
      background: var(--border);
      transition: background var(--transition-fast), height var(--transition-fast);
    }

    .divider-bar:hover::before {
      background: var(--primary);
      height: 72px;
    }

    /* ============ Markdown body ============ */
    .markdown-body {
      font-family: var(--font-sans);
      color: var(--text);
      line-height: 1.75;
      font-size: 14px;
      max-width: 820px;
    }

    .markdown-body>*:first-child {
      margin-top: 0 !important;
    }

    .markdown-body h1,
    .markdown-body h2,
    .markdown-body h3,
    .markdown-body h4,
    .markdown-body h5,
    .markdown-body h6 {
      font-weight: 650;
      line-height: 1.35;
      margin: 1.6em 0 .7em;
      color: var(--text);
      letter-spacing: -.2px;
    }

    .markdown-body h1 {
      font-size: 1.65em;
      padding-bottom: .35em;
      border-bottom: 1px solid var(--border);
    }

    .markdown-body h2 {
      font-size: 1.35em;
      padding-bottom: .3em;
      border-bottom: 1px solid var(--border);
    }

    .markdown-body h3 {
      font-size: 1.15em;
    }

    .markdown-body h4 {
      font-size: 1em;
    }

    .markdown-body h5,
    .markdown-body h6 {
      font-size: .9em;
      color: var(--text-secondary);
    }

    .markdown-body p {
      margin: .85em 0;
    }

    .markdown-body a {
      color: var(--primary);
      text-decoration: none;
      border-bottom: 1px solid transparent;
    }

    .markdown-body a:hover {
      border-bottom-color: var(--primary);
    }

    .markdown-body strong {
      font-weight: 650;
      color: var(--text);
    }

    .markdown-body ul,
    .markdown-body ol {
      margin: .8em 0;
      padding-left: 1.6em;
    }

    .markdown-body li {
      margin: .3em 0;
    }

    .markdown-body li::marker {
      color: var(--text-muted);
    }

    .markdown-body li input[type="checkbox"] {
      margin-right: .45em;
      accent-color: var(--primary);
    }

    .markdown-body ul:has(input[type="checkbox"]) {
      list-style: none;
      padding-left: .2em;
    }

    .markdown-body hr {
      height: 1px;
      border: none;
      background: var(--border);
      margin: 1.8em 0;
    }

    .markdown-body blockquote {
      border-left: 3px solid var(--primary);
      margin: 1.1em 0;
      padding: .5em 1em;
      background: var(--primary-soft);
      border-radius: 0 6px 6px 0;
      color: var(--text-secondary);
    }

    .markdown-body blockquote p {
      margin: .3em 0;
    }

    .markdown-body pre {
      background: var(--code-bg) !important;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 14px 16px;
      overflow-x: auto;
      margin: 1.1em 0;
      line-height: 1.6;
    }

    .markdown-body pre code {
      background: transparent;
      padding: 0;
      border-radius: 0;
      font-size: 12.5px;
      color: inherit;
    }

    /* 仅日间模式提升代码块内语法高亮 token 对比度（github.min.css 默认橙红在白底偏浅）
       以 .markdown-body 前缀提高优先级；深色模式沿用 github-dark.min.css 原配色（已达标） */
    :root:not([data-theme="dark"]) .markdown-body .hljs-keyword,
    :root:not([data-theme="dark"]) .markdown-body .hljs-variable.language_ { color: #b91c1c; }
    :root:not([data-theme="dark"]) .markdown-body .hljs-built_in { color: #b45309; }

    .markdown-body code {
      font-family: var(--font-mono);
      background: var(--panel-hover);
      padding: .15em .4em;
      border-radius: 4px;
      font-size: .875em;
      color: var(--text);
    }

    .markdown-body table {
      border-collapse: collapse;
      width: 100%;
      margin: 1.1em 0;
      font-size: 13.5px;
      display: block;
      overflow-x: auto;
    }

    .markdown-body th,
    .markdown-body td {
      border: 1px solid var(--border);
      padding: 8px 12px;
      text-align: left;
    }

    .markdown-body th {
      background: var(--panel-hover);
      font-weight: 600;
      color: var(--text);
    }

    .markdown-body img {
      max-width: 100%;
      border-radius: 6px;
    }

    /* ============ Responsive ============ */
    @media (max-width: 768px) {
      .header {
        height: 48px;
        padding: 0 12px;
      }

      .header-subtitle {
        display: none;
      }

      .mobile-tabs {
        display: flex;
      }

      .main-container {
        flex-direction: column;
        gap: 0;
        padding: 10px;
      }

      .divider-bar {
        display: none;
      }

      .panel.panel-preview {
        display: none;
      }

      .panel.panel-preview.mobile-visible {
        display: flex;
      }

      .panel.panel-editor.mobile-hidden {
        display: none;
      }

      .editor-textarea {
        padding: 12px 14px;
      }

      .preview-wrapper {
        padding: 14px 16px;
      }
    }
  </style>
</head>

<body>
  <header class="header">
    <div class="header-brand">
      <div class="logo-icon">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
          stroke-linecap="round" stroke-linejoin="round">
          <rect x="2" y="4" width="20" height="16" rx="2.5"></rect>
          <path d="M6.5 15.5V9l3 3.5 3-3.5v6.5"></path>
          <path d="M16 15.5l2.5-3 2.5 3"></path>
          <path d="M18.5 12.5v3"></path>
        </svg>
      </div>
      <div class="header-text">
        <span class="header-title">Markdown 编辑器</span>
        <span class="header-subtitle">· 双向实时跟随</span>
      </div>
      <a href="../" class="home-btn" title="返回主页" aria-label="返回主页">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
          stroke-linejoin="round" aria-hidden="true">
          <path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
          <path d="M9 22V12h6v10"></path>
        </svg>
      </a>
    </div>
    <div class="header-actions">
      <button class="icon-btn" id="themeToggle" title="切换主题">
        <svg id="iconSun" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none;">
          <circle cx="12" cy="12" r="4"></circle>
          <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"></path>
        </svg>
        <svg id="iconMoon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
        </svg>
      </button>
    </div>
  </header>

  <div class="toolbar" id="toolbar">
    <button class="toolbar-btn" data-action="heading" title="标题"><i class="fas fa-heading"></i></button>
    <button class="toolbar-btn" data-action="bold" title="加粗"><i class="fas fa-bold"></i></button>
    <button class="toolbar-btn" data-action="italic" title="斜体"><i class="fas fa-italic"></i></button>
    <span class="toolbar-divider"></span>
    <button class="toolbar-btn" data-action="link" title="链接"><i class="fas fa-link"></i></button>
    <button class="toolbar-btn" data-action="image" title="图片"><i class="fas fa-image"></i></button>
    <span class="toolbar-divider"></span>
    <button class="toolbar-btn" data-action="codeblock" title="代码块"><i class="fas fa-code"></i></button>
    <button class="toolbar-btn" data-action="inlinecode" title="行内代码"
      style="font-family:var(--font-mono);font-weight:600;">`</button>
    <span class="toolbar-divider"></span>
    <button class="toolbar-btn" data-action="quote" title="引用"><i class="fas fa-quote-left"></i></button>
    <button class="toolbar-btn" data-action="ul" title="无序列表"><i class="fas fa-list-ul"></i></button>
    <button class="toolbar-btn" data-action="ol" title="有序列表"><i class="fas fa-list-ol"></i></button>
    <span class="toolbar-divider"></span>
    <button class="toolbar-btn" data-action="table" title="表格"><i class="fas fa-table"></i></button>
    <button class="toolbar-btn" data-action="hr" title="分割线"><i class="fas fa-minus"></i></button>
  </div>

  <div class="mobile-tabs" id="mobileTabs">
    <button class="mobile-tab-btn active" id="tabEditor"><i class="fas fa-pen"></i> 编辑</button>
    <button class="mobile-tab-btn" id="tabPreview"><i class="fas fa-eye"></i> 预览</button>
  </div>

  <div class="main-container" id="mainContainer">
    <div class="panel panel-editor" id="panelEditor">
      <div class="panel-header">
        <span class="dot dot-edit"></span>编辑器
        <span class="count" id="charCount">0 字符</span>
      </div>
      <textarea class="editor-textarea" id="editor" placeholder="在此编写 Markdown…" spellcheck="false"></textarea>
    </div>
    <div class="divider-bar" id="dividerBar"></div>
    <div class="panel panel-preview" id="panelPreview">
      <div class="panel-header">
        <span class="dot dot-preview"></span>预览
        <span class="count" id="wordCount">0 字</span>
      </div>
      <div class="preview-wrapper" id="preview">
        <div class="markdown-body"></div>
      </div>
    </div>
  </div>

  <script>
    (function () {
      const editor = document.getElementById("editor");
      const previewContent = document
        .getElementById("preview")
        .querySelector(".markdown-body");
      const previewScroller = document.getElementById("preview");
      const themeToggle = document.getElementById("themeToggle");
      const charCount = document.getElementById("charCount");
      const wordCount = document.getElementById("wordCount");
      const dividerBar = document.getElementById("dividerBar");
      const mainContainer = document.getElementById("mainContainer");
      const panelEditor = document.getElementById("panelEditor");
      const panelPreview = document.getElementById("panelPreview");
      const tabEditor = document.getElementById("tabEditor");
      const tabPreview = document.getElementById("tabPreview");
      const toolbar = document.getElementById("toolbar");
      const hljsThemeLink = document.getElementById("hljs-theme");

      let isDarkMode = false;
      let isMobilePreview = false;
      const STORAGE_CONTENT = "md-editor-content";
      const STORAGE_THEME = "md-editor-theme";
      const STORAGE_SPLIT = "md-editor-split";

      // *** 修复：声明 renderTimeout ***
      let renderTimeout;
      let saveTimeout;
      let userScrollTimeout;
      let programmaticScroll = false;
      let editingProgrammaticScroll = false;
      let userScrollingPreview = false;

      // Marked 配置
      marked.use({ breaks: true, gfm: true });
      const renderer = new marked.Renderer();
      renderer.code = function (code, language) {
        let highlighted;
        if (language && hljs.getLanguage(language)) {
          highlighted = hljs.highlight(code, { language }).value;
        } else {
          highlighted = hljs.highlightAuto(code).value;
        }
        return `<pre><code class="language-${language || ""}">${highlighted}</code></pre>`;
      };
      renderer.link = function (href, title, text) {
        return `<a href="${href}" target="_blank" rel="noopener noreferrer" title="${title || ""}">${text}</a>`;
      };
      marked.use({ renderer });

      // 范文（保留原有风格）
      const defaultContent = `# 👋 欢迎使用 Markdown 编辑器

这是一个 **纯前端** 的 Markdown 编辑器，支持**双向实时滚动跟随**、暗色模式和响应式布局。
滚动任意一侧，另一侧都会自动跟随，让写作与预览无缝衔接。

---

## ✨ 功能特性

- 🎨 实时预览，流畅渲染
- 🌙 暗色/亮色模式切换
- 📱 完美适配手机、平板与桌面
- 💾 本地自动保存
- ⌨️ 常用 Markdown 工具栏与快捷键
- 🔗 **双向滚动同步** — 编辑与预览互相跟随

---

## 📝 语法示例

### 代码块

\`\`\`javascript
function greet(name) {
    return \`Hello, \${name}!\`;
}
console.log(greet('世界'));
\`\`\`

\`\`\`python
def fibonacci(n):
    if n <= 1:
        return n
    return fibonacci(n-1) + fibonacci(n-2)

print(fibonacci(10))  # 55
\`\`\`

### 表格

| 功能 | 状态 | 优先级 |
|------|------|--------|
| 实时预览 | ✅ 完成 | 高 |
| 暗色模式 | ✅ 完成 | 高 |
| 响应式 | ✅ 完成 | 中 |
| 双向跟随 | ✅ 完成 | 高 |

### 引用

> "简洁是智慧的灵魂，冗长是肤浅的藻饰。"

### 任务列表

- [x] 支持实时预览
- [x] 支持暗色模式
- [x] 支持双向滚动跟随
- [ ] 导出 PDF
`;

      function loadContent() {
        try {
          const saved = localStorage.getItem(STORAGE_CONTENT);
          return saved && saved.trim() ? saved : defaultContent;
        } catch (e) {
          return defaultContent;
        }
      }

      function saveContent() {
        clearTimeout(saveTimeout);
        saveTimeout = setTimeout(() => {
          localStorage.setItem(STORAGE_CONTENT, editor.value);
        }, 600);
      }

      // 编辑区 -> 预览区（滚动同步）
      function syncEditorScrollToPreview() {
        if (userScrollingPreview || !previewScroller) return;
        const maxEdit = editor.scrollHeight - editor.clientHeight;
        if (maxEdit <= 0) return;
        const ratio = editor.scrollTop / maxEdit;
        const target =
          ratio *
          (previewScroller.scrollHeight - previewScroller.clientHeight);
        programmaticScroll = true;
        previewScroller.scrollTop = target;
      }

      // 编辑区 -> 预览区（光标同步）
      function syncCursorToPreview() {
        if (userScrollingPreview || !previewScroller) return;
        const text = editor.value;
        const cursor = editor.selectionStart;
        const lines = (text.substring(0, cursor).match(/\n/g) || []).length;
        const totalLines = (text.match(/\n/g) || []).length + 1;
        const ratio = totalLines > 0 ? lines / totalLines : 0;
        requestAnimationFrame(() => {
          const maxScroll =
            previewScroller.scrollHeight - previewScroller.clientHeight;
          previewScroller.scrollTop = ratio * maxScroll;
          programmaticScroll = true;
        });
      }

      // 预览区 -> 编辑区（滚动同步）
      function syncPreviewToEditor() {
        if (!previewScroller || !editor) return;
        const maxEdit = editor.scrollHeight - editor.clientHeight;
        const maxPrev =
          previewScroller.scrollHeight - previewScroller.clientHeight;
        if (maxPrev <= 0 || maxEdit <= 0) return;
        const ratio = previewScroller.scrollTop / maxPrev;
        editingProgrammaticScroll = true;
        editor.scrollTop = ratio * maxEdit;
      }

      // 更新预览（修复重点）
      function updatePreview() {
        clearTimeout(renderTimeout);
        renderTimeout = setTimeout(() => {
          try {
            previewContent.innerHTML = marked.parse(editor.value);
          } catch (e) {
            previewContent.innerHTML =
              '<p style="color:var(--danger);">⚠️ 解析错误</p>';
          }
          updateStats();
          saveContent();
          if (!isMobile() || isMobilePreview) syncCursorToPreview();
        }, 30);
      }

      function updateStats() {
        const text = editor.value;
        charCount.textContent = `${text.length} 字符`;
        const chinese = (text.match(/[\u4e00-\u9fff]/g) || []).length;
        const words = (text.match(/[a-zA-Z]+/g) || []).length;
        wordCount.textContent = `${chinese + words} 字`;
      }

      // 暗色模式
      function applyTheme(dark) {
        isDarkMode = dark;
        document.documentElement.dataset.theme = dark ? "dark" : "light";
        var iSun = document.getElementById("iconSun");
        var iMoon = document.getElementById("iconMoon");
        if (iSun) iSun.style.display = dark ? "block" : "none";
        if (iMoon) iMoon.style.display = dark ? "none" : "block";
        themeToggle.title = dark ? "切换到浅色模式" : "切换到深色模式";
        hljsThemeLink.href = dark
          ? "https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css"
          : "https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github.min.css";
        localStorage.setItem(STORAGE_THEME, dark ? "dark" : "light");
        updatePreview();
      }
      themeToggle.addEventListener("click", () => applyTheme(!isDarkMode));

      function loadTheme() {
        const saved = localStorage.getItem(STORAGE_THEME);
        if (saved === "dark") applyTheme(true);
        else if (saved === "light") applyTheme(false);
        else if (window.matchMedia("(prefers-color-scheme: dark)").matches)
          applyTheme(true);
        else applyTheme(false);
      }

      // 移动端标签
      function switchMobileTab(tab) {
        isMobilePreview = tab === "preview";
        if (tab === "preview") {
          panelEditor.classList.add("mobile-hidden");
          panelPreview.classList.add("mobile-visible");
          tabPreview.classList.add("active");
          tabEditor.classList.remove("active");
          updatePreview();
        } else {
          panelEditor.classList.remove("mobile-hidden");
          panelPreview.classList.remove("mobile-visible");
          tabEditor.classList.add("active");
          tabPreview.classList.remove("active");
          editor.focus();
        }
      }
      tabEditor.addEventListener("click", () => switchMobileTab("editor"));
      tabPreview.addEventListener("click", () => switchMobileTab("preview"));

      function isMobile() {
        return window.innerWidth <= 768;
      }

      // 分隔拖拽
      function initDivider() {
        let dragging = false,
          startX,
          startWidth;
        dividerBar.addEventListener("mousedown", (e) => {
          if (isMobile()) return;
          dragging = true;
          startX = e.clientX;
          startWidth = panelEditor.getBoundingClientRect().width;
          document.body.style.cursor = "col-resize";
          document.body.style.userSelect = "none";
          e.preventDefault();
        });
        document.addEventListener("mousemove", (e) => {
          if (!dragging) return;
          const cw = mainContainer.getBoundingClientRect().width;
          const dw = dividerBar.getBoundingClientRect().width;
          let newWidth = startWidth + (e.clientX - startX);
          newWidth = Math.max(180, Math.min(cw - dw - 180, newWidth));
          const pct = (newWidth / cw) * 100;
          panelEditor.style.flex = "none";
          panelEditor.style.width = `${pct}%`;
          panelPreview.style.flex = "none";
          panelPreview.style.width = `${100 - pct - (dw / cw) * 100}%`;
          localStorage.setItem(STORAGE_SPLIT, pct.toFixed(1));
        });
        document.addEventListener("mouseup", () => {
          if (dragging) {
            dragging = false;
            document.body.style.cursor = "";
            document.body.style.userSelect = "";
          }
        });
      }

      // 工具栏操作
      function insertText(before, after, placeholder) {
        const s = editor.selectionStart,
          e = editor.selectionEnd;
        const sel = editor.value.substring(s, e) || placeholder || "";
        editor.value =
          editor.value.substring(0, s) +
          before +
          sel +
          after +
          editor.value.substring(e);
        editor.focus();
        editor.setSelectionRange(
          s + before.length,
          s + before.length + sel.length,
        );
        updatePreview();
      }
      function insertBlock(prefix, placeholder) {
        const s = editor.selectionStart;
        const lineStart = editor.value.lastIndexOf("\n", s - 1) + 1;
        const ins =
          (editor.value.substring(lineStart, s).length === 0 ? "" : "\n") +
          prefix +
          (placeholder || "");
        editor.value =
          editor.value.substring(0, s) + ins + editor.value.substring(s);
        editor.focus();
        editor.setSelectionRange(s + ins.length, s + ins.length);
        updatePreview();
      }
      function wrapSelection(wrapper) {
        const s = editor.selectionStart,
          e = editor.selectionEnd;
        const sel = editor.value.substring(s, e);
        if (sel) {
          editor.value =
            editor.value.substring(0, s) +
            wrapper +
            sel +
            wrapper +
            editor.value.substring(e);
          editor.setSelectionRange(s + wrapper.length, e + wrapper.length);
        } else {
          editor.value =
            editor.value.substring(0, s) +
            wrapper +
            wrapper +
            editor.value.substring(s);
          editor.setSelectionRange(s + wrapper.length, s + wrapper.length);
        }
        editor.focus();
        updatePreview();
      }

      toolbar.addEventListener("click", (e) => {
        const btn = e.target.closest(".toolbar-btn");
        if (!btn) return;
        const action = btn.dataset.action;
        switch (action) {
          case "heading":
            insertBlock("### ", "标题");
            break;
          case "bold":
            wrapSelection("**");
            break;
          case "italic":
            wrapSelection("*");
            break;
          case "link":
            insertText("[", "](url)", "链接文字");
            break;
          case "image":
            insertText("![", "](url)", "图片描述");
            break;
          case "codeblock":
            insertBlock("```\n", "代码\n```");
            break;
          case "inlinecode":
            wrapSelection("`");
            break;
          case "quote":
            insertBlock("> ", "引用内容");
            break;
          case "ul":
            insertBlock("- ", "列表项");
            break;
          case "ol":
            insertBlock("1. ", "列表项");
            break;
          case "table":
            insertBlock(
              "| 列1 | 列2 | 列3 |\n|-----|-----|-----|\n| 内容 | 内容 | 内容 |\n",
              "",
            );
            break;
          case "hr":
            insertBlock("\n---\n", "");
            break;
        }
      });

      // 键盘快捷键
      editor.addEventListener("keydown", (e) => {
        if (e.key === "Tab") {
          e.preventDefault();
          const s = editor.selectionStart,
            ed = editor.selectionEnd;
          if (s === ed) {
            editor.value =
              editor.value.substring(0, s) +
              "    " +
              editor.value.substring(s);
            editor.selectionStart = editor.selectionEnd = s + 4;
          } else {
            const lines = editor.value.substring(s, ed).split("\n");
            editor.value =
              editor.value.substring(0, s) +
              lines.map((l) => "    " + l).join("\n") +
              editor.value.substring(ed);
          }
          updatePreview();
        }
        const ctrl = e.ctrlKey || e.metaKey;
        if (ctrl && e.key === "b") {
          e.preventDefault();
          wrapSelection("**");
        }
        if (ctrl && e.key === "i") {
          e.preventDefault();
          wrapSelection("*");
        }
        if (ctrl && e.key === "k") {
          e.preventDefault();
          insertText("[", "](url)", "链接文字");
        }
      });

      // 滚动事件
      editor.addEventListener("scroll", () => {
        if (editingProgrammaticScroll) {
          editingProgrammaticScroll = false;
          return;
        }
        syncEditorScrollToPreview();
      });
      editor.addEventListener("click", () => {
        userScrollingPreview = false;
        syncCursorToPreview();
      });
      editor.addEventListener("keyup", (e) => {
        if (e.key.startsWith("Arrow") || e.key === "Home" || e.key === "End")
          syncCursorToPreview();
      });

      previewScroller.addEventListener("scroll", () => {
        if (programmaticScroll) {
          programmaticScroll = false;
          return;
        }
        userScrollingPreview = true;
        clearTimeout(userScrollTimeout);
        syncPreviewToEditor();
        userScrollTimeout = setTimeout(() => {
          userScrollingPreview = false;
          syncCursorToPreview();
        }, 2000);
      });

      editor.addEventListener("input", updatePreview);
      window.addEventListener("resize", () => {
        if (!isMobile()) {
          panelEditor.classList.remove("mobile-hidden");
          panelPreview.classList.remove("mobile-visible");
        }
        updatePreview();
      });

      // 初始化
      loadTheme();
      editor.value = loadContent();
      updatePreview();
      initDivider();
      editor.focus();
      editor.setSelectionRange(editor.value.length, editor.value.length);
    })();
  
  </script>
</body>
