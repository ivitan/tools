  <script>
    /* 提前应用主题，避免首屏闪白；默认「跟随系统」，仅在用户曾手动锁定浅/深时读缓存 */
    (function () {
      try {
        var KEY = 'airport-theme-v2'; // 换新键，避开旧版残留的锁定值
        var saved = localStorage.getItem(KEY);
        var t = (saved && saved !== 'system')
          ? saved
          : (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        document.documentElement.dataset.theme = t;
        document.documentElement.style.colorScheme = t; // 同步滚动条/原生控件配色
        if (t === 'dark') document.documentElement.style.background = '#0b1220'; // 兜底：仅深色防 CSS 解析前露白
      } catch (e) {}
    })();
  </script>

<script>
/* 移动端状态栏配色同步（mobile-native §10）：监听 data-theme 变化，写入页面实际顶部背景色 */
(function () {
  function upd() {
    var meta = document.querySelector('meta[name="theme-color"]'); if (!meta) return;
    var el = document.querySelector('.header, header') || document.body; if (!el) return;
    var bg = getComputedStyle(el).backgroundColor;
    if (bg === 'rgba(0, 0, 0, 0)' || bg === 'transparent') { el = document.body; if (el) bg = getComputedStyle(el).backgroundColor; }
    if (bg && bg !== 'rgba(0, 0, 0, 0)' && bg !== 'transparent') meta.content = bg;
  }
  upd();
  document.addEventListener('DOMContentLoaded', upd);
  if (window.MutationObserver) new MutationObserver(upd).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
  if (window.matchMedia) matchMedia('(prefers-color-scheme: dark)').addEventListener('change', upd);
})();
</script>

    }
@media (hover: hover) and (pointer: fine) {
    .dropzone:hover { background: var(--panel); }
}
    .dropzone { margin-bottom: 8px; }
    .dropzone--sm {
      position: relative;
      width: 28px;
      height: 28px;
      border: 1px dashed var(--border-hover);
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--surface);
      cursor: pointer;
      flex-shrink: 0;
      align-self: center;
      transition: background-color .15s, border-color .15s;
    }
    /* 用绝对定位把图标精确居中，避免 SVG 作为 flex 子项时个别浏览器不居中的情况 */
    .dropzone--sm svg.ic-16 {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
    }
@media (hover: hover) and (pointer: fine) {
    .dropzone--sm:hover { background: var(--panel); }
}
    .file-input {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      opacity: 0;
      cursor: pointer;
    }
    .dropzone-text {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 12px;
      font-weight: 500;
      color: var(--text-secondary);
    }
    /* 拖拽 / 点击激活态 */
    .drag-active,
    .drop-focus,
    #dropZoneLarge:active,
    #dropZoneSmall:active {
      border-color: var(--primary) !important;
      background-color: var(--primary-light) !important;
    }

    /* 表选择面板 */
    .table-panel {
      border: 1px solid var(--border);
      background: var(--panel);
      border-radius: 4px;
      padding: 8px;
      overflow-y: auto;
      max-height: 192px;
    }
    .panel-title { font-size: 12px; line-height: 16px; font-weight: 700; color: var(--text-muted); margin-bottom: 4px; }
    .table-item { display: flex; align-items: center; gap: 4px; min-width: 0; }
    .table-checkbox { width: 14px; height: 14px; accent-color: var(--primary); border-radius: 4px; flex-shrink: 0; }
    .table-item label {
      font-size: 12px;
      color: var(--text-secondary);
      cursor: pointer;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    /* ---------- 11. 表格 ---------- */
    .tbl { width: 100%; min-width: 100%; border-collapse: collapse; font-size: 12px; line-height: 16px; }
    .tbl th, .tbl td {
      padding: 6px 12px;
      white-space: nowrap;
      text-align: center;
    }
    /* 边框只保留「右侧竖线 + 表头下横线」，与旧版一致：
       多画上下/左边框会让表格整体高出 2px，并改变首列起始位置 */
    .tbl th { border: 0 solid var(--table-border); border-width: 0 1px 1px 0; }
    .tbl td { border: 0 solid var(--table-border); border-width: 0 1px 0 0; }
    .tbl th {
      background: var(--header-row);
      color: var(--text);
      font-weight: 600;
    }
    .tbl td { color: var(--text-secondary); }
    .tbl thead th {
      position: sticky;
      top: 0;
      z-index: 2;
      box-shadow: var(--shadow);
    }
    .tbl tbody tr { transition: background-color .15s; }
@media (hover: hover) and (pointer: fine) {
    .tbl tbody tr:hover { background: var(--row-hover); }
}
    .tbl td.is-empty { color: var(--weak); }
    @media (min-width: 640px) { .tbl { font-size: 13px; } }

    /* 节点提取表：窄列 + 上下双行表头 */
    .tbl--nodes th { min-width: 100px; padding: 8px 12px; font-weight: 400; }
    @media (min-width: 640px) { .tbl--nodes th { min-width: 120px; } }
    .th-main { font-weight: 700; color: var(--text-strong); }
    .th-sub  { font-size: 10px; color: var(--text-dim); margin-top: 2px; }
    @media (min-width: 640px) { .th-sub { font-size: 11px; } }
    .tbl--nodes td { padding: 8px 12px; vertical-align: middle; }
    .cell-time { color: var(--text); font-weight: 500; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }

    /* 粘贴展示表：表头左对齐 */
    .tbl--paste { font-size: 12px; line-height: 1.5; }
    .tbl--paste th { text-align: left; padding: 6px 12px; font-weight: 600; color: var(--text); }
    .tbl--paste td { padding: 6px 12px; border-bottom-width: 1px; }

    /* 原始数据明细表：更小字号 */
    .tbl--raw { font-size: 11px; line-height: 1.5; }
    @media (min-width: 640px) { .tbl--raw { font-size: 12px; line-height: 16px; } }
    .tbl--raw th { padding: 8px 12px; }
    .tbl--raw td { text-align: center; border-width: 0; }
    .tbl--raw tbody tr + tr td { border-top-width: 1px; }

    .table-scroll { overflow: auto; overscroll-behavior: contain; }

    /* 展开「余下 N 条」按钮 */
    .more-btn {
      display: block;
      margin-top: 4px;
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 10px;
      text-align: center;
      background: var(--primary-light);
      color: var(--primary);
      transition: background-color .15s;
    }
@media (hover: hover) and (pointer: fine) {
    .more-btn:hover { background: var(--primary-soft); }
}
    details.more-row > summary { outline: none; list-style: none; text-align: center; cursor: pointer; }
    .more-divider {
      margin-top: 4px;
      padding-top: 4px;
      border-top: 1px solid var(--border);
      color: var(--text-secondary);
      line-height: 1.6;
    }

    /* ---------- 12. 状态提示 / 日期复制 ---------- */
    .status {
      margin-bottom: 8px;
      font-size: 12px;
      font-weight: 500;
      text-align: center;
      line-height: 16px;
      color: var(--text-muted);
    }
    .date-display {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 13px;
      font-weight: 700;
      color: var(--primary);
      cursor: pointer;
      user-select: none;
      transition: color .15s;
    }
@media (hover: hover) and (pointer: fine) {
    .date-display:hover { color: var(--primary-hover); }
}
    .copy-icon { opacity: .8; transition: opacity .15s; }
@media (hover: hover) and (pointer: fine) {
    .date-display:hover .copy-icon { opacity: 1; }
}
    .check-icon { color: var(--success); }

    /* ---------- 13. 粘贴网格 ---------- */
    .paste-box {
      position: relative;
      width: 100%;
      min-height: 140px;
      max-height: 60vh;
      overflow: auto;
      overscroll-behavior: contain;
      background: var(--panel);
      border: 1px solid var(--border-hover);
      border-radius: 6px;
      cursor: text;
      transition: box-shadow .15s, border-color .15s;
    }
    .paste-box.focus-glow {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 1px var(--primary);
    }
    .paste-placeholder {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 16px;
      font-size: 12px;
      color: var(--weak);
      pointer-events: none;
      user-select: none;
    }
    .paste-placeholder svg { margin-bottom: 8px; color: var(--weak); }

    /* ---------- 14. 折叠箭头 / 轻提示 ---------- */
    .chev {
      display: inline-block;
      font-size: 12px;
      line-height: 16px;
      color: var(--weak);
      transition: transform .2s;
    }
    .chev--up { transform: rotate(-90deg); }

    .toast {
      position: fixed;
      left: 50%;
      bottom: calc(24px + env(safe-area-inset-bottom));
      z-index: 50;
      padding: 6px 12px;
      border-radius: 6px;
      background: rgba(15, 23, 42, .85);
      color: #fff;
      font-size: 12px;
      box-shadow: var(--shadow-lg);
      opacity: 0;
      transform: translateX(-50%);
      transition: opacity .2s;
      pointer-events: none;
    }
    [data-theme="dark"] .toast { background: rgba(226, 232, 240, .92); color: #0b1220; }

    /* ---------- 15. 滚动条 ---------- */
    .custom-scrollbar::-webkit-scrollbar { height: 6px; width: 6px; }
    .custom-scrollbar::-webkit-scrollbar-track { background: var(--scrollbar-track); border-radius: 3px; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: var(--scrollbar-thumb); border-radius: 3px; }
@media (hover: hover) and (pointer: fine) {
    .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: var(--scrollbar-thumb-hover); }
}

    /* ---------- 16. 节点字段帮助（表头「?」+ 悬浮气泡） ---------- */
    /* 主标题行改为「中文名 + ?」行内居中；按钮为裸图标，不额外占布局高度 */
    .tbl--nodes .th-main { display: inline-flex; align-items: center; gap: 4px; }
    .th-help {
      width: 15px;
      height: 15px;
      padding: 0;
      border: 0;
      background: transparent;
      border-radius: 50%;
      color: var(--text-dim);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      cursor: help;
      transition: color .15s, background-color .15s, box-shadow .15s;
    }
    .th-help svg { width: 15px; height: 15px; display: block; }
@media (hover: hover) and (pointer: fine) {
    .th-help:hover { color: var(--primary); background: var(--primary-light); box-shadow: 0 0 0 3px var(--primary-light); }
}
    .th-help.is-open { color: var(--primary); background: var(--primary-light); box-shadow: 0 0 0 3px var(--primary-light); }

    /* 气泡：沿用卡片语言（浅蓝标题栏 + 正文分区），变量取色，深浅色自动适配 */
    .node-help-pop {
      position: fixed;
      z-index: 300;
      display: none;
      width: min(340px, calc(100vw - 16px));
      max-height: min(70vh, 460px);
      overflow: auto;
      overscroll-behavior: contain;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 8px;
      box-shadow: var(--shadow-lg);
      font-size: 12px;
      line-height: 1.6;
      color: var(--text-secondary);
      text-align: left;
      white-space: normal;
    }
    .nh-head {
      position: sticky;
      top: 0;
      z-index: 1;
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 7px 12px;
      background: var(--primary-light);
      border-bottom: 1px solid var(--primary-soft);
    }
    .nh-name { font-size: 12px; font-weight: 700; color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .nh-code { font-size: 10px; color: var(--text-dim); flex-shrink: 0; }
    .nh-ref { margin-left: auto; font-size: 10px; color: var(--text-muted); flex-shrink: 0; }
    .nh-body { padding: 10px 12px; }
    .nh-sec + .nh-sec { margin-top: 10px; padding-top: 10px; border-top: 1px dashed var(--border); }
    .nh-sec-title { display: flex; align-items: center; font-size: 12px; font-weight: 700; margin-bottom: 6px; }
    .nh-sec-title svg { width: 13px; height: 13px; flex-shrink: 0; margin-right: 4px; }
    .nh-sec-title--trouble { color: var(--warn); }
    .nh-sec-title--video { color: var(--primary); }
    .nh-list { margin: 0; padding-left: 16px; }
    .nh-list li { color: var(--text-muted); }
    .nh-list li + li { margin-top: 4px; }
    .nh-empty { color: var(--weak); }
  </style>
</head>

<body>
  <header class="header">
    <div class="header-inner">
      <div class="logo">
        <div class="logo-icon"><i class="fas fa-plane"></i></div>
        <span>节点信息提取</span>
        <a href="../" class="home-btn" title="返回主页" aria-label="返回主页">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
            <path d="M9 22V12h6v10"></path>
          </svg>
        </a>
      </div>
      <button class="icon-btn" id="btnTheme" title="切换主题" type="button">
        <svg id="iconSun" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display:none;">
          <circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
        </svg>
        <svg id="iconMoon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
        </svg>
      </button>
    </div>
  </header>
  <main class="page">

    <div class="stack">
      <!-- 通道 A：数据库源输入区 -->
      <div class="card card--soft">
        <div class="card-body--lg">
          <div class="grid-2">
            <div class="col col-full">
              <div class="row g-xs section-title">
                <span class="badge">A</span>
                <span class="section-title section-title--inline c-secondary nowrap">导入数据库 (可选)</span>
                <div id="dropZoneSmall" class="dropzone--sm hidden"
                  title="点击选择 SQLite 文件，或将文件拖拽到此导入">
                  <svg class="ic-16 c-muted" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round" style="pointer-events:none;">
                    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                    <polyline points="17 8 12 3 7 8"></polyline>
                    <line x1="12" y1="3" x2="12" y2="15"></line>
                  </svg>
                  <input type="file" id="dbFilesSmall" multiple accept=".db,.db3,.db4,.sqlite,.sqlite3,.s3db,.sl3,application/x-sqlite3,application/vnd.sqlite3" class="file-input" />
                </div>
                <span id="fileInfo" class="spacer truncate fs-12 fw-bold c-primary hidden"></span>
              </div>
              <div id="dropZoneLarge" class="dropzone">
                <span class="dropzone-text">
                  <svg class="ic c-muted" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                    <polyline points="17 8 12 3 7 8"></polyline>
                    <line x1="12" y1="3" x2="12" y2="15"></line>
                  </svg>
                  点击选择 SQLite 文件，或将文件拖拽到此导入</span>
                <input type="file" id="dbFilesLarge" multiple accept=".db,.db3,.db4,.sqlite,.sqlite3,.s3db,.sl3,application/x-sqlite3,application/vnd.sqlite3" class="file-input" />
              </div>
              <div id="tableSelectionSection" class="table-panel custom-scrollbar hidden">
                <p class="panel-title">勾选要提取的表:</p>
                <div id="tableList" class="grid-fixed-3"></div>
              </div>
            </div>
            <div class="col col-full">
              <p class="section-title c-secondary">
                <svg class="ic" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                </svg>节点提取条件与操作</p>
              <div class="grow col-between g-md">
                <div class="grid-form">
                  <input type="text" id="startTime" placeholder="开始:2026-06-08 08:08:08"
                    title="开始时间格式:2026-06-08 08:08:08" class="input" />
                  <input type="text" id="endTime" placeholder="结束:2026-09-09 09:09:09" title="结束时间格式:2026-09-09 09:09:09"
                    class="input" />
                  <input type="text" id="aproCode" placeholder="机位号:933" title="输入 aproCode" class="input" />
                </div>
                <div class="grid-3">
                  <button id="btnParseNear" class="btn-act btn-blue">
                    <svg class="ic" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 012-2h2a2 2 0 012 2">
                      </path>
                    </svg>近机位提取
                  </button>
                  <button id="btnParseRemote" class="btn-act btn-sky">
                    <svg class="ic" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M3.055 11H5a2 2 0 012 2v1a2 2 0 002 2 2 2 0 012 2v2.945M8 3.935V5.5A2.5 2.5 0 0010.5 8h.5a2 2 0 012 2 2 2 0 104 0 2 2 0 012-2h1.064M15 20.488V18a2 2 0 012-2h3.064M21 12a9 9 0 11-18 0 9 9 0 0118 0z">
                      </path>
                    </svg>远机位提取
                  </button>
                  <button id="btnExport" class="btn-act btn-purple">
                    <svg class="ic" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"></path>
                    </svg>导出结果表
                  </button>
                  <button id="btnCopy" class="btn-act btn-emerald">
                    <svg class="ic" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z">
                      </path>
                    </svg>复制时间点
                  </button>
                  <button id="btnCopyTableNums" class="btn-act btn-amber" title="复制镜头号">
                    <svg class="ic" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M9 17v-2m3 2v-4m3 4v-6m2 10H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z">
                      </path>
                    </svg>复制镜头号
                  </button>
                  <button id="btnClear" class="btn-act btn-gray">
                    <svg class="ic" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16">
                      </path>
                    </svg>清空结果集
                  </button>
                </div>
                <div id="queryStatus" class="status">
                  请配置数据并选择提取模式
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>

      <div class="stack">
        <!-- 解析节点提取表 (固定展开) -->
        <div class="card">
          <div class="card-head card-head--primary">
            <div class="row g-lg">
              <span class="card-title c-blue">
                <svg class="ic" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4"></path>
                </svg>各节点时间提取结果 (左右滑动查看)</span>
              <span id="extractedDateDisplay" class="date-display hidden" title="单击复制日期">
                <span class="date-text"></span>
                <svg class="copy-icon ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                  stroke-linecap="round" stroke-linejoin="round">
                  <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
                  <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
                </svg>
                <svg class="check-icon ic hidden" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"
                  stroke-linecap="round" stroke-linejoin="round">
                  <polyline points="20 6 9 17 4 12"></polyline>
                </svg>
              </span>
            </div>
          </div>
          <div class="table-scroll custom-scrollbar card-body">
            <table class="tbl tbl--nodes" id="nodeTable">
              <thead id="exactTableHeader"></thead>
              <tbody id="exactTableBody"></tbody>
            </table>
          </div>
        </div>

        <!-- 通道 B：数据粘贴与回显展示区（默认展开） -->
        <div class="card">
          <div id="pasteToggleBtn" class="card-head card-head--neutral">
            <div class="row">
              <span class="badge">B</span>
              <span class="fs-12 fw-bold c-secondary">数据粘贴与回显展示区 (<span id="filteredTextCount"
                  class="c-primary fw-bold">0</span>行)</span>
            </div>
            <span id="pasteToggleIcon" class="chev">▼</span>
          </div>
          <div id="pasteContainer" class="col card-body--lg card-body--soft">
            <p class="hint">
              点击下方网格区域粘贴测试数据，或查看数据库提取后的回显结果
            </p>
            <textarea id="pasteArea" class="hidden"></textarea>

            <div id="pasteGridWrapper" tabindex="0" class="paste-box custom-scrollbar">
              <div id="pastePlaceholder" class="paste-placeholder">

    // 常量与正则预编译

    /* 主题管理（与 SQLite 工具统一：默认跟随系统，system/light/dark 三态） */
    const theme = {
      KEY: 'airport-theme-v2',
      get mode() { return localStorage.getItem(this.KEY) || 'system'; },
      get effective() {
        if (this.mode === 'system')
          return (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        return this.mode;
      },
      apply() {
        const t = this.effective;
        document.documentElement.dataset.theme = t;
        document.documentElement.style.colorScheme = t;
        document.documentElement.style.background = 'var(--bg)';
        this._updateIcon();
      },
      toggle() {
        const next = this.effective === 'dark' ? 'light' : 'dark';
        localStorage.setItem(this.KEY, next); // 锁定为手动选择，停止跟随系统
        this.apply();
        toast(`已切换为${this.effective === 'dark' ? '深色' : '浅色'}模式（双击按钮恢复跟随系统）`, 'success');
      },
      init() {
        this.apply();
        const mq = matchMedia('(prefers-color-scheme: dark)');
        const sync = () => { if (this.mode === 'system') this.apply(); };
        if (mq.addEventListener) mq.addEventListener('change', sync);
        else if (mq.addListener) mq.addListener(sync); // 老浏览器兼容
        // 部分 Android WebView 在系统主题切换 / 应用切后台再回前台时不回调 change，
        // 额外挂 visibilitychange / focus / storage 兜底（覆盖 SQLite 等仅监听 change 的不足）。
        document.addEventListener('visibilitychange', () => {
          if (document.visibilityState === 'visible') sync();
        });
        window.addEventListener('focus', sync);
        window.addEventListener('storage', sync);
      },
      _updateIcon() {
        const eff = this.effective;
        const sun = document.getElementById('iconSun');
        const moon = document.getElementById('iconMoon');
        if (sun) sun.style.display = eff === 'light' ? 'block' : 'none';
        if (moon) moon.style.display = eff === 'dark' ? 'block' : 'none';
      }
    };

    function toast(msg, type = '', duration = 1800) {

        'padding:8px 14px;border-radius:8px;font:500 13px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;' +

        'opacity:0;transform:translateY(-6px);transition:opacity .2s ease,transform .2s ease;pointer-events:none;';
      document.body.appendChild(el);
      requestAnimationFrame(() => { el.style.opacity = '1'; el.style.transform = 'translateY(0)'; });

        el.style.opacity = '0'; el.style.transform = 'translateY(-6px)';

    function escapeHtml(str) {

        el.setAttribute("role", "tooltip");
        el.addEventListener("mouseenter", () => clearTimeout(this.hideTimer));
        el.addEventListener("mouseleave", () => { if (!this.pinned) this.hide(); });
        document.body.appendChild(el);
        this.el = el;
        return el;
      },
      position() {
        const el = this.el;
        const anchor = this.anchor;
        if (!el || !anchor) return;
        const gap = 8;
        const pad = 8;
        const r = anchor.getBoundingClientRect();
        const w = el.offsetWidth;
        const h = el.offsetHeight;
        let left = r.left + r.width / 2 - w / 2;
        left = Math.max(pad, Math.min(left, window.innerWidth - w - pad));
        let top = r.bottom + gap;
        if (top + h > window.innerHeight - pad) {
          const above = r.top - gap - h;
          top = above >= pad ? above : Math.max(pad, window.innerHeight - h - pad);
        }
        el.style.left = left + "px";
        el.style.top = top + "px";
      },
      show(anchor, pin) {
        if (this.anchor !== anchor) this.markOpen(false);
        const el = this.ensure();
        clearTimeout(this.hideTimer);
        el.innerHTML = buildNodeHelpHtml(anchor.dataset.code);
        el.style.visibility = "hidden";
        el.style.display = "block";
        this.anchor = anchor;
        this.pinned = !!pin;
        this.position();
        el.scrollTop = 0;
        el.style.visibility = "";
        this.markOpen(true);
      },
      markOpen(open) {
        if (!this.anchor) return;
        this.anchor.classList.toggle("is-open", open);
      },
      hide() {
        clearTimeout(this.hideTimer);
        if (this.el) {
          this.el.style.display = "none";
          this.el.style.visibility = "";
        }
        this.markOpen(false);
        this.anchor = null;
        this.pinned = false;
      },
      scheduleHide(delay) {
        if (this.pinned) return;
        clearTimeout(this.hideTimer);
        this.hideTimer = setTimeout(() => this.hide(), delay || 180);
      },
      isOpen() {
        return !!(this.el && this.el.style.display === "block");
      },
    };

        rafId = requestAnimationFrame(() => {

    let currentMode = "near";

    // 点击上传区以外的任意位置即恢复原状；拖拽高亮（.drag-active）优先级相同、互不冲突
    const dropFocusZones = [dropZoneLarge, dropZoneSmall];

    // 每个 SQLite 库的前 16 字节恒为 "SQLite format 3\0"
    const SQLITE_MAGIC = [
      0x53, 0x51, 0x4c, 0x69, 0x74, 0x65, 0x20,
      0x66, 0x6f, 0x72, 0x6d, 0x61, 0x74, 0x20, 0x33, 0x00,
    ];
    function isSqliteBuffer(buf) {
      if (!buf || buf.length < 16) return false;
      for (let i = 0; i < 16; i++) {
        if (buf[i] !== SQLITE_MAGIC[i]) return false;
      }
      return true;
    }

    // 用 textContent 而非 innerHTML，避免文件名中的 HTML 被解析
    function showFileStatus(msg, isError) {
      const el = document.getElementById("fileInfo");
      el.textContent = msg;
      // 完整文案挂到 title：长文件名时行内以省略号截断，鼠标悬浮查看完整内容，
      // 避免长文本把左侧标题挤扁
      el.title = msg;
      el.className = isError
        ? "spacer truncate fs-12 fw-bold c-danger"
        : "spacer truncate fs-12 fw-bold c-primary";
    }

    async function handleFiles(files) {
      if (!sqlEngine) {
        showFileStatus("引擎尚未就绪，请稍候重试", true);
        return;
      }

      databases = [];
      const tableMap = new Map();
      const failed = [];

      // 阶段 1：并行读取全部文件并做 SQLite 头校验（纯 IO / 字节比较，互不阻塞）。
      // 旧实现是 for 循环里逐个 await file.arrayBuffer()，N 个文件要串行等 N 次读取；
      // 改成 Promise.all 一次并行读后，多文件导入耗时从「累加」变为「取最慢单个」，
      // 这也是 SQLite 工具比本工具快很多的根因。
      const arr = [...files];
      const prepared = await Promise.all(
        arr.map(async (file) => {
          try {
            const buf = new Uint8Array(await file.arrayBuffer());
            return { file, buf, ok: isSqliteBuffer(buf), error: null };
          } catch (e) {
            return { file, error: e };
          }
        }),
      );

      // 阶段 2：串行执行 CPU 重的建库逻辑，每完成一个让出主线程（setTimeout 0），
      // 避免一次性卡死 UI；坏文件逐个捕获，保证整批不会因为一个出错而中断。
      // ① 文件头校验已在阶段 1 完成（SQLite 打开是惰性的，非数据库文件到执行查询时才报错，
      //    那样 UI 早已显示「已载入」，造成假成功错觉，故提前拦截）。
      for (let i = 0; i < prepared.length; i++) {
        const p = prepared[i];
        if (p.error) {
          failed.push({ name: p.file.name, reason: "无法读取文件" });
          continue;
        }
        if (!p.ok) {
          failed.push({ name: p.file.name, reason: "不是 SQLite 数据库文件" });
          continue;
        }

        let db = null;
        try {
          db = new sqlEngine.Database(p.buf);
          const res = db.exec(
            "SELECT name FROM sqlite_master WHERE type='table' AND name NOT LIKE 'sqlite_%';",
          );
          databases.push({ name: p.file.name, db: db });
          if (res.length > 0) {
            res[0].values.forEach((row) => {
              const tableName = row[0];
              if (!tableMap.has(tableName)) {
                tableMap.set(tableName, []);
              }
              tableMap.get(tableName).push(p.file.name);
            });
          }
        } catch (e) {
          if (db) {
            try { db.close(); } catch (_) {}
          }
          failed.push({ name: p.file.name, reason: "数据库损坏或格式不支持" });
        }
        if (i < prepared.length - 1) await new Promise((r) => setTimeout(r, 0));
      }

      const tableListDiv = document.getElementById("tableList");
      // 一次性拼接后写入 innerHTML，避免逐项 appendChild 触发多次重排
      let listHtml = "";
      tableMap.forEach((files, tableName) => {
        listHtml += `<div class="table-item">
        <input type="checkbox" value="${tableName}" class="table-checkbox" checked>
        <label class="cursor-pointer truncate" title="${tableName}" onclick="this.previousElementSibling.click()">
          ${tableName}
        </label>
      </div>`;
      });
      tableListDiv.innerHTML = listHtml;

      const okCount = databases.length;

      // ② 全部失败时回滚到上传前状态，绝不留下「已载入」的假象
      if (okCount === 0) {
        dropZoneLarge.classList.remove("hidden");
        dropZoneSmall.classList.add("hidden");
        document.getElementById("tableSelectionSection").classList.add("hidden");
        const msg =
          failed.length === 1
            ? `${failed[0].name} ${failed[0].reason}`
            : `${failed.length} 个文件导入失败：${failed.map((f) => f.name).join("、")}`;
        showFileStatus(msg, true);
        return;
      }

      dropZoneLarge.classList.add("hidden");
      dropZoneSmall.classList.remove("hidden");
      document
        .getElementById("tableSelectionSection")
        .classList.remove("hidden");

      if (failed.length > 0) {
        showFileStatus(
          `已载入 ${okCount} 个库，${failed.length} 个失败：${failed.map((f) => f.name).join("、")}`,
          true,
        );
      } else if (tableMap.size === 0) {
        showFileStatus(`已载入 ${okCount} 个库，但未找到数据表`, true);
      } else {
        showFileStatus(`已载入 ${okCount} 个库`, false);
      }
    }

    // B 区是否正处于「数据库提取结果」展示状态（此状态下禁用粘贴，清空后恢复）
    let bAreaDbDataActive = false;

    // 避免「清空结果集」后焦点仍在按钮上导致粘贴事件收不到）
    document.addEventListener("paste", (e) => {
      // 粘贴目标若为输入框（开始/结束时间、机位号等条件区），保持浏览器默认行为：
      // 不拦截、不写入 B 区网格，粘贴内容仅作为筛选条件参与提取
      const pasteTarget = e.target;

          pasteTarget.isContentEditable)
      ) {
        return;

      e.preventDefault();
      // 数据库数据展示期间不触发粘贴，需先点击「清空结果集」恢复
      if (bAreaDbDataActive) {

        return;

      const text = (e.clipboardData || window.clipboardData).getData(
        "text",
      );

        const pasteArea = document.getElementById("pasteArea");
        pasteArea.value = pasteArea.value
          ? pasteArea.value + "\n" + text
          : text;

        document.getElementById("queryStatus").innerHTML =
          `<span class="c-primary">正在渲染数据，请稍候</span>`;

        // 异步释放主线程，防止浏览器卡死
        setTimeout(() => {
          renderPasteTableGrid();
          document.getElementById("queryStatus").innerHTML =
            `<span class="c-success">数据已粘贴至网格，请点击提取按钮</span>`;

    // 焦点蓝边（激活指示）仅在非数据库展示状态下显示
    const pasteGridEl = document.getElementById("pasteGridWrapper");

    function showToast(msg) {
      let t = document.getElementById("copyToast");

    // 复制文本（优先 Clipboard API，失败/非安全上下文降级 execCommand）
    function copyText(text) {
      return new Promise((resolve) => {
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(text).then(resolve).catch(() => {
            fallbackCopy(text);
            resolve();
          });
        } else {
          fallbackCopy(text);
          resolve();
        }
      });
    }
    function fallbackCopy(text) {
      try {
        const ta = document.createElement("textarea");
        ta.value = text;
        ta.style.position = "fixed";
        ta.style.top = "0";
        ta.style.left = "0";
        ta.style.opacity = "0";
        document.body.appendChild(ta);
        ta.focus();
        ta.select();
        document.execCommand("copy");
        document.body.removeChild(ta);

    }

    // 双击 B 区网格内任意单元格复制其内容（含数据库来源数据）
    document
      .getElementById("pasteGridWrapper")
      .addEventListener("dblclick", (e) => {

    function renderPasteTableGrid(extraText) {
      const base = document.getElementById("pasteArea").value.trim();
      let extra = extraText || "";
      // 用户已粘贴时，去掉 DB TSV 首行表头避免与粘贴表头重复
      if (base && extra) {
        const idx = extra.indexOf("\n");
        extra = idx >= 0 ? extra.slice(idx + 1) : "";
      }
      const text = (base ? base + "\n" : "") + extra;
      const table = document.getElementById("pasteVisualTable");
      const thead = document.getElementById("pasteVisualThead");
      const tbody = document.getElementById("pasteVisualTbody");
      const placeholder = document.getElementById("pastePlaceholder");
      const wrapper = document.getElementById("pasteGridWrapper");

      if (!text) {
        placeholder.classList.remove("hidden");
        table.classList.add("hidden");
        thead.innerHTML = "";
        tbody.innerHTML = "";
        wrapper.style.maxHeight = "";
        document.getElementById("filteredTextCount").innerText = "0";
        return;
      }

      placeholder.classList.add("hidden");
      table.classList.remove("hidden");
      // 来自数据库的数据展示时置位标志，禁用粘贴直至「清空结果集」
      bAreaDbDataActive = !!extraText;
      // 数据库展示期间不显示蓝色激活光晕
      if (extraText) wrapper.classList.remove("focus-glow");

      const lines = text.split("\n").filter((l) => l.trim() !== "");
      if (lines.length === 0) return;

      const firstLineCols = lines[0].split("\t").map((c) => c.trim());
      const hasHeader =
        firstLineCols.includes("nodeCode") ||
        firstLineCols.includes("report_time") ||
        firstLineCols.includes("aproCode");

      let headers = [];
      let startRowIdx = 0;

      if (hasHeader) {
        headers = firstLineCols;
        startRowIdx = 1;
      } else {
        const maxCols = Math.max(
          ...lines.slice(0, 5).map((l) => l.split("\t").length),
        );
        for (let c = 1; c <= maxCols; c++) {
          headers.push(`列 ${c}`);
        }
        startRowIdx = 0;
      }

      // 来自数据库的数据：B 区展示时隐藏 image_path 列
      // （该字段不参与提取逻辑，仅保留在 C 区「查看原始数据来源明细」中）
      const skipCols = extraText ? new Set(["image_path"]) : new Set();
      const colKeep = [];
      for (let h = 0; h < headers.length; h++) {
        if (!skipCols.has(headers[h])) colKeep.push(h);
      }

      // 使用数组拼接替代字符串累加
      let theadRows = ["<tr>"];
      for (let k = 0; k < colKeep.length; k++) {
        const h = colKeep[k];
        theadRows.push(
          `<th>${headers[h]}</th>`,
        );
      }
      theadRows.push("</tr>");
      thead.innerHTML = theadRows.join("");

      // DOM 限流保护：截断过长展示数据
      const isTruncated = lines.length > MAX_RENDER_ROWS;
      const displayLines = isTruncated
        ? lines.slice(0, MAX_RENDER_ROWS)
        : lines;

      let tbodyLines = new Array(displayLines.length - startRowIdx);
      let validRows = lines.length - startRowIdx;

      for (let i = startRowIdx; i < displayLines.length; i++) {
        const cols = displayLines[i].split("\t");
        let trHtml =
          '<tr>';
        for (let k = 0; k < colKeep.length; k++) {
          const j = colKeep[k];
          const cellVal = cols[j] !== undefined ? cols[j].trim() : "";
          trHtml += `<td>${cellVal}</td>`;
        }
        trHtml += "</tr>";
        tbodyLines[i - startRowIdx] = trHtml;
      }

      tbody.innerHTML = tbodyLines.join("");

      // B 区高度自适应：无论来自数据库还是手动粘贴，行数少则贴合内容，
      // 行数多则限制为视口高度并在内部滚动，避免整页被撑得过长
      const rowCount = displayLines.length - startRowIdx;
      wrapper.style.maxHeight = rowCount > 50 ? "60vh" : "";

      const truncNote = isTruncated
        ? ` (为保证性能，仅渲染前${MAX_RENDER_ROWS}行)`
        : "";
      document.getElementById("filteredTextCount").innerText =
        `${validRows}${truncNote}`;

    // 【核心引擎】
    function executeExtraction(mode) {
      if (!sqlEngine) return alert("引擎尚未就绪，请稍候");

      currentMode = mode;
      const { dict, order, label } = CONFIG[currentMode];

      const selectedTables = Array.from(
        document.querySelectorAll(".table-checkbox:checked"),
      ).map((cb) => cb.value);
      const startTime = document.getElementById("startTime").value.trim();
      const endTime = document.getElementById("endTime").value.trim();
      const aproCode = document.getElementById("aproCode").value.trim();
      let pasteText = document.getElementById("pasteArea").value.trim();

      // 第一道门：无数据来源（未勾选数据表 且 未手动粘贴）时，直接提示，不再继续
      if (selectedTables.length === 0 && !pasteText) {
        document.getElementById("queryStatus").innerHTML =
          `<span class="c-danger fw-bold">请导入并勾选数据表，或在工作网格粘贴数据</span>`;
        renderEmptyTable(currentMode);
        return;
      }

      // 查询条件必填：开始时间 / 结束时间 / 机位号 三者都需填写，缺一不可
      if (!startTime || !endTime || !aproCode) {
        document.getElementById("queryStatus").innerHTML =
          `<span class="c-danger fw-bold">请完整填写查询条件（开始时间、结束时间、机位号 均需填写）</span>`;
        renderEmptyTable(currentMode);
        return;
      }

      // 记录本次提取实际用到的数据表名与过滤条件（供"复制镜头编号"按钮使用）
      lastUsedTables = selectedTables.slice();
      lastExtractionFilter = { startTime, endTime, aproCode };

      document.getElementById("queryStatus").innerHTML =
        `<span class="c-primary">正在解析并合并数据流，请稍候</span>`;

      // 使用 setTimeout 释放主线程以渲染 loading 状态
      setTimeout(() => {
        let temporaryMap = {};
        let allRawResults = [];
        let allColumns = new Set();
        let hasDataParsed = false;
        let appidExcluded = 0; // 因 appid 与当前提取模式矛盾而被排除的行数
        let dbFilteredRawDataForTextarea = [];
        let dbFilteredColumns = new Set();

        if (selectedTables.length > 0) {
          // 过滤条件与具体表无关，提升到循环外只构建一次
          const conditions = [];
          if (startTime) conditions.push(`report_time >= '${startTime}'`);
          if (endTime) conditions.push(`report_time <= '${endTime}'`);
          if (aproCode) conditions.push(`aproCode = '${aproCode}'`);
          const whereClause =
            conditions.length > 0 ? `WHERE ${conditions.join(" AND ")}` : "";

          databases.forEach(({ name, db }) => {
            selectedTables.forEach((tableName) => {
              try {
                // 单次查询同时供 B 区展示/解析 与 C 区原始明细使用，避免重复查询建对象
                const result = db.exec(
                  `SELECT * FROM "${tableName}" ${whereClause}`,
                );
                if (result.length === 0) return;

                const cols = result[0].columns;
                const colCount = cols.length;
                const values = result[0].values;
                for (let c = 0; c < colCount; c++) {
                  const col = cols[c];
                  allColumns.add(col);
                  dbFilteredColumns.add(col);
                }

                // 用 for 循环替代 forEach 闭包，避免每行一次闭包分配
                for (let i = 0; i < values.length; i++) {
                  const row = values[i];
                  const rowObj = { _source_db: name, _source_table: tableName };
                  for (let j = 0; j < colCount; j++) {
                    rowObj[cols[j]] = row[j];
                  }
                  allRawResults.push(rowObj);
                  dbFilteredRawDataForTextarea.push(rowObj);
                }
              } catch (e) {
                console.warn("DB Read Error:", e.message);
              }
            });
          });
        }

        // 把 DB 命中数据拼成 TSV：仅用于本次解析，绝不写回粘贴区，
        // 否则取消勾选/未手动粘贴时粘贴区会残留旧数据，被误判为“有输入”而重复出内容。
        let dbTsvString = "";
        if (dbFilteredRawDataForTextarea.length > 0) {
          // 按 report_time 时间顺序升序排列（格式 YYYY-MM-DD HH:MM:SS 或 HH:MM:SS，字典序即时间序）
          dbFilteredRawDataForTextarea.sort((a, b) => {
            const ta = a.report_time || "";
            const tb = b.report_time || "";
            return ta < tb ? -1 : ta > tb ? 1 : 0;
          });

          const colsArr = Array.from(dbFilteredColumns);
          const priorityCols = ["nodeCode", "report_time", "aproCode"];
          let filteredColsArr = colsArr.filter(
            (c) => !priorityCols.includes(c),
          );
          const finalColsArr = [
            ...priorityCols.filter((c) => dbFilteredColumns.has(c)),
            ...filteredColsArr,
          ];

          // 首列放置「来源表」：标识该行命中自哪个库表（仅 DB 数据有值，手工粘贴行为空）
          const SOURCE_COL = "来源表";
          let dbTsvLines = [[SOURCE_COL, ...finalColsArr].join("\t")];
          for (let i = 0; i < dbFilteredRawDataForTextarea.length; i++) {
            const row = dbFilteredRawDataForTextarea[i];
            const lineVals = new Array(finalColsArr.length + 1);
            lineVals[0] = row._source_table || "";
            for (let j = 0; j < finalColsArr.length; j++) {
              lineVals[j + 1] = row[finalColsArr[j]] || "";
            }
            dbTsvLines.push(lineVals.join("\t"));
          }

          dbTsvString = dbTsvLines.join("\n") + "\n";
          // 把 DB 命中数据一并回显到“数据粘贴与展示区”（仅展示，不写回 pasteArea）
          renderPasteTableGrid(dbTsvString);
        }

        // 解析文本 = 用户粘贴内容 + DB 命中数据；DB 数据只在内存参与本次解析，不污染粘贴区
        const parseText = (pasteText ? pasteText + "\n" : "") + dbTsvString;

        if (parseText) {
          const lines = parseText.split("\n");
          const headers = lines[0].split("\t").map((h) => h.trim());
          let globalCodeIdx = headers.indexOf("nodeCode");
          let globalTimeIdx = headers.indexOf("report_time");
          // appid 列：remote=远机位，near=近机位（权威判定依据）
          // 数据特性：数据库导入时 appid 必为 near/remote（不会为空）→ 等同于严格过滤；
          // 仅下方粘贴区手工粘贴的数据 appid 可能为空 → 空值时回退原字典匹配，避免提取不到
          let globalAppidIdx = headers.indexOf("appid");

          let inferredCodeIdx = -1;
          let inferredTimeIdx = -1;

          // 全局智能列定位推断（解决无表头时数字被模糊兜底误杀问题）
          if (globalCodeIdx === -1 || globalTimeIdx === -1) {
            for (let i = 0; i < lines.length; i++) {
              let sampleLine = lines[i].trim();
              if (!sampleLine) continue;

              let sampleCols = sampleLine.split("\t");
              if (sampleCols.length > 1) {
                let tIdx = sampleCols.findIndex((c) => TIME_REGEX.test(c));
                if (tIdx !== -1) {
                  if (
                    tIdx + 1 < sampleCols.length &&
                    dict[sampleCols[tIdx + 1].trim()]
                  ) {
                    inferredTimeIdx = tIdx;
                    inferredCodeIdx = tIdx + 1;
                    break;
                  }
                  if (tIdx - 1 >= 0 && dict[sampleCols[tIdx - 1].trim()]) {
                    inferredTimeIdx = tIdx;
                    inferredCodeIdx = tIdx - 1;
                    break;
                  }
                }
              }
            }
          }

          for (let i = 0; i < lines.length; i++) {
            const line = lines[i].trim();
            if (!line) continue;

            let matchedCode = null;
            let matchedTime = null;

            if (globalCodeIdx !== -1 && globalTimeIdx !== -1 && i > 0) {
              const cols = line.split("\t");
              if (cols.length > Math.max(globalCodeIdx, globalTimeIdx)) {
                // 先用 appid 做近/远机位权威判定：仅当该字段明确为 near/remote 时才参与过滤，
                // 为空或无法识别时保持原有字典匹配行为，避免旧数据提取不到
                if (globalAppidIdx !== -1) {
                  const appidVal = String(
                    cols[globalAppidIdx] ?? "",
                  )
                    .trim()
                    .toLowerCase();
                  if (appidVal === "near" || appidVal === "remote") {
                    if (appidVal !== mode) {
                      appidExcluded++;
                      continue;
                    }
                  }
                }
                let code = cols[globalCodeIdx].trim();
                let rTime = cols[globalTimeIdx].trim();
                if (dict[code] && rTime) {
                  matchedCode = code;
                  let tMatch = rTime.match(TIME_REGEX);
                  if (tMatch) matchedTime = tMatch[0];
                }
              }
            } else if (inferredCodeIdx !== -1 && inferredTimeIdx !== -1) {
              const cols = line.split("\t");
              if (cols.length > Math.max(inferredCodeIdx, inferredTimeIdx)) {
                let code = cols[inferredCodeIdx].trim();
                let rTime = cols[inferredTimeIdx].trim();
                if (dict[code] && rTime) {
                  matchedCode = code;
                  let tMatch = rTime.match(TIME_REGEX);
                  if (tMatch) matchedTime = tMatch[0];
                }
              }
            } else if (globalCodeIdx === -1) {
              let tMatch = line.match(TIME_REGEX);
              if (tMatch) {
                matchedTime = tMatch[0];
                const tokens = line.split(SPLIT_REGEX);
                for (let j = 0; j < tokens.length; j++) {
                  let cleanToken = tokens[j].trim();
                  if (
                    cleanToken &&
                    dict[cleanToken] &&
                    cleanToken !== matchedTime
                  ) {
                    matchedCode = cleanToken;
                    break;
                  }
                }
              }
            }

            if (matchedCode && matchedTime) {
              if (!temporaryMap[matchedCode]) {
                temporaryMap[matchedCode] = new Set();
              }
              temporaryMap[matchedCode].add(matchedTime);
              hasDataParsed = true;
            }
          }
        }

        if (!hasDataParsed) {
          if (selectedTables.length === 0 && !pasteText) {
            document.getElementById("queryStatus").innerHTML =
              `<span class="c-danger fw-bold">请导入并勾选数据表，或在工作网格粘贴数据</span>`;
          } else {
            document.getElementById("queryStatus").innerHTML =
              `<span class="c-orange fw-bold">未在数据中提取到匹配【${label}】的有效节点</span>`;
          }
          // 无数据时清空结果表，避免“未输入却仍显示上一次内容”的观感
          renderEmptyTable(currentMode);
          return;
        }

        finalCleanedTimes = {};
        let hitCount = 0;
        let theadRows = ["<tr>"];
        let tbodyRows = ["<tr>"];

        let extractedDate = "";

        order.forEach((code) => {
          const timesSet = temporaryMap[code];
          const sortedTimes = timesSet
            ? Array.from(timesSet).sort((a, b) => a.localeCompare(b))
            : [];
          let finalSelectedTime = "";
          let displayHtml = "-";

          // 提取 03 节点首条记录的日期部分
          if (code === "03" && sortedTimes.length > 0) {
            const firstTimeStr = sortedTimes[0];
            if (firstTimeStr.includes(" ")) {
              extractedDate = firstTimeStr.split(" ")[0];
            }
          }

          if (sortedTimes.length > 0) {
            hitCount++;
            const allTimes = sortedTimes.map((ts) =>
              ts.includes(" ") ? ts.split(" ")[1] : ts,
            );

            let timesToDisplay = allTimes;
            // 行李车过滤规则：入位取首，离开取末
            if (code === "baggage_start") {
              timesToDisplay = [allTimes[0]];
            } else if (code === "baggage_end") {
              timesToDisplay = [allTimes[allTimes.length - 1]];
            }

            finalSelectedTime = timesToDisplay.join("\n");
            finalCleanedTimes[code] = finalSelectedTime;

            if (timesToDisplay.length === 1) {
              displayHtml = timesToDisplay[0];
            } else if (timesToDisplay.length === 2) {
              displayHtml = timesToDisplay.join("<br>");
            } else {
              displayHtml = `
              <details class="more-row">
                <summary>
                  <div>${timesToDisplay[0]}</div>
                  <div class="more-btn">▼ 展开余下 ${timesToDisplay.length - 1} 条</div>
                </summary>
                <div class="more-divider">
                  ${timesToDisplay.slice(1).join("<br>")}
                  <div class="more-btn" onclick="this.closest('details').removeAttribute('open')">▲ 收起</div>
                </div>
              </details>
            `;
            }
          } else {
            finalCleanedTimes[code] = "";
          }

          theadRows.push(`
          <th>
            <div class="th-main">${dict[code]}${helpBtnHtml(code)}</div>
            <div class="th-sub">${code}</div>
          </th>`);
          tbodyRows.push(
            `<td class="cell-time">${displayHtml}</td>`,
          );
        });

        theadRows.push("</tr>");
        tbodyRows.push("</tr>");

        // 更新 03 节点日期 UI
        const dateDisplayEl = document.getElementById("extractedDateDisplay");
        const dateTextEl = dateDisplayEl.querySelector(".date-text");
        if (extractedDate) {
          if (dateTextEl) dateTextEl.textContent = extractedDate;
          dateDisplayEl.classList.remove("hidden");
        } else {
          dateDisplayEl.classList.add("hidden");
          if (dateTextEl) dateTextEl.textContent = "";
        }

        document.getElementById("exactTableHeader").innerHTML =
          theadRows.join("");
        document.getElementById("exactTableBody").innerHTML =
          tbodyRows.join("");

        if (selectedTables.length > 0) {
          renderRawTable(allRawResults, Array.from(allColumns));
        } else {
          document.getElementById("rawTableHeader").innerHTML = "";
          document.getElementById("rawTableBody").innerHTML = "";
          document.getElementById("rawCount").innerText = "0";
          document.getElementById("rawTruncNote").classList.add("hidden");
        }

        const appidNote =
          appidExcluded > 0
            ? ` <span class="c-muted">（已按 appid=${mode} 过滤掉 ${appidExcluded} 行异类数据）</span>`
            : "";
        document.getElementById("queryStatus").innerHTML =
          `<span class="c-${mode === "near" ? "blue" : "sky"} fw-bold">[${label}]</span> 解析完毕，提取到 <span class="c-danger fw-bold">${hitCount}</span> 个节点${appidNote}`;
      }, 50); // 让出主线程完毕
    }

    function renderRawTable(data, columns) {
      const isTruncated = data.length > MAX_RENDER_ROWS;
      const displayData = isTruncated ? data.slice(0, MAX_RENDER_ROWS) : data;
      document.getElementById("rawCount").innerText = `${data.length}`;
      // 自适应容器高度：行数少时贴合内容（不设上限），行数多时限制为视口高度并内部滚动，
      // 避免页面被超长表格顶得过长
      const rawContainer = document.getElementById("rawContainer");
      rawContainer.style.maxHeight =
        displayData.length > 50 ? "60vh" : "";
      const rawTruncNote = document.getElementById("rawTruncNote");
      if (isTruncated) {
        rawTruncNote.textContent = `为保证性能，仅渲染前${MAX_RENDER_ROWS}条`;
        rawTruncNote.classList.remove("hidden");
      } else {
        rawTruncNote.classList.add("hidden");
      }

      const thead = document.getElementById("rawTableHeader");
      const tbody = document.getElementById("rawTableBody");

      if (data.length === 0) {
        thead.innerHTML = "";
        tbody.innerHTML = "";
        rawContainer.style.maxHeight = "";
        return;
      }

      const expectedOrder = [
        "id",
        "appid",
        "taskid",
        "aproCode",
        "camera",
        "report_time",
        "nodeCode",
        "visualId",
        "image_path",
        "info",
        "create_time",
      ];
      let finalColumns = ["_source_db", "_source_table"];
      expectedOrder.forEach((col) => {
        if (columns.includes(col)) finalColumns.push(col);
      });
      columns.forEach((col) => {
        if (!expectedOrder.includes(col)) finalColumns.push(col);
      });

      let theadRows = ["<tr>"];
      finalColumns.forEach((col) => {
        let title =
          col === "_source_db"
            ? "来源库"
            : col === "_source_table"
              ? "表名"
              : col;
        theadRows.push(
          `<th>${title}</th>`,
        );
      });
      theadRows.push("</tr>");
      thead.innerHTML = theadRows.join("");

      let tbodyLines = new Array(displayData.length);
      for (let i = 0; i < displayData.length; i++) {
        const row = displayData[i];
        let trHtml =
          '<tr>';
        for (let j = 0; j < finalColumns.length; j++) {
          let cellData = row[finalColumns[j]];
          if (cellData === null || cellData === undefined) {
            trHtml += `<td class="is-empty">-</td>`;
          } else {
            const textStr = String(cellData);
            if (textStr.length > 40) {
              trHtml += `<td title="${textStr}">${textStr.substring(0, 40)}...</td>`;
            } else {
              trHtml += `<td>${textStr}</td>`;
            }
          }
        }
        trHtml += "</tr>";
        tbodyLines[i] = trHtml;
      }
      tbody.innerHTML = tbodyLines.join("");
    }

    // 清空重置
    document.getElementById("btnClear").addEventListener("click", () => {
      finalCleanedTimes = {};
      lastUsedTables = []; // 同步清空本次提取用到的表记录
      lastExtractionFilter = null; // 同步清空过滤条件快照
      document.getElementById("pasteArea").value = "";
      bAreaDbDataActive = false; // 恢复 B 区粘贴能力

      document.querySelectorAll(".table-checkbox").forEach((cb) => {
        cb.checked = true;
      });

      renderEmptyTable();

      document.getElementById("pastePlaceholder").classList.remove("hidden");
      document.getElementById("pasteVisualTable").classList.add("hidden");
      document.getElementById("pasteVisualThead").innerHTML = "";
      document.getElementById("pasteVisualTbody").innerHTML = "";
      document.getElementById("filteredTextCount").innerText = "0";

      // 清空日期 UI
      const resetDateDisplay = document.getElementById(
        "extractedDateDisplay",
      );
      resetDateDisplay.classList.add("hidden");
      const resetDateText = resetDateDisplay.querySelector(".date-text");
      if (resetDateText) resetDateText.textContent = "";

      document.getElementById("queryStatus").innerText = "页面已全部清空重置";
    });

    // 强力复制
    document.getElementById("btnCopy").addEventListener("click", () => {
      if (Object.keys(finalCleanedTimes).length === 0)
        return alert("没有可复制的数据，请先执行提取");

      const { order } = CONFIG[currentMode];
      let text = order
        .map((code) => {
          let val = finalCleanedTimes[code] || "";
          if (val.includes("\n")) {
            return `"${val}"`;
          }
          return val;
        })
        .join("\t");

      const textArea = document.createElement("textarea");
      textArea.value = text;
      textArea.style.position = "fixed";
      textArea.style.top = "0";
      textArea.style.left = "0";
      textArea.style.opacity = "0";

      document.body.appendChild(textArea);
      textArea.focus();
      textArea.select();

      try {
        const successful = document.execCommand("copy");
        if (successful) {
          document.getElementById("queryStatus").innerHTML =
            `<span class="c-success fw-bold">时间行已成功复制，快去粘贴吧</span>`;
        } else {
          alert("写入失败，请手动框选结果复制");
        }
      } catch (err) {
        alert("当前浏览器环境受限，请手动框选");
      }

      document.body.removeChild(textArea);
    });

    // CSV导出
    document.getElementById("btnExport").addEventListener("click", () => {
      if (Object.keys(finalCleanedTimes).length === 0)
        return alert("没有可导出的数据，请先执行提取");

      const { order, dict, label } = CONFIG[currentMode];
      let csv = "\uFEFF";

      csv += order.map((code) => `"${dict[code]}\n${code}"`).join(",") + "\n";
      csv += order
        .map((code) => `"${finalCleanedTimes[code] || ""}"`)
        .join(",");

      const blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
      const link = document.createElement("a");
      link.href = URL.createObjectURL(blob);
      link.download = `航班保障提取(${label})_${new Date().getTime()}.csv`;
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
      document.getElementById("queryStatus").innerHTML =
        `<span class="c-purple fw-bold">CSV数据已成功导出</span>`;
    });

    // 复制镜头编号排序：含 03 的表最前（同表还有摆渡车/客舱门则最最前），
    // 其次其余表，最后是有摆渡车/客舱门/客梯车但无 03 的表；组内保持原序。
    document
      .getElementById("btnCopyTableNums")
      .addEventListener("click", () => {
        if (!lastUsedTables || lastUsedTables.length === 0) {
          return alert("请先执行节点提取，再复制镜头编号");
        }
        if (!sqlEngine) return alert("引擎尚未就绪，请稍候");

        const aproCodeVal = document.getElementById("aproCode").value.trim();

        // 命名规则：xxx_aproCode_xxxxx。aproCode 是下划线分隔的「整段」，必须精确相等匹配，
        // 严禁子串匹配（否则 90903 会被 903 误匹配进来）。复制的镜头编号必须严格来自该 aproCode 的表。
        let matchedTables = [];
        if (aproCodeVal) {
          matchedTables = lastUsedTables.filter((tn) =>
            tn.split("_").some((seg) => seg.trim() === aproCodeVal),
          );
        } else {
          // 无 aproCode 输入时，按命名规则 xxx_aproCode_xxxxx 兜底匹配（至少两段下划线）
          matchedTables = lastUsedTables.filter(
            (tn) => (tn.match(/_/g) || []).length >= 2,
          );
        }

        if (matchedTables.length === 0) {
          return alert(
            "未找到包含 aproCode 的数据表，请检查表名命名或 aproCode 输入",
          );
        }

        // 扫描整张表收集 nodeCode 特征（不再套用提取时间过滤，避免摆渡车/客舱门/客梯车节点因时间超出范围而被漏判）
        const infos = matchedTables.map((tn) => {
          let has03 = false,
            hasBus = false,
            hasDoor = false,
            hasStair = false;
          databases.forEach(({ db }) => {
            try {
              const res = db.exec(`SELECT nodeCode FROM "${tn}"`);
              if (res.length > 0) {
                const cols = res[0].columns;
                const iCode = cols.indexOf("nodeCode");
                if (iCode === -1) return;
                res[0].values.forEach((row) => {
                  const code = String(
                    row[iCode] === null || row[iCode] === undefined
                      ? ""
                      : row[iCode],
                  ).trim();
                  // 03：永远排第一（无论同表是否还有摆渡车/客舱门，其他规则对其不生效）
                  if (code === "03" || code.split("/").includes("03"))
                    has03 = true;
                  // 摆渡车：052（到港摆渡车到位）/ 27（离港摆渡车到位）
                  if (
                    ["052", "27", "52"].some((t) =>
                      code.split("/").includes(t),
                    )
                  )
                    hasBus = true;
                  // 客舱门：06（开客舱门）/ 29（关客舱门）
                  if (["06", "29"].some((t) => code.split("/").includes(t)))
                    hasDoor = true;
                  // 客梯车：051（客梯车对接）/ 272（客梯车撤离），并入尾组特征
                  if (["051", "272"].some((t) => code.split("/").includes(t)))
                    hasStair = true;
                });
              }
            } catch (e) {
              /* 该库中无此表等情况，忽略 */
            }
          });
          return { tn, has03, hasTailFeat: hasBus || hasDoor || hasStair };
        });

        const firstBusGroup = [],
          firstGroup = [],
          middleGroup = [],
          lastGroup = [];
        infos.forEach((it) => {
          if (it.has03 && it.hasTailFeat)
            firstBusGroup.push(it); // 03 + 摆渡车/客舱门 同表 → 最最前
          else if (it.has03)
            firstGroup.push(it); // 仅 03（同表无摆渡车/客舱门）→ 次前
          else if (it.hasTailFeat) lastGroup.push(it);
          else middleGroup.push(it);
        });

        const ordered = [
          ...firstBusGroup,
          ...firstGroup,
          ...middleGroup,
          ...lastGroup,
        ];

        // 提取每个表名末尾的数字（取最后一个下划线后的连续数字段；若无下划线则取表名末尾连续数字）
        const tailNums = [];
        ordered.forEach((it) => {
          const tn = it.tn;
          const parts = tn.split("_");
          let tail = parts[parts.length - 1];
          const m = tail.match(/\d+/);
          if (m) {
            tailNums.push(m[0]);
          } else {
            // 兜底：从整个表名末尾抓连续数字
            const fm = tn.match(/(\d+)$/);
            if (fm) tailNums.push(fm[1]);
          }
        });

        if (tailNums.length === 0) {
          return alert("已匹配到表，但未在表名末尾解析出数字");
        }

        // 去重保序
        const uniqNums = [];
        const seen = new Set();
        for (const n of tailNums) {
          if (!seen.has(n)) {
            seen.add(n);
            uniqNums.push(n);
          }
        }

        // 一行一个，换行分隔，便于粘贴到 Excel 单列
        const text = uniqNums.join("\n");

        const textArea = document.createElement("textarea");
        textArea.value = text;
        textArea.style.position = "fixed";
        textArea.style.top = "0";
        textArea.style.left = "0";
        textArea.style.opacity = "0";
        document.body.appendChild(textArea);
        textArea.focus();
        textArea.select();

        try {
          const successful = document.execCommand("copy");
          if (successful) {
            document.getElementById("queryStatus").innerHTML =
              `<span class="c-warn fw-bold">已复制 ${uniqNums.length} 个镜头编号</span>`;
          } else {
            alert("写入失败，请手动复制");
          }
        } catch (err) {
          alert("当前浏览器环境受限，请手动复制");
        }
        document.body.removeChild(textArea);
      });

  /* 输入框双击全选（事件委托，覆盖静态与动态控件；排除 checkbox/radio/file/按钮类） */
  document.addEventListener('dblclick', function (e) {
    var el = e.target;
    if (!el || typeof el.select !== 'function') return;
    var tag = el.tagName;
    if (tag !== 'INPUT' && tag !== 'TEXTAREA') return;
    var type = (el.type || '').toLowerCase();
    if (['checkbox', 'radio', 'button', 'submit', 'reset', 'file', 'range', 'color'].indexOf(type) !== -1) return;
    if (el.disabled || el.readOnly) return;
    el.select();
  });
  </script>
